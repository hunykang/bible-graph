ror":"글라우디오"}},{"id":"e_ephesus","type":"event","name":"에베소에서의 사역","name_en":"Ministry in Ephesus","tagline":"두란노 서원에서 날마다","summary":"3차 전도여행 중 바울이 에베소에서 2년 넘게 두란노 서원에서 날마다 강론한 사건입니다. 하나님의 말씀이 흥왕하여 세력을 얻었고, 마술사들이 책을 불사르는 회개가 일어났습니다. 데메드리오의 소동도 있었습니다. 개혁주의 관점에서 이는 말씀의 능력으로 우상 문화가 무너지는 복음의 승리를 보여줍니다.","verses":[{"ref":"행 19:11","book_en":"Acts","ch":19,"v":11,"text":"하나님이 바울의 손으로 희한한 능을 행하게 하시니"},{"ref":"행 19:20","book_en":"Acts","ch":19,"v":20,"text":"이와 같이 주의 말씀이 힘이 있어 흥왕하여 세력을 얻으니라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 19:1-20","title":"에베소의 부흥","text":"두란노 서원 강론으로 말씀이 흥왕합니다."}],"related":["f_paul","f_timothy","b_acts","b_eph","d_church","d_holyspirit"],"meta":{"when":"AD 53-55년경","order":45,"year_est":54,"emperor":"글라우디오"}},{"id":"e_paul_arrest","type":"event","name":"바울의 체포","name_en":"Arrest of Paul","tagline":"성전에서 붙잡히다","summary":"바울이 예루살렘 성전에서 유대인들의 소동으로 붙잡힌 사건입니다. 천부장은 그를 결박했으나, 바울은 로마 시민권을 밝혀 채찍질을 면했습니다. 이후 가이사랴에서 벨릭스와 베스도 앞에 섰고, 가이사에게 상소했습니다. 개혁주의 관점에서 이는 고난 중에도 복음을 전하는 바울의 담대함과, 로마로 가게 하시는 하나님의 섭리를 보여줍니다.","verses":[{"ref":"행 21:33","book_en":"Acts","ch":21,"v":33,"text":"이에 천부장이 가까이 가서 바울을 잡아 두 쇠사슬로 결박하라 명하고 누구며 무슨 일을 하였느냐 물으니"},{"ref":"행 22:21","book_en":"Acts","ch":22,"v":21,"text":"나더러 또 이르시되 떠나가라 내가 너를 멀리 이방인에게로 보내리라 하셨느니라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 21:27-36","title":"성전에서의 체포","text":"소동 속에 붙잡히나 담대히 간증을 시작합니다."}],"related":["f_paul","b_acts","e_paul_rome","d_church"],"meta":{"when":"AD 57년경","order":46,"year_est":57,"emperor":"네로"}},{"id":"e_rome_voyage","type":"event","name":"로마로 가는 항해","name_en":"Voyage to Rome","tagline":"풍랑 속에서도 반드시 서리라","summary":"가이사에게 상소한 바울이 죄수 호송선으로 로마로 향하던 중 큰 풍랑을 만난 사건입니다. 배가 파선했으나 바울의 말대로 한 사람도 잃지 않고 모두 구원받았습니다. 멜리데 섬에서는 독사에 물리고도 해를 입지 않았습니다. 개혁주의 관점에서 이는 하나님의 약속이 풍랑보다 강함을 보여주는 섭리의 증거입니다.","verses":[{"ref":"행 27:24","book_en":"Acts","ch":27,"v":24,"text":"바울아 두려워 말라 네가 가이사 앞에 서야 하겠고 또 하나님께서 너와 함께 행선하는 자를 다 네게 주셨다 하였으니"},{"ref":"행 27:44","book_en":"Acts","ch":27,"v":44,"text":"그 남은 사람들은 널조각 혹은 배 물건에 의지하여 나가게 하니 마침내 사람들이 다 상륙하여 구원을 얻으니라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 27:1-44","title":"로마행 항해","text":"파선 중에도 약속대로 모두 구원받습니다."}],"related":["e_paul_rome","f_paul","b_acts","d_church"],"meta":{"when":"AD 59-60년경","order":47,"year_est":59,"emperor":"네로"}},{"id":"w_pompey","meta":{"when":"BC 63년","year":-63,"year_est":-63,"emperor":"황제 이전 (로마 공화정)"},"name":"폼페이우스의 예루살렘 점령","name_en":"Pompey's Capture of Jerusalem","related":["e_birth","b_luke","f_jesus","b_matthew"],"summary":"로마 장군 폼페이우스가 BC 63년 예루살렘을 점령하면서 유대 땅에 로마 시대가 열렸습니다. 이후 유대는 로마의 간섭 아래 헤롯 가문의 통치를 받게 됩니다. 예수님 시대의 로마 총독과 세금, 십자가형이 모두 여기서 시작된 배경입니다.","tagline":"유대에 로마 시대가 열리다","type":"world"},{"id":"w_herod","meta":{"when":"BC 37-4년","year":-37,"year_est":-37,"emperor":"황제 이전 (로마 공화정)"},"name":"헤롯 대왕의 통치","name_en":"Reign of Herod the Great","related":["e_birth","e_magi","b_matthew","f_jesus"],"summary":"로마가 세운 유대의 왕 헤롯 대왕은 BC 37년부터 4년까지 통치했습니다. 예수님 탄생 때 '유대인의 왕으로 나신 이' 소식을 듣고 베들레헴의 아기들을 죽이라 명한 왕이 바로 그입니다(마 2장). 성전을 화려하게 재건했지만 잔혹한 통치자로 기억됩니다.","tagline":"예수님 탄생 당시의 왕","type":"world"},{"id":"w_herod_temple","meta":{"when":"BC 20년경~","year":-20,"year_est":-20,"emperor":"아우구스투스"},"name":"헤롯 성전 재건","name_en":"Herod's Temple Reconstruction","related":["e_temple_destruction","b_john","f_jesus","e_trial"],"summary":"헤롯 대왕이 BC 20년경부터 예루살렘 성전을 대대적으로 재건했습니다. 예수님이 '이 성전을 헐라'(요 2:19)고 말씀하신 바로 그 성전으로, 당시에도 46년째 공사 중이었습니다. AD 70년 로마에 의해 파괴되기까지 유대 신앙의 중심이었습니다.","tagline":"예수님이 보신 그 성전","type":"world"},{"id":"w_augustus","meta":{"when":"BC 27-AD 14년","year":-27,"year_est":-27,"emperor":"아우구스투스"},"name":"아우구스투스와 팍스 로마나","name_en":"Augustus and Pax Romana","related":["e_birth","e_paul_rome","b_acts","f_paul"],"summary":"초대 로마 황제 아우구스투스가 세운 '로마의 평화' 시대에 지중해 세계는 하나로 연결되었습니다. 잘 닦인 도로와 공통어인 그리스어는 후에 복음이 빠르게 퍼지는 통로가 되었습니다. 바울의 전도여행이 가능했던 것도 이 평화 덕분입니다.","tagline":"복음이 퍼진 로마의 평화","type":"world"},{"id":"w_census","meta":{"when":"BC 4년경","year":-4,"year_est":-4,"emperor":"아우구스투스"},"name":"호구령","name_en":"The Census of Quirinius","related":["e_birth","b_luke","f_jesus","f_mary_mother"],"summary":"아우구스투스의 호구령 때문에 요셉과 마리아는 나사렛에서 베들레헴으로 올라가야 했습니다(눅 2:1-7). 그 결과 예수님은 미가서 5:2의 예언대로 베들레헴에서 태어나셨습니다. 로마의 행정 명령이 하나님의 예언 성취에 쓰인 셈입니다.","tagline":"베들레헴으로 이끈 칙령","type":"world"},{"id":"w_tiberius","meta":{"when":"AD 14-37년","year":14,"year_est":14,"emperor":"아우구스투스"},"name":"디베료 황제","name_en":"Emperor Tiberius","related":["e_john_ministry","e_baptism","e_cross","b_luke"],"summary":"예수님의 공생애 기간(AD 27-30년경) 내내 로마 황제는 디베료였습니다(눅 3:1). '가이사의 것은 가이사에게'(마 22:21)라는 말씀 속 가이사도 바로 그입니다. 세례 요한과 예수님이 사역하던 시절의 세계 권력자였습니다.","tagline":"예수님 시대의 로마 황제","type":"world"},{"id":"w_pilate","meta":{"when":"AD 26-36년","year":26,"year_est":26,"emperor":"디베료"},"name":"본디오 빌라도 총독","name_en":"Pontius Pilate","related":["e_trial","e_cross","f_jesus","e_peter_denial"],"summary":"AD 26년부터 36년까지 유대를 다스린 로마 총독으로, 예수님의 재판을 담당했습니다(요 18-19장). '나는 이 사람에게서 죄를 찾지 못하노라' 하면서도 군중의 압력에 십자가형을 선고했습니다. 사도신경의 '본디오 빌라도에게 고난을 받으사'가 바로 그입니다.","tagline":"예수님을 재판한 총독","type":"world"},{"id":"w_caligula","meta":{"when":"AD 37-41년","year":37,"year_est":37,"emperor":"디베료"},"name":"갈리굴라의 황제 숭배 강요","name_en":"Caligula's Demand for Worship","related":["e_stephen_martyrdom","b_acts","d_church"],"summary":"황제 갈리굴라는 자신을 신으로 숭배하라고 강요했고, 예루살렘 성전에 자신의 동상을 세우려다 유대인의 격렬한 저항에 부딪혔습니다. 이 사건은 초대교회가 '황제 숭배 거부' 때문에 박해를 받게 되는 흐름의 시작을 보여줍니다.","tagline":"황제 숭배와 박해의 시작","type":"world"},{"id":"w_claudius","meta":{"when":"AD 41-54년","year":41,"year_est":41,"emperor":"갈리굴라"},"name":"글라우디오 시대의 흉년과 추방","name_en":"Claudius: Famine and Expulsion","related":["b_acts","f_paul","b_1cor","e_paul_conversion"],"summary":"황제 글라우디오 때 큰 흉년이 들어(행 11:28) 예루살렘 교회를 돕기 위한 구제가 이루어졌고, 유대인 추방령(행 18:2)으로 바울은 고린도에서 아굴라와 브리스길을 만났습니다. 로마의 정책이 바울에게 동역자를 만나게 한 셈입니다.","tagline":"흉년과 유대인 추방령","type":"world"},{"id":"w_nero","meta":{"when":"AD 54-68년","year":54,"year_est":54,"emperor":"글라우디오"},"name":"네로와 로마 대화재·첫 박해","name_en":"Nero and the First Persecution","related":["e_paul_rome","f_peter","f_paul","b_2tim"],"summary":"AD 64년 로마 대화재 후 네로는 누명을 그리스도인에게 씌워 잔혹하게 박해했습니다. 전통적으로 베드로와 바울이 이 시기에 순교한 것으로 전해집니다(딤후 4:6-8). 박해 속에서도 교회는 흩어지며 복음을 전했습니다.","tagline":"대화재와 첫 번째 박해","type":"world"},{"id":"w_jewish_war","meta":{"when":"AD 66년","year":66,"year_est":66,"emperor":"네로"},"name":"유대-로마 전쟁 발발","name_en":"Outbreak of the Jewish-Roman War","related":["e_temple_destruction","b_matthew","b_mark","d_eschatology"],"summary":"AD 66년 유대인의 반로마 봉기로 전쟁이 시작되었습니다. 예수님이 예언하신 '돌 하나도 돌 위에 남지 않으리라'(마 24:2)의 배경이 되는 전쟁으로, 4년 뒤 예루살렘 함락으로 이어집니다.","tagline":"예언 성취로 향한 전쟁","type":"world"},{"id":"w_vespasian","meta":{"when":"AD 69년","year":69,"year_est":69,"emperor":"갈바"},"name":"베스파시아누스 즉위","name_en":"Vespasian Becomes Emperor","related":["e_temple_destruction","b_luke","d_eschatology"],"summary":"AD 69년 '네 황제의 해' 혼란 끝에 장군 베스파시아누스가 황제가 되었고, 아들 디도에게 유대 전쟁을 맡겼습니다. 디도가 AD 70년 예루살렘을 함락하고 성전을 파괴했습니다. 예수님의 예언이 로마 황실의 교체 속에서 성취된 셈입니다.","tagline":"성전 파괴를 이끈 황제","type":"world"},{"id":"w_masada","meta":{"when":"AD 73년","year":73,"year_est":73,"emperor":"베스파시아누스"},"name":"마사다 함락","name_en":"Fall of Masada","related":["e_temple_destruction","b_heb","d_church"],"summary":"AD 73년 로마군이 최후의 유대 저항 거점 마사다를 함락하면서 유대-로마 전쟁이 완전히 끝났습니다. 성전 파괴 후 유대교는 성전 중심에서 회당 중심으로 바뀌었고, 기독교는 유대교와 완전히 다른 길로 나아가게 되었습니다.","tagline":"전쟁의 끝, 갈라진 두 길","type":"world"},{"id":"w_josephus","meta":{"when":"AD 75-79년경","year":76,"year_est":76,"emperor":"베스파시아누스"},"name":"요세푸스의 『유대 전쟁사』","name_en":"Josephus' Jewish War","related":["e_john_ministry","e_trial","b_acts","f_james_brother"],"summary":"유대인 역사가 요세푸스가 AD 75-79년경 쓴 『유대 전쟁사』는 세례 요한과 빌라도, 야고보의 죽음을 외부인의 시각에서 증언합니다. 성경 밖에서도 예수님 시대의 인물과 사건이 실재했음을 보여주는 귀한 자료입니다.","tagline":"성경 밖의 역사 증언","type":"world"},{"id":"w_domitian","meta":{"when":"AD 81-96년","year":81,"year_est":81,"emperor":"티투스"},"name":"도미티아누스 박해","name_en":"Domitian's Persecution","related":["e_patmos_revelation","b_rev","f_john_apostle","d_eschatology"],"summary":"황제 도미티아누스는 자신을 '주요 신'으로 숭배하도록 강요하며 그리스도인을 박해했습니다. 전통적으로 요한이 이 시기에 밧모섬에 유배되어 계시록을 기록한 것으로 봅니다(계 1:9). '예수님이 이기신다'는 계시록의 메시지는 박해받는 교회에 주신 위로였습니다.","tagline":"밧모섬 유배의 배경","type":"world"},{"id":"w_pliny","meta":{"when":"AD 112년경","year":112,"year_est":112,"emperor":"트라야누스"},"name":"플리니우스의 편지(소아시아 박해)","name_en":"Pliny's Letter on Christians","related":["b_rev","d_church","f_john_apostle","e_patmos_revelation"],"summary":"AD 112년경 소아시아 총독 플리니우스는 황제 트라야누스에게 '그리스도인들을 어떻게 처벌해야 하느냐'고 묻는 편지를 썼습니다. 편지에 따르면 초대교회는 주일에 모여 그리스도를 하나님처럼 찬양했습니다. 성경 시대가 끝난 뒤에도 교회가 굳게 서 있었음을 보여주는 로마 관리의 기록입니다.","tagline":"로마 관리가 본 초대교회","type":"world"},{"id":"f_andrew","key_chapters":[{"book_id":"b_john","ref":"요 1:35-42","text":"예수님을 처음 만난 안드레가 곧바로 형 시몬(베드로)을 찾아가 그리스도를 소개한 장면입니다.","title":"형 베드로를 예수님께 인도하다"},{"book_id":"b_john","ref":"요 6:8-9","text":"오병이어 기적 앞에서 보리떡 다섯 개와 물고기 두 마리를 가진 소년을 예수님께 데려온 안드레의 믿음입니다.","title":"소년의 도시락을 드리다"},{"book_id":"b_matthew","ref":"마 4:18-20","text":"갈릴리 바다에서 그물을 던지던 안드레가 예수님의 부르심에 즉시 따라나선 시작입니다.","title":"어부에서 제자로"}],"meta":{"role":"열두 제자 중 하나, 베드로의 형"},"name":"안드레","name_en":"Andrew","related":["f_peter","f_jesus","f_john_baptist","e_first_disciples","e_loaves","b_john","b_matthew","d_christ"],"summary":"안드레는 베드로의 형으로, 세례 요한의 제자였다가 예수님을 처음 만난 제자 중 한 사람입니다. 그는 예수님을 만나자마자 형 베드로를 찾아가 \"우리가 그리스도를 만났다\"고 전했습니다. 오병이어 기적 때는 물고기 두 마리와 보리떡 다섯 개를 가진 소년을 예수님께 데려왔습니다. 안드레는 늘 '사람을 예수님께 인도하는' 자리에서 복음의 통로가 되었습니다.","tagline":"사람을 예수님께 데려오던 제자","type":"figure","verses":[{"book_en":"John","ch":1,"ref":"요 1:41","v":41,"text":"그가 먼저 자기의 형제 시몬을 찾아 말하되 우리가 메시야를 만났다 하고 (메시야는 번역하면 그리스도라)"},{"book_en":"John","ch":6,"ref":"요 6:9","v":9,"text":"여기 한 아이가 있어 보리떡 다섯 개와 물고기 두 마리를 가졌나이다 그러나 그것이 이 많은 사람에게 얼마나 되겠삽나이까"},{"book_en":"Matthew","ch":4,"ref":"마 4:18","v":18,"text":"갈릴리 해변에 다니시다가 두 형제 곧 베드로라 하는 시몬과 그 형제 안드레가 바다에 그물 던지는 것을 보시니 저희는 어부라"}]},{"id":"f_philip_apostle","key_chapters":[{"book_id":"b_john","ref":"요 1:43-51","text":"예수님의 부르심을 받은 빌립이 즉시 나다나엘을 예수님께 데려와 함께 제자가 된 이야기입니다.","title":"부르심과 나다나엘의 인도"},{"book_id":"b_john","ref":"요 6:5-7","text":"무리에게 먹일 것을 두고 돈으로 계산하던 빌립에게 예수님이 하나님의 능력을 가르치신 장면입니다.","title":"계산하는 빌립"},{"book_id":"b_john","ref":"요 14:8-11","text":"빌립의 질문에 예수님께서 자신이 곧 아버지를 계시하는 분임을 선언하신 말씀입니다.","title":"아버지를 보여 주소서"}],"meta":{"role":"열두 제자 중 하나"},"name":"빌립","name_en":"Philip the Apostle","related":["f_jesus","f_bartholomew","e_first_disciples","e_loaves","e_last_supper","b_john","d_christ"],"summary":"빌립은 예수님께서 직접 \"나를 따르라\"고 부르신 제자로, 벳새다 출신입니다. 그는 친구 나다나엘(바돌로매)에게 \"모세가 율법에 기록한 그분을 만났다\"며 예수님을 소개했습니다. 오병이어 기적 전에는 \"이백 데나리온의 떡이 부족하다\"고 계산했지만, 예수님은 그런 빌립을 통해 하나님의 능력을 보이셨습니다. 최후의 만찬 자리에서는 \"아버지를 보여 달라\"고 구했고, 예수님은 \"나를 본 자는 아버지를 보았다\"고 답하셨습니다.","tagline":"나를 따르라 부르심을 받은 제자","type":"figure","verses":[{"book_en":"John","ch":1,"ref":"요 1:43","v":43,"text":"이튿날 예수께서 갈릴리로 나가려 하시다가 빌립을 만나 이르시되 나를 좇으라 하시니"},{"book_en":"John","ch":14,"ref":"요 14:8","v":8,"text":"빌립이 가로되 주여 아버지를 우리에게 보여 주옵소서 그리하면 족하겠나이다"},{"book_en":"John","ch":6,"ref":"요 6:7","v":7,"text":"빌립이 대답하되 각 사람으로 조금씩 받게 할찌라도 이백 데나리온의 떡이 부족하리이다"}]},{"id":"f_bartholomew","key_chapters":[{"book_id":"b_john","ref":"요 1:45-51","text":"의심하던 나다나엘이 예수님을 하나님의 아들로 고백하고 제자가 된 장면입니다.","title":"무화과나무 아래의 나다나엘"},{"book_id":"b_john","ref":"요 21:2","text":"부활하신 예수님을 다시 만난 제자들 가운데 나다나엘이 함께 있었습니다.","title":"부활 후 갈릴리에서"}],"meta":{"role":"열두 제자 중 하나 (나다나엘)"},"name":"바돌로매","name_en":"Bartholomew","related":["f_jesus","f_philip_apostle","e_first_disciples","b_john","b_matthew","d_christ"],"summary":"바돌로매는 요한복음에 나오는 '나다나엘'과 같은 사람으로 봅니다. 무화과나무 아래 있던 그를 예수님께서 \"간사함이 없는 참 이스라엘 사람\"이라 부르셨습니다. 처음에는 \"나사렛에서 무슨 선한 것이 나겠느냐\"고 의심했지만, 예수님이 자신을 미리 아셨다는 말에 \"당신은 하나님의 아들이십니다\"라고 고백했습니다. 복음서 사도 명단에는 빌립 바로 다음에 이름이 올라 있습니다.","tagline":"간사함이 없던 참 이스라엘 사람","type":"figure","verses":[{"book_en":"John","ch":1,"ref":"요 1:47","v":47,"text":"예수께서 나다나엘이 자기에게 오는 것을 보시고 그를 가리켜 가라사대 보라 이는 참 이스라엘 사람이라 그 속에 간사한 것이 없도다"},{"book_en":"John","ch":1,"ref":"요 1:49","v":49,"text":"나다나엘이 대답하되 랍비여 당신은 하나님의 아들이시요 당신은 이스라엘의 임금이로소이다"},{"book_en":"Matthew","ch":10,"ref":"마 10:3","v":3,"text":"빌립과 바돌로매, 도마와 세리 마태, 알패오의 아들 야고보와 다대오,"}]},{"id":"f_matthew","key_chapters":[{"book_id":"b_matthew","ref":"마 9:9-13","text":"세관에서 일하던 마태가 예수님의 한 마디에 모든 것을 버리고 따른 회심의 순간입니다.","title":"세리 마태의 부르심"},{"book_id":"b_luke","ref":"눅 5:29-32","text":"마태가 베푼 잔치에서 예수님이 죄인을 부르러 오셨음을 선언하신 장면입니다.","title":"죄인들의 잔치"}],"meta":{"role":"열두 제자 중 하나, 마태복음 저자"},"name":"마태","name_en":"Matthew","related":["f_jesus","e_first_disciples","b_matthew","b_mark","b_luke","d_christ","d_salvation"],"summary":"마태(레위)는 세관에서 세금을 걷던 세리였습니다. 당시 세리는 동족에게 미움받는 죄인의 대명사였지만, 예수님은 \"나를 따르라\"고 부르셨고 마태는 즉시 일어나 따랐습니다. 그는 예수님을 위해 잔치를 베풀어 세리 친구들을 초대했고, 예수님은 \"의인을 부르러 온 것이 아니요 죄인을 부르러 왔다\"고 하셨습니다. 후에 마태복음을 기록해 예수님이 약속된 메시아이심을 유대인에게 전했습니다.","tagline":"세리에서 복음서 저자가 된 제자","type":"figure","verses":[{"book_en":"Matthew","ch":9,"ref":"마 9:9","v":9,"text":"예수께서 거기서 떠나 지나가시다가 마태라 하는 사람이 세관에 앉은 것을 보시고 이르시되 나를 좇으라 하시니 일어나 좇으니라"},{"book_en":"Matthew","ch":9,"ref":"마 9:13","v":13,"text":"너희는 가서 내가 긍휼을 원하고 제사를 원치 아니하노라 하신 뜻이 무엇인지 배우라 내가 의인을 부르러 온 것이 아니요 죄인을 부르러 왔노라 하시니라"},{"book_en":"Luke","ch":5,"ref":"눅 5:28","v":28,"text":"저가 모든 것을 버리고 일어나 좇으니라"}]},{"id":"f_thomas","key_chapters":[{"book_id":"b_john","ref":"요 20:24-29","text":"부활하신 예수님을 직접 만난 도마가 \"나의 주, 나의 하나님\"이라 고백한 장면입니다.","title":"도마의 고백"},{"book_id":"b_john","ref":"요 11:16","text":"위험한 유대 땅으로 가시는 예수님을 따라 \"우리도 함께 죽으러 가자\"던 도마의 충성입니다.","title":"함께 죽으러 가자"},{"book_id":"b_john","ref":"요 14:5-6","text":"도마의 질문에 예수님께서 \"내가 곧 길이요 진리요 생명이니\"라고 답하신 말씀입니다.","title":"길이요 진리요 생명"}],"meta":{"role":"열두 제자 중 하나, 부활의 증인"},"name":"도마","name_en":"Thomas","related":["f_jesus","e_resurrection","e_thomas","e_lazarus","b_john","d_christ","d_salvation"],"summary":"도마는 예수님의 부활 소식을 듣고 \"내가 그분의 손의 못 자국을 보지 않고는 믿지 않겠다\"고 말했습니다. 일주일 후 예수님은 도마에게 직접 상처를 보이시며 \"믿음 없는 자가 되지 말고 믿는 자가 되라\"고 하셨고, 도마는 \"나의 주님이시요 나의 하나님이시니이다\"라고 고백했습니다. 도마는 의심 많은 제자가 아니라, 부활의 확실한 증인이 되어 예수님의 신성을 고백한 사람입니다. 예수님은 \"보지 못하고 믿는 자들은 복되다\"고 하시며 후대 성도들을 축복하셨습니다.","tagline":"부활을 직접 본 증인","type":"figure","verses":[{"book_en":"John","ch":20,"ref":"요 20:28","v":28,"text":"도마가 대답하여 가로되 나의 주시며 나의 하나님이시니이다"},{"book_en":"John","ch":20,"ref":"요 20:29","v":29,"text":"예수께서 가라사대 너는 나를 본 고로 믿느냐 보지못하고 믿는 자들은 복되도다 하시니라"},{"book_en":"John","ch":11,"ref":"요 11:16","v":16,"text":"디두모라 하는 도마가 다른 제자들에게 말하되 우리도 주와 함께 죽으러 가자 하니라"}]},{"id":"f_james_alphaeus","key_chapters":[{"book_id":"b_matthew","ref":"마 10:1-4","text":"알패오의 아들 야고보가 열두 사도 중 하나로 부르심을 받은 명단입니다.","title":"열두 사도의 파송"},{"book_id":"b_acts","ref":"행 1:12-14","text":"예수님 승천 후 함께 모여 기도하던 제자들 가운데 야고보가 있었습니다.","title":"다락방의 기도"}],"meta":{"role":"열두 제자 중 하나"},"name":"알패오의 아들 야고보","name_en":"James son of Alphaeus","related":["f_jesus","f_james_zebedee","e_first_disciples","e_pentecost","b_matthew","b_acts"],"summary":"알패오의 아들 야고보는 세베대의 아들 야고보와 구분하기 위해 '작은 야고보'로도 불립니다. 복음서에 그에 대한 개별 기록은 거의 없지만, 열두 사도 명단에 빠짐없이 이름이 올라 있습니다. 드러난 활약 없이도 예수님의 부르심에 끝까지 충성한 제자로, 눈에 띄지 않는 자리에서도 신실하게 따르는 믿음의 본보기입니다.","tagline":"조용히 충성한 열두 제자","type":"figure","verses":[{"book_en":"Matthew","ch":10,"ref":"마 10:3","v":3,"text":"빌립과 바돌로매, 도마와 세리 마태, 알패오의 아들 야고보와 다대오,"},{"book_en":"Acts","ch":1,"ref":"행 1:13","v":13,"text":"들어가 저희 유하는 다락에 올라가니 베드로, 요한, 야고보, 안드레와 빌립, 도마와 바돌로매, 마태와 및 알패오의 아들 야고보, 셀롯인 시몬, 야고보의 아들 유다가 다 거기 있어"}]},{"id":"f_simon_zealot","key_chapters":[{"book_id":"b_matthew","ref":"마 10:1-4","text":"열심당원이던 시몬이 세리 마태와 함께 열두 사도로 부르심을 받은 명단입니다.","title":"열두 사도의 파송"},{"book_id":"b_acts","ref":"행 1:12-14","text":"부활과 승천을 목격한 시몬이 초대교회 탄생의 자리에 함께 있었습니다.","title":"다락방의 기도"}],"meta":{"role":"열두 제자 중 하나"},"name":"열심당원 시몬","name_en":"Simon the Zealot","related":["f_jesus","f_matthew","e_first_disciples","e_pentecost","b_matthew","b_luke","b_acts","d_church"],"summary":"열심당원 시몬은 로마에 맞서 싸우던 열심당 출신으로 보입니다. 세리 마태와는 정반대 진영에 있던 사람이 같은 열두 제자가 되었다는 것은 복음의 화해하는 능력을 보여줍니다. 정치적 열심을 버리고 예수님의 나라를 위해 헌신한 그는, 복음 안에서 원수가 형제가 되는 은혜의 증거입니다.","tagline":"열심을 복음에 바친 제자","type":"figure","verses":[{"book_en":"Matthew","ch":10,"ref":"마 10:4","v":4,"text":"가나안인 시몬과 및 가룟 유다 곧 예수를 판 자라"},{"book_en":"Luke","ch":6,"ref":"눅 6:15","v":15,"text":"마태와 도마와 및 알패오의 아들 야고보와 및 셀롯이라 하는 시몬과"},{"book_en":"Acts","ch":1,"ref":"행 1:13","v":13,"text":"들어가 저희 유하는 다락에 올라가니 베드로, 요한, 야고보, 안드레와 빌립, 도마와 바돌로매, 마태와 및 알패오의 아들 야고보, 셀롯인 시몬, 야고보의 아들 유다가 다 거기 있어"}]},{"id":"f_thaddaeus","key_chapters":[{"book_id":"b_john","ref":"요 14:22-24","text":"최후의 만찬에서 다대오가 묻자 예수님이 자신을 나타내시는 계시의 의미를 가르치신 장면입니다.","title":"다대오의 질문"},{"book_id":"b_matthew","ref":"마 10:1-4","text":"다대오(유다)가 열두 사도 중 하나로 부르심을 받은 명단입니다.","title":"열두 사도의 파송"}],"meta":{"role":"열두 제자 중 하나"},"name":"다대오","name_en":"Thaddaeus","related":["f_jesus","e_last_supper","b_john","b_matthew","b_acts","d_christ"],"summary":"다대오는 야고보의 아들 유다로도 불리는 열두 제자입니다. 최후의 만찬 자리에서 \"주여 어찌하여 우리에게는 자기를 나타내시고 세상에게는 아니하려 하시나이까\"라고 질문했습니다. 예수님은 \"나를 사랑하는 자는 내 아버지께 사랑을 받을 것이요\"라고 답하시며, 자신을 나타내심이 사랑하는 제자들에게 주시는 계시임을 가르치셨습니다.","tagline":"최후의 만찬에서 질문한 제자","type":"figure","verses":[{"book_en":"John","ch":14,"ref":"요 14:22","v":22,"text":"가룟인 아닌 유다가 가로되 주여 어찌하여 자기를 우리에게는 나타내시고 세상에게는 아니하려 하시나이까"},{"book_en":"Matthew","ch":10,"ref":"마 10:3","v":3,"text":"빌립과 바돌로매, 도마와 세리 마태, 알패오의 아들 야고보와 다대오,"},{"book_en":"Acts","ch":1,"ref":"행 1:13","v":13,"text":"들어가 저희 유하는 다락에 올라가니 베드로, 요한, 야고보, 안드레와 빌립, 도마와 바돌로매, 마태와 및 알패오의 아들 야고보, 셀롯인 시몬, 야고보의 아들 유다가 다 거기 있어"}]},{"id":"f_matthias","key_chapters":[{"book_id":"b_acts","ref":"행 1:21-26","text":"기도와 제비뽑기로 하나님의 뜻을 구해 맛디아가 열두 사도의 반열에 든 장면입니다.","title":"맛디아의 선택"},{"book_id":"b_acts","ref":"행 2:1-4","text":"맛디아가 열두 사도 중 하나로 성령을 받고 복음 전파에 나선 오순절입니다.","title":"오순절 성령 강림"}],"meta":{"role":"가룟 유다를 대신한 사도"},"name":"맛디아","name_en":"Matthias","related":["f_peter","e_pentecost","b_acts","d_holyspirit","d_church"],"summary":"맛디아는 가룟 유다의 빈자리를 채우기 위해 뽑힌 사도입니다. 베드로는 \"요한의 세례로부터 우리 중에 함께한 자\"라는 자격을 내세웠고, 제자들은 기도한 뒤 제비를 뽑아 맛디아를 선택했습니다. 이는 성령 강림 전이지만 하나님의 주권적 인도하심을 구한 정당한 선택이었고, 맛디아는 오순절 성령 강림의 증인이 되었습니다.","tagline":"기도로 뽑힌 열두 번째 사도","type":"figure","verses":[{"book_en":"Acts","ch":1,"ref":"행 1:24","v":24,"text":"저희가 기도하여 가로되 뭇사람의 마음을 아시는 주여 이 두 사람 중에 누가 주의 택하신바 되어"},{"book_en":"Acts","ch":1,"ref":"행 1:26","v":26,"text":"제비 뽑아 맛디아를 얻으니 저가 열 한 사도의 수에 가입하니라"},{"book_en":"Acts","ch":1,"ref":"행 1:22","v":22,"text":"항상 우리와 함께 다니던 사람 중에 하나를 세워 우리로 더불어 예수의 부활하심을 증거할 사람이 되게 하여야 하리라 하거늘"}]},{"id":"f_james_zebedee","key_chapters":[{"book_id":"b_matthew","ref":"마 4:21-22","text":"아버지 세베대와 그물을 버려두고 예수님을 따른 야고보와 요한 형제의 시작입니다.","title":"부르심을 받은 형제"},{"book_id":"b_mark","ref":"막 9:2-8","text":"베드로·요한과 함께 변화산에서 예수님의 영광을 목격한 야고보입니다.","title":"변화산의 증인"},{"book_id":"b_acts","ref":"행 12:1-2","text":"헤롯 아그립바 1세의 박해로 칼에 순교한 야고보, 사도 중 첫 순교자입니다.","title":"첫 사도의 순교"}],"meta":{"role":"열두 제자 중 하나, 첫 순교 사도"},"name":"세베대의 아들 야고보","name_en":"James son of Zebedee","related":["f_jesus","f_john_apostle","f_peter","f_herod_agrippa1","e_transfiguration","e_peter_prison","b_matthew","b_acts"],"summary":"세베대의 아들 야고보는 요한의 형으로, 베드로·요한과 함께 예수님의 가장 가까운 세 제자 중 하나였습니다. 변화산과 겟세마네의 증인이었고, 한때는 \"우레의 아들\"이라 불릴 만큼 혈기가 있었습니다. 그러나 예수님을 따르며 변화되었고, 헤롯 아그립바 1세의 박해 때 칼에 순교해 사도 중 첫 순교자가 되었습니다.","tagline":"첫 순교자가 된 우레의 아들","type":"figure","verses":[{"book_en":"Matthew","ch":4,"ref":"마 4:21","v":21,"text":"거기서 더 가시다가 다른 두 형제 곧 세베대의 아들 야고보와 그 형제 요한이 그 부친 세베대와 한가지로 배에서 그물 깁는 것을 보시고 부르시니"},{"book_en":"Acts","ch":12,"ref":"행 12:2","v":2,"text":"요한의 형제 야고보를 칼로 죽이니"},{"book_en":"Mark","ch":3,"ref":"막 3:17","v":17,"text":"또 세베대의 아들 야고보와 야고보의 형제 요한이니 이 둘에게는 보아너게 곧 우뢰의 아들이란 이름을 더하셨으며"}]},{"id":"f_joseph_husband","type":"figure","name":"요셉","name_en":"Joseph","tagline":"순종으로 예수님을 양육한 아버지","summary":"요셉은 마리아의 남편으로, 목수였습니다. 마리아의 임신 사실을 알고 조용히 파혼하려 했으나, 천사가 꿈에 나타나 \"다윗의 자손 요셉아 두려워하지 말고\"라고 하자 즉시 순종했습니다. 호구령 때 마리아와 함께 베들레헴으로 갔고, 헤롯의 위협을 피해 아기 예수를 애굽으로 피신시켰습니다. 말없이 순종으로 예수님을 보호하고 양육한 의로운 사람입니다.","verses":[{"ref":"마 1:20","book_en":"Matthew","ch":1,"v":20,"text":"이 일을 생각할 때에 주의 사자가 현몽하여 가로되 다윗의 자손 요셉아 네 아내 마리아 데려오기를 무서워 말라 저에게 잉태된 자는 성령으로 된 것이라"},{"ref":"마 1:24","book_en":"Matthew","ch":1,"v":24,"text":"요셉이 잠을 깨어 일어나서 주의 사자의 분부대로 행하여 그 아내를 데려왔으나"},{"ref":"눅 2:4","book_en":"Luke","ch":2,"v":4,"text":"요셉도 다윗의 집 족속인 고로 갈릴리 나사렛 동네에서 유대를 향하여 베들레헴이라 하는 다윗의 동네로"}],"related":["f_mary_mother","f_jesus","e_annunciation","e_birth","e_magi","b_matthew","b_luke","w_census"],"meta":{"role":"마리아의 남편, 예수님의 양부"},"key_chapters":[{"book_id":"b_matthew","ref":"마 1:18-25","title":"꿈에 나타난 천사","text":"의로운 요셉이 천사의 말을 듣고 마리아를 아내로 맞이한 순종의 장면입니다."},{"book_id":"b_matthew","ref":"마 2:13-15","title":"애굽으로의 피신","text":"헤롯의 위협에서 아기 예수를 지키기 위해 밤에 일어나 애굽으로 피신한 요셉입니다."},{"book_id":"b_luke","ref":"눅 2:4-7","title":"베들레헴으로","text":"호구령 때문에 마리아와 함께 베들레헴으로 올라간 요셉의 여정입니다."}]},{"id":"f_martha","type":"figure","name":"마르다","name_en":"Martha","tagline":"주는 그리스도시니이다 고백한 여인","summary":"마르다는 마리아와 나사로의 누이로, 베다니에서 예수님을 자주 모시던 여인입니다. 한때는 섬기는 일에 분주해 예수님께 \"마리아가 나를 돕게 하소서\"라고 했지만, 예수님은 \"필요한 것은 하나뿐\"이라며 말씀 듣는 자리를 더 귀히 여기셨습니다. 동생 나사로가 죽었을 때는 \"주는 그리스도시요 세상에 오시는 하나님의 아들이신 줄 믿나이다\"라고 고백한 믿음의 여인입니다.","verses":[{"ref":"요 11:27","book_en":"John","ch":11,"v":27,"text":"가로되 주여 그러하외다 주는 그리스도시요 세상에 오시는 하나님의 아들이신줄 내가 믿나이다"},{"ref":"눅 10:42","book_en":"Luke","ch":10,"v":42,"text":"그러나 몇 가지만 하든지 혹 한 가지만이라도 족하니라 마리아는 이 좋은 편을 택하였으니 빼앗기지 아니하리라 하시니라"},{"ref":"요 12:2","book_en":"John","ch":12,"v":2,"text":"거기서 예수를 위하여 잔치할쌔 마르다는 일을 보고 나사로는 예수와 함께 앉은자 중에 있더라"}],"related":["f_jesus","f_lazarus_bethany","e_lazarus","b_john","b_luke","d_christ","d_salvation"],"meta":{"role":"베다니의 자매, 섬김의 여인"},"key_chapters":[{"book_id":"b_luke","ref":"눅 10:38-42","title":"필요한 것은 하나뿐","text":"분주한 마르다에게 예수님이 말씀 듣는 자리의 소중함을 가르치신 장면입니다."},{"book_id":"b_john","ref":"요 11:20-27","title":"마르다의 고백","text":"나사로의 죽음 앞에서 예수님을 그리스도라 고백한 마르다의 믿음입니다."}]},{"id":"f_lazarus_bethany","type":"figure","name":"베다니의 나사로","name_en":"Lazarus of Bethany","tagline":"죽음에서 부활한 예수님의 친구","summary":"나사로는 베다니에 살던 마르다와 마리아의 동생으로, 예수님이 사랑하시던 친구였습니다. 병들어 죽어 무덤에 있은 지 나흘이 되었을 때, 예수님은 \"나사로야 나오라\"고 외치셨고 그는 살아났습니다. 이 기적은 예수님이 부활이요 생명이심을 보여주었고, 많은 유대인이 이를 보고 예수님을 믿었습니다. 그러나 대제사장들은 나사로까지 죽이려 모의했습니다.","verses":[{"ref":"요 11:43","book_en":"John","ch":11,"v":43,"text":"이 말씀을 하시고 큰 소리로 나사로야 나오라 부르시니"},{"ref":"요 11:25","book_en":"John","ch":11,"v":25,"text":"예수께서 가라사대 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고"},{"ref":"요 12:11","book_en":"John","ch":12,"v":11,"text":"나사로 까닭에 많은 유대인이 가서 예수를 믿음이러라"}],"related":["f_jesus","f_martha","e_lazarus","b_john","d_christ","d_salvation"],"meta":{"role":"예수님이 살리신 베다니 사람"},"key_chapters":[{"book_id":"b_john","ref":"요 11:38-44","title":"나사로의 부활","text":"죽은 지 나흘 된 나사로를 살리신 예수님의 권능, 부활이요 생명이심의 증거입니다."},{"book_id":"b_john","ref":"요 12:9-11","title":"나사로를 죽이려는 모의","text":"나사로 때문에 많은 사람이 예수님을 믿자 종교 지도자들이 나사로까지 죽이려 한 장면입니다."}]},{"id":"f_mary_bethany","type":"figure","name":"베다니의 마리아","name_en":"Mary of Bethany","tagline":"향유 옥합으로 예수님의 장례를 예비한 여인","summary":"베다니의 마리아는 마르다의 동생이자 나사로의 누이입니다. 예수님의 말씀을 듣기 위해 그 발 앞에 앉았고(눅 10:39), 비싼 향유를 예수님의 발에 부어 장례를 예비했습니다(요 12:3-8). 이 사랑과 헌신은 구원을 얻기 위한 공로가 아니라, 주님의 은혜를 받은 믿음이 맺은 열매였습니다.","verses":[{"ref":"요 12:3","book_en":"John","ch":12,"v":3,"text":"마리아는 지극히 비싼 향유 곧 순전한 나드 한 근을 가져다가 예수의 발에 붓고 자기 머리털로 그의 발을 씻으니 향유 냄새가 집에 가득하더라"},{"ref":"눅 10:42","book_en":"Luke","ch":10,"v":42,"text":"그러나 몇 가지만 하든지 혹 한 가지만이라도 족하니라 마리아는 이 좋은 편을 택하였으니 빼앗기지 아니하리라 하시니라"},{"ref":"요 12:7","book_en":"John","ch":12,"v":7,"text":"예수께서 가라사대 저를 가만 두어 나의 장사할 날을 위하여 이를 두게 하라"}],"key_chapters":[{"book_id":"b_john","ref":"요 12장","title":"향유로 장례를 예비하다","text":"마리아가 값비싼 향유를 예수님의 발에 붓고, 주님은 그 일이 자신의 장례를 예비한 것이라고 말씀하십니다."}],"related":["f_martha","f_lazarus_bethany","f_jesus","b_john"],"meta":{"role":"향유 옥합을 깨뜨린 여인"}},{"id":"f_simon_cyrene","type":"figure","name":"구레네 시몬","name_en":"Simon of Cyrene","tagline":"억지로 예수님의 십자가를 진 구레네 사람","summary":"구레네 시몬은 골고다로 가던 중 로마 병사들에게 붙잡혀 예수님의 십자가를 대신 졌습니다(막 15:21). 마가는 그를 알렉산더와 루포의 아버지라고 소개하고, 로마서에는 루포가 교회의 일원으로 등장합니다(롬 16:13). 그는 뜻밖의 자리에서 십자가 사건 가까이에 서게 된 증인입니다. 구원은 십자가를 대신 진 행위가 아니라 그리스도의 대속을 믿는 은혜로 받습니다.","verses":[{"ref":"막 15:21","book_en":"Mark","ch":15,"v":21,"text":"마침 알렉산더와 루포의 아비인 구레네 사람 시몬이 시골로서 와서 지나가는데 저희가 그를 억지로 같이 가게 하여 예수의 십자가를 지우고"},{"ref":"마 27:32","book_en":"Matthew","ch":27,"v":32,"text":"나가다가 시몬이란 구레네 사람을 만나매 그를 억지로 같이 가게 하여 예수의 십자가를 지웠더라"},{"ref":"롬 16:13","book_en":"Romans","ch":16,"v":13,"text":"주 안에서 택하심을 입은 루포와 그 어머니에게 문안하라 그 어머니는 곧 내 어머니니라"}],"key_chapters":[{"book_id":"b_mark","ref":"막 15장","title":"십자가를 대신 지다","text":"예수님이 골고다로 가시는 길에 구레네 시몬이 붙들려 십자가를 대신 집니다."}],"related":["f_jesus","e_cross"],"meta":{"role":"예수님의 십자가를 대신 진 사람"}},{"id":"f_epaphras","type":"figure","name":"에바브라","name_en":"Epaphras","tagline":"골로새를 위해 항상 기도로 힘쓰던 종","summary":"에바브라는 바울에게 복음을 배워 골로새 교회를 세운 일꾼입니다(골 1:7). 바울은 그를 '그리스도 예수의 종'이라 부르며, 성도들이 하나님의 뜻 안에 굳게 서도록 항상 기도로 힘쓴다고 칭찬했습니다(골 4:12-13). 바울과 함께 옥에 갇히기도 했습니다(몬 1:23). 교회는 눈에 띄는 사람의 힘이 아니라 말씀과 기도로 섬기는 신실한 일꾼을 통해 세워집니다.","verses":[{"ref":"골 1:7","book_en":"Colossians","ch":1,"v":7,"text":"이와 같이 우리와 함께 종 된 사랑하는 에바브라에게 너희가 배웠나니 그는 너희를 위하여 그리스도의 신실한 일군이요"},{"ref":"골 4:12","book_en":"Colossians","ch":4,"v":12,"text":"그리스도 예수의 종인 너희에게서 온 에바브라가 너희에게 문안하니 저가 항상 너희를 위하여 애써 기도하여 너희로 하나님의 모든 뜻 가운데서 완전하고 확신 있게 서기를 구하나니"},{"ref":"몬 1:23","book_en":"Philemon","ch":1,"v":23,"text":"그리스도 예수 안에서 나와 함께 갇힌 자 에바브라와"}],"key_chapters":[{"book_id":"b_col","ref":"골 4장","title":"항상 애써 기도한 종","text":"에바브라가 골로새 성도들이 하나님의 뜻 가운데 굳게 서도록 힘써 기도합니다."}],"related":["f_paul","b_col","f_onesimus"],"meta":{"role":"골로새 교회를 세운 일꾼"}},{"id":"f_tychicus","type":"figure","name":"두기고","name_en":"Tychicus","tagline":"바울의 편지를 전한 사랑받는 형제","summary":"두기고는 바울의 신실한 동역자로 에베소서와 골로새서를 전달하고 바울의 안부를 전했습니다(엡 6:21, 골 4:7). 바울은 그를 '사랑을 받은 형제요 신실한 일꾼'이라고 불렀습니다. 복음 전파의 보이지 않는 자리에서 맡은 일을 충성스럽게 감당한 사람입니다. 하나님은 말씀을 전하고 성도를 위로하는 평범한 섬김도 귀하게 사용하십니다.","verses":[{"ref":"엡 6:21","book_en":"Ephesians","ch":6,"v":21,"text":"나의 사정 곧 내가 무엇을 하는지 너희에게도 알게 하려 하노니 사랑을 받은 형제요 주 안에서 진실한 일군인 두기고가 모든 일을 너희에게 알게 하리라"},{"ref":"골 4:7","book_en":"Colossians","ch":4,"v":7,"text":"두기고가 내 사정을 다 너희에게 알게 하리니 그는 사랑을 받는 형제요 신실한 일군이요 주 안에서 함께 된 종이라"},{"ref":"딤후 4:12","book_en":"2Timothy","ch":4,"v":12,"text":"두기고는 에베소로 보내었노라"}],"key_chapters":[{"book_id":"b_eph","ref":"엡 6장","title":"사랑받는 형제와 신실한 일꾼","text":"바울이 두기고를 보내 자신의 사정을 알리고 에베소 성도들의 마음을 위로하게 합니다."}],"related":["f_paul","b_eph","b_col"],"meta":{"role":"바울 서신의 전달자"}},{"id":"f_mary_johnmark_mother","type":"figure","name":"마가 요한의 어머니 마리아","name_en":"Mary, mother of John Mark","tagline":"초대교회가 모여 기도하던 집의 주인","summary":"마리아는 마가 요한의 어머니입니다. 예루살렘에 있던 그의 집은 초대교회가 함께 모여 기도하던 곳이었습니다(행 12:12). 베드로가 옥에서 풀려난 뒤 가장 먼저 찾아간 곳도 이 집이었습니다. 그는 집을 열어 성도들을 섬겼고, 하나님은 그들의 간절한 기도에 응답하셨습니다. 교회는 말씀과 기도, 그리고 기꺼이 자리를 내어 주는 섬김으로 함께 세워집니다.","verses":[{"ref":"행 12:12","book_en":"Acts","ch":12,"v":12,"text":"깨닫고 마가라 하는 요한의 어머니 마리아의 집에 가니 여러 사람이 모여 기도하더라"},{"ref":"행 12:5","book_en":"Acts","ch":12,"v":5,"text":"이에 베드로는 옥에 갇혔고 교회는 그를 위하여 간절히 하나님께 빌더라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 12장","title":"기도하던 교회의 집","text":"베드로가 옥에서 풀려난 뒤 여러 성도가 모여 기도하던 마리아의 집을 찾아갑니다."}],"related":["f_john_mark","f_peter","e_peter_prison"],"meta":{"role":"마가다락방의 주인"}},{"id":"f_phoebe","type":"figure","name":"뵈뵈","name_en":"Phoebe","tagline":"로마서를 전달한 겐그레아의 일꾼","summary":"뵈뵈는 겐그레아 교회의 일꾼(집사)으로, 바울이 로마서를 보낼 때 그 전달을 맡은 여인입니다. 바울은 로마 교회에 \"주 안에서 합당하게 영접하고, 무슨 일이든지 돕라\"고 부탁했습니다. 복음의 핵심 교리가 담긴 로마서가 오늘 우리 손에 있는 데에는 뵈뵈의 충성된 섬김이 있었습니다. 교회를 돕는 평신도 사역자의 본보기입니다.","verses":[{"ref":"롬 16:1","book_en":"Romans","ch":16,"v":1,"text":"내가 겐그레아 교회의 일군으로 있는 우리 자매 뵈뵈를 너희에게 천거하노니"},{"ref":"롬 16:2","book_en":"Romans","ch":16,"v":2,"text":"너희가 주 안에서 성도들의 합당한 예절로 그를 영접하고 무엇이든지 그에게 소용되는 바를 도와줄찌니 이는 그가 여러 사람과 나의 보호자가 되었음이니라"}],"related":["f_paul","b_romans","d_church","d_salvation"],"meta":{"role":"겐그레아 교회의 일꾼"},"key_chapters":[{"book_id":"b_romans","ref":"롬 16:1-2","title":"뵈뵈의 추천","text":"바울이 로마 교회에 뵈뵈를 영접하고 도울 것을 부탁한 말씀입니다."}]},{"id":"f_dorcas","type":"figure","name":"도로가","name_en":"Dorcas","tagline":"선행으로 부활한 욥바의 여제자","summary":"도로가(다비다)는 욥바에 살던 여제자로, \"선행과 구제하기를 심히 많이\" 한 여인이었습니다. 그가 병들어 죽자 성도들이 베드로를 청했고, 베드로는 기도한 뒤 \"다비다야 일어나라\"고 했습니다. 도로가가 살아나자 욥바의 많은 사람이 주를 믿었습니다. 이름 없는 자리에서 이웃을 섬기던 그의 삶은 하나님이 기억하시는 참된 경건의 모습입니다.","verses":[{"ref":"행 9:36","book_en":"Acts","ch":9,"v":36,"text":"욥바에 다비다라 하는 여제자가 있으니 그 이름을 번역하면 도르가라 선행과 구제하는 일이 심히 많더니"},{"ref":"행 9:40","book_en":"Acts","ch":9,"v":40,"text":"베드로가 사람을 다 내어보내고 무릎을 꿇고 기도하고 돌이켜 시체를 향하여 가로되 다비다야 일어나라 하니 그가 눈을 떠 베드로를 보고 일어나 앉는지라"},{"ref":"행 9:42","book_en":"Acts","ch":9,"v":42,"text":"온 욥바 사람이 알고 많이 주를 믿더라"}],"related":["f_peter","b_acts","d_church","d_salvation"],"meta":{"role":"욥바의 여제자, 구제의 여인"},"key_chapters":[{"book_id":"b_acts","ref":"행 9:36-42","title":"도로가의 부활","text":"선행이 많던 도로가가 죽었다가 베드로의 기도로 살아나 많은 사람이 주를 믿게 된 이야기입니다."}]},{"id":"f_barnabas","type":"figure","name":"바나바","name_en":"Barnabas","tagline":"권위의 아들, 사람을 세운 격려자","summary":"바나바(본명 요셉)는 구브로 출신 레위인으로, 사도들이 \"권위의 아들\"이라 별명을 붙인 격려자였습니다. 밭을 팔아 사도들의 발 앞에 두었고, 회심한 바울을 아무도 믿지 않을 때 그를 사도들에게 데려가 보증했습니다. 안디옥 교회를 세우는 데 앞장섰고, 바울과 함께 1차 전도여행을 떠났습니다. 마가 문제로 바울과 갈라선 뒤에도 마가를 끝까지 품은, 사람을 세우는 사람입니다.","verses":[{"ref":"행 4:36","book_en":"Acts","ch":4,"v":36,"text":"구브로에서 난 레위족인이 있으니 이름은 요셉이라 사도들이 일컬어 바나바(번역하면 권위자)라 하니"},{"ref":"행 9:27","book_en":"Acts","ch":9,"v":27,"text":"바나바가 데리고 사도들에게 가서 그가 길에서 어떻게 주를 본 것과 주께서 그에게 말씀하신 일과 다메섹에서 그가 어떻게 예수의 이름으로 담대히 말하던 것을 말하니라"},{"ref":"행 11:24","book_en":"Acts","ch":11,"v":24,"text":"바나바는 착한 사람이요 성령과 믿음이 충만한 자라 이에 큰 무리가 주께 더하더라"}],"related":["f_paul","f_john_mark","e_paul_conversion","e_mission1","b_acts","d_church","d_holyspirit"],"meta":{"role":"초대교회의 격려자, 선교사"},"key_chapters":[{"book_id":"b_acts","ref":"행 4:36-37","title":"밭을 판 바나바","text":"소유를 팔아 가난한 성도들을 도운 바나바의 사랑, '권위의 아들'이라는 별명의 시작입니다."},{"book_id":"b_acts","ref":"행 9:26-27","title":"바울을 보증하다","text":"회심한 바울을 모두가 의심할 때 그를 사도들에게 인도한 바나바의 용기입니다."},{"book_id":"b_acts","ref":"행 13:1-3","title":"1차 전도여행의 파송","text":"성령의 지시로 바나바와 바울이 안디옥 교회에서 파송받은 이방 선교의 출발점입니다."},{"book_id":"b_acts","ref":"행 15:36-39","title":"마가를 품은 바나바","text":"바울과 의견이 갈라진 뒤에도 마가를 데리고 격려한 바나바의 끝까지 품는 사랑입니다."}]},{"id":"f_silas","type":"figure","name":"실라","name_en":"Silas","tagline":"옥중에서도 찬송한 바울의 동역자","summary":"실라는 예루살렘 교회의 지도자 중 한 사람으로, 예언의 은사가 있던 사람입니다. 바울과 바나바가 갈라선 뒤 바울의 2차 전도여행 동역자가 되었습니다. 빌립보 감옥에 갇혔을 때 바울과 함께 기도하고 찬송했고, 그 밤에 옥문이 열리는 기적이 일어났습니다. 데살로니가전후서의 공동 발신자로도 이름이 올라 있는 충성된 동역자입니다.","verses":[{"ref":"행 16:25","book_en":"Acts","ch":16,"v":25,"text":"밤중쯤 되어 바울과 실라가 기도하고 하나님을 찬미하매 죄수들이 듣더라"},{"ref":"행 15:22","book_en":"Acts","ch":15,"v":22,"text":"이에 사도와 장로와 온 교회가 그 중에서 사람을 택하여 바울과 바나바와 함께 안디옥으로 보내기를 가결하니 곧 형제 중에 인도자인 바사바라 하는 유다와 실라더라"},{"ref":"살전 1:1","book_en":"1Thessalonians","ch":1,"v":1,"text":"바울과 실루아노와 디모데는 하나님 아버지와 주 예수 그리스도 안에 있는 데살로니가인의 교회에 편지하노니 은혜와 평강이 너희에게 있을찌어다"}],"related":["f_paul","f_barnabas","e_macedonia","e_jerusalem_council","b_acts","b_1th","b_2th","d_church"],"meta":{"role":"바울의 2차 전도여행 동역자"},"key_chapters":[{"book_id":"b_acts","ref":"행 15:40-41","title":"새 동역자 실라","text":"바나바와 갈라선 바울이 실라와 함께 2차 전도여행을 시작한 장면입니다."},{"book_id":"b_acts","ref":"행 16:25-34","title":"빌립보 옥중 찬송","text":"감옥에서 찬송하던 바울과 실라를 통해 간수와 그 집이 구원받은 이야기입니다."}]},{"id":"f_titus","type":"figure","name":"디도","name_en":"Titus","tagline":"그레데 교회를 세운 바울의 아들","summary":"디도는 헬라인 출신으로, 바울이 \"믿음 안에서 참 아들\"이라 부른 동역자입니다. 예루살렘 공의회에 바울과 함께 참석했고, 고린도 교회의 문제를 해결하는 데 바울의 특사로 활약했습니다. 후에는 그레데에 남아 교회를 세우고 장로들을 세우는 일을 맡았으며, 바울은 그에게 디도서를 보냈습니다. 어려운 교회를 맡아 질서를 세운 목회자입니다.","verses":[{"ref":"딛 1:4","book_en":"Titus","ch":1,"v":4,"text":"같은 믿음을 따라 된 나의 참 아들 디도에게 편지하노니 하나님 아버지와 그리스도 예수 우리 구주로 좇아 은혜와 평강이 네게 있을찌어다"},{"ref":"갈 2:3","book_en":"Galatians","ch":2,"v":3,"text":"그러나 나와 함께 있는 헬라인 디도라도 억지로 할례를 받게 아니하였으니"},{"ref":"고후 8:23","book_en":"2Corinthians","ch":8,"v":23,"text":"디도로 말하면 나의 동무요 너희를 위한 나의 동역자요 우리 형제들로 말하면 여러 교회의 사자들이요 그리스도의 영광이니라"}],"related":["f_paul","e_jerusalem_council","b_titus","b_2cor","b_gal","d_church"],"meta":{"role":"바울의 동역자, 그레데의 목회자"},"key_chapters":[{"book_id":"b_titus","ref":"딛 1:5","title":"그레데에 남겨진 사명","text":"남은 일을 정리하고 각 성에 장로들을 세우라는 바울의 부탁을 받은 디도입니다."},{"book_id":"b_2cor","ref":"고후 7:6-7","title":"고린도를 위로한 디도","text":"고린도 교회의 회개 소식을 바울에게 전해 위로한 디도의 사역입니다."},{"book_id":"b_gal","ref":"갈 2:1-3","title":"예루살렘 공의회에 동행","text":"헬라인 디도가 할례 문제의 논쟁 한가운데서 복음의 자유를 증명한 사건입니다."}]},{"id":"f_aquila_priscilla","type":"figure","name":"아굴라와 브리스길라","name_en":"Aquila and Priscilla","tagline":"천막 짓던 평신도 선교 부부","summary":"아굴라와 브리스길라는 글라우디오 황제의 유대인 추방령으로 로마를 떠나 고린도에 정착한 부부입니다. 바울과 같은 천막 만드는 직업을 가져 함께 일하며 복음을 전했고, 에베소에서는 아볼로에게 하나님의 도를 더 정확히 가르쳤습니다. 바울은 그들을 \"그리스도 예수 안에서 나의 동역자들\"이라 했고, 그들의 집은 교회가 모이는 처소가 되었습니다. 일터에서 복음을 전한 평신도 부부의 본보기입니다.","verses":[{"ref":"행 18:3","book_en":"Acts","ch":18,"v":3,"text":"업이 같으므로 함께 거하여 일을 하니 그 업은 장막을 만드는 것이더라"},{"ref":"행 18:26","book_en":"Acts","ch":18,"v":26,"text":"그가 회당에서 담대히 말하기를 시작하거늘 브리스길라와 아굴라가 듣고 데려다가 하나님의 도를 더 자세히 풀어 이르더라"},{"ref":"롬 16:3","book_en":"Romans","ch":16,"v":3,"text":"너희가 그리스도 예수 안에서 나의 동역자들인 브리스가와 아굴라에게 문안하라"}],"related":["f_paul","f_apollos","b_acts","b_romans","b_1cor","d_church","w_claudius"],"meta":{"role":"바울의 동역자 부부, 평신도 선교사"},"key_chapters":[{"book_id":"b_acts","ref":"행 18:1-3","title":"고린도에서의 만남","text":"추방되어 온 부부와 바울이 천막 만드는 일을 함께하며 복음을 나눈 시작입니다."},{"book_id":"b_acts","ref":"행 18:24-26","title":"아볼로를 가르치다","text":"성경에 능통한 아볼로에게 하나님의 도를 더 자세히 설명해 준 부부의 사역입니다."},{"book_id":"b_romans","ref":"롬 16:3-5","title":"바울의 동역자들","text":"바울이 목숨까지 내걸고 복음을 도운 부부에게 감사한 마음을 전한 말씀입니다."}]},{"id":"f_lydia","type":"figure","name":"루디아","name_en":"Lydia","tagline":"유럽 복음의 첫 열매","summary":"루디아는 두아디라 출신 자주 장사로, 빌립보에서 하나님을 섬기던 여인이었습니다. 바울의 설교를 들을 때 \"주께서 그 마음을 열어\" 말씀에 귀를 기울였고, 그와 온 집이 세례를 받았습니다. 이는 유럽 땅의 첫 회심으로, 빌립보 교회의 시작이 되었습니다. 루디아는 바울 일행을 자기 집에 머물게 하며 초대교회의 후원이 되었습니다.","verses":[{"ref":"행 16:14","book_en":"Acts","ch":16,"v":14,"text":"두아디라성의 자주 장사로서 하나님을 공경하는 루디아라 하는 한 여자가 들었는데 주께서 그 마음을 열어 바울의 말을 청종하게 하신지라"},{"ref":"행 16:15","book_en":"Acts","ch":16,"v":15,"text":"저와 그 집이 다 세례를 받고 우리에게 청하여 가로되 만일 나를 주 믿는 자로 알거든 내 집에 들어와 유하라 하고 강권하여 있게 하니라"}],"related":["f_paul","f_silas","e_macedonia","b_acts","b_php","d_salvation","d_church"],"meta":{"role":"빌립보 교회의 첫 회심자"},"key_chapters":[{"book_id":"b_acts","ref":"행 16:13-15","title":"마음을 여신 하나님","text":"강가에서 말씀을 듣던 루디아의 마음을 주께서 여셔서 온 집이 세례받은 이야기입니다."},{"book_id":"b_acts","ref":"행 16:40","title":"루디아의 집","text":"옥에서 나온 바울 일행이 루디아의 집에서 형제들을 위로한 빌립보 교회의 모임입니다."}]},{"id":"f_john_mark","type":"figure","name":"요한 마가","name_en":"John Mark","tagline":"실패에서 회복된 마가복음 저자","summary":"요한 마가는 예루살렘 마가 다락방의 아들로, 1차 전도여행에 동행했다가 밤빌리아에서 돌아가 바울과 갈등을 빚었습니다. 바나바는 그를 끝까지 품었고, 세월이 흐른 뒤 바울은 \"마가가 나의 일에 유익하다\"며 그를 불렀습니다. 실패했던 청년이 회복되어 마가복음을 기록했고, 베드로는 그를 \"내 아들\"이라 불렀습니다. 넘어진 사람을 포기하지 않으시는 하나님의 은혜를 보여줍니다.","verses":[{"ref":"행 15:38","book_en":"Acts","ch":15,"v":38,"text":"바울은 밤빌리아에서 자기들을 떠나 한가지로 일하러 가지 아니한 자를 데리고 가는 것이 옳지 않다 하여"},{"ref":"딤후 4:11","book_en":"2Timothy","ch":4,"v":11,"text":"누가만 나와 함께 있느니라 네가 올 때에 마가를 데리고 오라 저가 나의 일에 유익하니라"},{"ref":"벧전 5:13","book_en":"1Peter","ch":5,"v":13,"text":"함께 택하심을 받은 바벨론에 있는 교회가 너희에게 문안하고 내 아들 마가도 그리하느니라"}],"related":["f_paul","f_barnabas","f_peter","e_mission1","b_acts","b_mark","d_church"],"meta":{"role":"마가복음 저자, 바나바의 조카"},"key_chapters":[{"book_id":"b_acts","ref":"행 12:12","title":"마가 다락방","text":"베드로가 옥에서 풀려나 찾아간 마가의 어머니 집, 초대교회가 모여 기도하던 곳입니다."},{"book_id":"b_acts","ref":"행 13:13","title":"밤빌리아에서 돌아가다","text":"1차 전도여행 중 마가가 예루살렘으로 돌아간 일로 바울과 갈등이 생긴 사건입니다."},{"book_id":"b_acts","ref":"행 15:37-39","title":"바나바의 선택","text":"바울과 갈라서서까지 마가를 데리고 간 바나바의 격려가 훗날 마가를 세웠습니다."},{"book_id":"b_2tim","ref":"딤후 4:11","title":"유익한 마가","text":"말년에 바울이 \"마가가 나의 일에 유익하다\"며 그를 부른 회복의 고백입니다."}]},{"id":"f_luke_evangelist","type":"figure","name":"누가","name_en":"Luke the Evangelist","tagline":"사랑받는 의사, 누가복음·사도행전 저자","summary":"누가는 \"사랑받는 의사\"로 불린 이방인 그리스도인입니다. 바울의 전도여행에 동행하며 \"우리\"라는 표현으로 사도행전의 목격자였음을 드러냈습니다. 그는 \"모든 일을 근원부터 자세히 미루어 살핀\" 뒤 누가복음과 사도행전을 기록해, 데오빌로에게 예수님과 교회의 이야기를 전했습니다. 신약 성경의 4분의 1 이상을 기록한 위대한 역사가이자 바울의 끝까지 함께한 동역자입니다.","verses":[{"ref":"골 4:14","book_en":"Colossians","ch":4,"v":14,"text":"사랑을 받는 의원 누가와 또 데마가 너희에게 문안하느니라"},{"ref":"딤후 4:11","book_en":"2Timothy","ch":4,"v":11,"text":"누가만 나와 함께 있느니라 네가 올 때에 마가를 데리고 오라 저가 나의 일에 유익하니라"},{"ref":"눅 1:3","book_en":"Luke","ch":1,"v":3,"text":"그 모든 일을 근원부터 자세히 미루어 살핀 나도 데오빌로 각하에게 차례대로 써 보내는 것이 좋은줄 알았노니"}],"related":["f_paul","e_macedonia","e_paul_rome","b_luke","b_acts","b_col","b_2tim","d_christ"],"meta":{"role":"누가복음·사도행전 저자, 의사"},"key_chapters":[{"book_id":"b_luke","ref":"눅 1:1-4","title":"데오빌로에게 보내는 서문","text":"자세히 조사해 순서대로 기록하겠다는 누가의 역사가로서의 다짐입니다."},{"book_id":"b_acts","ref":"행 16:10","title":"우리 일행","text":"\"우리가\"라는 표현으로 누가가 바울 일행에 합류한 순간, 마게도냐 환상 직후입니다."},{"book_id":"b_2tim","ref":"딤후 4:11","title":"마지막까지 함께한 누가","text":"바울의 순교 직전 \"누가만 나와 함께 있다\"던 고백, 끝까지 남은 동역자입니다."}]},{"id":"f_apollos","type":"figure","name":"아볼로","name_en":"Apollos","tagline":"성경에 능통했던 알렉산드리아의 설교자","summary":"아볼로는 알렉산드리아 출신 유대인으로, 성경에 능통하고 말솜씨가 뛰어난 사람이었습니다. 에베소에서 열심히 예수님을 가르쳤으나 요한의 세례만 알았기에, 아굴라와 브리스길라가 하나님의 도를 더 자세히 설명해 주었습니다. 이후 아가야로 건너가 성경으로 예수님이 그리스도이심을 증명했고, 고린도 교회에서 바울과 함께 사역했습니다. 겸손히 배우고 가르친 설교자의 본보기입니다.","verses":[{"ref":"행 18:24","book_en":"Acts","ch":18,"v":24,"text":"알렉산드리아에서 난 아볼로라 하는 유대인이 에베소에 이르니 이 사람은 학문이 많고 성경에 능한 자라"},{"ref":"행 18:28","book_en":"Acts","ch":18,"v":28,"text":"이는 성경으로써 예수는 그리스도라고 증거하여 공중 앞에서 유력하게 유대인의 말을 이김일러라"},{"ref":"고전 3:6","book_en":"1Corinthians","ch":3,"v":6,"text":"나는 심었고 아볼로는 물을 주었으되 오직 하나님은 자라나게 하셨나니"}],"related":["f_paul","f_aquila_priscilla","b_acts","b_1cor","d_church"],"meta":{"role":"에베소·고린도의 설교자"},"key_chapters":[{"book_id":"b_acts","ref":"행 18:24-26","title":"더 자세히 배우다","text":"뛰어난 설교자 아볼로가 부부의 가르침을 겸손히 받아들인 장면입니다."},{"book_id":"b_acts","ref":"행 18:27-28","title":"아가야에서의 사역","text":"성경으로 예수님이 그리스도이심을 힘있게 증명한 아볼로의 변증입니다."},{"book_id":"b_1cor","ref":"고전 3:5-6","title":"심는 이와 물 주는 이","text":"\"나는 심었고 아볼로는 물을 주었으되 자라게 하시는 이는 하나님\"이라는 바울의 말씀입니다."}]},{"id":"f_philip_deacon","type":"figure","name":"빌립 집사","name_en":"Philip the Deacon","tagline":"사마리아에 복음을 전한 전도자","summary":"빌립 집사는 초대교회가 세운 일곱 집사 중 한 사람으로, 사도 빌립과는 다른 사람입니다. 스데반의 순교 후 흩어진 성도들 가운데 사마리아로 내려가 그리스도를 전파했고, 큰 기쁨이 그 성에 임했습니다. 성령의 인도하심으로 광야 길에서 에디오피아 내시를 만나 세례를 주었고, 이후 가이사랴에 정착해 네 딸과 함께 살았습니다. 집사에서 전도자로 쓰임받은 사람입니다.","verses":[{"ref":"행 8:5","book_en":"Acts","ch":8,"v":5,"text":"빌립이 사마리아 성에 내려가 그리스도를 백성에게 전파하니"},{"ref":"행 8:35","book_en":"Acts","ch":8,"v":35,"text":"빌립이 입을 열어 이 글에서 시작하여 예수를 가르쳐 복음을 전하니"},{"ref":"행 21:8","book_en":"Acts","ch":21,"v":8,"text":"이튿날 떠나 가이사랴에 이르러 일곱 집사 중 하나인 전도자 빌립의 집에 들어가서 유하니라"}],"related":["f_stephen","f_ethiopian_eunuch","e_deacons","e_stephen_martyrdom","e_ethiopian","b_acts","d_holyspirit","d_church"],"meta":{"role":"일곱 집사 중 하나, 전도자"},"key_chapters":[{"book_id":"b_acts","ref":"행 6:5","title":"일곱 집사의 선택","text":"성령과 지혜가 충만한 사람으로 뽑힌 일곱 집사 중 빌립의 이름이 올라 있습니다."},{"book_id":"b_acts","ref":"행 8:5-8","title":"사마리아 전도","text":"빌립이 사마리아에서 그리스도를 전파하자 큰 기쁨이 성에 임한 부흥의 장면입니다."},{"book_id":"b_acts","ref":"행 8:26-40","title":"에디오피아 내시에게 세례를","text":"성령의 인도하심으로 광야에서 내시를 만나 이사야서를 풀어 주고 세례를 준 이야기입니다."}]},{"id":"f_ananias_damascus","type":"figure","name":"다메섹의 아나니아","name_en":"Ananias of Damascus","tagline":"바울에게 안수한 순종의 제자","summary":"다메섹의 아나니아는 박해자 사울에게 안수하라는 주님의 명령을 받은 제자입니다. \"저가 주의 이름을 부르는 모든 사람을 결박하려 한다\"는 두려움에도 불구하고 순종해 사울을 찾아가 \"형제 사울아\"라 부르며 안수했습니다. 사울의 눈에서 비늘 같은 것이 벗겨지고 그가 성령 충만을 받았습니다. 위대한 사도 바울의 회심 뒤에는 이름 없는 한 제자의 순종이 있었습니다.","verses":[{"ref":"행 9:17","book_en":"Acts","ch":9,"v":17,"text":"아나니아가 떠나 그 집에 들어가서 그에게 안수하여 가로되 형제 사울아 주 곧 네가 오는 길에서 나타나시던 예수께서 나를 보내어 너로 다시 보게 하시고 성령으로 충만하게 하신다 하니"},{"ref":"행 9:18","book_en":"Acts","ch":9,"v":18,"text":"즉시 사울의 눈에서 비늘 같은 것이 벗어져 다시 보게 된지라 일어나 세례를 받고"},{"ref":"행 22:14","book_en":"Acts","ch":22,"v":14,"text":"그가 또 가로되 우리 조상들의 하나님이 너를 택하여 너로 하여금 자기 뜻을 알게 하시며 저 의인을 보게 하시고 그 입에서 나오는 음성을 듣게 하셨으니"}],"related":["f_paul","e_paul_conversion","b_acts","d_salvation","d_church"],"meta":{"role":"다메섹의 제자"},"key_chapters":[{"book_id":"b_acts","ref":"행 9:10-18","title":"형제 사울아","text":"두려움을 이기고 순종한 아나니아의 안수로 사울이 눈을 뜨고 세례받은 장면입니다."},{"book_id":"b_acts","ref":"행 22:12-16","title":"바울의 간증 속 아나니아","text":"바울이 직접 회상한 아나니아의 예언, \"의인을 택하사 주의 뜻을 알게 하셨다\"는 말씀입니다."}]},{"id":"f_ananias_sapphira","type":"figure","name":"아나니아와 삽비라","name_en":"Ananias and Sapphira","tagline":"성령을 속인 부부에 대한 경고","summary":"아나니아와 삽비라는 밭을 팔아 그 값의 일부를 감추고 전부인 것처럼 사도들의 발 앞에 둔 부부입니다. 베드로는 \"네가 사람을 속인 것이 아니요 하나님을 속인 것\"이라며, 이는 성령을 속인 죄라고 선언했습니다. 두 사람은 그 자리에서 목숨을 잃었고, 온 교회와 듣는 자들에게 큰 두려움이 임했습니다. 교회의 거룩하심을 지키시는 하나님의 준엄한 경고를 보여주는 사건입니다.","verses":[{"ref":"행 5:3","book_en":"Acts","ch":5,"v":3,"text":"베드로가 가로되 아나니아야 어찌하여 사단이 네 마음에 가득하여 네가 성령을 속이고 땅값 얼마를 감추었느냐"},{"ref":"행 5:5","book_en":"Acts","ch":5,"v":5,"text":"아나니아가 이 말을 듣고 엎드러져 혼이 떠나니 이 일을 듣는 사람이 다 크게 두려워하더라"},{"ref":"행 5:11","book_en":"Acts","ch":5,"v":11,"text":"온 교회와 이 일을 듣는 사람들이 다 크게 두려워하니라"}],"related":["f_peter","e_ananias","b_acts","d_holyspirit","d_church"],"meta":{"role":"성령을 속인 부부"},"key_chapters":[{"book_id":"b_acts","ref":"행 5:1-11","title":"아나니아와 삽비라의 죽음","text":"거짓으로 성령을 속인 부부에 대한 하나님의 심판과 교회에 임한 두려움의 기록입니다."}]},{"id":"f_cornelius","type":"figure","name":"백부장 고넬료","name_en":"Cornelius","tagline":"이방인 구원의 문을 연 백부장","summary":"고넬료는 가이사랴에 주둔한 이탈리아 부대의 백부장으로, 하나님을 경외하고 구제를 많이 하던 경건한 사람이었습니다. 환상 중에 베드로를 청하라는 지시를 받고 베드로를 초청했고, 베드로가 복음을 전할 때 성령이 이방인들에게 임했습니다. 이는 복음이 유대인을 넘어 이방 세계로 열리는 결정적 전환점이 되었고, 베드로는 \"하나님은 외모로 사람을 취하지 않으신다\"고 고백했습니다.","verses":[{"ref":"행 10:2","book_en":"Acts","ch":10,"v":2,"text":"그가 경건하여 온 집으로 더불어 하나님을 경외하며 백성을 많이 구제하고 하나님께 항상 기도하더니"},{"ref":"행 10:44","book_en":"Acts","ch":10,"v":44,"text":"베드로가 이 말 할때에 성령이 말씀 듣는 모든 사람에게 내려오시니"},{"ref":"행 10:34","book_en":"Acts","ch":10,"v":34,"text":"베드로가 입을 열어 가로되 내가 참으로 하나님은 사람의 외모를 취하지 아니하시고"}],"related":["f_peter","e_cornelius","e_jerusalem_council","b_acts","d_holyspirit","d_church","d_salvation"],"meta":{"role":"가이사랴의 백부장, 첫 이방인 회심자"},"key_chapters":[{"book_id":"b_acts","ref":"행 10:1-8","title":"고넬료의 환상","text":"기도하던 고넬료에게 천사가 나타나 베드로를 청하라고 지시한 장면입니다."},{"book_id":"b_acts","ref":"행 10:34-48","title":"이방인에게 임한 성령","text":"베드로의 설교 중에 이방인들에게 성령이 임해 세례받은 구원의 문이 열린 사건입니다."},{"book_id":"b_acts","ref":"행 11:1-18","title":"베드로의 해명","text":"예루살렘 교회에 이방인 구원을 보고한 베드로, 교회가 하나님의 일을 인정한 순간입니다."}]},{"id":"f_ethiopian_eunuch","type":"figure","name":"에디오피아 내시","name_en":"Ethiopian Eunuch","tagline":"광야에서 세례받은 간다게의 내시","summary":"에디오피아 내시는 여왕 간다게의 국고를 맡은 고관으로, 예배하러 예루살렘에 왔다가 돌아가는 길이었습니다. 병거에서 이사야서를 읽고 있었으나 깨닫지 못했고, 성령의 인도하심으로 빌립 집사가 다가가 이사야 53장의 고난받는 종이 예수님임을 전했습니다. 내시는 \"믿나이다\" 고백하고 물에서 세례를 받았으며, 기뻐하며 자기 길로 갔습니다. 복음이 아프리카로 뻗어 나간 첫 열매입니다.","verses":[{"ref":"행 8:30","book_en":"Acts","ch":8,"v":30,"text":"빌립이 달려가서 선지자 이사야의 글 읽는 것을 듣고 말하되 읽는 것을 깨닫느뇨"},{"ref":"행 8:37","book_en":"Acts","ch":8,"v":37,"text":"(없음)"},{"ref":"행 8:39","book_en":"Acts","ch":8,"v":39,"text":"둘이 물에서 올라갈새 주의 영이 빌립을 이끌어 간지라 내시는 흔연히 길을 가므로 그를 다시 보지 못하니라"}],"related":["f_philip_deacon","e_ethiopian","b_acts","d_christ","d_salvation","d_holyspirit"],"meta":{"role":"에디오피아의 고관, 첫 아프리카 회심자"},"key_chapters":[{"book_id":"b_acts","ref":"행 8:26-31","title":"광야 길의 만남","text":"성령의 지시로 광야 길에 선 빌립이 이사야서를 읽던 내시를 만난 장면입니다."},{"book_id":"b_acts","ref":"행 8:32-39","title":"세례받는 내시","text":"이사야 53장을 풀어 준 빌립의 전도로 내시가 세례받고 기뻐하며 간 이야기입니다."}]},{"id":"f_herod_great","type":"figure","name":"헤롯 대왕","name_en":"Herod the Great","tagline":"아기 예수를 죽이려 한 유대의 왕","summary":"헤롯 대왕은 로마의 인정을 받아 유대를 다스린 왕으로, 예루살렘 성전을 웅장하게 재건했습니다. 동방박사들에게서 유대인의 왕이 나셨다는 소식을 듣고 베들레헴의 두 살 아래 사내아이를 다 죽이는 학살을 저질렀습니다. 그러나 하나님의 아들을 막을 수 없었고, 그는 비참한 최후를 맞았습니다. 인간 권력이 하나님의 구속 계획을 막지 못함을 보여주는 인물입니다.","verses":[{"ref":"마 2:3","book_en":"Matthew","ch":2,"v":3,"text":"헤롯왕과 온 예루살렘이 듣고 소동한지라"},{"ref":"마 2:16","book_en":"Matthew","ch":2,"v":16,"text":"이에 헤롯이 박사들에게 속은 줄을 알고 심히 노하여 사람을 보내어 베들레헴과 그 모든 지경 안에 있는 사내 아이를 박사들에게 자세히 알아본 그 때를 표준하여 두 살부터 그 아래로 다 죽이니"}],"related":["f_jesus","e_birth","e_magi","b_matthew","w_herod","w_herod_temple","d_christ"],"meta":{"role":"예수 탄생 당시 유대의 왕"},"key_chapters":[{"book_id":"b_matthew","ref":"마 2:1-8","title":"동방박사와 헤롯","text":"메시아 탄생 소식에 두려워하며 박사들을 속여 정보를 캐내려 한 헤롯의 계략입니다."},{"book_id":"b_matthew","ref":"마 2:16-18","title":"베들레헴의 학살","text":"아기 예수님을 없애려 사내아이들을 죽인 헤롯의 잔혹함, 예레미야의 예언 성취입니다."}]},{"id":"f_herod_antipas","type":"figure","name":"헤롯 안디바","name_en":"Herod Antipas","tagline":"세례 요한을 죽인 분봉왕","summary":"헤롯 안디바는 헤롯 대왕의 아들로 갈릴리를 다스린 분봉왕입니다. 형제의 아내 헤로디아를 취한 것을 책망한 세례 요한을 감옥에 가두었다가, 헤로디아의 딸의 춤 앞에서 한 맹세 때문에 요한의 목을 베었습니다. 예수님을 심문할 때는 희롱만 하고 빌라도에게 돌려보냈습니다. 죄를 지적하는 선지자의 음성을 끝내 외면한 통치자입니다.","verses":[{"ref":"막 6:27","book_en":"Mark","ch":6,"v":27,"text":"왕이 곧 시위병 하나를 보내어 요한의 머리를 가져오라 명하니 그 사람이 나가 옥에서 요한을 목 베어"},{"ref":"눅 23:11","book_en":"Luke","ch":23,"v":11,"text":"헤롯이 그 군병들과 함께 예수를 업신여기며 희롱하고 빛난 옷을 입혀 빌라도에게 도로 보내니"},{"ref":"눅 13:32","book_en":"Luke","ch":13,"v":32,"text":"가라사대 가서 저 여우에게 이르되 오늘과 내일 내가 귀신을 쫓아내며 병을 낫게 하다가 제 삼일에는 완전하여지리라 하라"}],"related":["f_jesus","f_john_baptist","e_trial","b_mark","b_luke","w_tiberius"],"meta":{"role":"갈릴리의 분봉왕"},"key_chapters":[{"book_id":"b_mark","ref":"막 6:14-29","title":"세례 요한의 순교","text":"헤로디아의 딸의 춤과 맹세 때문에 요한을 죽인 안디바의 비극적인 선택입니다."},{"book_id":"b_luke","ref":"눅 23:6-12","title":"예수님을 희롱하다","text":"빌라도가 보낸 예수님을 심문 대신 희롱하고 돌려보낸 안디바의 모습입니다."}]},{"id":"f_herod_agrippa1","type":"figure","name":"헤롯 아그립바 1세","name_en":"Herod Agrippa I","tagline":"교회를 박해하다 심판받은 왕","summary":"헤롯 아그립바 1세는 헤롯 대왕의 손자로 유대를 다스린 왕입니다. 유대인들의 환심을 사려고 교회를 박해해 사도 야고보를 칼로 죽이고 베드로를 옥에 가두었습니다. 그러나 베드로는 천사의 도움으로 풀려났고, 아그립바는 가이사랴에서 \"신의 소리\"라는 아첨을 받고도 하나님께 영광을 돌리지 않아 충에 먹혀 죽었습니다. 교회를 대적하는 자의 최후를 보여줍니다.","verses":[{"ref":"행 12:2","book_en":"Acts","ch":12,"v":2,"text":"요한의 형제 야고보를 칼로 죽이니"},{"ref":"행 12:23","book_en":"Acts","ch":12,"v":23,"text":"헤롯이 영광을 하나님께로 돌리지 아니하는고로 주의 사자가 곧 치니 충이 먹어 죽으니라"}],"related":["f_james_zebedee","f_peter","e_peter_prison","b_acts","w_claudius"],"meta":{"role":"야고보를 죽인 유대의 왕"},"key_chapters":[{"book_id":"b_acts","ref":"행 12:1-5","title":"교회를 향한 박해","text":"야고보를 죽이고 베드로를 옥에 가둔 아그립바 1세의 박해, 교회가 간절히 기도한 밤입니다."},{"book_id":"b_acts","ref":"행 12:20-23","title":"하나님의 심판","text":"영광을 하나님께 돌리지 않은 아그립바가 충에 먹혀 죽은 하나님의 심판입니다."}]},{"id":"f_herod_agrippa2","type":"figure","name":"헤롯 아그립바 2세","name_en":"Herod Agrippa II","tagline":"바울의 변론을 들은 마지막 헤롯 왕","summary":"헤롯 아그립바 2세는 아그립바 1세의 아들로, 유대 종교 문제에 밝은 왕이었습니다. 베스도가 바울의 재판을 위해 그를 불렀고, 바울은 아그립바 앞에서 자신의 회심과 부활의 복음을 담대히 전했습니다. 아그립바는 \"네가 적은 말로 나를 그리스도인이 되게 하려느냐\"고 했고, \"이 사람이 가이사에게 상소하지 않았다면 놓을 수 있었을 것\"이라 인정했습니다. 복음을 듣고도 결단하지 못한 아쉬운 왕입니다.","verses":[{"ref":"행 26:28","book_en":"Acts","ch":26,"v":28,"text":"아그립바가 바울더러 이르되 네가 적은 말로 나를 권하여 그리스도인이 되게 하려 하는도다"},{"ref":"행 26:32","book_en":"Acts","ch":26,"v":32,"text":"이에 아그립바가 베스도더러 일러 가로되 이 사람이 만일 가이사에게 호소하지 아니하였더면 놓을 수 있을뻔하였다 하니라"}],"related":["f_paul","e_paul_arrest","b_acts","w_nero","d_christ"],"meta":{"role":"바울을 심문한 유대의 왕"},"key_chapters":[{"book_id":"b_acts","ref":"행 25:13-27","title":"아그립바의 방문","text":"바울의 재판을 위해 가이사랴를 찾은 아그립바 2세와 베스도의 재판정입니다."},{"book_id":"b_acts","ref":"행 26:1-29","title":"아그립바 앞의 변론","text":"바울이 회심 간증과 부활 복음을 전한 명변론, 아그립바의 아쉬운 반응입니다."}]},{"id":"f_pilate","type":"figure","name":"본디오 빌라도","name_en":"Pontius Pilate","tagline":"손을 씻은 로마 총독","summary":"본디오 빌라도는 유대를 다스리던 로마 총독으로, 예수님의 재판을 맡았습니다. 그는 \"나는 이 사람에게서 죄를 찾지 못하노라\"고 여러 번 선언했으면서도, 무리의 요구에 못 이겨 예수님을 십자가에 내주었습니다. 손을 씻으며 \"이 사람의 피에 대해 무죄하다\"고 했지만, 진리를 알면서도 결단하지 못한 비겁함의 대명사가 되었습니다. 십자가 위 명패에 \"나사렛 예수 유대인의 왕\"이라 쓴 것도 그입니다.","verses":[{"ref":"요 18:38","book_en":"John","ch":18,"v":38,"text":"빌라도가 가로되 진리가 무엇이냐 하더라 이 말을 하고 다시 유대인들에게 나가서 이르되 나는 그에게서 아무 죄도 찾지 못하노라"},{"ref":"마 27:24","book_en":"Matthew","ch":27,"v":24,"text":"빌라도가 아무 효험도 없이 도리어 민란이 나려는 것을 보고 물을 가져다가 무리 앞에서 손을 씻으며 가로되 이 사람의 피에 대하여 나는 무죄하니 너희가 당하라"},{"ref":"요 19:19","book_en":"John","ch":19,"v":19,"text":"빌라도가 패를 써서 십자가 위에 붙이니 나사렛 예수 유대인의 왕이라 기록되었더라"}],"related":["f_jesus","e_trial","e_cross","b_matthew","b_john","w_pilate","w_tiberius","d_christ"],"meta":{"role":"예수님을 십자가에 넘긴 로마 총독"},"key_chapters":[{"book_id":"b_john","ref":"요 18:28-40","title":"빌라도의 심문","text":"\"진리가 무엇이냐\" 묻고도 무리에게 굴복한 빌라도의 재판 과정입니다."},{"book_id":"b_matthew","ref":"마 27:24-26","title":"손을 씻은 빌라도","text":"무죄를 알면서도 예수님을 내어준 빌라도, 죄를 씻을 수 없는 손 씻음입니다."},{"book_id":"b_john","ref":"요 19:19-22","title":"십자가 위 명패","text":"\"나사렛 예수 유대인의 왕\"이라 쓴 명패를 고수한 빌라도의 마지막 기록입니다."}]},{"id":"f_caiaphas","type":"figure","name":"대제사장 가야바","name_en":"Caiaphas","tagline":"예수님을 정죄한 대제사장","summary":"가야바는 예수님 당시의 대제사장으로, 예수님을 죽이려는 공회를 주도했습니다. 그는 \"한 사람이 백성을 위하여 죽는 것이 유익하다\"고 했는데, 요한복음은 이를 무의식중에 한 대속의 예언이라 밝힙니다. 밤중에 열린 불법 재판에서 예수님이 \"하나님의 아들 그리스도\"라 답하시자 신성모독이라 정죄했습니다. 종교적 권위를 지키려 하나님의 아들을 죽인 비극의 인물입니다.","verses":[{"ref":"요 11:50","book_en":"John","ch":11,"v":50,"text":"한 사람이 백성을 위하여 죽어서 온 민족이 망하지 않게 되는 것이 너희에게 유익한 줄을 생각지 아니하는도다 하였으니"},{"ref":"마 26:65","book_en":"Matthew","ch":26,"v":65,"text":"이에 대제사장이 자기 옷을 찢으며 가로되 저가 참람한 말을 하였으니 어찌 더 증인을 요구하리요 보라 너희가 지금 이 참람한 말을 들었도다"},{"ref":"요 18:14","book_en":"John","ch":18,"v":14,"text":"가야바는 유대인들에게 한 사람이 백성을 위하여 죽는 것이 유익하다 권고하던 자러라"}],"related":["f_jesus","e_trial","e_lazarus","b_matthew","b_john","d_christ"],"meta":{"role":"예수님 당시의 대제사장"},"key_chapters":[{"book_id":"b_john","ref":"요 11:47-53","title":"가야바의 예언","text":"나사로 사건 후 공회에서 \"한 사람이 죽는 것이 유익하다\"고 한 무의식중의 예언입니다."},{"book_id":"b_matthew","ref":"마 26:57-68","title":"밤중의 불법 재판","text":"가야바 앞에서 열린 재판에서 예수님이 그리스도이심을 밝히신 장면입니다."}]},{"id":"f_gamaliel","type":"figure","name":"가말리엘","name_en":"Gamaliel","tagline":"사도들을 살린 지혜로운 바리새인","summary":"가말리엘은 바리새인이자 율법 교사로, 백성에게 존경을 받던 산헤드린 의원이었습니다. 사도들을 죽이려던 공회에서 \"이 사람들을 내버려 두라, 이 사상과 소행이 하나님께로서 났으면 너희가 저희를 없이하지 못할 것\"이라고 말해 사도들을 구했습니다. 바울은 그의 문하에서 율법을 배웠습니다. 하나님의 주권을 인정한 지혜로운 판단으로 교회를 보호한 인물입니다.","verses":[{"ref":"행 5:38","book_en":"Acts","ch":5,"v":38,"text":"이제 내가 너희에게 말하노니 이 사람들을 상관 말고 버려두라 이 사상과 이 소행이 사람에게로서 났으면 무너질 것이요"},{"ref":"행 5:39","book_en":"Acts","ch":5,"v":39,"text":"만일 하나님께로서 났으면 너희가 저희를 무너뜨릴 수 없겠고 도리어 하나님을 대적하는 자가 될까 하노라 하니"},{"ref":"행 22:3","book_en":"Acts","ch":22,"v":3,"text":"나는 유대인으로 길리기아 다소에서 났고 이 성에서 자라 가말리엘의 문하에서 우리 조상들의 율법의 엄한 교훈을 받았고 오늘 너희 모든 사람처럼 하나님께 대하여 열심하는 자라"}],"related":["f_paul","e_peter_sermon","b_acts","d_church"],"meta":{"role":"바리새인 율법 교사, 바울의 스승"},"key_chapters":[{"book_id":"b_acts","ref":"행 5:34-42","title":"가말리엘의 충고","text":"\"하나님께로서 났으면 없이하지 못하리라\"는 말로 사도들을 구한 공회의 장면입니다."},{"book_id":"b_acts","ref":"행 22:3","title":"바울의 스승","text":"바울이 \"가말리엘의 문하에서\" 율법을 배웠다고 간증한 말씀입니다."}]},{"id":"f_simon_magus","type":"figure","name":"시몬 마술사","name_en":"Simon Magus","tagline":"성령을 돈으로 사려 한 마술사","summary":"시몬은 사마리아에서 마술로 백성을 놀라게 하던 사람으로, 빌립의 전도를 듣고 세례를 받았습니다. 그러나 베드로와 요한이 안수할 때 성령이 임하는 것을 보고 돈으로 그 권능을 사려 했습니다. 베드로는 \"네 은과 네가 함께 망할지어다\"라며 그의 마음이 하나님 앞에서 바르지 못함을 책망했습니다. 외형적 회심과 달리 탐욕에 사로잡힌 거짓 믿음에 대한 경고입니다.","verses":[{"ref":"행 8:20","book_en":"Acts","ch":8,"v":20,"text":"베드로가 가로되 네가 하나님의 선물을 돈 주고 살 줄로 생각하였으니 네 은과 네가 함께 망할찌어다"},{"ref":"행 8:21","book_en":"Acts","ch":8,"v":21,"text":"하나님 앞에서 네 마음이 바르지 못하니 이 도에는 네가 관계도 없고 분깃 될 것도 없느니라"},{"ref":"행 8:13","book_en":"Acts","ch":8,"v":13,"text":"시몬도 믿고 세례를 받은 후에 전심으로 빌립을 따라 다니며 그 나타나는 표적과 큰 능력을 보고 놀라니라"}],"related":["f_peter","f_philip_deacon","b_acts","d_holyspirit","d_salvation"],"meta":{"role":"사마리아의 마술사"},"key_chapters":[{"book_id":"b_acts","ref":"행 8:9-24","title":"시몬의 탐욕","text":"성령의 권능을 돈으로 사려다 베드로에게 책망받은 시몬의 이야기입니다."}]},{"id":"f_zacchaeus","type":"figure","name":"삭개오","name_en":"Zacchaeus","tagline":"뽕나무에서 내려온 세리장","summary":"삭개오는 여리고의 세리장으로, 키가 작아 예수님을 보려고 뽕나무에 올라갔습니다. 예수님은 그를 보시고 \"삭개오야 속히 내려오라 내가 오늘 네 집에 유하여야 하겠다\"고 하셨습니다. 삭개오는 기뻐하며 영접했고, 재산의 절반을 가난한 자에게 주고 토색한 것은 네 배로 갚겠다고 했습니다. 예수님은 \"오늘 구원이 이 집에 이르렀으니\"라고 선포하셨습니다. 잃은 자를 찾아 구원하시는 예수님의 사역을 보여주는 표본입니다.","verses":[{"ref":"눅 19:5","book_en":"Luke","ch":19,"v":5,"text":"예수께서 그곳에 이르사 우러러 보시고 이르시되 삭개오야 속히 내려오라 내가 오늘 네 집에 유하여야 하겠다 하시니"},{"ref":"눅 19:8","book_en":"Luke","ch":19,"v":8,"text":"삭개오가 서서 주께 여짜오되 주여 보시옵소서 내 소유의 절반을 가난한 자들에게 주겠사오며 만일 뉘 것을 토색한 일이 있으면 사배나 갚겠나이다"},{"ref":"눅 19:10","book_en":"Luke","ch":19,"v":10,"text":"인자의 온 것은 잃어버린 자를 찾아 구원하려 함이니라"}],"related":["f_jesus","b_luke","d_salvation","d_christ"],"meta":{"role":"회심한 여리고의 세리장"},"key_chapters":[{"book_id":"b_luke","ref":"눅 19:1-10","title":"삭개오의 회심","text":"뽕나무에서 내려온 삭개오가 예수님을 영접하고 삶이 바뀐 구원의 이야기입니다."}]},{"id":"f_nicodemus","type":"figure","name":"니고데모","name_en":"Nicodemus","tagline":"밤에 찾아온 산헤드린 의원","summary":"니고데모는 바리새인이자 산헤드린의 의원이었습니다. 밤에 예수님을 찾아와 \"하나님께로부터 오신 선생\"이라 고백했고, 예수님은 그에게 \"거듭나지 않으면 하나님 나라를 볼 수 없다\"고 하셨습니다. 이 대화 중에 \"하나님이 세상을 이처럼 사랑하사\"라는 요한복음 3장 16절이 주어졌습니다. 후에 공회에서 예수님을 변호했고, 예수님의 장례 때는 몰약과 침향을 가져와 장사를 도왔습니다. 진리를 향해 한 걸음씩 나아간 구도자입니다.","verses":[{"ref":"요 3:16","book_en":"John","ch":3,"v":16,"text":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"},{"ref":"요 3:3","book_en":"John","ch":3,"v":3,"text":"예수께서 대답하여 가라사대 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 하나님 나라를 볼수 없느니라"},{"ref":"요 19:39","book_en":"John","ch":19,"v":39,"text":"일찍 예수께 밤에 나아왔던 니고데모도 몰약과 침향 섞은 것을 백 근쯤 가지고 온지라"}],"related":["f_jesus","e_nicodemus","e_cross","b_john","d_salvation","d_christ"],"meta":{"role":"거듭남을 배운 바리새인 의원"},"key_chapters":[{"book_id":"b_john","ref":"요 3:1-21","title":"거듭나야 하리라","text":"밤에 찾아온 니고데모에게 물과 성령으로 거듭남을 가르치신 예수님의 말씀입니다."},{"book_id":"b_john","ref":"요 7:50-51","title":"공회에서의 변호","text":"예수님을 잡으려는 공회에서 공정한 재판을 요구한 니고데모의 용기입니다."},{"book_id":"b_john","ref":"요 19:38-40","title":"장례를 도운 니고데모","text":"아리마대 요셉과 함께 예수님의 시신을 장사 지낸 니고데모의 마지막 섬김입니다."}]},{"id":"f_joseph_arimathea","type":"figure","name":"아리마대 요셉","name_en":"Joseph of Arimathea","tagline":"무덤을 내어준 숨은 제자","summary":"아리마대 요셉은 산헤드린의 존경받는 의원이었으나, 예수님의 제자 된 것을 두려움 때문에 숨기고 있었습니다. 그러나 예수님이 십자가에서 돌아가시자 담대히 빌라도에게 시신을 요구해 자기 새 무덤에 모셨습니다. 이는 \"부자와 함께\" 장사될 것이라는 이사야의 예언의 성취였습니다. 결정적 순간에 숨은 제자에서 드러난 제자로 일어선 용기의 본보기입니다.","verses":[{"ref":"마 27:59","book_en":"Matthew","ch":27,"v":59,"text":"요셉이 시체를 가져다가 정한 세마포로 싸서"},{"ref":"막 15:43","book_en":"Mark","ch":15,"v":43,"text":"아리마대 사람 요셉이 와서 당돌히 빌라도에게 들어가 예수의 시체를 달라 하니 이 사람은 존귀한 공회원이요 하나님의 나라를 기다리는 자라"},{"ref":"요 19:38","book_en":"John","ch":19,"v":38,"text":"아리마대 사람 요셉이 예수의 제자나 유대인을 두려워하여 은휘하더니 이 일 후에 빌라도더러 예수의 시체를 가져가기를 구하매 빌라도가 허락하는지라 이에 가서 예수의 시체를 가져가니라"}],"related":["f_jesus","f_nicodemus","e_cross","b_matthew","b_john","b_mark","d_christ"],"meta":{"role":"예수님을 장사 지낸 산헤드린 의원"},"key_chapters":[{"book_id":"b_matthew","ref":"마 27:57-60","title":"새 무덤에 모시다","text":"아리마대 요셉이 자기 새 무덤에 예수님의 시신을 모신 장례의 기록입니다."},{"book_id":"b_john","ref":"요 19:38-42","title":"담대한 요청","text":"두려움을 이기고 빌라도에게 시신을 요구한 요셉과 니고데모의 섬김입니다."}]},{"id":"f_onesimus","type":"figure","name":"오네시모","name_en":"Onesimus","tagline":"도망친 종에서 사랑받는 형제로","summary":"오네시모는 빌레몬의 집에서 도망친 종으로, 로마 감옥에 갇힌 바울을 만나 복음을 듣고 회심했습니다. 바울은 그를 \"내가 갇힌 중에서 낳은 아들\"이라 부르며 빌레몬에게 돌려보냈습니다. 바울은 빌레몬에게 오네시모를 \"종 이상으로, 사랑받는 형제로\" 받아 달라고 간청했습니다. 복음이 신분의 벽을 허물고 형제를 만드는 능력을 보여주는 빌레몬서의 주인공입니다.","verses":[{"ref":"몬 1:10","book_en":"Philemon","ch":1,"v":10,"text":"갇힌 중에서 낳은 아들 오네시모를 위하여 네게 간구하노라"},{"ref":"몬 1:16","book_en":"Philemon","ch":1,"v":16,"text":"이 후로는 종과 같이 아니하고 종에서 뛰어나 곧 사랑 받는 형제로 둘 자라 내게 특별히 그러하거든 하물며 육신과 주 안에서 상관된 네게랴"},{"ref":"골 4:9","book_en":"Colossians","ch":4,"v":9,"text":"신실하고 사랑을 받는 형제 오네시모를 함께 보내노니 그는 너희에게서 온 사람이라 저희가 여기 일을 다 너희에게 알게 하리라"}],"related":["f_paul","b_phm","b_col","d_church","d_salvation"],"meta":{"role":"빌레몬의 종에서 회심한 형제"},"key_chapters":[{"book_id":"b_phm","ref":"몬 1:10-16","title":"사랑받는 형제로","text":"도망친 종 오네시모를 형제로 받아 달라는 바울의 간청이 담긴 편지입니다."},{"book_id":"b_col","ref":"골 4:7-9","title":"충성된 형제 오네시모","text":"바울이 오네시모를 \"신실하고 사랑받는 형제\"라 소개한 말씀입니다."}]},{"id":"d_scripture","type":"doctrine","name":"성경론","name_en":"Bibliology","tagline":"하나님의 말씀, 성경","summary":"성경은 하나님이 사람을 통해 기록하게 하신 하나님의 말씀입니다. 개혁주의는 성경만이 신앙과 삶의 최종 권위라고 고백합니다. 성경은 구원에 필요한 모든 것을 분명하고 충분하게 가르쳐 줍니다. 그래서 성도는 날마다 성경을 읽고, 설교를 듣고, 말씀대로 살아야 합니다.","verses":[{"ref":"딤후 3:16","book_en":"2Timothy","ch":3,"v":16,"text":"모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니"},{"ref":"벧후 1:21","book_en":"2Peter","ch":1,"v":21,"text":"예언은 언제든지 사람의 뜻으로 낸 것이 아니요 오직 성령의 감동하심을 입은 사람들이 하나님께 받아 말한 것임이니라"},{"ref":"요 10:35","book_en":"John","ch":10,"v":35,"text":"성경은 폐하지 못하나니 하나님의 말씀을 받은 사람들을 신이라 하셨거든"}],"related":["d_god","d_christ","d_man","b_2tim","b_2pet","f_timothy","f_paul"],"meta":{"locus":"서론"},"sub_doctrines":[{"title":"성경의 권위","summary":"성경은 모든 신앙과 행위의 유일하고 최종적인 규범입니다. 교회의 전통이나 개인의 체험도 성경 아래 있습니다. '성경이 말하면 하나님이 말씀하신 것'이라는 자세로 받아들여야 합니다.","key_chapters":[{"book_id":"b_2tim","ref":"딤후 3:16-17","title":"모든 성경은 하나님의 감동으로","text":"성경의 출처와 용도를 밝힌 구절로, 성경이 교훈과 책망과 바르게 함에 유익함을 말합니다."},{"book_id":"b_john","ref":"요 10:35","title":"성경은 폐하지 못하나니","text":"예수님께서 성경의 권위를 직접 확증하신 말씀입니다."},{"book_id":"b_rev","ref":"계 22:18-19","title":"더하거나 빼지 말라","text":"성경 말씀에 인간의 생각을 더하거나 빼는 것을 엄히 금하십니다."}]},{"title":"계시 - 일반계시와 특별계시","summary":"하나님은 자연과 양심을 통해 자신을 알리시지만(일반계시), 구원에 이르게 하는 지식은 성경(특별계시)으로 주셨습니다. 일반계시만으로는 구원에 이를 수 없습니다.","key_chapters":[{"book_id":"b_romans","ref":"롬 1:19-20","title":"보이지 아니하는 것들이 창세로부터","text":"자연을 통해 하나님의 영원하신 능력과 신성이 분명히 보인다고 말합니다."},{"book_id":"b_heb","ref":"히 1:1-2","title":"아들로 말씀하셨으니","text":"옛적에는 선지자들로, 마지막에는 아들로 말씀하신 특별계시를 설명합니다."},{"book_id":"b_john","ref":"요 1:18","title":"본래 하나님을 본 사람이 없으되","text":"아들이신 예수님이 하나님을 설명해 주셨다고 말합니다."}]},{"title":"성경의 영감","summary":"성경은 사람이 쓴 글이지만, 성령의 감동으로 오류 없이 기록된 하나님의 말씀입니다. 기록자들의 개성은 살리시면서도, 하나님께서 친히 말씀하신 바를 담게 하셨습니다.","key_chapters":[{"book_id":"b_2pet","ref":"벧후 1:21","title":"성령의 감동하심을 입은 사람들이","text":"예언은 사람의 뜻으로 낸 것이 아니라 성령의 감동으로 기록되었음을 말합니다."},{"book_id":"b_2tim","ref":"딤후 3:16","title":"모든 성경은 하나님의 감동으로","text":"성경 전체가 하나님의 숨결로 주어졌음을 선언합니다."},{"book_id":"b_2pet","ref":"벧후 3:15-16","title":"바울의 편지를 성경과 같이","text":"사도들의 글도 성경으로 인정되었음을 보여줍니다."}]},{"title":"성경의 명료성과 충분성","summary":"구원에 필요한 진리는 성경에 분명하게 기록되어 있어 평신도도 알 수 있습니다. 또한 신앙과 삶에 필요한 모든 것이 성경에 충분히 담겨 있어 다른 계시를 더할 필요가 없습니다.","key_chapters":[{"book_id":"b_john","ref":"요 20:31","title":"믿게 하려 함이라","text":"성경이 기록된 목적은 예수님을 믿고 생명을 얻게 하려는 것임을 말합니다."},{"book_id":"b_2tim","ref":"딤후 3:15","title":"구원에 이르는 지혜","text":"성경이 구원에 이르는 지혜를 준다고 말합니다."},{"book_id":"b_romans","ref":"롬 15:4","title":"미리 기록된 바는 교훈을 위하여","text":"성경이 오늘 우리를 가르치기 위해 기록되었음을 말합니다."}]}]},{"id":"d_god","type":"doctrine","name":"신론","name_en":"Theology Proper","tagline":"스스로 계신 한 분 하나님","summary":"하나님은 스스로 계시며 영원하시고, 모든 것을 아시고 모든 것을 하실 수 있는 분입니다. 하나님은 한 분이시되 성부, 성자, 성령 세 위격으로 계십니다. 이 삼위일체 하나님을 알고 사랑하고 섬기는 것이 신앙의 시작입니다.","verses":[{"ref":"요 4:24","book_en":"John","ch":4,"v":24,"text":"하나님은 영이시니 예배하는 자가 신령과 진정으로 예배할찌니라"},{"ref":"딤전 1:17","book_en":"1Timothy","ch":1,"v":17,"text":"만세의 왕 곧 썩지 아니하고 보이지 아니하고 홀로 하나이신 하나님께 존귀와 영광이 세세토록 있어지이다 아멘"},{"ref":"요일 4:8","book_en":"1John","ch":4,"v":8,"text":"사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"}],"related":["d_scripture","d_christ","d_holyspirit","d_creation","b_john","b_romans","f_jesus","e_baptism"],"meta":{"locus":"신론"},"sub_doctrines":[{"title":"하나님의 존재","summary":"하나님은 '스스로 있는 자'이십니다. 누구에게서 나신 것도 아니고, 시작도 끝도 없으신 영원하신 분입니다. 하나님은 영이시므로 눈에 보이지 않지만, 만물 가운데 분명히 계십니다.","key_chapters":[{"book_id":"b_john","ref":"요 4:24","title":"하나님은 영이시니","text":"하나님의 본질이 영이심을 밝힌 말씀입니다."},{"book_id":"b_1tim","ref":"딤전 1:17","title":"영원하신 왕","text":"영원하시고 홀로 하나이신 하나님께 영광을 돌립니다."},{"book_id":"b_rev","ref":"계 4:11","title":"만물을 창조하시고","text":"만물의 창조주이신 하나님을 찬양하는 장면입니다."}]},{"title":"하나님의 속성 - 거룩, 사랑, 주권","summary":"하나님은 죄와 완전히 구별되신 거룩한 분이시며, 동시에 사랑 그 자체이십니다. 그리고 만물을 뜻대로 다스리시는 주권자이십니다. 이 세 속성이 함께 어우러진 분이 우리의 하나님이십니다.","key_chapters":[{"book_id":"b_1jn","ref":"요일 4:8","title":"하나님은 사랑이시라","text":"하나님의 본질이 사랑임을 선언합니다."},{"book_id":"b_1pet","ref":"벧전 1:15-16","title":"너희도 거룩할지어다","text":"거룩하신 하나님을 본받아 거룩하라는 명령입니다."},{"book_id":"b_romans","ref":"롬 11:33-36","title":"깊도다 하나님의 지혜와 지식의 풍성함이여","text":"하나님의 주권과 지혜를 찬양하는 고백입니다."}]},{"title":"삼위일체","summary":"하나님은 한 분이시되 성부, 성자, 성령 세 위격으로 영원히 계십니다. 세 위격은 동등한 하나님이시며, 한 분 하나님을 이룹니다. 예수님의 세례 때 세 위격이 함께 나타나셨습니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 28:19","title":"아버지와 아들과 성령의 이름으로","text":"세 위격의 한 이름으로 세례를 명하신 말씀입니다."},{"book_id":"b_2cor","ref":"고후 13:13","title":"성령의 교통하심이","text":"삼위일체 하나님의 축복을 담은 인사입니다."},{"book_id":"b_matthew","ref":"마 3:16-17","title":"예수님의 세례","text":"성부, 성자, 성령이 함께 나타나신 장면입니다."}]}]},{"id":"d_creation","type":"doctrine","name":"창조론","name_en":"Creation and Providence","tagline":"만물을 지으시고 붙드시는 하나님","summary":"하나님은 말씀으로 천지를 창조하셨고, 그 창조는 아들이신 예수 그리스도를 통해 이루어졌습니다. 창조는 과거의 사건으로 끝나지 않았습니다. 하나님은 지금도 만물을 붙드시고, 모든 일을 선하게 이끌어 가십니다. 이것이 섭리입니다.","verses":[{"ref":"요 1:3","book_en":"John","ch":1,"v":3,"text":"만물이 그로 말미암아 지은바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라"},{"ref":"골 1:16","book_en":"Colossians","ch":1,"v":16,"text":"만물이 그에게 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 보좌들이나 주관들이나 정사들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고"},{"ref":"히 1:3","book_en":"Hebrews","ch":1,"v":3,"text":"이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결케 하는 일을 하시고 높은 곳에 계신 위엄의 우편에 앉으셨느니라"}],"related":["d_god","d_man","d_christ","b_john","b_col","b_heb"],"meta":{"locus":"창조론"},"sub_doctrines":[{"title":"창조","summary":"태초에 하나님이 천지를 창조하셨습니다. 신약은 이 창조가 '말씀이신 그리스도'를 통해 이루어졌다고 밝힙니다. 만물은 그리스도로 말미암아 지어졌고, 그분을 위해 존재합니다.","key_chapters":[{"book_id":"b_john","ref":"요 1:1-3","title":"만물이 그로 말미암아","text":"말씀이신 그리스도를 통한 창조를 선언합니다."},{"book_id":"b_col","ref":"골 1:16-17","title":"만물이 그에게 창조되되","text":"보이는 것과 보이지 않는 모든 것이 그리스도 안에서 지어졌음을 말합니다."},{"book_id":"b_heb","ref":"히 11:3","title":"하나님의 말씀으로","text":"믿음으로 세계가 하나님의 말씀으로 지어진 줄 안다고 말합니다."}]},{"title":"하나님의 섭리","summary":"하나님은 창조하신 세계를 버려두지 않으시고, 능력의 말씀으로 붙드시며 다스리십니다. 참새 한 마리도 하나님의 허락 없이는 떨어지지 않습니다. 성도에게는 모든 것이 합력하여 선을 이룹니다.","key_chapters":[{"book_id":"b_heb","ref":"히 1:3","title":"만물을 붙드시며","text":"그리스도께서 능력의 말씀으로 만물을 붙드신다고 말합니다."},{"book_id":"b_romans","ref":"롬 8:28","title":"합력하여 선을 이루느니라","text":"하나님을 사랑하는 자에게는 모든 것이 선을 이룬다는 약속입니다."},{"book_id":"b_matthew","ref":"마 10:29-31","title":"머리털까지 다 세신 바 되었나니","text":"하나님의 세밀한 돌보심을 보여주는 말씀입니다."}]},{"title":"새 창조","summary":"하나님의 창조 사역은 그리스도 안에서 '새 창조'로 이어집니다. 거듭난 성도는 새로운 피조물이며, 역사의 끝에는 새 하늘과 새 땅이 옵니다. 창조-타락-구속-완성의 큰 그림이 여기서 완성됩니다.","key_chapters":[{"book_id":"b_2cor","ref":"고후 5:17","title":"새로운 피조물이라","text":"그리스도 안에 있는 자는 새 창조를 받은 존재라고 말합니다."},{"book_id":"b_rev","ref":"계 21:5","title":"만물을 새롭게 하노라","text":"보좌에 앉으신 이가 만물을 새롭게 하신다고 선언하십니다."},{"book_id":"b_romans","ref":"롬 8:21","title":"썩어짐의 종 노릇 한 데서","text":"피조물이 장차 영광의 자유에 이를 것을 말합니다."}]}]},{"id":"d_man","type":"doctrine","name":"인간론","name_en":"Anthropology","tagline":"하나님의 형상, 그러나 타락한 인간","summary":"사람은 하나님의 형상대로 지음받은 존귀한 존재입니다. 그러나 첫 사람 아담의 범죄로 모든 인류가 죄 가운데 떨어졌습니다. 사람은 스스로 구원할 수 없을 만큼 죄에 깊이 물들어 있습니다. 이것이 전적 타락입니다. 그래서 구원은 전적으로 하나님의 은혜여야 합니다.","verses":[{"ref":"롬 5:12","book_en":"Romans","ch":5,"v":12,"text":"이러므로 한 사람으로 말미암아 죄가 세상에 들어오고 죄로 말미암아 사망이 왔나니 이와 같이 모든 사람이 죄를 지었으므로 사망이 모든 사람에게 이르렀느니라"},{"ref":"엡 2:1","book_en":"Ephesians","ch":2,"v":1,"text":"너희의 허물과 죄로 죽었던 너희를 살리셨도다"},{"ref":"롬 3:23","book_en":"Romans","ch":3,"v":23,"text":"모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니"}],"related":["d_creation","d_salvation","d_christ","b_romans","b_eph","f_paul","e_paul_conversion"],"meta":{"locus":"인간론"},"sub_doctrines":[{"title":"하나님의 형상","summary":"사람은 동물과 달리 하나님의 형상대로 지음받았습니다. 그래서 이성과 양심과 하나님을 아는 마음을 가졌고, 한 사람 한 사람이 존귀합니다. 타락 후에도 형상은 완전히 지워지지 않았습니다.","key_chapters":[{"book_id":"b_jas","ref":"약 3:9","title":"하나님의 형상대로 지음을 받은 사람","text":"사람을 저주하지 말아야 할 이유로 하나님의 형상을 듭니다."},{"book_id":"b_col","ref":"골 3:10","title":"형상을 따라","text":"새 사람은 창조하신 자의 형상을 따라 새롭게 된다고 말합니다."},{"book_id":"b_1cor","ref":"고전 11:7","title":"하나님의 형상과 영광","text":"사람이 하나님의 형상임을 말합니다."}]},{"title":"인간의 타락과 원죄","summary":"아담 한 사람의 범죄로 죄가 세상에 들어오고, 모든 사람이 죄인이 되었습니다. 우리는 아담 안에서 죄의 본성을 물려받아 태어납니다. 이것이 원죄입니다.","key_chapters":[{"book_id":"b_romans","ref":"롬 5:12","title":"한 사람으로 말미암아","text":"아담의 범죄로 죄와 사망이 모든 사람에게 이른 것을 말합니다."},{"book_id":"b_romans","ref":"롬 5:18-19","title":"한 사람의 순종치 아니함으로","text":"아담의 불순종과 그리스도의 순종을 대비합니다."},{"book_id":"b_1cor","ref":"고전 15:22","title":"아담 안에서 모든 사람이 죽은 것 같이","text":"아담 안에서의 죽음과 그리스도 안에서의 생명을 말합니다."}]},{"title":"전적 타락","summary":"타락한 인간은 영적으로 죽은 상태입니다. 스스로 하나님을 찾지도, 구원을 선택하지도 못합니다. 이성, 감정, 의지 어느 한 부분도 죄의 영향을 벗어나지 못했습니다.","key_chapters":[{"book_id":"b_eph","ref":"엡 2:1-3","title":"허물과 죄로 죽었던 너희를","text":"영적으로 죽었던 상태를 생생하게 묘사합니다."},{"book_id":"b_romans","ref":"롬 3:10-12","title":"의인은 없나니","text":"모든 사람이 죄 아래 있음을 선언합니다."},{"book_id":"b_romans","ref":"롬 8:7-8","title":"육신의 생각은 하나님과 원수가 되나니","text":"타락한 본성이 하나님을 기쁘시게 할 수 없음을 말합니다."}]}]},{"id":"d_salvation","type":"doctrine","name":"구원론","name_en":"Soteriology","tagline":"오직 은혜로, 오직 믿음으로","summary":"구원은 하나님이 죄인을 구원하시는 전적인 은혜의 역사입니다. 성령이 죽은 영혼을 살리시고(중생), 죄인은 회개하고 믿음으로 응답하며, 하나님은 그를 의롭다고 선언하십니다(칭의). 구원받은 성도는 평생 거룩해져 가고(성화), 하나님께서 끝까지 붙드십니다(견인).","verses":[{"ref":"엡 2:8","book_en":"Ephesians","ch":2,"v":8,"text":"너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라"},{"ref":"롬 8:30","book_en":"Romans","ch":8,"v":30,"text":"또 미리 정하신 그들을 또한 부르시고 부르신 그들을 또한 의롭다 하시고 의롭다 하신 그들을 또한 영화롭게 하셨느니라"},{"ref":"빌 1:6","book_en":"Philippians","ch":1,"v":6,"text":"너희 속에 착한 일을 시작하신 이가 그리스도 예수의 날까지 이루실 줄을 우리가 확신하노라"}],"related":["d_christ","d_holyspirit","d_man","d_eschatology","b_romans","b_eph","f_paul","e_cross"],"meta":{"locus":"구원론"},"sub_doctrines":[{"title":"칭의","summary":"칭의는 하나님이 죄인을 예수 그리스도를 믿는 믿음으로 의롭다고 선언하시는 은혜입니다. 우리의 행위가 아니라 그리스도의 의가 우리에게 전가됩니다. '오직 믿음'은 종교개혁의 핵심 외침이었습니다.","key_chapters":[{"book_id":"b_romans","ref":"롬 8:33-34","title":"누가 능히 하나님 택하신 자들을 송사하리요","text":"하나님의 선언 앞에서는 어떤 고발도 무효함을 말합니다."},{"book_id":"b_gal","ref":"갈 2:16","title":"율법의 행위로 의롭다 함을 얻을 육체가 없나니","text":"오직 그리스도를 믿는 믿음으로 의롭다 함을 받는다고 말합니다."},{"book_id":"b_2cor","ref":"고후 5:21","title":"죄를 알지도 못하신 자로","text":"우리의 죄는 그리스도께, 그분의 의는 우리에게 옮겨졌음을 말합니다."}]},{"title":"중생","summary":"중생은 성령이 죽었던 영혼을 살리셔서 거듭나게 하시는 하나님의 주권적 역사입니다. 사람은 스스로 거듭날 수 없으며, 이는 전적인 은혜입니다. 중생한 사람은 죄를 회개하고 새 삶을 삽니다.","key_chapters":[{"book_id":"b_john","ref":"요 3:3-8","title":"거듭나지 아니하면","text":"거듭남의 필요와 성령의 주권적 역사를 말씀하십니다."},{"book_id":"b_eph","ref":"엡 2:1","title":"허물과 죄로 죽었던 너희를 살리셨도다","text":"중생이 죽은 자를 살리시는 하나님의 역사임을 말합니다."},{"book_id":"b_titus","ref":"딛 3:5","title":"중생의 씻음과 성령의 새롭게 하심으로","text":"중생이 우리의 행위가 아닌 하나님의 긍휼로 된 것임을 말합니다."}]},{"title":"회개와 믿음","summary":"회개는 죄에서 돌이키는 것이고, 믿음은 그리스도께로 향하는 것입니다. 이 둘은 중생한 사람이 보이는 응답으로, 동전의 양면과 같습니다. 진정한 믿음은 빈손으로 그리스도를 붙잡는 것입니다.","key_chapters":[{"book_id":"b_acts","ref":"행 2:38","title":"너희가 회개하여","text":"베드로의 첫 설교에 대한 회중의 응답으로 회개를 촉구합니다."},{"book_id":"b_mark","ref":"막 1:15","title":"회개하고 복음을 믿으라","text":"예수님의 첫 선포에 담긴 구원의 초청입니다."},{"book_id":"b_john","ref":"요 6:29","title":"하나님이 보내신 자를 믿는 것이","text":"하나님의 일이 곧 예수님을 믿는 것임을 말씀하십니다."}]},{"title":"성화","summary":"성화는 구원받은 성도가 평생에 걸쳐 죄에서 떠나 그리스도를 닮아가는 변화입니다. 성령께서 말씀과 고난을 통해 우리를 빚으십니다. 칭의가 단번의 선언이라면, 성화는 평생의 과정입니다.","key_chapters":[{"book_id":"b_1th","ref":"살전 4:3","title":"너희의 거룩함이라","text":"하나님의 뜻이 성도의 거룩함임을 밝힙니다."},{"book_id":"b_romans","ref":"롬 6:11-13","title":"죄에 대하여는 죽은 자요","text":"죄에는 죽고 하나님께는 산 자로 여기라고 권면합니다."},{"book_id":"b_heb","ref":"히 12:14","title":"거룩함을 좇으라","text":"거룩함 없이는 주를 보지 못할 것이라고 경고합니다."}]},{"title":"성도의 견인","summary":"참으로 구원받은 성도는 끝까지 믿음을 지키게 됩니다. 넘어지고 흔들릴 수는 있지만, 하나님께서 친히 붙드시기 때문입니다. 구원의 시작도 끝도 하나님의 손에 있습니다.","key_chapters":[{"book_id":"b_john","ref":"요 10:28-29","title":"내 손에서 빼앗을 자가 없느니라","text":"예수님의 손에 있는 양은 아무도 빼앗을 수 없다고 약속하십니다."},{"book_id":"b_romans","ref":"롬 8:38-39","title":"하나님의 사랑에서","text":"어떤 것도 우리를 그리스도 안의 사랑에서 끊을 수 없다고 말합니다."},{"book_id":"b_php","ref":"빌 1:6","title":"이루실 줄","text":"착한 일을 시작하신 이가 완성하신다는 확신입니다."}]}]},{"id":"f_philemon","type":"figure","name":"빌레몬","name_en":"Philemon","tagline":"용서로 화해를 이룬 성도","summary":"골로새에 사는 성도 빌레몬은 도망친 종 오네시모의 주인이었습니다. 바울은 오네시모를 그에게 돌려보내며 \"이제는 종과 같이 대하지 말고 사랑받는 형제로 받으라\"고 권했습니다. 빌레몬의 용서는 복음이 만드는 화해의 모습입니다.","verses":[{"ref":"몬 1:16","book_en":"Philemon","ch":1,"v":16,"text":"이 후로는 종과 같이 아니하고 종에서 뛰어나 곧 사랑 받는 형제로 둘 자라 내게 특별히 그러하거든 하물며 육신과 주 안에서 상관된 네게랴"},{"ref":"몬 1:17","book_en":"Philemon","ch":1,"v":17,"text":"그러므로 네가 나를 동무로 알찐대 저를 영접하기를 내게 하듯하고"},{"ref":"몬 1:15","book_en":"Philemon","ch":1,"v":15,"text":"저가 잠시 떠나게 된 것은 이를 인하여 저를 영원히 두게 함이니"}],"related":["f_onesimus","f_paul","b_phm"],"meta":{"role":"골로새 교회의 성도, 오네시모의 주인"},"key_chapters":[{"book_id":"b_phm","ref":"몬 1:10-16","title":"사랑받는 형제로","text":"도망친 종 오네시모를 형제로 받아 달라는 바울의 간청이 담긴 편지입니다."},{"book_id":"b_phm","ref":"몬 1:17-19","title":"내게 하듯 하라","text":"빌레몬에게 오네시모를 바울 자신처럼 영접해 달라고 부탁하는 말씀입니다."}]},{"id":"f_demas","type":"figure","name":"데마","name_en":"Demas","tagline":"세상을 사랑하여 떠난 동역자","summary":"데마는 한때 바울의 동역자로 복음을 위해 수고했습니다. 그러나 마지막에는 \"이 세상을 사랑하여\" 바울을 버리고 떠났습니다. 데마는 시작보다 끝이 중요하고, 끝까지 붙드는 믿음이 얼마나 귀한지를 경고하는 인물입니다.","verses":[{"ref":"딤후 4:10","book_en":"2Timothy","ch":4,"v":10,"text":"데마는 이 세상을 사랑하여 나를 버리고 데살로니가로 갔고 그레스게는 갈라디아로, 디도는 달마디아로 갔고"},{"ref":"골 4:14","book_en":"Colossians","ch":4,"v":14,"text":"사랑을 받는 의원 누가와 또 데마가 너희에게 문안하느니라"},{"ref":"몬 1:24","book_en":"Philemon","ch":1,"v":24,"text":"또한 나의 동역자 마가, 아리스다고, 데마, 누가가 문안하느니라"}],"related":["f_paul","f_luke_evangelist","b_2tim"],"meta":{"role":"바울의 동역자였다가 세상을 택한 자"},"key_chapters":[{"book_id":"b_col","ref":"골 4:14","title":"문안하는 데마","text":"바울 곁에서 함께 사역하던 때의 데마를 보여 주는 말씀입니다."},{"book_id":"b_2tim","ref":"딤후 4:10","title":"세상을 사랑하여","text":"바울을 버리고 떠난 데마의 마지막 모습을 전하는 경고의 말씀입니다."}]},{"id":"f_eunice_lois","type":"figure","name":"유니스와 로이스","name_en":"Eunice and Lois","tagline":"신앙을 다음 세대에 전한 어머니와 외조모","summary":"디모데의 외조모 로이스와 어머니 유니스는 거짓 없는 믿음을 가진 여인들이었습니다. 바울은 디모데 안에 있는 믿음이 그 두 여인에게서 이어진 것임을 기억하라고 했습니다. 가정의 신앙 교육이 얼마나 귀한지를 보여주는 본보기입니다.","verses":[{"ref":"딤후 1:5","book_en":"2Timothy","ch":1,"v":5,"text":"이는 네 속에 거짓이 없는 믿음을 생각함이라 이 믿음은 먼저 네 외조모 로이스와 네 어머니 유니게 속에 있더니 네 속에도 있는 줄을 확신하노라"},{"ref":"딤후 3:15","book_en":"2Timothy","ch":3,"v":15,"text":"또 네가 어려서부터 성경을 알았나니 성경은 능히 너로 하여금 그리스도 예수 안에 있는 믿음으로 말미암아 구원에 이르는 지혜가 있게 하느니라"},{"ref":"행 16:1","book_en":"Acts","ch":16,"v":1,"text":"바울이 더베와 루스드라에도 이르매 거기 디모데라 하는 제자가 있으니 그 모친은 믿는 유대 여자요 부친은 헬라인이라"}],"related":["f_timothy","f_paul","b_2tim"],"meta":{"role":"디모데의 어머니와 외조모"},"key_chapters":[{"book_id":"b_2tim","ref":"딤후 1:5","title":"거짓이 없는 믿음","text":"로이스와 유니스를 거쳐 디모데에게 이른 믿음의 계보를 말합니다."},{"book_id":"b_2tim","ref":"딤후 3:15","title":"어렸을 때부터 성경을","text":"어린 시절부터 말씀으로 양육받은 디모데의 모습을 보여 줍니다."}]},{"id":"f_epaphroditus","type":"figure","name":"에바브로디도","name_en":"Epaphroditus","tagline":"목숨을 걸고 섬긴 동역자","summary":"에바브로디도는 빌립보 교회의 후원을 들고 로마 감옥의 바울에게 갔습니다. 그는 병들어 죽을 뻔하면서도 사명을 감당했고, 바울은 그를 \"나의 형제요 동역자요 군사\"라 불렀습니다. 이름 없이 충성하는 일꾼의 본보기입니다.","verses":[{"ref":"빌 2:25","book_en":"Philippians","ch":2,"v":25,"text":"그러나 에바브로디도를 너희에게 보내는 것이 필요한 줄로 생각하노니 그는 나의 형제요 함께 수고하고 함께 군사된 자요 너희 사자로 나의 쓸 것을 돕는 자라"},{"ref":"빌 2:29","book_en":"Philippians","ch":2,"v":29,"text":"이러므로 너희가 주 안에서 모든 기쁨으로 저를 영접하고 또 이와 같은 자들을 존귀히 여기라"},{"ref":"빌 2:30","book_en":"Philippians","ch":2,"v":30,"text":"저가 그리스도의 일을 위하여 죽기에 이르러도 자기 목숨을 돌아보지 아니한 것은 나를 섬기는 너희의 일에 부족함을 채우려 함이니라"}],"related":["f_paul","b_php"],"meta":{"role":"빌립보 교회가 바울에게 보낸 사자"},"key_chapters":[{"book_id":"b_php","ref":"빌 2:25-26","title":"나의 형제요 동역자요 군사","text":"바울이 에바브로디도를 소개하며 그의 수고를 높이 평가하는 말씀입니다."},{"book_id":"b_php","ref":"빌 2:29-30","title":"죽기에 이르러","text":"그리스도의 일을 위해 목숨을 아끼지 않은 헌신을 기리는 말씀입니다."}]},{"id":"f_theophilus","type":"figure","name":"데오빌로","name_en":"Theophilus","tagline":"누가복음과 사도행전을 받은 사람","summary":"데오빌로는 누가복음과 사도행전의 첫 독자였습니다. 누가는 그에게 \"들은 바를 확실히 알게 하려\" 순서대로 기록했다고 했습니다. 성경이 한 사람을 향한 사랑과 정성에서 기록되었다는 것을 보여줍니다.","verses":[{"ref":"눅 1:3","book_en":"Luke","ch":1,"v":3,"text":"그 모든 일을 근원부터 자세히 미루어 살핀 나도 데오빌로 각하에게 차례대로 써 보내는 것이 좋은줄 알았노니"},{"ref":"눅 1:4","book_en":"Luke","ch":1,"v":4,"text":"이는 각하로 그 배운 바의 확실함을 알게 하려 함이로라"},{"ref":"행 1:1","book_en":"Acts","ch":1,"v":1,"text":"데오빌로여 내가 먼저 쓴 글에는 무릇 예수의 행하시며 가르치시기를 시작하심부터"}],"related":["f_luke_evangelist","b_luke","b_acts"],"meta":{"role":"누가복음·사도행전의 수신자"},"key_chapters":[{"book_id":"b_luke","ref":"눅 1:1-4","title":"확실히 알게 하려","text":"데오빌로에게 보내는 누가복음의 서문으로, 기록 목적을 밝히는 말씀입니다."},{"book_id":"b_acts","ref":"행 1:1-3","title":"앞 책에서","text":"사도행전이 누가복음에 이어지는 두 번째 책임을 보여 주는 말씀입니다."}]},{"id":"f_felix","type":"figure","name":"벨릭스","name_en":"Felix","tagline":"결단을 미룬 총독","summary":"유대 총독 벨릭스는 바울에게서 복음을 듣고 두려움을 느꼈지만, \"네가 물러가라, 내가 틈이 있으면 너를 부르리라\"며 결단을 미뤘습니다. 복음을 듣고도 미루는 것이 얼마나 위험한지를 보여주는 경고의 인물입니다.","verses":[{"ref":"행 24:25","book_en":"Acts","ch":24,"v":25,"text":"바울이 의와 절제와 장차 오는 심판을 강론하니 벨릭스가 두려워하여 대답하되 시방은 가라 내가 틈이 있으면 너를 부르리라 하고"},{"ref":"행 24:26","book_en":"Acts","ch":24,"v":26,"text":"동시에 또 바울에게서 돈을 받을까 바라는고로 더 자주 불러 같이 이야기하더라"}],"related":["f_paul","b_acts"],"meta":{"role":"바울을 재판한 유대 총독"},"key_chapters":[{"book_id":"b_acts","ref":"행 24:24-25","title":"두려워하여","text":"복음을 듣고 두려워하면서도 결단을 미룬 벨릭스의 모습을 전합니다."},{"book_id":"b_acts","ref":"행 24:26-27","title":"틈이 있으면","text":"돈을 바라고 바울을 붙잡아 둔 벨릭스의 속마음을 보여 줍니다."}]},{"id":"f_jairus","type":"figure","name":"야이로","name_en":"Jairus","tagline":"죽은 딸을 살리신 회당장","summary":"회당장 야이로는 죽어가는 딸을 위해 예수님께 나아왔습니다. 사람들이 \"죽었다\"고 했을 때 예수님은 \"두려워 말고 믿기만 하라\"고 하셨고, 열두 살 소녀를 살리셨습니다. 절망 앞에서 믿음으로 나아가는 본보기입니다.","verses":[{"ref":"막 5:23","book_en":"Mark","ch":5,"v":23,"text":"많이 간구하여 가로되 내 어린 딸이 죽게 되었사오니 오셔서 그 위에 손을 얹으사 그로 구원을 얻어 살게 하소서 하거늘"},{"ref":"막 5:36","book_en":"Mark","ch":5,"v":36,"text":"예수께서 그 하는 말을 곁에서 들으시고 회당장에게 이르시되 두려워 말고 믿기만 하라 하시고"},{"ref":"막 5:41","book_en":"Mark","ch":5,"v":41,"text":"그 아이의 손을 잡고 가라사대 달리다굼 하시니 번역하면 곧 소녀야 내가 네게 말하노니 일어나라 하심이라"}],"related":["f_jesus","b_mark"],"meta":{"role":"가버나움 회당장"},"key_chapters":[{"book_id":"b_mark","ref":"막 5:22-24","title":"예수의 발 아래 엎드리어","text":"딸을 살려 달라고 간청하는 야이로의 간절함을 보여 줍니다."},{"book_id":"b_mark","ref":"막 5:35-43","title":"달리다굼","text":"\"소녀야 일어나라\"는 말씀으로 죽은 딸을 살리신 장면입니다."}]},{"id":"f_centurion","type":"figure","name":"가버나움 백부장","name_en":"The Centurion","tagline":"예수님이 칭찬하신 이방인의 믿음","summary":"로마 백부장은 병든 종을 위해 예수님께 나아와 \"말씀만 하옵소서\"라고 했습니다. 예수님은 \"이스라엘 중 아무에게서도 이만한 믿음을 보지 못하였노라\"고 칭찬하셨습니다. 혈통이 아니라 믿음이 구원의 길임을 보여줍니다.","verses":[{"ref":"마 8:8","book_en":"Matthew","ch":8,"v":8,"text":"백부장이 대답하여 가로되 주여 내 집에 들어오심을 나는 감당치 못하겠사오니 다만 말씀으로만 하옵소서 그러면 내 하인이 낫겠삽나이다"},{"ref":"마 8:10","book_en":"Matthew","ch":8,"v":10,"text":"예수께서 들으시고 기이히 여겨 좇는 자들에게 이르시되 내가 진실로 너희에게 이르노니 이스라엘 중 아무에게서도 이만한 믿음을 만나보지 못하였노라"},{"ref":"눅 7:5","book_en":"Luke","ch":7,"v":5,"text":"저가 우리 민족을 사랑하고 또한 우리를 위하여 회당을 지었나이다 하니"}],"related":["f_jesus","b_matthew"],"meta":{"role":"가버나움의 로마 백부장"},"key_chapters":[{"book_id":"b_matthew","ref":"마 8:5-9","title":"말씀만 하옵소서","text":"권위에 순종하듯 예수님의 말씀을 신뢰한 백부장의 고백입니다."},{"book_id":"b_matthew","ref":"마 8:10-13","title":"이만한 믿음","text":"이방인의 믿음을 칭찬하시며 천국 잔치를 예고하신 말씀입니다."}]},{"id":"f_aristarchus","type":"figure","name":"아리스다고","name_en":"Aristarchus","tagline":"바울과 함께 갇힌 동역자","summary":"아리스다고는 에베소 소동 때 바울 대신 끌려갔고, 로마로 가는 항해에도 동행했으며, 나중에는 바울과 함께 갇힌 자가 되었습니다. 위험할 때 곁을 지키는 참된 동역자의 모습입니다.","verses":[{"ref":"행 19:29","book_en":"Acts","ch":19,"v":29,"text":"온 성이 요란하여 바울과 같이 다니는 마게도냐 사람 가이오와 아리스다고를 잡아가지고 일제히 연극장으로 달려들어 가는지라"},{"ref":"행 27:2","book_en":"Acts","ch":27,"v":2,"text":"아시아 해변 각처로 가려 하는 아드라뭇데노 배에 우리가 올라 행선할쌔 마게도냐의 데살로니가 사람 아리스다고도 함께 하니라"},{"ref":"골 4:10","book_en":"Colossians","ch":4,"v":10,"text":"나와 함께 갇힌 아리스다고와 바나바의 생질 마가와 (이 마가에 대하여 너희가 명을 받았으매 그가 이르거든 영접하라)"}],"related":["f_paul","f_luke_evangelist","b_acts","b_col"],"meta":{"role":"데살로니가 출신 바울의 동역자"},"key_chapters":[{"book_id":"b_acts","ref":"행 19:29","title":"바울의 동행 아리스다고","text":"에베소 소동 때 바울을 대신해 끌려간 충성된 동역자의 모습입니다."},{"book_id":"b_col","ref":"골 4:10-11","title":"함께 갇힌 자","text":"바울과 함께 갇혀 복음을 섬긴 아리스다고를 소개하는 말씀입니다."}]},{"id":"f_joanna","type":"figure","name":"요안나","name_en":"Joanna","tagline":"자기 재산으로 예수님을 섬긴 여인","summary":"요안나는 헤롯의 청지기 구사의 아내로, 자기 재산으로 예수님과 제자들을 섬긴 여인들 중 한 사람입니다. 부활의 첫 증인들 중에도 그녀가 있었습니다. 높은 자리보다 예수님 곁을 택한 믿음입니다.","verses":[{"ref":"눅 8:3","book_en":"Luke","ch":8,"v":3,"text":"또 헤롯의 청지기 구사의 아내 요안나와 또 수산나와 다른 여러 여자가 함께 하여 자기들의 소유로 저희를 섬기더라"},{"ref":"눅 24:10","book_en":"Luke","ch":24,"v":10,"text":"(이 여자들은 막달라 마리아와 요안나와 야고보의 모친 마리아라 또 저희와 함께한 다른 여자들도 이것을 사도들에게 고하니라)"}],"related":["f_jesus","f_mary_magdalene","b_luke"],"meta":{"role":"헤롯의 청지기 구사의 아내"},"key_chapters":[{"book_id":"b_luke","ref":"눅 8:1-3","title":"자기 재산으로 섬기더니","text":"예수님의 사역을 물질로 섬긴 여인들을 소개하는 말씀입니다."},{"book_id":"b_luke","ref":"눅 24:9-10","title":"부활을 전한 여인들","text":"빈 무덤의 소식을 사도들에게 전한 증인들 중 요안나가 있었습니다."}]},{"id":"e_temple_cleansing","type":"event","name":"성전을 청결하게 하심","name_en":"Cleansing of the Temple","tagline":"내 아버지의 집으로 장사하는 집을 만들지 말라","summary":"예수님은 유월절에 성전에 올라가 장사하는 자들을 쫓아내셨습니다. \"내 아버지의 집으로 장사하는 집을 만들지 말라\"고 하셨습니다. 예배의 거룩함을 되찾으신 사건입니다.","verses":[{"ref":"요 2:15","book_en":"John","ch":2,"v":15,"text":"노끈으로 채찍을 만드사 양이나 소를 다 성전에서 내어 쫓으시고 돈 바꾸는 사람들의 돈을 쏟으시며 상을 엎으시고"},{"ref":"요 2:16","book_en":"John","ch":2,"v":16,"text":"비둘기 파는 사람들에게 이르시되 이것을 여기서 가져가라 내 아버지의 집으로 장사하는 집을 만들지 말라 하시니"},{"ref":"요 2:17","book_en":"John","ch":2,"v":17,"text":"제자들이 성경 말씀에 주의 전을 사모하는 열심이 나를 삼키리라 한 것을 기억하더라"}],"related":["f_jesus","b_john"],"meta":{"when":"AD 27년경","order":11.5,"year_est":27,"emperor":"디베료"},"key_chapters":[{"book_id":"b_john","ref":"요 2:13-17","title":"성전을 청결하게","text":"장사꾼들을 쫓아내시며 예배의 거룩함을 되찾으신 장면입니다."},{"book_id":"b_john","ref":"요 2:18-22","title":"성전된 자기 몸","text":"부활을 가리키며 말씀하신 예수님의 예언입니다."}]},{"id":"e_footwashing","type":"event","name":"세족식","name_en":"Foot Washing","tagline":"주와 선생이 너희 발을 씻겼으니","summary":"최후의 만찬 때 예수님은 일어나 제자들의 발을 씻기셨습니다. \"내가 주와 선생이 되어 너희 발을 씻겼으니 너희도 서로 발을 씻기는 것이 옳으니라\"고 하셨습니다. 섬김의 본을 보이신 사건입니다.","verses":[{"ref":"요 13:5","book_en":"John","ch":13,"v":5,"text":"이에 대야에 물을 담아 제자들의 발을 씻기시고 그 두르신 수건으로 씻기기를 시작하여"},{"ref":"요 13:14","book_en":"John","ch":13,"v":14,"text":"내가 주와 또는 선생이 되어 너희 발을 씻겼으니 너희도 서로 발을 씻기는 것이 옳으니라"},{"ref":"요 13:15","book_en":"John","ch":13,"v":15,"text":"내가 너희에게 행한것 같이 너희도 행하게 하려하여 본을 보였노라"}],"related":["f_jesus","f_peter","b_john"],"meta":{"when":"AD 30년경","order":22.5,"year_est":30,"emperor":"디베료"},"key_chapters":[{"book_id":"b_john","ref":"요 13:1-11","title":"제자들의 발을 씻기시니라","text":"주님이 종처럼 낮아져 제자들을 섬기신 장면입니다."},{"book_id":"b_john","ref":"요 13:12-17","title":"너희도 행하게 하려","text":"섬김의 본을 따라 살라는 부탁의 말씀입니다."}]},{"id":"e_high_priestly_prayer","type":"event","name":"대제사장의 기도","name_en":"High Priestly Prayer","tagline":"아버지여 저희를 하나가 되게 하옵소서","summary":"잡히시기 전 밤, 예수님은 제자들을 위해 길게 기도하셨습니다. \"저희를 하나가 되게 하옵소서\"라고 하신 이 기도(요 17장)는 로이드존스 목사님이 깊이 강해한 본문입니다. 예수님의 마음이 가장 잘 드러난 기도입니다.","verses":[{"ref":"요 17:1","book_en":"John","ch":17,"v":1,"text":"예수께서 이 말씀을 하시고 눈을 들어 하늘을 우러러 가라사대 아버지여 때가 이르렀사오니 아들을 영화롭게 하사 아들로 아버지를 영화롭게 하게 하옵소서"},{"ref":"요 17:21","book_en":"John","ch":17,"v":21,"text":"아버지께서 내 안에, 내가 아버지 안에 있는것 같이 저희도 다 하나가 되어 우리 안에 있게 하사 세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서"},{"ref":"요 17:24","book_en":"John","ch":17,"v":24,"text":"아버지여 내게 주신 자도 나 있는 곳에 나와 함께 있어 아버지께서 창세 전부터 나를 사랑하시므로 내게 주신 나의 영광을 저희로 보게 하시기를 원하옵나이다"}],"related":["f_jesus","b_john"],"meta":{"when":"AD 30년경","order":22.7,"year_est":30,"emperor":"디베료"},"key_chapters":[{"book_id":"b_john","ref":"요 17:1-5","title":"아버지여 때가 이르렀사오니","text":"자신을 위한 예수님의 기도로 시작되는 대제사장의 기도입니다."},{"book_id":"b_john","ref":"요 17:20-26","title":"하나가 되게 하옵소서","text":"제자들과 후대의 믿는 자들을 위한 중보의 기도입니다."}]},{"id":"e_peter_restored","type":"event","name":"갈릴리에서 베드로를 회복시키심","name_en":"Restoration of Peter","tagline":"네가 나를 사랑하느냐","summary":"부활하신 예수님은 갈릴리 바닷가에서 베드로에게 세 번 \"네가 나를 사랑하느냐\"고 물으시고 \"내 양을 먹이라\"고 맡기셨습니다. 세 번 부인한 실패자를 다시 세우신 은혜의 사건입니다.","verses":[{"ref":"요 21:15","book_en":"John","ch":21,"v":15,"text":"저희가 조반 먹은 후에 예수께서 시몬 베드로에게 이르시되 요한의 아들 시몬아 네가 이 사람들보다 나를 더 사랑하느냐 하시니 가로되 주여 그러하외다 내가 주를 사랑하는줄 주께서 아시나이다 가라사대 내 어린 양을 먹이라 하시고"},{"ref":"요 21:17","book_en":"John","ch":21,"v":17,"text":"세번째 가라사대 요한의 아들 시몬아 네가 나를 사랑하느냐 하시니 주께서 세번째 네가 나를 사랑하느냐 하시므로 베드로가 근심하여 가로되 주여 모든 것을 아시오매 내가 주를 사랑하는 줄을 주께서 아시나이다 예수께서 가라사대 내 양을 먹이라"},{"ref":"요 21:19","book_en":"John","ch":21,"v":19,"text":"이 말씀을 하심은 베드로가 어떠한 죽음으로 하나님께 영광을 돌릴 것을 가리키심이러라 이 말씀을 하시고 베드로에게 이르시되 나를 따르라 하시니"}],"related":["f_peter","f_jesus","b_john"],"meta":{"when":"AD 30년경","order":30.5,"year_est":30,"emperor":"디베료"},"key_chapters":[{"book_id":"b_john","ref":"요 21:15-17","title":"내 양을 먹이라","text":"세 번의 질문과 세 번의 맡기심으로 베드로를 회복시키신 장면입니다."},{"book_id":"b_john","ref":"요 21:18-19","title":"나를 따르라","text":"베드로의 순교를 예고하시며 다시 따르라고 하신 말씀입니다."}]},{"id":"e_samaria_revival","type":"event","name":"사마리아에 복음이 전파됨","name_en":"Gospel in Samaria","tagline":"사마리아에 큰 기쁨이 있더라","summary":"스데반 순교 후 흩어진 성도들 중 빌립 집사가 사마리아에 복음을 전하자 큰 기쁨이 일어났습니다. 유대인이 상종하지 않던 사마리아에도 구원의 문이 열린 사건입니다.","verses":[{"ref":"행 8:5","book_en":"Acts","ch":8,"v":5,"text":"빌립이 사마리아 성에 내려가 그리스도를 백성에게 전파하니"},{"ref":"행 8:8","book_en":"Acts","ch":8,"v":8,"text":"그 성에 큰 기쁨이 있더라"},{"ref":"행 8:14","book_
