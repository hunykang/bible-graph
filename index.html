en":"Acts","ch":8,"v":14,"text":"예루살렘에 있는 사도들이 사마리아도 하나님의 말씀을 받았다 함을 듣고 베드로와 요한을 보내매"}],"related":["f_philip_deacon","f_peter","f_john_apostle","b_acts"],"meta":{"when":"AD 35년경","order":37.5,"year_est":35,"emperor":"디베료"},"key_chapters":[{"book_id":"b_acts","ref":"행 8:4-8","title":"사마리아에 전파하매","text":"빌립의 전도로 사마리아에 큰 기쁨이 임한 장면입니다."},{"book_id":"b_acts","ref":"행 8:14-17","title":"성령 받으니라","text":"베드로와 요한이 내려가 성령 받음을 위해 기도한 장면입니다."}]},{"id":"e_called_christians","type":"event","name":"안디옥에서 그리스도인이라 불림","name_en":"Called Christians at Antioch","tagline":"제자들이 처음으로 그리스도인이라 불리니라","summary":"바나바와 바울이 가르친 안디옥 교회의 제자들이 처음으로 '그리스도인'이라 불렸습니다. 교회가 세상 속에서 그리스도의 이름으로 구별되기 시작한 순간입니다.","verses":[{"ref":"행 11:23","book_en":"Acts","ch":11,"v":23,"text":"저가 이르러 하나님의 은혜를 보고 기뻐하여 모든 사람에게 굳은 마음으로 주께 붙어 있으라 권하니"},{"ref":"행 11:26","book_en":"Acts","ch":11,"v":26,"text":"만나매 안디옥에 데리고 와서 둘이 교회에 일년간 모여 있어 큰 무리를 가르쳤고 제자들이 안디옥에서 비로소 그리스도인이라 일컬음을 받게 되었더라"}],"related":["f_barnabas","f_paul","b_acts"],"meta":{"when":"AD 42년경","order":40.5,"year_est":42,"emperor":"글라우디오"},"key_chapters":[{"book_id":"b_acts","ref":"행 11:22-26","title":"그리스도인이라 일컫게 되니라","text":"안디옥 교회의 성장과 '그리스도인'이라는 이름의 탄생을 전합니다."}]},{"id":"e_philippi_jail","type":"event","name":"빌립보 감옥에서의 찬송","name_en":"Praise in Prison","tagline":"한밤중에 바울과 실라가 기도하고 찬송하매","summary":"빌립보에서 매 맞고 갇힌 바울과 실라가 한밤중에 기도하고 찬송하자 지진이 일어나 옥문이 열렸습니다. 간수는 \"내가 어떻게 하여야 구원을 얻으리이까\"라고 물었고, 그 가정이 구원받았습니다.","verses":[{"ref":"행 16:25","book_en":"Acts","ch":16,"v":25,"text":"밤중쯤 되어 바울과 실라가 기도하고 하나님을 찬미하매 죄수들이 듣더라"},{"ref":"행 16:30","book_en":"Acts","ch":16,"v":30,"text":"저희를 데리고 나가 가로되 선생들아 내가 어떻게 하여야 구원을 얻으리이까 하거늘"},{"ref":"행 16:31","book_en":"Acts","ch":16,"v":31,"text":"가로되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 얻으리라 하고"}],"related":["f_paul","f_silas","b_acts"],"meta":{"when":"AD 50년경","order":44.5,"year_est":50,"emperor":"글라우디오"},"key_chapters":[{"book_id":"b_acts","ref":"행 16:25-28","title":"옥문이 다 열리며","text":"찬송 중에 일어난 지진과 간수의 자결 시도를 막은 장면입니다."},{"book_id":"b_acts","ref":"행 16:29-34","title":"구원을 얻으리이까","text":"\"주 예수를 믿으라\"는 말씀에 간수의 가정이 구원받은 장면입니다."}]},{"id":"e_miletus_farewell","type":"event","name":"밀레도에서의 고별 설교","name_en":"Farewell at Miletus","tagline":"은혜의 말씀에 너희를 부탁하노라","summary":"예루살렘으로 향하던 바울은 밀레도에서 에베소 장로들을 불러 고별 설교를 했습니다. \"내 생명을 조금도 귀한 것으로 여기지 아니하노라\"고 했습니다. 목자의 눈물의 고별입니다.","verses":[{"ref":"행 20:24","book_en":"Acts","ch":20,"v":24,"text":"나의 달려갈 길과 주 예수께 받은 사명 곧 하나님의 은혜의 복음 증거하는 일을 마치려 함에는 나의 생명을 조금도 귀한 것으로 여기지 아니하노라"},{"ref":"행 20:28","book_en":"Acts","ch":20,"v":28,"text":"너희는 자기를 위하여 또는 온 양떼를 위하여 삼가라 성령이 저들 가운데 너희로 감독자를 삼고 하나님이 자기 피로 사신 교회를 치게 하셨느니라"},{"ref":"행 20:32","book_en":"Acts","ch":20,"v":32,"text":"지금 내가 너희를 주와 및 그 은혜의 말씀께 부탁하노니 그 말씀이 너희를 능히 든든히 세우사 거룩케 하심을 입은 모든 자 가운데 기업이 있게 하시리라"}],"related":["f_paul","b_acts"],"meta":{"when":"AD 57년경","order":45.5,"year_est":57,"emperor":"네로"},"key_chapters":[{"book_id":"b_acts","ref":"행 20:17-27","title":"작별을 고하니라","text":"에베소 장로들을 불러 지난 사역을 돌아본 말씀입니다."},{"book_id":"b_acts","ref":"행 20:28-38","title":"은혜의 말씀에 부탁하노라","text":"장로들에게 교회를 부탁하고 눈물로 헤어진 장면입니다."}]},{"id":"e_caesarea_trial","type":"event","name":"가이사랴에서의 재판","name_en":"Trial at Caesarea","tagline":"가이사에게 호소하노라","summary":"바울은 가이사랴에서 벨릭스, 베스도, 아그립바 왕 앞에 서서 복음을 전했습니다. 재판정이 선교지가 된 사건으로, 바울은 \"가이사에게 호소하노라\"며 로마로 향했습니다.","verses":[{"ref":"행 25:11","book_en":"Acts","ch":25,"v":11,"text":"만일 내가 불의를 행하여 무슨 사죄를 범하였으면 죽기를 사양치 아니할 것이나 만일 이 사람들의 나를 송사하는 것이 다 사실이 아니면 누구든지 나를 그들에게 내어 줄수 없삽나이다 내가 가이사께 호소하노라 한대"},{"ref":"행 26:28","book_en":"Acts","ch":26,"v":28,"text":"아그립바가 바울더러 이르되 네가 적은 말로 나를 권하여 그리스도인이 되게 하려 하는도다"},{"ref":"행 26:29","book_en":"Acts","ch":26,"v":29,"text":"바울이 가로되 말이 적으나 많으나 당신 뿐아니라 오늘 내 말을 듣는 모든 사람도 다 이렇게 결박한 것 외에는 나와 같이 되기를 하나님께 원하노이다 하니라"}],"related":["f_paul","f_felix","f_herod_agrippa2","b_acts"],"meta":{"when":"AD 59년경","order":46.5,"year_est":59,"emperor":"네로"},"key_chapters":[{"book_id":"b_acts","ref":"행 24:10-21","title":"벨릭스 앞에서의 변명","text":"총독 벨릭스 앞에서 복음을 전한 바울의 첫 변론입니다."},{"book_id":"b_acts","ref":"행 26:24-29","title":"그리스도인이 되게 하려느냐","text":"아그립바 왕 앞에서 담대히 복음을 전한 바울의 마지막 변론입니다."}]},{"id":"e_seven_churches","type":"event","name":"일곱 교회에 보낸 편지","name_en":"Letters to the Seven Churches","tagline":"성령이 교회들에게 하시는 말씀을 들을지어다","summary":"밧모섬의 요한에게 주님은 에베소, 서머나, 버가모, 두아디라, 사데, 빌라델비아, 라오디게아 일곱 교회에 편지를 보내셨습니다. 칭찬과 책망과 약속이 담긴 이 편지는 오늘 교회에도 주시는 말씀입니다.","verses":[{"ref":"계 2:7","book_en":"Revelation","ch":2,"v":7,"text":"귀 있는 자는 성령이 교회들에게 하시는 말씀을 들을찌어다 이기는 그에게는 내가 하나님의 낙원에 있는 생명나무의 과실을 주어 먹게 하리라"},{"ref":"계 3:20","book_en":"Revelation","ch":3,"v":20,"text":"볼찌어다 내가 문밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그로 더불어 먹고 그는 나로 더불어 먹으리라"},{"ref":"계 2:10","book_en":"Revelation","ch":2,"v":10,"text":"네가 장차 받을 고난을 두려워 말라 볼찌어다 마귀가 장차 너희 가운데서 몇 사람을 옥에 던져 시험을 받게 하리니 너희가 십일 동안 환난을 받으리라 네가 죽도록 충성하라 그리하면 내가 생명의 면류관을 네게 주리라"}],"related":["f_john_apostle","b_rev"],"meta":{"when":"AD 95년경","order":49.5,"year_est":95,"emperor":"도미티아누스"},"key_chapters":[{"book_id":"b_rev","ref":"계 2:1-7","title":"에베소 교회에게","text":"첫사랑을 버린 것을 책망하시며 회개를 촉구하신 말씀입니다."},{"book_id":"b_rev","ref":"계 3:14-22","title":"라오디게아 교회에게","text":"미지근한 신앙을 책망하시며 문을 두드리시는 주님의 음성입니다."}]},{"id":"d_prayer","type":"doctrine","name":"기도","name_en":"Prayer","tagline":"쉬지 말고 기도하라","summary":"기도는 하나님의 자녀가 아버지께 나아가는 대화입니다. 예수님은 주기도문으로 기도의 본을 가르치셨고, 바울은 \"쉬지 말고 기도하라\"고 했습니다. 기도는 말씀, 성례와 함께 신앙을 자라게 하는 은혜의 수단입니다.","verses":[{"ref":"마 6:9","book_en":"Matthew","ch":6,"v":9,"text":"그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며"},{"ref":"살전 5:17","book_en":"1Thessalonians","ch":5,"v":17,"text":"쉬지 말고 기도하라"},{"ref":"요 15:7","book_en":"John","ch":15,"v":7,"text":"너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는대로 구하라 그리하면 이루리라"}],"related":["d_church","d_scripture","b_matthew","f_jesus"],"meta":{"locus":"교회론"},"sub_doctrines":[{"title":"기도란 무엇인가","summary":"기도는 하나님께 소원을 아뢰는 것입니다. 감사와 회개, 간구가 담기며, 예수님의 이름으로 아버지께 나아갑니다. 기도는 하나님을 움직이는 수단이 아니라, 하나님과 동행하는 자녀의 특권입니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 6:5-8","title":"은밀한 중에 보시는","text":"위선이 아닌 진실한 기도를 가르치신 말씀입니다."},{"book_id":"b_1jn","ref":"요일 5:14","title":"그의 뜻대로 구하면","text":"하나님의 뜻대로 구할 때 들으신다는 약속입니다."},{"book_id":"b_php","ref":"빌 4:6-7","title":"아무것도 염려하지 말고","text":"기도로 평안을 얻는 비결을 말하는 말씀입니다."}]},{"title":"주기도문","summary":"예수님이 친히 가르치신 기도의 모범입니다. 하나님의 이름과 나라와 뜻을 먼저 구하고, 일용할 양식과 용서, 시험과 악에서의 구원을 구합니다. 소요리문답은 주기도문을 여섯 가지 간구로 풀이합니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 6:9-13","title":"하늘에 계신 우리 아버지여","text":"주기도문 전문으로, 기도의 뼈대를 보여 줍니다."},{"book_id":"b_luke","ref":"눅 11:1-4","title":"기도를 가르쳐 주옵소서","text":"제자들의 요청에 주기도문을 가르치신 장면입니다."}]},{"title":"예배","summary":"예배는 하나님의 백성이 함께 모여 하나님께 영광을 돌리는 일입니다. \"신령과 진정으로\" 드려야 하며, 말씀 선포와 찬양, 기도와 성례가 그 중심입니다. 예배는 일주일의 첫 열매를 하나님께 드리는 것입니다.","key_chapters":[{"book_id":"b_john","ref":"요 4:23-24","title":"신령과 진정으로","text":"참된 예배자의 모습을 말씀하신 예수님의 가르침입니다."},{"book_id":"b_acts","ref":"행 2:42","title":"사도의 가르침을 받아","text":"초대교회의 예배 모습을 보여 주는 말씀입니다."}]}]},{"id":"d_ten_commandments","type":"doctrine","name":"십계명","name_en":"The Ten Commandments","tagline":"하나님 사랑과 이웃 사랑의 요약","summary":"십계명은 하나님이 시내산에서 주신 도덕율의 요약입니다. 예수님은 이를 \"하나님 사랑과 이웃 사랑\" 두 계명으로 요약하셨습니다. 십계명은 구원받는 조건이 아니라, 구원받은 성도가 어떻게 살아야 하는지를 보여주는 삶의 지침입니다.","verses":[{"ref":"마 22:37","book_en":"Matthew","ch":22,"v":37,"text":"예수께서 가라사대 네 마음을 다하고 목숨을 다하고 뜻을 다하여 주 너의 하나님을 사랑하라 하셨으니"},{"ref":"마 22:39","book_en":"Matthew","ch":22,"v":39,"text":"둘째는 그와 같으니 네 이웃을 네 몸과 같이 사랑하라 하셨으니"},{"ref":"롬 13:10","book_en":"Romans","ch":13,"v":10,"text":"사랑은 이웃에게 악을 행치 아니하나니 그러므로 사랑은 율법의 완성이니라"}],"related":["d_god","d_man","b_matthew","b_romans"],"meta":{"locus":"신론"},"sub_doctrines":[{"title":"제1-4계명: 하나님을 사랑하라","summary":"다른 신을 두지 말고, 우상을 만들지 말고, 하나님의 이름을 망령되이 일컫지 말고, 안식일을 거룩히 지키라는 계명입니다. 하나님과의 관계가 모든 삶의 첫 자리임을 가르칩니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 22:37-38","title":"네 마음을 다하여","text":"첫째 되는 계명으로 하나님 사랑을 말씀하신 예수님의 요약입니다."},{"book_id":"b_1jn","ref":"요일 5:21","title":"우상에서 멀리하라","text":"우상 숭배를 경계하는 사도의 마지막 당부입니다."}]},{"title":"제5-10계명: 이웃을 사랑하라","summary":"부모를 공경하고, 살인·간음·도둑질·거짓 증거를 금하며, 탐내지 말라는 계명입니다. 이웃과의 관계에서 거룩함을 지키는 삶의 울타리입니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 22:39-40","title":"네 이웃을 네 몸과 같이","text":"둘째 되는 계명으로 이웃 사랑을 말씀하신 요약입니다."},{"book_id":"b_romans","ref":"롬 13:9-10","title":"사랑은 율법의 완성","text":"여러 계명이 사랑 하나로 요약됨을 말하는 말씀입니다."}]},{"title":"율법의 세 가지 용도","summary":"개혁주의는 율법의 용도를 셋으로 말합니다. 첫째, 거울처럼 죄를 깨닫게 합니다. 둘째, 악을 막는 울타리가 됩니다. 셋째, 구원받은 성도에게 삶의 지침이 됩니다.","key_chapters":[{"book_id":"b_romans","ref":"롬 3:20","title":"율법으로는 죄를 깨달음이니라","text":"율법이 죄를 드러내는 거울임을 말하는 말씀입니다."},{"book_id":"b_gal","ref":"갈 3:24","title":"율법이 우리를 인도하는","text":"율법이 그리스도께로 인도하는 몽학선생임을 말합니다."}]}]},{"id":"d_revival","type":"doctrine","name":"부흥","name_en":"Revival","tagline":"성령의 주권적인 새 역사","summary":"부흥은 성령께서 주권적으로 교회에 새 생명을 부어주시는 역사입니다. 로이드존스 목사님은 『부흥』 강해에서 \"부흥은 인간의 노력으로 만들 수 없고, 오직 하나님의 주권적 은혜로 임한다\"고 했습니다. 하박국이 \"수년 내에 부흥하게 하옵소서\"라고 기도한 것처럼, 부흥은 사모하고 기도할 일입니다.","verses":[{"ref":"합 3:2","book_en":"Habakkuk","ch":3,"v":2,"text":"여호와여 내가 주께 대한 소문을 듣고 놀랐나이다 여호와여 주는 주의 일을 이 수년 내에 부흥케 하옵소서 이 수년 내에 나타내시옵소서 진노 중에라도 긍휼을 잊지 마옵소서"},{"ref":"행 4:31","book_en":"Acts","ch":4,"v":31,"text":"빌기를 다하매 모인 곳이 진동하더니 무리가 다 성령이 충만하여 담대히 하나님의 말씀을 전하니라"},{"ref":"시 85:6","book_en":"Psalms","ch":85,"v":6,"text":"우리를 다시 살리사 주의 백성으로 주를 기뻐하게 아니하시겠나이까"}],"related":["d_holyspirit","d_church","b_acts","e_pentecost"],"meta":{"locus":"성령론"},"sub_doctrines":[{"title":"부흥이란 무엇인가","summary":"부흥은 잠든 교회가 깨어나고, 죄인들이 무더기로 돌아오는 성령의 특별한 역사입니다. 인간의 계획이나 기술로 만들 수 없으며, 하나님의 주권 아래 임합니다. 로이드존스는 부흥을 \"하나님이 교회를 찾아오시는 것\"이라 했습니다.","key_chapters":[{"book_id":"b_acts","ref":"행 2:41-47","title":"삼천 명이 더하니라","text":"오순절 부흥으로 교회가 시작된 장면입니다."},{"book_id":"b_acts","ref":"행 4:31","title":"담대히 하나님의 말씀을","text":"기도 후에 성령이 충만하여 담대해진 성도들의 모습입니다."}]},{"title":"성경의 부흥 사례","summary":"구약의 요시야 개혁, 니느웨의 회개, 오순절 성령 강림, 1907년 평양 대부흥까지, 하나님은 시대마다 부흥을 주셨습니다. 공통점은 말씀으로 돌아가고, 죄를 회개하고, 기도에 힘쓴 것입니다.","key_chapters":[{"book_id":"b_acts","ref":"행 2:37-38","title":"마음에 찔려","text":"베드로의 설교에 회개한 오순절 회중의 모습입니다."}]},{"title":"부흥을 사모하는 기도","summary":"부흥은 구하는 자에게 주시는 선물입니다. 하박국처럼 \"부흥하게 하옵소서\"라고 기도하고, 죄를 회개하며, 말씀으로 돌아갈 때 하나님은 일하십니다.","key_chapters":[{"book_id":"b_acts","ref":"행 1:14","title":"마음을 같이하여 기도에 힘쓰더니","text":"오순절을 기다리며 기도한 제자들의 모습입니다."}]}]},{"id":"d_idols","type":"doctrine","name":"우상","name_en":"Idols of the Heart","tagline":"마음의 우상을 버리고 하나님께로","summary":"우상은 나무나 돌만이 아닙니다. 팀 켈러 목사님은 『팀 켈러의 우상』에서 \"돈, 성공, 사랑, 권력 같은 좋은 것들이 최고의 것이 되면 우상이 된다\"고 했습니다. 요한은 \"아이들아 너희 자신을 지켜 우상에서 멀리하라\"고 했습니다. 탐심은 우상 숭배입니다.","verses":[{"ref":"요일 5:21","book_en":"1John","ch":5,"v":21,"text":"자녀들아 너희 자신을 지켜 우상에서 멀리하라"},{"ref":"골 3:5","book_en":"Colossians","ch":3,"v":5,"text":"그러므로 땅에 있는 지체를 죽이라 곧 음란과 부정과 사욕과 악한 정욕과 탐심이니 탐심은 우상 숭배니라"},{"ref":"출 20:3","book_en":"Exodus","ch":20,"v":3,"text":"너는 나 외에는 다른 신들을 네게 있게 말찌니라"}],"related":["d_man","d_god","b_1jn"],"meta":{"locus":"인간론"},"sub_doctrines":[{"title":"우상이란 무엇인가","summary":"우상은 하나님 대신 마음의 첫 자리를 차지하는 모든 것입니다. 눈에 보이는 신상뿐 아니라, 보이지 않는 마음의 우상이 더 위험합니다. 우상은 약속은 크지만 결국 우리를 배신합니다.","key_chapters":[{"book_id":"b_1jn","ref":"요일 5:21","title":"우상에서 멀리하라","text":"요한일서의 마지막 말씀으로 우상을 경계하는 당부입니다."},{"book_id":"b_col","ref":"골 3:5","title":"탐심은 우상 숭배니라","text":"탐하는 마음 자체가 우상 숭배임을 밝히는 말씀입니다."}]},{"title":"현대의 우상들","summary":"팀 켈러는 현대인의 우상으로 돈(물질), 성공(성취), 사랑(인정), 권력(통제)을 들었습니다. 이것들은 좋은 것이지만, 삶의 의미와 안전을 거기에 걸면 우상이 됩니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 6:24","title":"한 사람이 두 주인을","text":"하나님과 재물을 겸하여 섬길 수 없음을 말씀하십니다."},{"book_id":"b_1tim","ref":"딤전 6:10","title":"돈을 사랑함이 일만 악의 뿌리","text":"돈 자체가 아니라 돈을 사랑함이 문제임을 말합니다."}]},{"title":"우상을 버리는 길","summary":"우상은 꾸짖음만으로 버려지지 않습니다. 더 크고 아름다운 분, 곧 예수 그리스도의 복음으로 마음을 채울 때 우상은 힘을 잃습니다. 예배와 말씀으로 하나님을 다시 첫 자리에 모시는 것입니다.","key_chapters":[{"book_id":"b_1jn","ref":"요일 5:20","title":"참된 자 안에 있는","text":"참 하나님이신 예수 그리스도를 아는 것이 우상을 이기는 길입니다."}]}]},{"id":"d_work","type":"doctrine","name":"일과 소명","name_en":"Work and Calling","tagline":"일터에서도 하나님께 하듯","summary":"일은 저주가 아니라 창조 때 주신 선물입니다. 팀 켈러 목사님은 『일과 소명』에서 \"그리스도인은 일터를 하나님의 영광을 위한 소명의 자리로 본다\"고 했습니다. 바울은 \"무슨 일을 하든지 마음을 다하여 주께 하듯 하라\"고 했습니다.","verses":[{"ref":"창 2:15","book_en":"Genesis","ch":2,"v":15,"text":"여호와 하나님이 그 사람을 이끌어 에덴 동산에 두사 그것을 다스리며 지키게 하시고"},{"ref":"골 3:23","book_en":"Colossians","ch":3,"v":23,"text":"무슨 일을 하든지 마음을 다하여 주께 하듯하고 사람에게 하듯하지 말라"},{"ref":"창 1:28","book_en":"Genesis","ch":1,"v":28,"text":"하나님이 그들에게 복을 주시며 그들에게 이르시되 생육하고 번성하여 땅에 충만하라, 땅을 정복하라, 바다의 고기와 공중의 새와 땅에 움직이는 모든 생물을 다스리라 하시니라"}],"related":["d_creation","d_church","b_col","b_eph"],"meta":{"locus":"창조론"},"sub_doctrines":[{"title":"일의 창조: 하나님의 선물","summary":"하나님은 아담을 에덴동산에 두시고 \"다스리며 지키게\" 하셨습니다. 일은 타락 전에 주어진 복된 명령으로, 인간이 하나님의 형상을 따라 창조적으로 섬기는 자리입니다.","key_chapters":[{"book_id":"b_col","ref":"골 3:23","title":"주께 하듯 하라","text":"일터의 모든 일을 하나님께 하듯 하라는 말씀입니다."}]},{"title":"타락한 일: 우상화된 성공","summary":"타락 후 일은 수고와 땀이 되었고, 성공이 우상이 되기 쉽습니다. 일을 정체성으로 삼으면 일은 우리를 삼키지만, 하나님을 첫 자리에 두면 일은 제자리를 찾습니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 6:33","title":"그의 나라와 그의 의를","text":"먼저 구할 것을 가르치신 말씀으로 일의 우선순위를 바로잡습니다."}]},{"title":"구속된 일: 복음으로 새롭게","summary":"그리스도 안에서 일은 예배가 됩니다. 정직과 성실, 이웃을 위한 섬김으로 일터를 선교지로 삼는 것, 그것이 소명자의 일입니다.","key_chapters":[{"book_id":"b_eph","ref":"엡 6:5-8","title":"주께 하듯 하여","text":"직장에서의 순종을 주께 하듯 하라고 권면하는 말씀입니다."}]}]},{"id":"d_family","type":"doctrine","name":"가정","name_en":"Family and Marriage","tagline":"작은 교회, 가정","summary":"가정은 하나님이 세우신 첫 번째 공동체입니다. 결혼은 그리스도와 교회의 비밀을 보여주는 표상이고, 부모는 자녀를 주의 교훈으로 양육해야 합니다. 팀 켈러 목사님은 『결혼을 말하다』에서 \"결혼은 서로를 거룩하게 만드는 우정의 길\"이라고 했습니다. 가정은 작은 교회입니다.","verses":[{"ref":"창 2:24","book_en":"Genesis","ch":2,"v":24,"text":"이러므로 남자가 부모를 떠나 그 아내와 연합하여 둘이 한 몸을 이룰찌로다"},{"ref":"엡 5:25","book_en":"Ephesians","ch":5,"v":25,"text":"남편들아 아내 사랑하기를 그리스도께서 교회를 사랑하시고 위하여 자신을 주심 같이 하라"},{"ref":"엡 6:4","book_en":"Ephesians","ch":6,"v":4,"text":"또 아비들아 너희 자녀를 노엽게 하지 말고 오직 주의 교양과 훈계로 양육하라"}],"related":["d_church","d_creation","b_eph"],"meta":{"locus":"교회론"},"sub_doctrines":[{"title":"결혼의 창조와 의미","summary":"하나님이 아담에게 하와를 짝지어 주신 것처럼, 결혼은 하나님의 창조 질서입니다. 바울은 부부의 연합이 그리스도와 교회의 연합을 보여주는 비밀이라고 했습니다.","key_chapters":[{"book_id":"b_eph","ref":"엡 5:31-32","title":"이 비밀이 크도다","text":"결혼이 그리스도와 교회를 가리키는 비밀임을 말합니다."}]},{"title":"부부의 역할","summary":"남편은 그리스도께서 교회를 사랑하신 것처럼 아내를 사랑하고, 아내는 주께 하듯 남편에게 순종합니다. 서로 섬기는 사랑이 가정의 질서입니다.","key_chapters":[{"book_id":"b_eph","ref":"엡 5:25","title":"아내 사랑하기를","text":"그리스도의 사랑을 본받으라는 남편을 향한 권면입니다."},{"book_id":"b_col","ref":"골 3:18-19","title":"주 안에서 합당하니라","text":"부부의 서로를 향한 합당한 도리를 말하는 말씀입니다."}]},{"title":"자녀 양육","summary":"자녀는 하나님의 선물이며, 부모는 그들을 주의 교훈과 훈계로 양육할 책임이 있습니다. 가정이 먼저 신앙 교육의 자리가 될 때 교회가 든든히 섭니다.","key_chapters":[{"book_id":"b_eph","ref":"엡 6:4","title":"주의 교훈과 훈계로 양육하라","text":"자녀 양육의 책임이 부모에게 있음을 말하는 말씀입니다."}]}]},{"id":"w_caesar","type":"world","name":"카이사르 암살과 공화정의 종말","name_en":"Assassination of Caesar","tagline":"로마 공화정이 무너진 날","summary":"BC 44년, 율리우스 카이사르가 원로원 회의장에서 암살당했습니다. 뒤이은 내전을 거쳐 옥타비아누스(아우구스투스)가 권력을 잡으며 로마는 공화정에서 제정으로 바뀌었습니다. 예수님이 태어나신 것은 바로 이 제정 로마 시대입니다.","related":["w_augustus","e_birth"],"meta":{"when":"BC 44년","year":-44,"year_est":-44,"emperor":"-"}},{"id":"w_actium","type":"world","name":"악티움 해전","name_en":"Battle of Actium","tagline":"아우구스투스가 로마를 손에 넣다","summary":"BC 31년, 옥타비아누스가 악티움 해전에서 안토니우스와 클레오파트라 연합군을 격파했습니다. 이 승리로 로마의 내전이 끝나고 아우구스투스의 단독 지배, 곧 팍스 로마나가 시작되었습니다.","related":["w_augustus","w_caesar"],"meta":{"when":"BC 31년","year":-31,"year_est":-31,"emperor":"-"}},{"id":"w_philo","type":"world","name":"알렉산드리아의 필로","name_en":"Philo of Alexandria","tagline":"헬라 철학과 유대 신앙의 만남","summary":"이집트 알렉산드리아의 유대 철학자 필로(BC 20–AD 50경)는 그리스 철학의 '로고스' 개념으로 구약을 해석했습니다. 그의 사상은 요한복음의 \"말씀이 육신이 되었다\"는 선언을 헬라 세계가 이해하는 다리가 되었습니다.","related":["b_john","f_jesus"],"meta":{"when":"BC 20-AD 50년경","year":-20,"year_est":-20,"emperor":"아우구스투스"}},{"id":"w_wangmang","type":"world","name":"왕망의 신나라","name_en":"Wang Mang's Xin Dynasty","tagline":"중국 한나라가 잠시 끊어진 때","summary":"AD 9년, 왕망이 전한을 무너뜨리고 신나라를 세웠다가 AD 23년 붕괴했습니다. 혼란 끝에 광무제가 후한을 세웠습니다. 예수님의 공생애 시기에 중국은 왕조가 바뀌는 격동기였습니다.","related":["w_houhan"],"meta":{"when":"AD 9-23년","year":9,"year_est":9,"emperor":"디베료"}},{"id":"w_houhan","type":"world","name":"후한 건국","name_en":"Eastern Han Founded","tagline":"광무제의 후한이 시작되다","summary":"AD 25년, 유수(광무제)가 낙양에서 후한을 세웠습니다. 이후 200년간 이어진 후한 시대에 중국 문명이 크게 발전했습니다. 바울이 복음을 전하던 시기와 겹칩니다.","related":["w_wangmang","f_paul"],"meta":{"when":"AD 25년","year":25,"year_est":25,"emperor":"디베료"}},{"id":"w_britannia","type":"world","name":"브리타니아 정복","name_en":"Conquest of Britannia","tagline":"로마가 영국 땅에 들어가다","summary":"AD 43년, 클라우디우스 황제가 브리타니아(영국) 원정을 단행했습니다. 로마 제국의 영토가 최대에 가까워지던 시기로, 바울이 2차 전도여행을 떠나던 때와 겹칩니다.","related":["e_macedonia","f_paul"],"meta":{"when":"AD 43년","year":43,"year_est":43,"emperor":"글라우디오"}},{"id":"w_vesuvius","type":"world","name":"베수비오 화산 폭발","name_en":"Eruption of Vesuvius","tagline":"폼페이를 삼킨 화산재","summary":"AD 79년, 베수비오 화산이 폭발해 폼페이와 헤르쿨라네움이 화산재에 묻혔습니다. 요한이 밧모섬에서 계시를 받기 약 15년 전의 일로, 로마 제국의 위용 뒤에 숨은 심판의 그림자를 보여줍니다.","related":["e_patmos_revelation"],"meta":{"when":"AD 79년","year":79,"year_est":79,"emperor":"티투스"}},{"id":"w_colosseum","type":"world","name":"콜로세움 완공","name_en":"Colosseum Completed","tagline":"로마의 거대한 원형 경기장","summary":"AD 80년, 5만 명을 수용하는 콜로세움이 완공되었습니다. 훗날 이곳에서 수많은 그리스도인이 순교했습니다. 로마의 영광과 박해의 현장이 한 자리에 있었습니다.","related":["w_vesuvius","e_paul_rome"],"meta":{"when":"AD 80년","year":80,"year_est":80,"emperor":"티투스"}},{"id":"w_nerva","type":"world","name":"네르바와 오현제 시대","name_en":"Nerva and the Five Good Emperors","tagline":"로마의 전성기가 열리다","summary":"AD 96년, 도미티아누스가 암살되고 네르바가 즉위하며 오현제 시대가 열렸습니다. 박해가 잠시 멈춘 시기로, 초대교회가 숨을 고르며 성장한 배경이 되었습니다.","related":["e_patmos_revelation"],"meta":{"when":"AD 96년","year":96,"year_est":96,"emperor":"네르바"}},{"id":"w_tacitus","type":"world","name":"타키투스의 『연대기』","name_en":"Tacitus' Annals","tagline":"로마 역사가가 기록한 그리스도","summary":"AD 116년경, 로마 역사가 타키투스는 『연대기』에서 \"그리스도\"가 본디오 빌라도 때 처형당했다고 기록했습니다. 성경 밖의 로마 문헌이 예수님의 실재를 증언하는 자료입니다.","related":["e_cross","f_pilate"],"meta":{"when":"AD 116년경","year":116,"year_est":116,"emperor":"트라야누스"}},{"id":"w_gaul","type":"world","name":"카이사르의 갈리아 정복","name_en":"Caesar's Conquest of Gaul","tagline":"로마가 프랑스 땅을 차지하다","summary":"BC 58–50년, 율리우스 카이사르가 갈리아(오늘날 프랑스)를 정복했습니다. 이 공적으로 카이사르의 권력이 커졌고, 결국 공화정의 종말로 이어졌습니다.","related":["w_caesar"],"meta":{"when":"BC 58-50년","year":-58,"year_est":-58,"emperor":"-"}},{"id":"w_trajan","type":"world","name":"트라야누스 즉위","name_en":"Accession of Trajan","tagline":"로마 제국의 최대 판도","summary":"AD 98년 즉위한 트라야누스 시대에 로마 제국은 역사상 가장 넓은 영토를 차지했습니다. 오현제 시대의 두 번째 황제로, 교회가 핍박 속에서도 자라나던 시기입니다.","related":["w_nerva","w_tacitus"],"meta":{"when":"AD 98년","year":98,"year_est":98,"emperor":"트라야누스"}},{"id":"w_hadrian","type":"world","name":"하드리아누스 시대","name_en":"Age of Hadrian","tagline":"팍스 로마나의 절정","summary":"하드리아누스(AD 117–138)는 방벽을 쌓고 국경을 안정시키며 팍스 로마나의 절정을 이끌었습니다. 영국의 하드리아누스 방벽이 이 시기에 지어졌습니다.","related":["w_trajan","w_barkokhba"],"meta":{"when":"AD 117-138년","year":117,"year_est":117,"emperor":"하드리아누스"}},{"id":"w_barkokhba","type":"world","name":"바르 코크바 반란","name_en":"Bar Kokhba Revolt","tagline":"유대인의 마지막 대반란","summary":"AD 132년, 바르 코크바가 이끄는 유대인의 마지막 대반란이 일어났으나 로마에 진압되었습니다. 이후 유대인은 예루살렘 출입이 금지되고 전 세계로 흩어졌습니다.","related":["e_temple_destruction","w_hadrian"],"meta":{"when":"AD 132-135년","year":132,"year_est":132,"emperor":"하드리아누스"}},{"id":"k_samhan","type":"korea","name":"삼한의 성립","name_en":"Rise of the Samhan","tagline":"마한·진한·변한, 남쪽의 세 나라","summary":"위만조선이 세워진 뒤 한반도 남쪽에는 마한·진한·변한, 이른바 삼한이 자리 잡았습니다. 마한 54개국, 진한 12개국, 변한 12개국으로, 훗날 백제·신라·가야의 뿌리가 되었습니다.","related":["k_gojoseon_fall","k_baekje_found","k_silla_found"],"meta":{"when":"BC 2세기경","year":-150,"year_est":-150,"emperor":"-"}},{"id":"k_buyeo","type":"korea","name":"부여의 성장","name_en":"Rise of Buyeo","tagline":"고구려·백제의 뿌리","summary":"송화강 유역의 부여는 농경과 철기 문화를 바탕으로 성장했습니다. 주몽과 온조가 모두 부여 출신으로, 고구려와 백제의 뿌리가 되었습니다.","related":["k_goguryeo_found","k_baekje_found","k_goguryeo_daemusin"],"meta":{"when":"BC 2세기경","year":-130,"year_est":-130,"emperor":"-"}},{"id":"k_goguryeo_daemusin","type":"korea","name":"고구려 대무신왕","name_en":"King Daemusin of Goguryeo","tagline":"부여를 정복한 3대왕","summary":"대무신왕(AD 18–44)은 고구려 제3대 왕으로 동부여를 정복하고 낙랑군을 공격했습니다. 고구려가 한반도 북부의 강자로 올라선 시기로, 예수님의 공생애 시기와 겹칩니다.","related":["k_goguryeo_found","k_goguryeo_taejo"],"meta":{"when":"AD 18-44년","year":18,"year_est":18,"emperor":"디베료"}},{"id":"k_gojoseon_fall","type":"korea","name":"고조선 멸망과 한사군 설치","name_en":"Fall of Gojoseon","tagline":"한반도에 한사군이 들어서다","summary":"BC 108년, 한나라 무제가 위만조선을 멸망시키고 한반도 북부에 낙랑군 등 한사군을 설치했습니다. 예수님 탄생 약 100년 전의 일로, 한반도가 중국과 직접 맞닿기 시작한 시기입니다.","related":["k_okjeo"],"meta":{"when":"BC 108년","year":-108,"year_est":-108,"emperor":"-"}},{"id":"k_silla_found","type":"korea","name":"신라 건국","name_en":"Founding of Silla","tagline":"박혁거세의 서라벌","summary":"BC 57년, 박혁거세가 경주에 신라를 세웠습니다. 예수님 탄생보다 약 50년 앞선 일입니다. 천 년 왕국의 첫걸음이었습니다.","related":["k_goguryeo_found","k_baekje_found"],"meta":{"when":"BC 57년","year":-57,"year_est":-57,"emperor":"-"}},{"id":"k_goguryeo_found","type":"korea","name":"고구려 건국","name_en":"Founding of Goguryeo","tagline":"주몽의 졸본성","summary":"BC 37년, 주몽(동명성왕)이 압록강 유역 졸본성에 고구려를 세웠습니다. 이후 700년 동북아시아의 강국으로 자라났습니다.","related":["k_silla_found","k_baekje_found"],"meta":{"when":"BC 37년","year":-37,"year_est":-37,"emperor":"-"}},{"id":"k_baekje_found","type":"korea","name":"백제 건국","name_en":"Founding of Baekje","tagline":"온조왕의 위례성","summary":"BC 18년, 주몽의 아들 온조가 한강 유역 위례성에 백제를 세웠습니다. 고구려에서 갈라져 나온 남쪽의 새 나라였습니다.","related":["k_goguryeo_found","k_silla_found"],"meta":{"when":"BC 18년","year":-18,"year_est":-18,"emperor":"-"}},{"id":"k_okjeo","type":"korea","name":"옥저와 동예","name_en":"Okjeo and Dongye","tagline":"한사군 주변의 부족 국가들","summary":"한사군이 설치된 뒤 함경도와 강원도 일대에는 옥저와 동예 같은 부족 국가들이 있었습니다. 고구려와 신라에 점차 흡수되며 한반도 삼국의 틀이 잡혀갔습니다.","related":["k_gojoseon_fall","k_goguryeo_found"],"meta":{"when":"BC 108년 이후","year":-108,"year_est":-100,"emperor":"-"}},{"id":"k_gaya_found","type":"korea","name":"가야 건국","name_en":"Founding of Gaya","tagline":"김수로왕의 금관가야","summary":"AD 42년, 김수     detail.innerHTML=`<div class="detail-inner">${breadcrumbHtml()}<div class="detail-head"><div><span class="badge" style="--type-color:var(${cssType[n.type]});--fill:${actualFill}">${typeNames[n.type]}</span><div class="detail-title"><h2>${esc(n.name)}</h2><a class="google-link" href="https://www.google.com/search?q=${encodeURIComponent(n.name)}" target="_blank" rel="noopener" aria-label="${esc(n.name)} Google 검색" title="Google 검색">↗</a></div><div class="en">${esc(n.name_en||'')}</div></div><button class="close" id="closeDetail" aria-label="상세 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p class="tagline">${esc(n.tagline)}</p><p class="summary">${esc(n.summary)}</p>${keyHtml}${subHtml}${chapterHtml}${expositionHtml}${readingHtml}${metaHtml(n)}${verseHtml}<h3 class="section-title">관련 노드</h3><div class="chips">${rel.map(r=>`<button class="chip" data-node="${r.id}">${esc(r.name)}</button>`).join('')}</div><p class="next-step">${nextStepText(n)}</p></div>`;
    document.getElementById('closeDetail').onclick=closeDetail;bindBreadcrumbs();detail.querySelectorAll('.chip').forEach(b=>b.onclick=()=>selectNode(byId.get(b.dataset.node),true,crumbPath));detail.querySelectorAll('.key-chapter').forEach(b=>b.onclick=()=>{const book=byId.get(b.dataset.book);if(!book)return;const path=crumbPath.slice();if(b.dataset.sub!=null){const si=Number(b.dataset.sub),s=n.sub_doctrines[si],last=path[path.length-1];if(!last||last.subIndex!==si)path.push({label:'세부: '+s.title,nodeId:n.id,subIndex:si,subTitle:s.title})}path.push({label:b.dataset.ref,nodeId:book.id});selectNode(book,true,path)});detail.querySelectorAll('.sub-doctrine').forEach(d=>d.addEventListener('toggle',()=>{if(!d.open)return;detail.querySelectorAll('.sub-doctrine').forEach(other=>{if(other!==d)other.open=false});const i=Number(d.dataset.subIndex),s=n.sub_doctrines[i];crumbPath=[{label:'교리: '+n.name,nodeId:n.id},{label:'세부: '+s.title,nodeId:n.id,subIndex:i,subTitle:s.title}];const host=detail.querySelector('.breadcrumbs');if(host)host.outerHTML=breadcrumbHtml();bindBreadcrumbs()}));
    const chapterSelect=document.getElementById('chapterVerseSelect');if(chapterSelect)chapterSelect.onchange=()=>{const host=document.getElementById('chapterVerseContent');if(host)host.innerHTML=chapterVerseCards(chapters[Number(chapterSelect.value)])};
    const expositionSelect=document.getElementById('expositionSelect');if(expositionSelect)expositionSelect.onchange=()=>{const host=document.getElementById('expositionContent');if(host)host.innerHTML=expositionCards(expositions[Number(expositionSelect.value)])};
    detail.scrollTop=0;
  }
  function closeDetail(afterClose){selected=null;crumbPath=[];layout.classList.remove('detail-open');detail.classList.remove('open');detail.inert=true;detail.setAttribute('aria-hidden','true');scrim.classList.remove('open');updateFigureBoardSelection();draw();if(typeof afterClose==='function')afterClose();setTimeout(()=>{resize();if(currentView==='figure')queueFigureBoardEdges();else if(currentView==='doctrine'){seedPositions();fitView(false)}},30)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function updateSearch(){
    const q=search.value.trim().toLowerCase();clearSearch.classList.toggle('visible',!!q);searchMatches.clear();if(!q){results.classList.remove('open');results.innerHTML='';draw();return}
    const found=nodes.filter(n=>[n.name,n.name_en,n.tagline,n.summary].join(' ').toLowerCase().includes(q)).slice(0,12);found.forEach(n=>searchMatches.add(n.id));results.innerHTML=found.length?found.map(n=>`<button class="result" role="option" data-node="${n.id}"><span class="result-dot" style="background:var(${cssType[n.type]})"></span><span><strong>${esc(n.name)} <small>${esc(n.name_en)}</small></strong><small>${esc(n.tagline)}</small></span></button>`).join(''):`<div class="empty">일치하는 노드가 없습니다.</div>`;results.classList.add('open');results.querySelectorAll('.result').forEach(b=>b.onclick=()=>{results.classList.remove('open');selectNode(byId.get(b.dataset.node),true)});draw();
  }
  let pointers=new Map(),gesture=null,dragNode=null,moved=false;
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.offsetX,y:e.offsetY});moved=false;const n=pick(e.offsetX,e.offsetY),fixed=['book','timeline','figure','doctrine'].includes(currentView);if(n&&pointers.size===1&&!fixed){dragNode=n;n.pinned=true;gesture={type:'node',x:e.offsetX,y:e.offsetY}}else{dragNode=null;gesture={type:'pan',x:e.offsetX,y:e.offsetY,px:pan.x,py:pan.y}}canvas.classList.add('dragging')});
  canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)){hovered=pick(e.offsetX,e.offsetY);canvas.style.cursor=hovered?'pointer':'grab';draw();return}pointers.set(e.pointerId,{x:e.offsetX,y:e.offsetY});if(pointers.size===2){const ps=[...pointers.values()];const dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};if(!gesture||gesture.type!=='pinch')gesture={type:'pinch',dist:dist,scale:scale,world:worldPoint(mid.x,mid.y)};else{scale=Math.max(.18,Math.min(3.5,gesture.scale*dist/gesture.dist));pan.x=mid.x-width/2-gesture.world.x*scale;pan.y=mid.y-height/2-gesture.world.y*scale;draw()}moved=true;return}if(!gesture)return;const dx=e.offsetX-gesture.x,dy=e.offsetY-gesture.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(dragNode){const w=worldPoint(e.offsetX,e.offsetY);dragNode.x=w.x;dragNode.y=w.y;dragNode.vx=dragNode.vy=0;draw()}else if(gesture.type==='pan'){pan.x=gesture.px+dx;pan.y=gesture.py+dy;draw()}});
  function endPointer(e){const was=pick(e.offsetX,e.offsetY);pointers.delete(e.pointerId);if(dragNode){dragNode.pinned=currentView==='timeline';if(!moved&&was===dragNode)selectNode(dragNode,false);else runSimulation(false)}else if(!moved&&was)selectNode(was,false);dragNode=null;if(!pointers.size){gesture=null;canvas.classList.remove('dragging')}else gesture=null}
  canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('pointerleave',()=>{if(!pointers.size){hovered=null;draw()}});
  canvas.addEventListener('wheel',e=>{e.preventDefault();const before=worldPoint(e.offsetX,e.offsetY),factor=Math.exp(-e.deltaY*.0012);scale=Math.max(.18,Math.min(3.5,scale*factor));pan.x=e.offsetX-width/2-before.x*scale;pan.y=e.offsetY-height/2-before.y*scale;draw()},{passive:false});
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  typeFilters.querySelectorAll('.type-filter').forEach(b=>b.onclick=()=>{const type=b.dataset.type;if(activeTypes.has(type))activeTypes.delete(type);else activeTypes.add(type);applyAllFilters()});
  figureFilters.innerHTML=`<button class="type-filter figure-chip" data-group="all" aria-pressed="true" style="--type-color:var(--accent)"><span class="type-dot"></span>전체</button>`+figureGroups.map((g,i)=>`<button class="type-filter figure-chip" data-group="${i}" aria-pressed="false" style="--type-color:var(${figureGroupAccents[i]})"><span class="type-dot"></span>${esc(g.title)} · ${g.ids.length}명</button>`).join('');
  figureFilters.querySelectorAll('.figure-chip').forEach(b=>b.onclick=()=>{
    const applyFigureFocus=()=>{
      const g=b.dataset.group;
      if(g==='all')figureFocusGroup=null;
      else{const gi=Number(g);figureFocusGroup=figureFocusGroup===gi?null:gi;}
      updateFigureFilters();draw();
      document.getElementById('status').textContent=figureFocusGroup==null?'주요인물 전체 보기':figureGroups[figureFocusGroup].title+' 그룹만 표시';
    };
    if(selected||detail.classList.contains('open'))closeDetail(applyFigureFocus);
    else applyFigureFocus();
  });
  search.addEventListener('input',updateSearch);search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';updateSearch();search.blur()}else if(e.key==='ArrowDown'){const first=results.querySelector('.result');if(first){e.preventDefault();first.focus()}}});
  clearSearch.onclick=()=>{search.value='';updateSearch();search.focus()};scrim.onclick=()=>{if(Date.now()-lastSelectAt<700)return;closeDetail()};
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))results.classList.remove('open')});
  document.getElementById('zoomIn').onclick=()=>{scale=Math.min(3.5,scale*1.22);draw()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.18,scale/1.22);draw()};document.getElementById('resetView').onclick=()=>fitView(false);
  window.addEventListener('resize',()=>{resize();if(currentView==='book')renderBookCards();else if(currentView==='figure')queueFigureBoardEdges();else if(currentView==='doctrine'){seedPositions();fitView(false)}});
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);
  const ro=new ResizeObserver(()=>resize());ro.observe(stage);
  const figureRo=new ResizeObserver(queueFigureBoardEdges);figureRo.observe(figureBoard);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(queueFigureBoardEdges);
  computeVisible();resize();setView('timeline');
})();
</script>
