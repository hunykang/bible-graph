ref":"행 5:29","v":29,"text":"베드로와 사도들이 대답하여 가로되 사람보다 하나님을 순종하는 것이 마땅하니라"},{"book_en":"Acts","ch":5,"note":"예수 이름을 위해 욕받는 것을 기뻐한 사도들의 고난관입니다.","ref":"행 5:41","v":41,"text":"사도들은 그 이름을 위하여 능욕 받는 일에 합당한 자로 여기심을 기뻐하면서 공회 앞을 떠나니라"}]},{"book_id":"b_acts","chapter":6,"verses":[{"book_en":"Acts","ch":6,"note":"사도들이 기도와 말씀 사역에 전념하기로 한, 교회 직분 분담의 기준입니다.","ref":"행 6:4","v":4,"text":"우리는 기도하는 것과 말씀 전하는 것을 전무하리라 하니"},{"book_en":"Acts","ch":6,"note":"하나님의 말씀이 왕성해지고 제자가 많아졌다는 초대교회 부흥의 기록입니다.","ref":"행 6:7","v":7,"text":"하나님의 말씀이 점점 왕성하여 예루살렘에 있는 제자의 수가 더 심히 많아지고 허다한 제사장의 무리도 이 도에 복종하니라"}]},{"book_id":"b_acts","chapter":7,"verses":[{"book_en":"Acts","ch":7,"note":"성령을 거스르는 완고함을 꾸짖은 스데반의 담대한 설교입니다.","ref":"행 7:51","v":51,"text":"목이 곧고 마음과 귀에 할례를 받지 못한 사람들아 너희가 항상 성령을 거스려 너희 조상과 같이 너희도 하는도다"},{"book_en":"Acts","ch":7,"note":"돌에 맞으면서도 원수를 용서한 스데반의 순교, 예수님을 닮은 마지막 기도입니다.","ref":"행 7:60","v":60,"text":"무릎을 꿇고 크게 불러 가로되 주여 이 죄를 저들에게 돌리지 마옵소서 이 말을 하고 자니라"}]},{"book_id":"b_acts","chapter":8,"verses":[{"book_en":"Acts","ch":8,"note":"빌립이 성경을 풀어 에디오피아 내시에게 예수를 전한, 성경적 전도의 모범입니다.","ref":"행 8:35","v":35,"text":"빌립이 입을 열어 이 글에서 시작하여 예수를 가르쳐 복음을 전하니"},{"book_en":"Acts","ch":8,"note":"'물이 있으니 세례 받음에 무슨 거리낌이 있느뇨'라는 복음에 대한 즉각적인 반응입니다.","ref":"행 8:36","v":36,"text":"길 가다가 물 있는 곳에 이르러 내시가 말하되 보라 물이 있으니 내가 세례를 받음에 무슨 거리낌이 있느뇨"}]},{"book_id":"b_acts","chapter":9,"verses":[{"book_en":"Acts","ch":9,"note":"다메섹 도상에서 '나는 네가 핍박하는 예수라' 하신 부활하신 주님의 음성입니다.","ref":"행 9:5","v":5,"text":"대답하되 주여 뉘시오니이까 가라사대 나는 네가 핍박하는 예수라"},{"book_en":"Acts","ch":9,"note":"핍박자 사울을 이방인의 사도로 택하신 하나님의 주권적인 부르심입니다.","ref":"행 9:15","v":15,"text":"주께서 가라사대 가라 이 사람은 내 이름을 이방인과 임금들과 이스라엘 자손들 앞에 전하기 위하여 택한 나의 그릇이라"}]},{"book_id":"b_acts","chapter":10,"verses":[{"book_en":"Acts","ch":10,"note":"하나님은 외모로 사람을 취하지 않으신다는, 복음의 문이 이방인에게 열린 선언입니다.","ref":"행 10:34","v":34,"text":"베드로가 입을 열어 가로되 내가 참으로 하나님은 사람의 외모를 취하지 아니하시고"},{"book_en":"Acts","ch":10,"note":"예수를 믿는 자마다 죄 사함을 받는다는 베드로의 복음 요약입니다.","ref":"행 10:43","v":43,"text":"저에 대하여 모든 선지자도 증거하되 저를 믿는 사람들이 다 그 이름을 힘입어 죄 사함을 받는다 하였느니라"}]},{"book_id":"b_acts","chapter":11,"verses":[{"book_en":"Acts","ch":11,"note":"이방인에게도 생명 얻는 회개를 주셨다는, 초대교회의 놀라운 깨달음입니다.","ref":"행 11:18","v":18,"text":"저희가 이 말을 듣고 잠잠하여 하나님께 영광을 돌려 가로되 그러면 하나님께서 이방인에게도 생명 얻는 회개를 주셨도다 하니라"},{"book_en":"Acts","ch":11,"note":"안디옥에서 제자들이 비로소 '그리스도인'이라 불리게 된 역사적인 기록입니다.","ref":"행 11:26","v":26,"text":"만나매 안디옥에 데리고 와서 둘이 교회에 일년간 모여 있어 큰 무리를 가르쳤고 제자들이 안디옥에서 비로소 그리스도인이라 일컬음을 받게 되었더라"}]},{"book_id":"b_acts","chapter":12,"verses":[{"book_en":"Acts","ch":12,"note":"옥에 갇힌 베드로를 위해 교회가 간절히 기도했다는, 기도의 능력을 보여주는 장면입니다.","ref":"행 12:5","v":5,"text":"이에 베드로는 옥에 갇혔고 교회는 그를 위하여 간절히 하나님께 빌더라"},{"book_en":"Acts","ch":12,"note":"핍박 중에도 하나님의 말씀이 흥왕했다는 교회의 승리 기록입니다.","ref":"행 12:24","v":24,"text":"하나님의 말씀은 흥왕하여 더하더라"}]},{"book_id":"b_acts","chapter":13,"verses":[{"book_en":"Acts","ch":13,"note":"성령께서 바나바와 사울을 따로 세우라 하신, 첫 선교 파송의 장면입니다.","ref":"행 13:2","v":2,"text":"주를 섬겨 금식할 때에 성령이 가라사대 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니"},{"book_en":"Acts","ch":13,"note":"예수로 말미암아 죄 사함을 전한다는 바울의 첫 복음 설교 핵심입니다.","ref":"행 13:38","v":38,"text":"그러므로 형제들아 너희가 알 것은 이 사람을 힘입어 죄 사함을 너희에게 전하는 이것이며"}]},{"book_id":"b_acts","chapter":14,"verses":[{"book_en":"Acts","ch":14,"note":"헛된 우상을 버리고 살아 계신 하나님께로 돌아오라는 바울의 외침입니다.","ref":"행 14:15","v":15,"text":"가로되 여러분이여 어찌하여 이러한 일을 하느냐 우리도 너희와 같은 성정을 가진 사람이라 너희에게 복음을 전하는 것은 이 헛된 일을 버리고 천지와 바다와 그 가운데 만유를 지으시고 살아 계신 하나님께로 돌아 오라 함이라"},{"book_en":"Acts","ch":14,"note":"하나님 나라에 들어가려면 많은 환난을 겪어야 한다는 제자도의 가르침입니다.","ref":"행 14:22","v":22,"text":"제자들의 마음을 굳게 하여 이 믿음에 거하라 권하고 또 우리가 하나님 나라에 들어가려면 많은 환난을 겪어야 할 것이라 하고"}]},{"book_id":"b_acts","chapter":15,"verses":[{"book_en":"Acts","ch":15,"note":"유대인이나 이방인이나 주 예수의 은혜로 구원받는다는 예루살렘 공의회의 결론입니다.","ref":"행 15:11","v":11,"text":"우리가 저희와 동일하게 주 예수의 은혜로 구원 받는 줄을 믿노라 하니라"},{"book_en":"Acts","ch":15,"note":"성령과 사도들이 함께 결정했다는, 교회의 권위 있는 선언 방식입니다.","ref":"행 15:28","v":28,"text":"성령과 우리는 이 요긴한 것들 외에 아무 짐도 너희에게 지우지 아니하는 것이 가한줄 알았노니"}]},{"book_id":"b_acts","chapter":16,"verses":[{"book_en":"Acts","ch":16,"note":"옥중에서 기도하고 찬미한 바울과 실라에게 임한 하나님의 응답 장면입니다.","ref":"행 16:25","v":25,"text":"밤중쯤 되어 바울과 실라가 기도하고 하나님을 찬미하매 죄수들이 듣더라"},{"book_en":"Acts","ch":16,"note":"'주 예수를 믿으라 그리하면 너와 네 집이 구원을 얻으리라'는 가장 유명한 복음 초청입니다.","ref":"행 16:31","v":31,"text":"가로되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 얻으리라 하고"}]},{"book_id":"b_acts","chapter":17,"verses":[{"book_en":"Acts","ch":17,"note":"날마다 성경을 상고한 베뢰아 사람들의, 말씀을 대하는 모범적인 자세입니다.","ref":"행 17:11","v":11,"text":"베뢰아 사람은 데살로니가에 있는 사람보다 더 신사적이어서 간절한 마음으로 말씀을 받고 이것이 그러한가 하여 날마다 성경을 상고하므로"},{"book_en":"Acts","ch":17,"note":"우리가 하나님을 힘입어 살고 움직인다는 바울의 아레오바고 설교입니다.","ref":"행 17:28","v":28,"text":"우리가 그를 힘입어 살며 기동하며 있느니라 너희 시인 중에도 어떤 사람들의 말과 같이 우리가 그의 소생이라 하니"}]},{"book_id":"b_acts","chapter":18,"verses":[{"book_en":"Acts","ch":18,"note":"두려워하지 말고 말하라는 밤 환상 중 주님의 격려로, 낙심한 전도자의 위로입니다.","ref":"행 18:9","v":9,"text":"밤에 주께서 환상 가운데 바울에게 말씀하시되 두려워하지 말며 잠잠하지 말고 말하라"},{"book_en":"Acts","ch":18,"note":"'내가 너와 함께 있으매'라는 임마누엘의 약속이 사역자를 붙드십니다.","ref":"행 18:10","v":10,"text":"내가 너와 함께 있으매 아무 사람도 너를 대적하여 해롭게 할 자가 없을 것이니 이는 이 성중에 내 백성이 많음이라 하시더라"}]},{"book_id":"b_acts","chapter":19,"verses":[{"book_en":"Acts","ch":19,"note":"주의 말씀이 힘이 있어 흥왕했다는 에베소 부흥의 요약입니다.","ref":"행 19:20","v":20,"text":"이와 같이 주의 말씀이 힘이 있어 흥왕하여 세력을 얻으니라"}]},{"book_id":"b_acts","chapter":20,"verses":[{"book_en":"Acts","ch":20,"note":"달려갈 길과 복음 전하는 사명을 마치려는 바울의 생애 고백입니다.","ref":"행 20:24","v":24,"text":"나의 달려갈 길과 주 예수께 받은 사명 곧 하나님의 은혜의 복음 증거하는 일을 마치려 함에는 나의 생명을 조금도 귀한 것으로 여기지 아니하노라"},{"book_en":"Acts","ch":20,"note":"'주는 것이 받는 것보다 복이 있다'는 예수님의 말씀을 인용한 유명한 교훈입니다.","ref":"행 20:35","v":35,"text":"범사에 너희에게 모본을 보였노니 곧 이같이 수고하여 약한 사람들을 돕고 또 주 예수의 친히 말씀하신바 주는 것이 받는 것보다 복이 있다 하심을 기억하여야 할찌니라"}]},{"book_id":"b_acts","chapter":21,"verses":[{"book_en":"Acts","ch":21,"note":"주의 이름을 위해 죽을 각오가 된 바울의 결단입니다.","ref":"행 21:13","v":13,"text":"바울이 대답하되 너희가 어찌하여 울어 내 마음을 상하게 하느냐 나는 주 예수의 이름을 위하여 결박 받을 뿐아니라 예루살렘에서 죽을 것도 각오하였노라 하니"},{"book_en":"Acts","ch":21,"note":"'주의 뜻대로 이루어지이다'라는 성도들의 순종 고백입니다.","ref":"행 21:14","v":14,"text":"저가 권함을 받지 아니하므로 우리가 주의 뜻대로 이루어지이다 하고 그쳤노라"}]},{"book_id":"b_acts","chapter":22,"verses":[{"book_en":"Acts","ch":22,"note":"주의 이름을 불러 세례 받고 죄를 씻으라는 아나니아의 권면입니다.","ref":"행 22:16","v":16,"text":"이제는 왜 주저하느뇨 일어나 주의 이름을 불러 세례를 받고 너의 죄를 씻으라 하더라"}]},{"book_id":"b_acts","chapter":23,"verses":[{"book_en":"Acts","ch":23,"note":"예루살렘에서 증거한 것 같이 로마에서도 하리라는 주님의 격려입니다.","ref":"행 23:11","v":11,"text":"그날 밤에 주께서 바울 곁에 서서 이르시되 담대하라 네가 예루살렘에서 나의 일을 증거한 것 같이 로마에서도 증거하여야 하리라 하시니라"}]},{"book_id":"b_acts","chapter":24,"verses":[{"book_en":"Acts","ch":24,"note":"하나님과 사람을 대하여 양심에 거리낌 없이 살려는 바울의 삶의 원칙입니다.","ref":"행 24:16","v":16,"text":"이것을 인하여 나도 하나님과 사람을 대하여 항상 양심에 거리낌이 없기를 힘쓰노라"}]},{"book_id":"b_acts","chapter":25,"verses":[{"book_en":"Acts","ch":25,"note":"가이사에게 상소한 바울의 결단으로, 복음이 로마로 향하는 전환점입니다.","ref":"행 25:11","v":11,"text":"만일 내가 불의를 행하여 무슨 사죄를 범하였으면 죽기를 사양치 아니할 것이나 만일 이 사람들의 나를 송사하는 것이 다 사실이 아니면 누구든지 나를 그들에게 내어 줄수 없삽나이다 내가 가이사께 호소하노라 한대"}]},{"book_id":"b_acts","chapter":26,"verses":[{"book_en":"Acts","ch":26,"note":"어둠에서 빛으로, 사탄의 권세에서 하나님께로 돌이키라는 복음의 사명입니다.","ref":"행 26:18","v":18,"text":"그 눈을 뜨게 하여 어두움에서 빛으로, 사단의 권세에서 하나님께로 돌아가게 하고 죄 사함과 나를 믿어 거룩케 된 무리 가운데서 기업을 얻게 하리라 하더이다"},{"book_en":"Acts","ch":26,"note":"아그립바 왕의 '적은 말로 나를 그리스도인 되게 하려느냐'는 유명한 반응입니다.","ref":"행 26:28","v":28,"text":"아그립바가 바울더러 이르되 네가 적은 말로 나를 권하여 그리스도인이 되게 하려 하는도다"}]},{"book_id":"b_acts","chapter":27,"verses":[{"book_en":"Acts","ch":27,"note":"풍랑 가운데서도 '하나님을 내가 믿노니'라고 고백한 바울의 믿음입니다.","ref":"행 27:25","v":25,"text":"그러므로 여러분이여 안심하라 나는 내게 말씀하신 그대로 되리라고 하나님을 믿노라"}]},{"book_id":"b_acts","chapter":28,"verses":[{"book_en":"Acts","ch":28,"note":"하나님의 구원이 이방인에게로 향했다는, 사도행전의 큰 흐름을 보여주는 말씀입니다.","ref":"행 28:28","v":28,"text":"그런즉 하나님의 이 구원을 이방인에게로 보내신줄 알라 저희는 또한 들으리라 하더라"},{"book_en":"Acts","ch":28,"note":"하나님 나라를 담대히 전한 바울로 끝맺는, 끝나지 않은 복음의 이야기입니다.","ref":"행 28:31","v":31,"text":"담대히 하나님 나라를 전파하며 주 예수 그리스도께 관한 것을 가르치되 금하는 사람이 없었더라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 1권 (행 1-3장, Banner of Truth)","text":"로이드존스는 사도행전의 시작이 인간의 계획이 아니라 승천하신 그리스도의 명령과 성령의 약속에 있음을 강조했다. 교회는 사람의 열심으로 세워지는 것이 아니라, 살아계신 주님의 명령을 받아 성령을 기다리는 데서 시작된다고 보았다. 그래서 그는 참된 기독교란 언제나 그리스도 중심이며 성령의 역사에 의존하는 것이라고 가르쳤다."}]},{"chapter":2,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 1권 (행 1-3장, Banner of Truth)","text":"오순절 성령 강림에서 로이드존스는 성령의 주권적인 역사를 가장 크게 보았다. 베드로의 설교를 듣고 마음에 찔림을 받은 사람들이 회개하고 세례를 받은 것은 인간의 설득이 아니라 성령께서 마음과 뜻을 움직이신 결과라고 강조했다. 또한 그는 초대교회가 사도의 가르침과 교제와 떡을 뗌과 기도에 힘쓴 것을 오늘의 교회가 본받아야 할 본보기로 제시했다."}]},{"chapter":3,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 1권 (행 1-3장, Banner of Truth)","text":"성전 미문에서 일어난 앉은뱅이의 치유를 두고 로이드존스는 복음의 능력을 보여주는 표적이라고 설명했다. 베드로가 돈이 아닌 예수의 이름으로 그를 일으킨 것은, 인간의 방법이 아니라 그리스도의 권능이 참된 해결임을 드러낸다고 보았다. 이어진 베드로의 설교에서는 회개하고 돌이켜 죄 사함을 받으라는 복음의 초청을 강조했다."}]},{"chapter":4,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 2권 (행 4-5장, Banner of Truth)","text":"공회 앞에서 담대히 변증한 베드로와 요한을 통해 로이드존스는 복음이 주는 담대함을 강조했다. 다른 이로써는 구원을 받을 수 없다는 선언은 구원이 오직 예수 그리스도의 이름에만 있다는 분명한 복음의 선포라고 설명했다. 또한 위협 앞에서도 담대함을 구하며 기도한 초대교회의 모습을 오늘의 교회가 본받아야 할 기도의 모범으로 제시했다."}]},{"chapter":5,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 2권 (행 4-5장, Banner of Truth)","text":"아나니아와 삽비라 사건에서 로이드존스는 교회에 임한 하나님의 거룩하심을 강조했다. 성령을 속인 죄에 대한 심판은 하나님이 교회를 얼마나 거룩하게 여기시는지를 보여준다고 보았다. 이어 사도들이 매를 맞고도 예수의 이름을 위해 능욕 받는 것을 기뻐한 것은, 고난 속에서도 복음을 부끄러워하지 않는 참된 제자의 모습이라고 가르쳤다."}]},{"chapter":6,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 3권 (행 5:17-6:8, Banner of Truth)","text":"헬라파 과부들의 구제 문제를 다룬 6장에서 로이드존스는 교회의 질서와 말씀 사역의 우선순위를 강조했다. 일곱 집사를 세운 것은 봉사의 일을 소홀히 해서가 아니라, 사도들이 기도와 말씀 전하는 일에 전념하기 위한 지혜로운 조치였다고 설명했다. 성령과 지혜가 충만한 스데반의 등장은 평신도라도 성령 충만하면 능력 있게 쓰임받는다는 것을 보여준다고 보았다."}]},{"chapter":7,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 4-5권 (행 7장, Banner of Truth)","text":"스데반의 긴 설교에서 로이드존스는 구약 역사 전체에 흐르는 하나님의 경륜을 보았다. 영광의 하나님이 아브라함에게 나타나신 때부터 모든 역사는 나사렛 예수 그리스도를 향해 나아가고 있었다고 강조했다. 돌에 맞아 죽으면서도 주 예수를 부른 스데반의 순교는, 세상에 타협하지 않으면서도 박해자를 위해 기도한 참된 그리스도인의 모습을 보여준다고 가르쳤다."}]},{"chapter":8,"summaries":[{"author":"마틴 로이드존스","source":"『Authentic Christianity』 6권 (행 8:1-35, Banner of Truth)","text":"핍박으로 흩어진 성도들을 통해 복음이 사마리아에 전해진 것을 두고 로이드존스는 고난을 복음 전파의 도구로 쓰시는 하나님의 주권을 강조했다. 시몬 마술사의 이야기로는 겉모양만 믿는 가짜 믿음의 위험을 경고했다. 에디오피아 내시에게 빌립이 설명한 고난받는 종의 복음이야말로 복음의 심장이며, 참된 회개와 믿음으로 나아가는 길이라고 가르쳤다."}]}],"exposition_note":"로이드존스: 『Authentic Christianity』 전 6권 (행 1-8장, Banner of Truth)"},{"id":"b_romans","type":"book","name":"로마서","name_en":"Romans","tagline":"복음의 핵심을 담은 편지","summary":"로마서는 바울이 복음의 핵심을 가장 체계적으로 정리한 편지입니다. 모든 사람이 죄인이며, 오직 예수 그리스도를 믿음으로 의롭다 하심을 받는다는 '칭의' 교리를 선포합니다. 개혁주의 신학의 토대가 되는 책으로, 종교개혁의 불씨가 되었습니다. 하나님의 주권과 은혜, 믿음의 삶을 깊이 있게 다룹니다.","verses":[{"ref":"롬 1:17","book_en":"Romans","ch":1,"v":17,"text":"복음에는 하나님의 의가 나타나서 믿음으로 믿음에 이르게 하나니 기록된바 오직 의인은 믿음으로 말미암아 살리라 함과 같으니라"},{"ref":"롬 3:28","book_en":"Romans","ch":3,"v":28,"text":"그러므로 사람이 의롭다 하심을 얻는 것은 율법의 행위에 있지 않고 믿음으로 되는줄 우리가 인정하노라"},{"ref":"롬 8:1","book_en":"Romans","ch":8,"v":1,"text":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니"}],"related":["f_paul","d_salvation","d_christ","d_eschatology"],"meta":{"category":"바울서신","author":"바울","date":"AD 57년경","chapters":16,"year_est":57,"emperor":"네로"},"sections":[{"range":"1-3장","text":"이방인도 유대인도 예외 없이 모두 죄 아래 있습니다. 모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니(3:23).","title":"모든 사람은 죄인입니다"},{"range":"4-5장","text":"아브라함이 행위가 아니라 믿음으로 의롭다 하심을 받은 것처럼, 우리도 예수님을 믿음으로 의롭다 하심을 받습니다. 이것이 칭의의 핵심입니다.","title":"믿음으로 의롭다 하십니다"},{"range":"6-8장","text":"세례로 그리스도와 함께 죽고 다시 산 자는 더 이상 죄의 종이 아닙니다. 그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니(8:1).","title":"죄에서 해방된 새 삶"},{"range":"9-11장","text":"하나님은 주권적으로 구원을 이루시며, 이스라엘의 넘어짐을 통해 이방인에게 구원이 이르렀습니다. 하나님의 계획은 실패하지 않습니다.","title":"이스라엘과 하나님의 주권"},{"range":"12-16장","text":"몸을 산 제물로 드리고(12:1), 서로 사랑하며, 권위에 순종하는 삶이 구원받은 자의 열매입니다. 교리는 반드시 삶으로 이어집니다.","title":"구원받은 자의 삶"}],"chapter_verses":[{"book_id":"b_romans","chapter":1,"verses":[{"ref":"롬 1:16","book_en":"Romans","ch":1,"v":16,"note":"복음을 부끄러워하지 않는 이유는 복음이 모든 믿는 자에게 구원을 주시는 하나님의 능력이기 때문입니다.","text":"내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라 첫째는 유대인에게요 또한 헬라인에게로다"},{"ref":"롬 1:17","book_en":"Romans","ch":1,"v":17,"note":"의인은 믿음으로 산다는 로마서 전체의 주제를 여는 구절입니다.","text":"복음에는 하나님의 의가 나타나서 믿음으로 믿음에 이르게 하나니 기록된바 오직 의인은 믿음으로 말미암아 살리라 함과 같으니라"}]},{"book_id":"b_romans","chapter":2,"verses":[{"ref":"롬 2:11","book_en":"Romans","ch":2,"v":11,"note":"하나님은 사람을 외모로 차별하지 않으시고 공평하게 심판하신다는 뜻입니다.","text":"이는 하나님께서 외모로 사람을 취하지 아니하심이니라"}]},{"book_id":"b_romans","chapter":3,"verses":[{"ref":"롬 3:23","book_en":"Romans","ch":3,"v":23,"note":"모든 사람이 죄를 범하였으므로 예외 없이 모두가 구원이 필요함을 보여줍니다.","text":"모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니"},{"ref":"롬 3:24","book_en":"Romans","ch":3,"v":24,"note":"값없이 은혜로 의롭다 하심을 받는다는 오직 은혜의 핵심 구절입니다.","text":"그리스도 예수 안에 있는 구속으로 말미암아 하나님의 은혜로 값 없이 의롭다 하심을 얻은 자 되었느니라"},{"ref":"롬 3:28","book_en":"Romans","ch":3,"v":28,"note":"의롭다 함을 받는 것은 율법의 행위가 아니라 믿음으로라는 선언입니다.","text":"그러므로 사람이 의롭다 하심을 얻는 것은 율법의 행위에 있지 않고 믿음으로 되는줄 우리가 인정하노라"}]},{"book_id":"b_romans","chapter":4,"verses":[{"ref":"롬 4:3","book_en":"Romans","ch":4,"v":3,"note":"아브라함도 행위가 아니라 믿음으로 의롭다 함을 받은 본보기임을 보여줍니다.","text":"성경이 무엇을 말하느뇨 아브라함이 하나님을 믿으매 이것이 저에게 의로 여기신바 되었느니라"}]},{"book_id":"b_romans","chapter":5,"verses":[{"ref":"롬 5:1","book_en":"Romans","ch":5,"v":1,"note":"믿음으로 의롭다 하심을 받은 성도는 하나님과 화평을 누리게 됩니다.","text":"그러므로 우리가 믿음으로 의롭다 하심을 얻었은즉 우리 주 예수 그리스도로 말미암아 하나님으로 더불어 화평을 누리자"},{"ref":"롬 5:8","book_en":"Romans","ch":5,"v":8,"note":"우리가 아직 죄인 되었을 때 그리스도께서 대신 죽으신 것이 하나님의 사랑의 증거입니다.","text":"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라"}]},{"book_id":"b_romans","chapter":6,"verses":[{"ref":"롬 6:23","book_en":"Romans","ch":6,"v":23,"note":"죄의 삯은 사망이요 하나님의 은사는 영생이라는 복음의 대비를 한 문장으로 보여줍니다.","text":"죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라"}]},{"book_id":"b_romans","chapter":7,"verses":[{"ref":"롬 7:24","book_en":"Romans","ch":7,"v":24,"note":"죄와 싸우는 성도의 솔직한 탄식이며, 그래서 구원자가 필요함을 고백하는 구절입니다.","text":"오호라 나는 곤고한 사람이로다 이 사망의 몸에서 누가 나를 건져 내랴"}]},{"book_id":"b_romans","chapter":8,"verses":[{"ref":"롬 8:1","book_en":"Romans","ch":8,"v":1,"note":"그리스도 예수 안에 있는 자에게는 결코 정죄함이 없다는 복음의 확신입니다.","text":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니"},{"ref":"롬 8:28","book_en":"Romans","ch":8,"v":28,"note":"하나님을 사랑하는 자에게는 모든 것이 합력하여 선을 이룬다는 섭리의 약속입니다.","text":"우리가 알거니와 하나님을 사랑하는 자 곧 그 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라"},{"ref":"롬 8:38","book_en":"Romans","ch":8,"v":38,"note":"어떤 것도 우리를 그리스도의 사랑에서 끊을 수 없다는 구원의 확실성 선언입니다.","text":"내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나"}]},{"book_id":"b_romans","chapter":9,"verses":[{"ref":"롬 9:16","book_en":"Romans","ch":9,"v":16,"note":"구원은 사람의 뜻이나 노력이 아니라 오직 긍휼히 여기시는 하나님께 달려 있습니다.","text":"그런즉 원하는 자로 말미암음도 아니요 달음박질하는 자로 말미암음도 아니요 오직 긍휼히 여기시는 하나님으로 말미암음이니라"}]},{"book_id":"b_romans","chapter":10,"verses":[{"ref":"롬 10:9","book_en":"Romans","ch":10,"v":9,"note":"입으로 예수를 주로 시인하고 마음으로 부활을 믿으면 구원을 받는다는 약속입니다.","text":"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니"},{"ref":"롬 10:13","book_en":"Romans","ch":10,"v":13,"note":"누구든지 주의 이름을 부르는 자는 구원을 얻는다는 복음의 문이 활짝 열린 구절입니다.","text":"누구든지 주의 이름을 부르는 자는 구원을 얻으리라"}]},{"book_id":"b_romans","chapter":11,"verses":[{"ref":"롬 11:33","book_en":"Romans","ch":11,"v":33,"note":"하나님의 지혜와 지식의 깊이에 감탄하며 찬양하는 바울의 고백입니다.","text":"깊도다 하나님의 지혜와 지식의 부요함이여, 그의 판단은 측량치 못할것이며 그의 길은 찾지 못할 것이로다"}]},{"book_id":"b_romans","chapter":12,"verses":[{"ref":"롬 12:2","book_en":"Romans","ch":12,"v":2,"note":"세상을 본받지 말고 마음을 새롭게 함으로 변화를 받으라는 성도의 삶의 방향입니다.","text":"너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라"}]},{"book_id":"b_romans","chapter":13,"verses":[{"ref":"롬 13:8","book_en":"Romans","ch":13,"v":8,"note":"서로 사랑하는 것이 율법을 다 이룬 것이라는 사랑의 요약입니다.","text":"피차 사랑의 빚 외에는 아무에게든지 아무 빚도 지지 말라 남을 사랑하는 자는 율법을 다 이루었느니라"}]},{"book_id":"b_romans","chapter":14,"verses":[{"ref":"롬 14:8","book_en":"Romans","ch":14,"v":8,"note":"살든지 죽든지 우리는 주의 것이라는 성도의 소속 고백입니다.","text":"우리가 살아도 주를 위하여 살고 죽어도 주를 위하여 죽나니 그러므로 사나 죽으나 우리가 주의 것이로라"}]},{"book_id":"b_romans","chapter":15,"verses":[{"ref":"롬 15:13","book_en":"Romans","ch":15,"v":13,"note":"소망의 하나님이 기쁨과 평강을 충만하게 하시기를 비는 축복의 구절입니다.","text":"소망의 하나님이 모든 기쁨과 평강을 믿음 안에서 너희에게 충만케 하사 성령의 능력으로 소망이 넘치게 하시기를 원하노라"}]},{"book_id":"b_romans","chapter":16,"verses":[{"ref":"롬 16:20","book_en":"Romans","ch":16,"v":20,"note":"평강의 하나님이 사탄을 우리의 발 아래서 상하게 하실 것이라는 승리의 약속입니다.","text":"평강의 하나님께서 속히 사단을 너희 발 아래서 상하게 하시리라 우리 주 예수의 은혜가 너희에게 있을찌어다"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 1권 (롬 1장, Banner of Truth)","text":"로이드존스는 로마서 1장을 복음의 서론으로 다루며, 복음이 단순한 가르침이 아니라 죄인을 구원하는 하나님의 능력임을 강조했다. 동시에 하나님의 진노가 모든 불경건과 불의에 대해 나타나고 있음을 선포했는데, 이는 복음이 왜 필요한지를 보여주는 진단이라고 보았다. 인간의 근본 문제는 무지가 아니라 하나님을 알면서도 영화롭게 하지 않는 반역이라고 설명했다."},{"author":"팀 켈러","source":"『Romans 1-7 For You』 (롬 1장 부분, The Good Book Company)","text":"켈러는 복음을 세상의 지혜와 대비되는 하나님의 역설적인 능력으로 소개했다. 복음은 종교적인 자기 의와 세속적인 자기 방종이라는 두 길 모두를 넘어서는 제3의 길이며, 부끄러워할 것이 아니라 자랑할 소식이라고 강조했다."}]},{"chapter":2,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 2권 (롬 2:1-3:20, Banner of Truth)","text":"도덕적으로 사는 사람도 하나님의 심판을 피할 수 없다는 점을 파헤쳤다. 율법을 아는 것과 행하는 것은 다르며, 하나님은 외적인 표식이 아니라 마음의 할례를 보신다고 강조했다. 유대인이라는 특권도 심판대 앞에서는 소용없다고 선포했다."},{"author":"팀 켈러","source":"『Romans 1-7 For You』 (롬 2장 부분, The Good Book Company)","text":"스스로 의롭다고 여기는 마음이야말로 가장 교묘한 죄의 형태일 수 있다고 지적했다. 다른 사람을 판단하는 잣대가 결국 자신을 정죄한다는 사실을 통해, 복음이 먼저 우리의 자기 의를 무너뜨린다고 설명했다."}]},{"chapter":3,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 2권(롬 2:1-3:20)·3권(롬 3:21-4:25), Banner of Truth","text":"모든 사람이 죄를 범했고 하나님의 영광에 이르지 못한다는 진단을 철저히 세운 뒤, 율법과 상관없이 나타난 하나님의 의로 전환했다. 그리스도의 속죄를 통해 하나님은 의로우시면서도 죄인을 의롭다 하시는 분임이 드러난다고 강조했다."},{"author":"팀 켈러","source":"『Romans 1-7 For You』 (롬 3장 부분, The Good Book Company)","text":"절망적인 진단이 오히려 소망의 문이다. 인간의 실패를 정직하게 인정할 때 비로소 은혜가 은혜로 들린다고 설명했다."}]},{"chapter":4,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 3권 (롬 3:21-4:25, Banner of Truth)","text":"아브라함의 사례를 통해 칭의가 행위가 아닌 믿음으로 주어지는 선물임을 논증했다. 자랑할 것이 아무것도 없다는 사실이 복음의 핵심이며, 이는 모든 시대의 율법주의에 대한 답이라고 강조했다."},{"author":"팀 켈러","source":"『Romans 1-7 For You』 (롬 4장 부분, The Good Book Company)","text":"믿음이란 자신을 바라보던 시선을 그리스도께로 돌리는 것이다. 아브라함도 예외가 아니었으니, 누구도 예외일 수 없다고 설명했다."}]},{"chapter":5,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 4권 (롬 5장, Banner of Truth)","text":"칭의의 결과로 주어지는 확신을 다뤘다. 아담 안에서 받은 죽음과 그리스도 안에서 받은 생명을 대비하며, 하나님의 사랑에 대한 확신이 고난 중에도 흔들리지 않는다고 강조했다."},{"author":"팀 켈러","source":"『Romans 1-7 For You』 (롬 5장 부분, The Good Book Company)","text":"소망은 부끄럽게 하지 않는다. 과거의 은혜인 화목, 현재의 은혜인 담대함, 미래의 은혜인 영광이 하나로 이어진다고 설명했다."}]},{"chapter":6,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 5권 (롬 6장, Banner of Truth)","text":"은혜를 빙자한 방종을 반박했다. 세례는 그리스도와의 연합을 의미하며, 죄에 대해 죽은 자가 다시 죄 가운데 살 수는 없다고 강조했다. 성도는 죄의 종이 아니라 의의 종이다."},{"author":"팀 켈러","source":"『Romans 1-7 For You』 (롬 6장 부분, The Good Book Company)","text":"정체성이 바뀌면 삶의 방향이 바뀐다. 이제 너의 주인은 죄가 아니라 그리스도라는 선언이 실제 순종으로 이어져야 한다고 설명했다."}]},{"chapter":7,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 6권 (롬 7:1-8:4, Banner of Truth)","text":"율법의 기능과 한계를 설명했다. 율법은 거룩하지만 죄를 드러낼 뿐 구원하지 못하며, 곤고한 사람의 탄식은 성도가 죄와 싸우는 현실을 보여준다고 보았다. 해답은 율법이 아니라 그리스도 안에 있다고 강조했다."},{"author":"팀 켈러","source":"『Romans 1-7 For You』 (롬 7장 부분, The Good Book Company)","text":"율법은 거울이지 사다리가 아니다. 율법은 우리를 비추어 죄를 보게 하지만, 그 위로 올라가 하나님께 이를 수는 없다고 설명했다."}]},{"chapter":8,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 6권(롬 7:1-8:4)·7권(롬 8:5-17)·8권(롬 8:17-39), Banner of Truth","text":"로마서의 정점이라고 본 장이다. 정죄함이 없는 이유, 성령의 인도와 양자 됨, 고난과 영광의 연결, 그리고 아무것도 우리를 그리스도의 사랑에서 끊을 수 없다는 확신으로 이어지는 흐름을 강조했다. 성도의 견인에 대한 가장 강력한 본문으로 다뤘다."},{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 8장 부분, The Good Book Company)","text":"두려움에서 사랑으로의 이동이다. 정죄의 두려움이 사라진 자리에 아빠 아버지를 부르는 친밀함이 들어선다고 설명했다."}]},{"chapter":9,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 9권 (롬 9장, Banner of Truth)","text":"하나님의 주권적인 선택을 정면으로 다뤘다. 구원이 인간의 의지나 노력에 달린 것이 아니라 긍휼히 여기시는 하나님께 달렸음을 선포했고, 토기장이의 비유로 창조주의 주권을 설명했다."},{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 9장 부분, The Good Book Company)","text":"하나님의 주권은 인간의 자랑을 무너뜨리고 겸손을 낳는다. 이 교리는 차갑게 느껴질 수 있지만, 실제로는 은혜를 가장 깊이 맛보게 하는 진리라고 설명했다."}]},{"chapter":10,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 10권 (롬 10장, Banner of Truth)","text":"구원하는 믿음의 본질을 다뤘다. 마음으로 믿고 입으로 시인하는 것이 구원의 길이며, 복음을 듣지 않고는 믿을 수 없기에 전파하는 사명이 필수적이라고 강조했다."},{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 10장 부분, The Good Book Company)","text":"믿음은 들음에서 난다. 그래서 교회는 복음을 전하는 일을 멈출 수 없으며, 전도는 선택이 아니라 구원의 구조 자체에 속한다고 설명했다."}]},{"chapter":11,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 11권 (롬 11장, Banner of Truth)","text":"이스라엘의 현재 상태와 장래에 대한 하나님의 신비로운 경륜을 다뤘다. 인간의 지혜로는 측량할 수 없는 하나님의 판단을 앞에 두고 경외와 찬양으로 마무리해야 한다고 강조했다."},{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 11장 부분, The Good Book Company)","text":"하나님의 계획은 우리의 이해를 넘지만 선하다. 겸손히 무릎 꿇고 찬양하는 것이 이 장에 대한 올바른 반응이라고 설명했다."}]},{"chapter":12,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 12권 (롬 12장, Banner of Truth)","text":"산 제사로서의 삶을 강조했다. 몸을 드리는 것이 영적 예배이며, 세상을 본받지 말고 마음을 새롭게 함으로 변화를 받으라고 선포했다. 은사에 따른 섬김과 사랑의 실천을 다뤘다."},{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 12장 부분, The Good Book Company)","text":"복음에 합당한 삶이란 은혜를 받은 사람의 전인격적 헌신이다. 예배는 주일 의식이 아니라 일상의 전부라고 설명했다."}]},{"chapter":13,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 13권 (롬 13장, Banner of Truth)","text":"두 나라에서의 삶을 다뤘다. 세상 권위에 대한 순종은 하나님의 주권을 인정하는 것이며, 동시에 사랑이 율법의 완성임을 강조했다. 이미 온 구원과 아직 오지 않은 완성의 긴장 속에서 살라고 했다."},{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 13장 부분, The Good Book Company)","text":"그리스도인은 세상 권위를 존중하되 최종 충성은 하나님께 둔다. 낮에 단정히 행하라는 권면은 재림을 기다리는 자의 윤리라고 설명했다."}]},{"chapter":14,"summaries":[{"author":"마틴 로이드존스","source":"『로마서 강해』 14권 (롬 14:1-17, Banner of Truth)","text":"자유와 양심에 대한 마지막 강해다. 강한 자와 약한 자가 먹는 문제로 서로 판단하지 말고, 형제를 실족하게 하지 않는 사랑이 우선이라고 강조했다. 하나님 나라의 본질은 먹고 마시는 것이 아니라 의와 평강과 희락이다."},{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 14장 부분, The Good Book Company)","text":"복음 안의 자유는 논쟁에서 이기는 것이 아니라 형제를 세우는 데 쓰인다. 확신이 강한 사람일수록 약한 사람을 배려해야 한다고 설명했다."}]},{"chapter":15,"summaries":[{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 15장 부분, The Good Book Company)","text":"서로 받아주라는 권면은 그리스도께서 우리를 받아주신 것을 본받는 것이다. 바울의 스페인 선교 계획은 복음이 멈추지 않고 확장되는 사명임을 보여준다고 설명했다."}]},{"chapter":16,"summaries":[{"author":"팀 켈러","source":"『Romans 8-16 For You』 (롬 16장 부분, The Good Book Company)","text":"바울이 동역자들의 이름을 일일이 부르는 것은 복음 사역이 사람을 살리는 일임을 보여준다. 평범한 성도들의 이름 없는 충성이 교회를 세운다고 설명했다."}]}]},{"id":"b_1cor","type":"book","name":"고린도전서","name_en":"1Corinthians","tagline":"문제 많은 교회에 보내는 처방전","summary":"고린도전서는 분열, 음행, 우상숭배 등 문제로 가득했던 고린도 교회에 보낸 편지입니다. 교회의 거룩함과 질서, 사랑의 본질을 가르칩니다. 유명한 '사랑장'(13장)이 이 책에 있습니다. 개혁주의 관점에서 교회는 완전한 사람들의 모임이 아니라, 말씀으로 계속 고쳐져야 할 그리스도의 몸임을 보여 줍니다.","verses":[{"ref":"고전 1:10","book_en":"1Corinthians","ch":1,"v":10,"text":"형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 다 같은 말을 하고 너희 가운데 분쟁이 없이 같은 마음과 같은 뜻으로 온전히 합하라"},{"ref":"고전 13:13","book_en":"1Corinthians","ch":13,"v":13,"text":"그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그 중에 제일은 사랑이라"},{"ref":"고전 15:3","book_en":"1Corinthians","ch":15,"v":3,"text":"내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고"}],"related":["f_paul","f_timothy","e_resurrection","d_church"],"meta":{"category":"바울서신","author":"바울","date":"AD 55년경","chapters":16,"year_est":55,"emperor":"네로"},"sections":[{"range":"1-4장","text":"바울파, 아볼로파로 나뉜 교회에 그리스도께서 어찌 나뉘었느냐고 책망합니다(1:13). 십자가의 도는 사람의 지혜가 아니라 하나님의 능력입니다.","title":"분열을 넘어 그리스도께로"},{"range":"5-7장","text":"음행을 단호히 책망하고 결혼과 독신에 대해 가르칩니다. 너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐(6:19).","title":"거룩한 삶"},{"range":"8-11장","text":"우상의 제물을 먹는 자유가 있어도 형제를 실족하게 하면 사랑이 아닙니다. 성찬은 주의 죽음을 기념하는 거룩한 식탁입니다.","title":"자유와 배려"},{"range":"12-14장","text":"은사는 몸 된 교회를 세우라고 주신 선물이며, 그중 으뜸은 사랑입니다. 사랑은 오래 참고 사랑은 온유하며(13:4).","title":"은사와 사랑"},{"range":"15-16장","text":"그리스도께서 부활하셨으니 우리도 부활합니다. 부활은 확실한 사실이므로 항상 주의 일에 더욱 힘쓰는 자들이 되십시오(15:58).","title":"부활의 소망"}],"chapter_verses":[{"book_id":"b_1cor","chapter":1,"verses":[{"ref":"고전 1:18","book_en":"1Corinthians","ch":1,"v":18,"note":"십자가의 도는 멸망하는 자에게는 미련한 것이나 구원받는 우리에게는 하나님의 능력입니다.","text":"십자가의 도가 멸망하는 자들에게는 미련한 것이요 구원을 얻는 우리에게는 하나님의 능력이라"},{"ref":"고전 1:27","book_en":"1Corinthians","ch":1,"v":27,"note":"하나님이 세상의 미련한 것들을 택하사 지혜 있는 자들을 부끄럽게 하신다는 뜻입니다.","text":"그러나 하나님께서 세상의 미련한 것들을 택하사 지혜 있는 자들을 부끄럽게 하려 하시고 세상의 약한 것들을 택하사 강한 것들을 부끄럽게 하려 하시며"}]},{"book_id":"b_1cor","chapter":2,"verses":[{"ref":"고전 2:2","book_en":"1Corinthians","ch":2,"v":2,"note":"바울이 예수 그리스도와 그의 십자가 외에는 알지 않기로 작정한 고백입니다.","text":"내가 너희 중에서 예수 그리스도와 그의 십자가에 못 박히신 것 외에는 아무 것도 알지 아니하기로 작정하였음이라"}]},{"book_id":"b_1cor","chapter":3,"verses":[{"ref":"고전 3:16","book_en":"1Corinthians","ch":3,"v":16,"note":"성도는 하나님이 거하시는 성전이므로 거룩하게 살아야 한다는 말씀입니다.","text":"너희가 하나님의 성전인 것과 하나님의 성령이 너희 안에 거하시는 것을 알지 못하느뇨"}]},{"book_id":"b_1cor","chapter":4,"verses":[{"ref":"고전 4:2","book_en":"1Corinthians","ch":4,"v":2,"note":"주님께 맡은 일꾼에게 가장 요구되는 것은 충성이라는 말씀입니다.","text":"그리고 맡은 자들에게 구할 것은 충성이니라"}]},{"book_id":"b_1cor","chapter":5,"verses":[{"ref":"고전 5:7","book_en":"1Corinthians","ch":5,"v":7,"note":"유월절 양이신 그리스도께서 우리를 위해 희생되셨다는 복음의 그림입니다.","text":"너희는 누룩 없는 자인데 새 덩어리가 되기 위하여 묵은 누룩을 내어버리라 우리의 유월절 양 곧 그리스도께서 희생이 되셨느니라"}]},{"book_id":"b_1cor","chapter":6,"verses":[{"ref":"고전 6:19","book_en":"1Corinthians","ch":6,"v":19,"note":"우리 몸은 성령이 거하시는 전이므로 음란을 멀리하라는 말씀입니다.","text":"너희 몸은 너희가 하나님께로부터 받은바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희의 것이 아니라"}]},{"book_id":"b_1cor","chapter":7,"verses":[{"ref":"고전 7:23","book_en":"1Corinthians","ch":7,"v":23,"note":"우리는 값 주고 사신 그리스도의 것이니 사람을 기쁘게 하려 하지 말라는 뜻입니다.","text":"너희는 값으로 사신 것이니 사람들의 종이 되지 말라"}]},{"book_id":"b_1cor","chapter":8,"verses":[{"ref":"고전 8:1","book_en":"1Corinthians","ch":8,"v":1,"note":"지식은 교만하게 하지만 사랑은 남을 세운다는 관계의 지혜입니다.","text":"우상의 제물에 대하여는 우리가 다 지식이 있는 줄을 아나 지식은 교만하게 하며 사랑은 덕을 세우나니"}]},{"book_id":"b_1cor","chapter":9,"verses":[{"ref":"고전 9:22","book_en":"1Corinthians","ch":9,"v":22,"note":"여러 사람에게 여러 모양이 되어 복음으로 구원하려는 바울의 전도 자세입니다.","text":"약한 자들에게는 내가 약한 자와 같이 된 것은 약한 자들을 얻고자 함이요 여러 사람에게 내가 여러 모양이 된 것은 아무쪼록 몇몇 사람들을 구원코자 함이니"}]},{"book_id":"b_1cor","chapter":10,"verses":[{"ref":"고전 10:13","book_en":"1Corinthians","ch":10,"v":13,"note":"감당 못할 시험은 허락하지 않으시고 피할 길도 주신다는 위로의 약속입니다.","text":"사람이 감당할 시험 밖에는 너희에게 당한 것이 없나니 오직 하나님은 미쁘사 너희가 감당치 못할 시험 당함을 허락지 아니하시고 시험 당할 즈음에 또한 피할 길을 내사 너희로 능히 감당하게 하시느니라"}]},{"book_id":"b_1cor","chapter":11,"verses":[{"ref":"고전 11:24","book_en":"1Corinthians","ch":11,"v":24,"note":"성찬에서 이것은 너희를 위한 내 몸이라 하신 주님의 말씀입니다.","text":"축사하시고 떼어 가라사대 이것은 너희를 위하는 내 몸이니 이것을 행하여 나를 기념하라 하시고"}]},{"book_id":"b_1cor","chapter":12,"verses":[{"ref":"고전 12:27","book_en":"1Corinthians","ch":12,"v":27,"note":"교회는 그리스도의 몸이고 성도 각자는 지체라는 말씀입니다.","text":"너희는 그리스도의 몸이요 지체의 각 부분이라"}]},{"book_id":"b_1cor","chapter":13,"verses":[{"ref":"고전 13:4","book_en":"1Corinthians","ch":13,"v":4,"note":"사랑의 성품을 구체적으로 보여주는 사랑 장의 대표 구절입니다.","text":"사랑은 오래 참고 사랑은 온유하며 투기하는 자가 되지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며"},{"ref":"고전 13:13","book_en":"1Corinthians","ch":13,"v":13,"note":"믿음 소망 사랑은 항상 있고 그 중 제일은 사랑이라는 결론입니다.","text":"그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그 중에 제일은 사랑이라"}]},{"book_id":"b_1cor","chapter":14,"verses":[{"ref":"고전 14:40","book_en":"1Corinthians","ch":14,"v":40,"note":"교회 안의 모든 일을 품위 있고 질서 있게 하라는 말씀입니다.","text":"모든 것을 적당하게 하고 질서대로 하라"}]},{"book_id":"b_1cor","chapter":15,"verses":[{"ref":"고전 15:58","book_en":"1Corinthians","ch":15,"v":58,"note":"부활의 소망 위에 항상 주의 일에 힘쓰라는 격려입니다.","text":"그러므로 내 사랑 하는 형제들아 견고하며 흔들리지 말며 항상 주의 일에 더욱 힘쓰는 자들이 되라 이는 너희 수고가 주 안에서 헛되지 않은 줄을 앎이니라"}]},{"book_id":"b_1cor","chapter":16,"verses":[{"ref":"고전 16:14","book_en":"1Corinthians","ch":16,"v":14,"note":"너희 모든 일을 사랑으로 행하라는 편지의 마지막 당부입니다.","text":"너희 모든 일을 사랑으로 행하라"}]}]},{"id":"b_2cor","type":"book","name":"고린도후서","name_en":"2Corinthians","tagline":"약함 속에서 드러나는 하나님의 능력","summary":"고린도후서는 바울이 자신의 사도직을 변호하며 고난 중 위로와 화해를 전하는 편지입니다. '약한 데서 강함이 온전해진다'는 고백이 담겨 있습니다. 사역자의 고난과 하나님의 위로, 헌금의 원리를 가르칩니다. 개혁주의 관점에서 고난은 실패가 아니라 그리스도와 동행하는 길임을 보여 줍니다.","verses":[{"ref":"고후 4:7","book_en":"2Corinthians","ch":4,"v":7,"text":"우리가 이 보배를 질그릇에 가졌으니 이는 능력의 심히 큰 것이 하나님께 있고 우리에게 있지 아니함을 알게 하려 함이라"},{"ref":"고후 5:17","book_en":"2Corinthians","ch":5,"v":17,"text":"그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새것이 되었도다"},{"ref":"고후 12:9","book_en":"2Corinthians","ch":12,"v":9,"text":"내게 이르시기를 내 은혜가 네게 족하도다 이는 내 능력이 약한데서 온전하여짐이라 하신지라 이러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니 이는 그리스도의 능력으로 내게 머물게 하려함이라"}],"related":["f_paul","f_timothy","d_church"],"meta":{"category":"바울서신","author":"바울","date":"AD 56년경","chapters":13,"year_est":56,"emperor":"네로"},"sections":[{"range":"1-2장","text":"바울은 극심한 고난 속에서도 모든 위로의 하나님을 찬양합니다(1:3). 하나님이 주시는 위로로 다른 사람을 위로하는 것이 성도의 사명입니다.","title":"환난 중의 위로"},{"range":"3-5장","text":"질그릇 같은 우리 안에 보배(복음)를 담으신 것은 능력의 심히 큰 것이 하나님께 있고 우리에게 있지 않음을 알게 하려 함입니다(4:7).","title":"새 언약의 영광"},{"range":"6-7장","text":"믿지 않는 자와 멍에를 같이 하지 말고(6:14), 하나님 뜻대로 하는 근심은 회개를 이룹니다(7:10).","title":"거룩과 화해"},{"range":"8-9장","text":"가난한 마게도냐 교회가 풍성히 연보한 것을 본보기로 듭니다. 하나님은 즐겨 내는 자를 사랑하시느니라(9:7).","title":"연보의 은혜"},{"range":"10-13장","text":"거짓 사도들의 공격 앞에서 바울은 자신의 약함을 자랑합니다. 내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라(12:9).","title":"약함으로 자랑하는 사도"}],"chapter_verses":[{"book_id":"b_2cor","chapter":1,"verses":[{"ref":"고후 1:4","book_en":"2Corinthians","ch":1,"v":4,"note":"하나님이 우리를 위로하시는 것은 우리도 남을 위로하게 하려 하심이라는 뜻입니다.","text":"우리의 모든 환난 중에서 우리를 위로하사 우리로 하여금 하나님께 받는 위로로써 모든 환난 중에 있는 자들을 능히 위로하게 하시는 이시로다"}]},{"book_id":"b_2cor","chapter":2,"verses":[{"ref":"고후 2:14","book_en":"2Corinthians","ch":2,"v":14,"note":"그리스도 안에서 항상 우리를 이기게 하시는 하나님께 감사하는 고백입니다.","text":"항상 우리를 그리스도 안에서 이기게 하시고 우리로 말미암아 각처에서 그리스도를 아는 냄새를 나타내시는 하나님께 감사하노라"}]},{"book_id":"b_2cor","chapter":3,"verses":[{"ref":"고후 3:17","book_en":"2Corinthians","ch":3,"v":17,"note":"주의 영이 계신 곳에는 참된 자유가 있다는 말씀입니다.","text":"주는 영이시니 주의 영이 계신 곳에는 자유함이 있느니라"}]},{"book_id":"b_2cor","chapter":4,"verses":[{"ref":"고후 4:7","book_en":"2Corinthians","ch":4,"v":7,"note":"보배 같은 복음을 질그릇 같은 우리에게 맡기신 것은 능력이 하나님께 있음을 보이려 함입니다.","text":"우리가 이 보배를 질그릇에 가졌으니 이는 능력의 심히 큰 것이 하나님께 있고 우리에게 있지 아니함을 알게 하려 함이라"}]},{"book_id":"b_2cor","chapter":5,"verses":[{"ref":"고후 5:17","book_en":"2Corinthians","ch":5,"v":17,"note":"그리스도 안에 있으면 새로운 피조물이라는 중생의 선언입니다.","text":"그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새것이 되었도다"},{"ref":"고후 5:21","book_en":"2Corinthians","ch":5,"v":21,"note":"죄 없으신 그리스도께서 우리 죄를 대신 지심으로 우리가 의롭게 되었다는 복음의 핵심입니다.","text":"하나님이 죄를 알지도 못하신 자로 우리를 대신하여 죄를 삼으신 것은 우리로 하여금 저의 안에서 하나님의 의가 되게 하려 하심이니라"}]},{"book_id":"b_2cor","chapter":6,"verses":[{"ref":"고후 6:2","book_en":"2Corinthians","ch":6,"v":2,"note":"지금이 은혜 받을 만한 때라며 오늘 복음을 받아들이라고 재촉하는 말씀입니다.","text":"가라사대 내가 은혜 베풀 때에 너를 듣고 구원의 날에 너를 도왔다 하셨으니 보라 지금은 은혜 받을만한 때요 보라 지금은 구원의 날이로다"}]},{"book_id":"b_2cor","chapter":7,"verses":[{"ref":"고후 7:10","book_en":"2Corinthians","ch":7,"v":10,"note":"하나님의 뜻대로 하는 근심은 구원에 이르는 회개를 이룬다는 말씀입니다.","text":"하나님의 뜻대로 하는 근심은 후회할 것이 없는 구원에 이르게 하는 회개를 이루는 것이요 세상 근심은 사망을 이루는 것이니라"}]},{"book_id":"b_2cor","chapter":8,"verses":[{"ref":"고후 8:9","book_en":"2Corinthians","ch":8,"v":9,"note":"부요하신 그리스도께서 가난하게 되심으로 우리가 부요하게 되었다는 은혜입니다.","text":"우리 주 예수 그리스도의 은혜를 너희가 알거니와 부요하신 자로서 너희를 위하여 가난하게 되심은 그의 가난함을 인하여 너희로 부요케 하려 하심이니라"}]},{"book_id":"b_2cor","chapter":9,"verses":[{"ref":"고후 9:7","book_en":"2Corinthians","ch":9,"v":7,"note":"하나님은 즐겨 내는 자를 사랑하신다는 헌금의 마음가짐에 대한 말씀입니다.","text":"각각 그 마음에 정한 대로 할 것이요 인색함으로나 억지로 하지 말찌니 하나님은 즐겨 내는 자를 사랑하시느니라"}]},{"book_id":"b_2cor","chapter":10,"verses":[{"ref":"고후 10:5","book_en":"2Corinthians","ch":10,"v":5,"note":"하나님을 아는 것을 가로막는 모든 생각을 사로잡아 그리스도께 복종시키는 영적 싸움의 말씀입니다.","text":"모든 이론을 파하며 하나님 아는 것을 대적하여 높아진 것을 다 파하고 모든 생각을 사로잡아 그리스도에게 복종케 하니"}]},{"book_id":"b_2cor","chapter":11,"verses":[{"ref":"고후 11:30","book_en":"2Corinthians","ch":11,"v":30,"note":"바울이 자랑한다면 자신의 약한 것을 자랑하겠다는 고백입니다.","text":"내가 부득불 자랑할찐대 나의 약한 것을 자랑하리라"}]},{"book_id":"b_2cor","chapter":12,"verses":[{"ref":"고후 12:9","book_en":"2Corinthians","ch":12,"v":9,"note":"내 은혜가 네게 족하다는 약함 가운데 역사하는 하나님의 능력을 보여주는 말씀입니다.","text":"내게 이르시기를 내 은혜가 네게 족하도다 이는 내 능력이 약한데서 온전하여짐이라 하신지라 이러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니 이는 그리스도의 능력으로 내게 머물게 하려함이라"}]},{"book_id":"b_2cor","chapter":13,"verses":[{"ref":"고후 13:13","book_en":"2Corinthians","ch":13,"v":13,"note":"성부와 성자와 성령의 이름으로 축복하는 축도의 대표 구절입니다.","text":"주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통하심이 너희 무리와 함께 있을찌어다"}]}]},{"id":"b_gal","type":"book","name":"갈라디아서","name_en":"Galatians","tagline":"오직 믿음! 율법이 아닙니다","summary":"갈라디아서는 '할례를 받아야 구원받는다'는 거짓 가르침에 맞서 쓴 편지입니다. 구원은 율법을 지킨 행위가 아니라 오직 예수님을 믿는 믿음으로 받는다고 단호하게 선포합니다. 종교개혁자들이 가장 사랑한 책 중 하나입니다. 개혁주의의 '오직 믿음' 교리의 핵심 근거가 되는 책입니다.","verses":[{"ref":"갈 2:16","book_en":"Galatians","ch":2,"v":16,"text":"사람이 의롭게 되는 것은 율법의 행위에서 난 것이 아니요 오직 예수 그리스도를 믿음으로 말미암는줄 아는고로 우리도 그리스도 예수를 믿나니 이는 우리가 율법의 행위에서 아니고 그리스도를 믿음으로서 의롭다 함을 얻으려 함이라 율법의 행위로서는 의롭다 함을 얻을 육체가 없느니라"},{"ref":"갈 3:11","book_en":"Galatians","ch":3,"v":11,"text":"또 하나님 앞에서 아무나 율법으로 말미암아 의롭게 되지 못할 것이 분명하니 이는 의인이 믿음으로 살리라 하였음이니라"},{"ref":"갈 5:1","book_en":"Galatians","ch":5,"v":1,"text":"그리스도께서 우리로 자유케 하려고 자유를 주셨으니 그러므로 굳세게 서서 다시는 종의 멍에를 메지 말라"}],"related":["f_paul","f_peter","e_jerusalem_council","d_salvation"],"meta":{"category":"바울서신","author":"바울","date":"AD 48~49년경","chapters":6,"year_est":48,"emperor":"글라우디오"},"sections":[{"range":"1-2장","text":"할례를 강요하는 거짓 교사들에게 다른 복음은 없나니라고 단호히 선언합니다(1:7). 복음에 무엇을 더하는 것은 복음을 버리는 것입니다.","title":"다른 복음은 없습니다"},{"range":"3-4장","text":"아브라함도 믿음으로 의롭다 하심을 받았습니다. 율법은 우리를 그리스도께로 인도하는 몽학선생이었습니다(3:24).","title":"율법이 아닌 믿음으로"},{"range":"5장","text":"그리스도께서 우리를 자유롭게 하셨으니 다시는 종의 멍에를 메지 마십시오(5:1). 성령을 따라 행하면 육체의 욕심을 이루지 않습니다(5:16).","title":"성령으로 행하라"},{"range":"6장","text":"서로의 짐을 지고(6:2), 선을 행하되 낙심하지 마십시오. 때가 이르면 거두게 될 것입니다(6:9). 자랑할 것은 오직 십자가뿐입니다.","title":"선을 행하되 낙심하지 말라"}],"chapter_verses":[{"book_id":"b_gal","chapter":1,"verses":[{"ref":"갈 1:10","book_en":"Galatians","ch":1,"v":10,"note":"사람을 기쁘게 하려 하면 그리스도의 종이 아니라는 복음 일꾼의 자세입니다.","text":"이제 내가 사람들에게 좋게 하랴 하나님께 좋게 하랴 사람들에게 기쁨을 구하랴 내가 지금까지 사람의 기쁨을 구하는 것이었더면 그리스도의 종이 아니니라"}]},{"book_id":"b_gal","chapter":2,"verses":[{"ref":"갈 2:20","book_en":"Galatians","ch":2,"v":20,"note":"이제는 내가 산 것이 아니요 내 안에 그리스도께서 사신 것이라는 신앙고백의 대표 구절입니다.","text":"내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 산 것이 아니요 오직 내 안에 그리스도께서 사신 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 몸을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라"}]},{"book_id":"b_gal","chapter":3,"verses":[{"ref":"갈 3:28","book_en":"Galatians","ch":3,"v":28,"note":"그리스도 안에서는 차별 없이 모두가 하나라는 복음의 평등 선언입니다.","text":"너희는 유대인이나 헬라인이나 종이나 자주자나 남자나 여자 없이 다 그리스도 예수 안에서 하나이니라"}]},{"book_id":"b_gal","chapter":4,"verses":[{"ref":"갈 4:6","book_en":"Galatians","ch":4,"v":6,"note":"성령께서 우리 마음에서 아바 아버지라 부르게 하신다는 양자 됨의 확신입니다.","text":"너희가 아들인고로 하나님이 그 아들의 영을 우리 마음 가운데 보내사 아바 아버지라 부르게 하셨느니라"}]},{"book_id":"b_gal","chapter":5,"verses":[{"ref":"갈 5:1","book_en":"Galatians","ch":5,"v":1,"note":"그리스도께서 주신 자유를 지키고 다시 종의 멍에를 메지 말라는 말씀입니다.","text":"그리스도께서 우리로 자유케 하려고 자유를 주셨으니 그러므로 굳세게 서서 다시는 종의 멍에를 메지 말라"},{"ref":"갈 5:22","book_en":"Galatians","ch":5,"v":22,"note":"성령의 열매 아홉 가지를 열거한 유명한 구절입니다.","text":"오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과"}]},{"book_id":"b_gal","chapter":6,"verses":[{"ref":"갈 6:7","book_en":"Galatians","ch":6,"v":7,"note":"심은 대로 거둔다는 하나님의 공의에 대한 경고입니다.","text":"스스로 속이지 말라 하나님은 만홀히 여김을 받지 아니하시나니 사람이 무엇으로 심든지 그대로 거두리라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"팀 켈러","source":"『Galatians For You』 1~2장 (갈 1:1-24 부분, The Good Book Company)","text":"바울은 자신이 전한 복음이 사람에게서 배우거나 받은 것이 아니라 예수 그리스도의 직접 계시임을 밝힌다. 켈러는 복음이 하나뿐이라는 점을 강조한다. 사람의 비위를 맞추는 가르침이나 행위를 더하는 가르침은 복음이 될 수 없다. 복음의 유일성을 지키는 것이 교회를 지키는 일이다."}]},{"chapter":2,"summaries":[{"author":"팀 켈러","source":"『Galatians For You』 3~4장 (갈 2:1-21 부분, The Good Book Company)","text":"예루살렘에서 사도들과 만난 바울은 이방인에게 전한 복음이 인정받았음을 말한다. 베드로가 이방인과 함께 먹기를 피했을 때 바울은 그를 공개적으로 책망했다. 켈러는 복음에 합당하게 행한다는 것이 곧 믿음으로 의롭다 함을 받는 진리를 삶으로 드러내는 것임을 설명한다. 복음은 유대인과 이방인을 하나로 묶는 유일한 힘이다."}]},{"chapter":3,"summaries":[{"author":"팀 켈러","source":"『Galatians For You』 5~7장 (갈 3:1-4:7 부분, The Good Book Company)","text":"갈라디아 성도들이 성령으로 시작했다가 육체로 마치려 함을 바울이 책망한다. 율법의 행위로는 의롭다 함을 받을 수 없으며 아브라함도 믿음으로 의롭다 함을 받았다. 켈러는 복음이 출발점이 아니라 평생의 전부임을 강조한다. 율법은 죄를 드러내고 그리스도께로 인도하는 몽학선생의 역할을 했다."}]},{"chapter":4,"summaries":[{"author":"팀 켈러","source":"『Galatians For You』 7~9장 (갈 3:26-4:31 부분, The Good Book Company)","text":"율법 아래 있던 자들을 그리스도께서 속량하셔서 하나님의 자녀 삼으셨다. 이제 우리는 종이 아니라 아들이요, 아들이면 후사이다. 켈러는 구원이 종의 신분에서 자녀의 신분으로 바뀌는 것임을 설명한다. 하갈과 사라의 비유를 통해 율법의 행위와 약속의 은혜라는 두 언약을 대조한다."}]},{"chapter":5,"summaries":[{"author":"팀 켈러","source":"『Galatians For You』 10~11장 (갈 5:1-25 부분, The Good Book Company)","text":"그리스도께서 자유롭게 하셨으니 다시는 종의 멍에를 메지 말라. 할례와 같은 율법의 행위를 더하면 그리스도께 아무 유익이 없다. 켈러는 복음의 자유가 방종이 아니라 사랑으로 섬기는 자유임을 말한다. 육체의 일을 버리고 성령을 따라 행할 때 성령의 열매가 맺힌다."}]},{"chapter":6,"summaries":[{"author":"팀 켈러","source":"『Galatians For You』 12장 및 결론 (갈 5:26-6:18 부분, The Good Book Company)","text":"허물을 범한 자를 온유한 마음으로 바로잡고 서로 짐을 지라고 권면한다. 선을 행하되 낙심하지 말며, 심는 대로 거두리라는 원리를 말한다. 켈러는 복음 공동체가 서로의 짐을 지는 사랑의 관계로 세워짐을 강조한다. 바울은 십자가 외에는 자랑하지 않겠다고 고백하며 편지를 마친다."}]}],"exposition_note":"팀 켈러: 『Galatians For You』 (갈 전체, The Good Book Company)"},{"id":"b_eph","type":"book","name":"에베소서","name_en":"Ephesians","tagline":"그리스도 안에서 하나 된 교회","summary":"에베소서는 감옥에 갇힌 바울이 쓴 편지로, 하나님의 구원 계획과 교회의 영광을 노래합니다. 유대인과 이방인이 그리스도 안에서 하나가 되었다는 것이 핵심입니다. '은혜로 구원받았다'는 유명한 고백이 이 책에 있습니다. 개혁주의 관점에서 교회는 그리스도의 몸으로서 하나님의 영광을 드러내는 공동체입니다.","verses":[{"ref":"엡 2:8","book_en":"Ephesians","ch":2,"v":8,"text":"너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라"},{"ref":"엡 2:10","book_en":"Ephesians","ch":2,"v":10,"text":"우리는 그의 만드신바라 그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니 이 일은 하나님이 전에 예비하사 우리로 그 가운데서 행하게 하려 하심이니라"},{"ref":"엡 4:4","book_en":"Ephesians","ch":4,"v":4,"text":"몸이 하나이요 성령이 하나이니 이와 같이 너희가 부르심의 한 소망 안에서 부르심을 입었느니라"}],"related":["f_paul","f_timothy","d_church","d_holyspirit","d_salvation"],"meta":{"category":"바울서신","author":"바울","date":"AD 60~62년경 옥중서신","chapters":6,"year_est":61,"emperor":"네로"},"sections":[{"range":"1장","text":"하나님은 창세 전에 그리스도 안에서 우리를 택하시고 예정하셨습니다(1:4-5). 구원은 우리의 선택이 아니라 하나님의 주권적 은혜에서 시작됩니다.","title":"창세 전부터 계획된 구원"},{"range":"2-3장","text":"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이는 너희에게서 난 것이 아니요 하나님의 선물이라(2:8). 유대인과 이방인이 한 새 사람이 되었습니다.","title":"은혜로 구원받은 한 몸"},{"range":"4-5장","text":"옛 사람을 벗고 새 사람을 입으십시오(4:22-24). 빛의 자녀답게 행하고, 서로 용서하며 그리스도의 사랑을 본받으십시오.","title":"새 사람답게 살라"},{"range":"6장","text":"우리의 싸움은 혈과 육이 아니라 악한 영들과의 싸움이므로 하나님의 전신갑주를 입으십시오(6:11-12). 승리는 이미 그리스도께 있습니다.","title":"영적 전쟁에서 승리하라"}],"chapter_verses":[{"book_id":"b_eph","chapter":1,"verses":[{"book_en":"Ephesians","ch":1,"note":"구원의 모든 복이 이미 그리스도 안에서 주어졌다는, 에베소서 전체의 주제를 여는 찬송입니다.","ref":"엡 1:3","v":3,"text":"찬송하리로다 하나님 곧 우리 주 예수 그리스도의 아버지께서 그리스도 안에서 하늘에 속한 모든 신령한 복으로 우리에게 복 주시되"},{"book_en":"Ephesians","ch":1,"note":"하나님이 세상을 만들기 전부터 우리를 택하시고 자녀로 예정하셨다는, 오직 은혜의 구원을 보여주는 구절입니다.","ref":"엡 1:4-5","v":4,"text":"곧 창세 전에 그리스도 안에서 우리를 택하사 우리로 사랑 안에서 그 앞에 거룩하고 흠이 없게 하시려고"}]},{"book_id":"b_eph","chapter":2,"verses":[{"book_en":"Ephesians","ch":2,"note":"구원은 행위가 아니라 하나님의 은혜로 믿음으로 받는 선물이라는 종교개혁의 핵심 구절입니다.","ref":"엡 2:8","v":8,"text":"너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라"},{"book_en":"Ephesians","ch":2,"note":"구원받은 성도는 하나님이 미리 준비하신 선한 일을 하며 살도록 지음받았다는 말씀입니다.","ref":"엡 2:10","v":10,"text":"우리는 그의 만드신바라 그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니 이 일은 하나님이 전에 예비하사 우리로 그 가운데서 행하게 하려 하심이니라"}]},{"book_id":"b_eph","chapter":3,"verses":[{"book_en":"Ephesians","ch":3,"note":"그리스도의 사랑이 얼마나 크고 깊은지 알기를 바라는 바울의 기도로, 사랑받는 구절입니다.","ref":"엡 3:17-19","v":17,"text":"믿음으로 말미암아 그리스도께서 너희 마음에 계시게 하옵시고 너희가 사랑 가운데서 뿌리가 박히고 터가 굳어져서"},{"book_en":"Ephesians","ch":3,"note":"우리가 구하거나 생각하는 것보다 더 넘치게 행하시는 하나님께 영광을 돌리는 찬송입니다.","ref":"엡 3:20-21","v":20,"text":"우리 가운데서 역사하시는 능력대로 우리의 온갖 구하는 것이나 생각하는 것에 더 넘치도록 능히 하실 이에게"}]},{"book_id":"b_eph","chapter":4,"verses":[{"book_en":"Ephesians","ch":4,"note":"복음에 합당한 삶, 곧 겸손과 온유로 교회의 하나됨을 지키라는 권면입니다.","ref":"엡 4:1-3","v":1,"text":"그러므로 주 안에서 갇힌 내가 너희를 권하노니 너희가 부르심을 입은 부름에 합당하게 행하여"},{"book_en":"Ephesians","ch":4,"note":"하나님이 그리스도 안에서 우리를 용서하신 것처럼 서로 용서하라는 실천 말씀입니다.","ref":"엡 4:32","v":32,"text":"서로 인자하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라"}]},{"book_id":"b_eph","chapter":5,"verses":[{"book_en":"Ephesians","ch":5,"note":"술이 아니라 성령으로 충만해지라는 명령으로, 성령 충만한 삶의 핵심 구절입니다.","ref":"엡 5:18","v":18,"text":"술 취하지 말라 이는 방탕한 것이니 오직 성령의 충만을 받으라"},{"book_en":"Ephesians","ch":5,"note":"부부의 사랑을 그리스도와 교회의 사랑에 비유한, 결혼의 성경적 모범 구절입니다.","ref":"엡 5:25","v":25,"text":"남편들아 아내 사랑하기를 그리스도께서 교회를 사랑하시고 위하여 자신을 주심 같이 하라"}]},{"book_id":"b_eph","chapter":6,"verses":[{"book_en":"Ephesians","ch":6,"note":"영적 싸움에서 마귀를 대적하는 하나님의 전신갑주 비유의 시작 구절입니다.","ref":"엡 6:10-11","v":10,"text":"종말로 너희가 주 안에서와 그 힘의 능력으로 강건하여지고"},{"book_en":"Ephesians","ch":6,"note":"전신갑주의 마지막 무기인 기도, 깨어 항상 기도하라는 말씀입니다.","ref":"엡 6:18","v":18,"text":"모든 기도와 간구로 하되 무시로 성령 안에서 기도하고 이를 위하여 깨어 구하기를 항상 힘쓰며 여러 성도를 위하여 구하고"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『Ephesians』 1권 (엡 1장, Banner of Truth)","text":"로이드존스는 에베소서 1장을 하나님의 영원한 목적의 선언으로 풀었다. 창세 전에 그리스도 안에서 택하심과 예정, 양자로 삼으심이 모두 하나님의 기쁘신 뜻에서 나왔음을 강조했다. 구원은 인간의 선택이 아니라 하나님의 주권적 은혜의 역사이며, 그 최종 목적은 하나님의 영광의 찬송에 있다고 설명했다."}]},{"chapter":2,"summaries":[{"author":"마틴 로이드존스","source":"『Ephesians』 2권 (엡 2장, Banner of Truth)","text":"허물과 죄로 죽었던 상태에서 하나님이 살리신 은혜를 강해의 중심에 두었다. 은혜로 구원을 받았다는 선언을 따라, 유대인과 이방인이 그리스도 안에서 하나로 화목하게 된 일과 그리스도가 우리의 화평이 되심을 설명했다. 교회는 하나님이 친히 세워 가시는 성전이라고 강조했다."}]},{"chapter":3,"summaries":[{"author":"마틴 로이드존스","source":"『Ephesians』 3권 『The Unsearchable Riches of Christ』 (엡 3장, Banner of Truth)","text":"이방인에게까지 열린 복음의 비밀을 측량할 수 없는 그리스도의 풍성으로 설명했다. 바울이 맡은 사도적 사명과 함께, 성도들이 성령으로 속사람이 강건해지고 그리스도의 사랑의 넓이와 깊이를 아는 지식을 구하는 기도를 강조했다. 구하는 것보다 넘치게 하시는 하나님께 영광을 돌리는 송영으로 장을 마무리했다."}]},{"chapter":4,"summaries":[{"author":"마틴 로이드존스","source":"『Ephesians』 4~5권 『Christian Unity』·『Darkness and Light』 (엡 4장, Banner of Truth)","text":"전반부에서는 성령이 주시는 하나 됨을 힘써 지키라는 권면을 풀었다. 한 몸과 한 성령과 한 소망이라는 교리가 성도의 실제 연합의 근거임을 강조했다. 후반부에서는 옛 사람을 벗어 버리고 새 사람을 입으라는 명령을 따라, 중생한 성도의 삶에 나타나는 구체적인 변화를 설명했다."}]},{"chapter":5,"summaries":[{"author":"마틴 로이드존스","source":"『Ephesians』 5~6권 『Darkness and Light』·『Life in the Spirit』 (엡 5장, Banner of Truth)","text":"전반부에서는 빛의 자녀답게 행하라는 권면을 중심으로 어둠의 일과 빛의 열매를 대조했다. 후반부에서는 성령의 충만을 명령으로 선포하고, 충만한 삶의 열매로 부부 관계를 설명했다. 남편의 사랑을 그리스도께서 교회를 사랑하신 일에 비유한 점을 깊이 강조했다."}]},{"chapter":6,"summaries":[{"author":"마틴 로이드존스","source":"『Ephesians』 6~8권 『Life in the Spirit』·『The Christian Warfare』·『The Christian Soldier』 (엡 6장, Banner of Truth)","text":"전반부에서는 자녀와 부모, 종과 상전의 관계에서 그리스도인의 순종이 주 안에서 이루어져야 함을 설명했다. 후반부에서는 하나님의 전신갑주를 입으라는 명령을 따라 그리스도인의 삶이 영적 전쟁임을 강조했다. 마귀의 궤계에 맞서는 길은 인간의 결심이 아니라 하나님이 주신 전신갑주뿐이라고 설명했다."}]}],"exposition_note":"로이드존스: 『Ephesians』 전 8권 (엡 1-6장, Banner of Truth)"},{"id":"b_php","type":"book","name":"빌립보서","name_en":"Philippians","tagline":"감옥에서도 기뻐하라","summary":"빌립보서는 감옥에 있는 바울이 오히려 기쁨으로 가득 차서 쓴 편지입니다. '주 안에서 항상 기뻐하라'는 권면이 반복됩니다. 예수님의 낮아지심과 높여지심을 노래하는 찬송(2장)이 담겨 있습니다. 개혁주의 관점에서 기쁨은 환경이 아니라 그리스도 안에 있는 확신에서 옵니다.","verses":[{"ref":"빌 1:21","book_en":"Philippians","ch":1,"v":21,"text":"이는 내게 사는 것이 그리스도니 죽는 것도 유익함이니라"},{"ref":"빌 4:4","book_en":"Philippians","ch":4,"v":4,"text":"주 안에서 항상 기뻐하라 내가 다시 말하노니 기뻐하라"},{"ref":"빌 4:13","book_en":"Philippians","ch":4,"v":13,"text":"내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라"}],"related":["f_paul","f_timothy","e_paul_rome","d_christ"],"meta":{"category":"바울서신","author":"바울","date":"AD 60~62년경 옥중서신","chapters":4,"year_est":61,"emperor":"네로"},"sections":[{"range":"1장","text":"감옥에 갇힌 바울이 오히려 기뻐하며 나에게 사는 것이 그리스도니 죽는 것도 유익함이라고 고백합니다(1:21). 환경이 아니라 그리스도가 기쁨의 이유입니다.","title":"옥중에서도 기쁨"},{"range":"2장","text":"예수님은 하나님과 동등됨을 취할 것으로 여기지 않고 자기를 비워 종의 형체를 가지셨습니다(2:6-7). 낮아지심이 높아지심의 길입니다.","title":"그리스도의 겸손을 본받으라"},{"range":"3장","text":"바울은 뒤에 있는 것은 잊어버리고 푯대를 향해 달려갑니다(3:13-14). 과거의 성공도 실패도 붙들지 말고 그리스도를 향해 나아가십시오.","title":"푯대를 향한 질주"},{"range":"4장","text":"주 안에서 항상 기뻐하라(4:4). 아무 것도 염려하지 말고 기도로 아뢰면 하나님의 평강이 마음을 지키십니다(4:6-7).","title":"주 안에서의 기쁨과 평강"}],"chapter_verses":[{"book_id":"b_php","chapter":1,"verses":[{"book_en":"Philippians","ch":1,"note":"구원을 시작하신 하나님이 친히 완성하신다는 성도의 견인을 보여주는 위로의 구절입니다.","ref":"빌 1:6","v":6,"text":"너희 속에 착한 일을 시작하신 이가 그리스도 예수의 날까지 이루실 줄을 우리가 확신하노라"},{"book_en":"Philippians","ch":1,"note":"바울의 인생관을 한 문장으로 보여주는, 그리스도 중심 삶의 대표 고백입니다.","ref":"빌 1:21","v":21,"text":"이는 내게 사는 것이 그리스도니 죽는 것도 유익함이니라"}]},{"book_id":"b_php","chapter":2,"verses":[{"book_en":"Philippians","ch":2,"note":"그리스도의 낮아지심과 높아지심을 노래한 찬송으로, 겸손의 본을 보이는 핵심 본문입니다.","ref":"빌 2:5-11","v":5,"text":"너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니"},{"book_en":"Philippians","ch":2,"note":"불평 없이 살아 세상에서 빛으로 비치라는 일상 속 성도의 자세입니다.","ref":"빌 2:14-15","v":14,"text":"모든 일을 원망과 시비가 없이 하라"}]},{"book_id":"b_php","chapter":3,"verses":[{"book_en":"Philippians","ch":3,"note":"그리스도를 아는 것에 비하면 세상의 모든 것은 해와 같다는 바울의 고백입니다.","ref":"빌 3:8","v":8,"text":"또한 모든 것을 해로 여김은 내 주 그리스도 예수를 아는 지식이 가장 고상함을 인함이라 내가 그를 위하여 모든 것을 잃어버리고 배설물로 여김은 그리스도를 얻고"},{"book_en":"Philippians","ch":3,"note":"뒤를 돌아보지 않고 앞을 향해 달려가는 신앙의 경주를 보여주는 구절입니다.","ref":"빌 3:13-14","v":13,"text":"형제들아 나는 아직 내가 잡은 줄로 여기지 아니하고 오직 한 일 즉 뒤에 있는 것은 잊어버리고 앞에 있는 것을 잡으려고"}]},{"book_id":"b_php","chapter":4,"verses":[{"book_en":"Philippians","ch":4,"note":"옥중에서 쓴 편지임에도 반복되는 기쁨의 명령으로, 빌립보서의 주제를 담고 있습니다.","ref":"빌 4:4","v":4,"text":"주 안에서 항상 기뻐하라 내가 다시 말하노니 기뻐하라"},{"book_en":"Philippians","ch":4,"note":"염려 대신 기도로, 기도의 응답으로 오는 하나님의 평강을 약속하는 위로의 말씀입니다.","ref":"빌 4:6-7","v":6,"text":"아무 것도 염려하지 말고 오직 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라"},{"book_en":"Philippians","ch":4,"note":"자족의 비결을 말하며, 그리스도 안에서 주어지는 힘으로 살 수 있다는 고백입니다.","ref":"빌 4:13","v":13,"text":"내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『The Life of Joy and Peace』 1권 『The Life of Joy』 (빌 1장, Baker Books)","text":"옥중에서도 기쁨을 잃지 않는 바울의 비결을 풀었다. 복음을 위한 빌립보 성도들의 동역과, 살든지 죽든지 그리스도가 존귀해지기를 바라는 바울의 고백을 강조했다. 성도 안에 착한 일을 시작하신 하나님이 친히 그 일을 완성하실 것이라는 확신이 기쁨의 근거라고 설명했다."}]},{"chapter":2,"summaries":[{"author":"마틴 로이드존스","source":"『The Life of Joy and Peace』 1권 『The Life of Joy』 (빌 2장, Baker Books)","text":"그리스도의 마음을 품으라는 권면을 강해의 중심에 두었다. 자기를 비우시고 종의 형체를 입으시며 죽기까지 복종하신 그리스도의 낮아지심을 설명했다. 두렵고 떨림으로 구원을 이루라는 말씀을, 하나님이 우리 안에서 소원을 두고 행하게 하시는 역사와 연결했다."}]},{"chapter":3,"summaries":[{"author":"마틴 로이드존스","source":"『The Life of Joy and Peace』 2권 『The Life of Peace』 (빌 3장, Baker Books)","text":"바울이 자랑하던 모든 것을 배설물로 여긴 고백을 따라, 율법의 의가 아닌 그리스도를 믿는 믿음에서 오는 의를 강조했다. 푯대를 향해 달려가는 바울의 자세와 하늘에 있는 시민권, 썩을 몸이 영광스러운 몸으로 변화될 부활의 소망을 설명했다."}]},{"chapter":4,"summaries":[{"author":"마틴 로이드존스","source":"『The Life of Joy and Peace』 2권 『The Life of Peace』 (빌 4장, Baker Books)","text":"주 안에서 항상 기뻐하라는 명령을 따라 염려 대신 기도와 간구로 나아갈 때 지키시는 하나님의 평강을 설명했다. 어떤 처지에서도 자족하는 비결과, 내게 능력 주시는 자 안에서 모든 것을 할 수 있다는 고백을 풀었다. 성도의 모든 필요를 채우시는 하나님의 공급으로 강해를 마무리했다."}]}],"exposition_note":"로이드존스: 『The Life of Joy and Peace』 전 2권 (빌 1-4장, Baker Books)"},{"id":"b_col","type":"book","name":"골로새서","name_en":"Colossians","tagline":"그리스도면 충분합니다","summary":"골로새서는 예수님 외에 다른 철학이나 율법을 더해야 한다는 가르침에 맞서 쓴 편지입니다. '그리스도 안에 모든 충만이 있다'고 선포합니다. 예수님의 신성과 창조주 되심을 분명히 합니다. 개혁주의 관점에서 구원에 무언가를 더하려는 모든 시도를 배격하고 오직 그리스도를 붙듭니다.","verses":[{"ref":"골 1:16","book_en":"Colossians","ch":1,"v":16,"text":"만물이 그에게 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 보좌들이나 주관들이나 정사들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고"},{"ref":"골 2:9","book_en":"Colossians","ch":2,"v":9,"text":"그 안에는 신성의 모든 충만이 육체로 거하시고"},{"ref":"골 3:1","book_en":"Colossians","ch":3,"v":1,"text":"그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위엣 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라"}],"related":["f_paul","f_timothy","d_christ","d_salvation"],"meta":{"category":"바울서신","author":"바울","date":"AD 60~62년경 옥중서신","chapters":4,"year_est":61,"emperor":"네로"},"sections":[{"range":"1장","text":"그리스도는 보이지 않는 하나님의 형상이시며 만물을 창조하시고 교회의 머리가 되십니다(1:15-18). 그분으로 충분합니다.","title":"만물의 으뜸이신 그리스도"},{"range":"2장","text":"철학과 헛된 속임수, 사람의 전통에 속지 마십시오(2:8). 그리스도 안에는 신성의 모든 충만이 몸으로 거하십니다(2:9).","title":"거짓 가르침을 경계하라"},{"range":"3-4장","text":"그리스도와 함께 다시 살리심을 받았으니 위엣 것을 찾으십시오(3:1). 옛 사람을 벗고 새 사람을 입으며, 기도에 힘쓰고 지혜롭게 행하십시오.","title":"위엣 것을 찾으라"}],"chapter_verses":[{"book_id":"b_col","chapter":1,"verses":[{"book_en":"Colossians","ch":1,"note":"그리스도가 만물의 창조주이심을 선언하는, 그리스도의 신성을 보여주는 구절입니다.","ref":"골 1:16","v":16,"text":"만물이 그에게 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 보좌들이나 주관들이나 정사들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고"},{"book_en":"Colossians","ch":1,"note":"성도 안에 내주하시는 그리스도가 영광의 소망이라는 복음의 비밀입니다.","ref":"골 1:27","v":27,"text":"하나님이 그들로 하여금 이 비밀의 영광이 이방인 가운데 어떻게 풍성한 것을 알게 하려하심이라 이 비밀은 너희 안에 계신 그리스도시니 곧 영광의 소망이니라"}]},{"book_id":"b_col","chapter":2,"verses":[{"book_en":"Colossians","ch":2,"note":"그리스도를 영접한 대로 그 안에서 뿌리박고 행하라는 성장의 원리입니다.","ref":"골 2:6-7","v":6,"text":"그러므로 너희가 그리스도 예수를 주로 받았으니 그 안에서 행하되"},{"book_en":"Colossians","ch":2,"note":"그리스도 안에 하나님의 모든 충만이 있고, 성도도 그 안에서 충만하다는 선언입니다.","ref":"골 2:9-10","v":9,"text":"그 안에는 신성의 모든 충만이 육체로 거하시고"}]},{"book_id":"b_col","chapter":3,"verses":[{"book_en":"Colossians","ch":3,"note":"부활하신 그리스도와 함께 산 자는 하늘의 것을 추구하라는 새 삶의 방향입니다.","ref":"골 3:1-2","v":1,"text":"그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위엣 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라"},{"book_en":"Colossians","ch":3,"note":"말씀이 풍성한 공동체와, 모든 일을 주의 이름으로 하라는 생활 지침입니다.","ref":"골 3:16-17","v":16,"text":"그리스도의 말씀이 너희 속에 풍성히 거하여 모든 지혜로 피차 가르치며 권면하고 시와 찬미와 신령한 노래를 부르며 마음에 감사함으로 하나님을 찬양하고"},{"book_en":"Colossians","ch":3,"note":"직장에서의 일까지도 주님께 하듯 하라는, 일터 신앙의 대표 구절입니다.","ref":"골 3:23","v":23,"text":"무슨 일을 하든지 마음을 다하여 주께 하듯하고 사람에게 하듯하지 말라"}]},{"book_id":"b_col","chapter":4,"verses":[{"book_en":"Colossians","ch":4,"note":"감사함으로 깨어 기도에 힘쓰라는 짧지만 강력한 권면입니다.","ref":"골 4:2","v":2,"text":"기도를 항상 힘쓰고 기도에 감사함으로 깨어 있으라"},{"book_en":"Colossians","ch":4,"note":"믿지 않는 사람들을 대할 때 지혜와 은혜 있는 말로 행하라는 전도의 지혜입니다.","ref":"골 4:5-6","v":5,"text":"외인을 향하여서는 지혜로 행하여 세월을 아끼라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『Love So Amazing』 (골 1장, Baker Books)","text":"그리스도의 탁월하심을 선포하는 장으로 풀었다. 만물이 그로 말미암아 창조되었고 교회의 머리이시며, 하나님 본체의 모든 충만이 그 안에 거하신다는 선언을 강조했다. 십자가의 피로 만물을 화목하게 하신 일과, 지혜와 영적인 지식을 구하는 바울의 기도를 설명했다."}]}],"exposition_note":"로이드존스: 『Love So Amazing』 (골 1장, Baker Books)"},{"id":"b_1th","type":"book","name":"데살로니가전서","name_en":"1Thessalonians","tagline":"예수님의 다시 오심을 기다리며","summary":"데살로니가전서는 바울이 가장 먼저 쓴 편지 중 하나로, 예수님의 재림을 기다리는 성도들을 격려합니다. 거룩한 삶과 서로 사랑, 죽은 성도의 부활 소망을 다룹니다. 핍박받는 교회에게 소망을 주는 책입니다. 개혁주의 관점에서 재림은 두려움이 아니라 성도의 확실한 소망입니다.","verses":[{"ref":"살전 1:10","book_en":"1Thessalonians","ch":1,"v":10,"text":"또 죽은 자들 가운데서 다시 살리신 그의 아들이 하늘로부터 강림하심을 기다린다고 말하니 이는 장래 노하심에서 우리를 건지시는 예수시니라"},{"ref":"살전 4:16","book_en":"1Thessalonians","ch":4,"v":16,"text":"주께서 호령과 천사장의 소리와 하나님의 나팔로 친히 하늘로 좇아 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고"},{"ref":"살전 5:16","book_en":"1Thessalonians","ch":5,"v":16,"text":"항상 기뻐하라"}],"related":["f_paul","f_timothy","d_eschatology"],"meta":{"category":"바울서신","author":"바울","date":"AD 50~51년경","chapters":5,"year_est":50,"emperor":"글라우디오"},"sections":[{"range":"1장","text":"데살로니가 교회는 환난 가운데서도 말씀을 받아 모든 믿는 자의 본이 되었습니다(1:6-7). 작은 교회도 온 세상에 믿음의 소문을 낼 수 있습니다.","title":"본이 된 교회"},{"range":"2-3장","text":"바울은 유모처럼, 아버지처럼 교회를 돌본 자신의 사역을 돌아봅니다. 디모데를 보내 교회를 굳게 세우려 한 것은 목자의 사랑입니다.","title":"목자의 마음"},{"range":"4장","text":"음행을 삼가고 거룩히 행하십시오. 주께서 재림하실 때 죽은 성도가 먼저 일어나고 산 자와 함께 공중에서 주를 맞이합니다(4:16-17).","title":"거룩과 재림의 소망"},{"range":"5장","text":"주의 날이 밤에 도둑같이 임하므로 깨어 근신하십시오(5:2,6). 항상 기뻐하라, 쉬지 말고 기도하라, 범사에 감사하라(5:16-18).","title":"깨어 있으라"}],"chapter_verses":[{"book_id":"b_1th","chapter":1,"verses":[{"book_en":"1Thessalonians","ch":1,"note":"믿음과 소망과 사랑이 삶으로 나타나는 건강한 교회의 모습을 보여줍니다.","ref":"살전 1:3","v":3,"text":"너희의 믿음의 역사와 사랑의 수고와 우리 주 예수 그리스도에 대한 소망의 인내를 우리 하나님 아버지 앞에서 쉬지 않고 기억함이니"},{"book_en":"1Thessalonians","ch":1,"note":"회심과 재림 소망이라는 초대교회 신앙의 두 축을 보여주는 구절입니다.","ref":"살전 1:9-10","v":9,"text":"저희가 우리에 대하여 스스로 고하기를 우리가 어떻게 너희 가운데 들어간 것과 너희가 어떻게 우상을 버리고 하나님께로 돌아와서 사시고 참되신 하나님을 섬기며"}]},{"book_id":"b_1th","chapter":2,"verses":[{"book_en":"1Thessalonians","ch":2,"note":"복음 전도자의 헌신적인 사랑, 목숨까지 주기를 기뻐한 바울의 심정입니다.","ref":"살전 2:8","v":8,"text":"우리가 이같이 너희를 사모하여 하나님의 복음으로만 아니라 우리 목숨까지 너희에게 주기를 즐겨함은 너희가 우리의 사랑하는 자 됨이니라"},{"book_en":"1Thessalonians","ch":2,"note":"성경은 사람의 말이 아니라 역사하시는 하나님의 말씀으로 받아야 한다는 선언입니다.","ref":"살전 2:13","v":13,"text":"이러므로 우리가 하나님께 쉬지 않고 감사함은 너희가 우리에게 들은바 하나님의 말씀을 받을 때에 사람의 말로 아니하고 하나님의 말씀으로 받음이니 진실로 그러하다 이 말씀이 또한 너희 믿는 자 속에서 역사하느니라"}]},{"book_id":"b_1th","chapter":3,"verses":[{"book_en":"1Thessalonians","ch":3,"note":"서로 향한 사랑이 풍성해져 재림 때 흠 없이 서게 되기를 비는 기도입니다.","ref":"살전 3:12-13","v":12,"text":"또 주께서 우리가 너희를 사랑함과 같이 너희도 피차간과 모든 사람에 대한 사랑이 더욱 많아 넘치게 하사"}]},{"book_id":"b_1th","chapter":4,"verses":[{"book_en":"1Thessalonians","ch":4,"note":"하나님의 뜻이 거룩함, 곧 음행을 버리는 삶임을 분명히 한 말씀입니다.","ref":"살전 4:3","v":3,"text":"하나님의 뜻은 이것이니 너희의 거룩함이라 곧 음란을 버리고"},{"book_en":"1Thessalonians","ch":4,"note":"조용히 성실하게 일하며 살아가는 것이 신앙인의 바른 태도임을 가르칩니다.","ref":"살전 4:11-12","v":11,"text":"또 너희에게 명한것 같이 종용하여 자기 일을 하고 너희 손으로 일하기를 힘쓰라"},{"book_en":"1Thessalonians","ch":4,"note":"주님의 재림과 성도의 휴거를 묘사한, 종말 소망의 대표 본문입니다.","ref":"살전 4:16-17","v":16,"text":"주께서 호령과 천사장의 소리와 하나님의 나팔로 친히 하늘로 좇아 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고"}]},{"book_id":"b_1th","chapter":5,"verses":[{"book_en":"1Thessalonians","ch":5,"note":"세 구절로 이루어진 가장 짧고 유명한 명령으로, 성도의 일상을 규정합니다.","ref":"살전 5:16-18","v":16,"text":"항상 기뻐하라"},{"book_en":"1Thessalonians","ch":5,"note":"성령의 역사를 끄지 말라는 짧지만 깊은 경고의 말씀입니다.","ref":"살전 5:19","v":19,"text":"성령을 소멸치 말며"},{"book_en":"1Thessalonians","ch":5,"note":"모든 것을 분별하여 좋은 것을 붙잡으라는 지혜의 말씀입니다.","ref":"살전 5:21","v":21,"text":"범사에 헤아려 좋은 것을 취하고"}]}]},{"id":"b_2th","type":"book","name":"데살로니가후서","name_en":"2Thessalonians","tagline":"재림을 빙자한 혼란을 바로잡다","summary":"데살로니가후서는 '주님의 날이 이미 왔다'는 잘못된 소문에 흔들린 교회를 바로잡는 편지입니다. 재림 전에 일어날 일들을 설명하며 성도들을 안정시킵니다. 일하지 않는 자에 대한 권면도 유명합니다. 개혁주의 관점에서 종말에 대한 호기심보다 오늘의 충실한 삶이 중요함을 가르칩니다.","verses":[{"ref":"살후 2:15","book_en":"2Thessalonians","ch":2,"v":15,"text":"이러므로 형제들아 굳게 서서 말로나 우리 편지로 가르침을 받은 유전을 지키라"},{"ref":"살후 3:3","book_en":"2Thessalonians","ch":3,"v":3,"text":"주는 미쁘사 너희를 굳게 하시고 악한 자에게서 지키시리라"},{"ref":"살후 3:10","book_en":"2Thessalonians","ch":3,"v":10,"text":"우리가 너희와 함께 있을 때에도 너희에게 명하기를 누구든지 일하기 싫어하거든 먹지도 말게 하라 하였더니"}],"related":["f_paul","d_eschatology"],"meta":{"category":"바울서신","author":"바울","date":"AD 51~52년경","chapters":3,"year_est":51,"emperor":"글라우디오"},"sections":[{"range":"1장","text":"핍박받는 교회지만 믿음이 자라 사랑이 풍성해짐을 감사합니다. 고난은 하나님의 의로운 심판의 증거이며, 주님이 오실 때 갚아주십니다.","title":"고난 중 감사와 위로"},{"range":"2장","text":"주의 날이 이르렀다는 거짓말에 흔들리지 마십시오(2:2). 배도와 불법의 사람이 먼저 나타난 뒤 주님이 오십니다. 진리를 굳게 붙드십시오.","title":"주의 날 전에 일어날 일"},{"range":"3장","text":"일하기 싫어하는 자는 먹지도 말게 하십시오(3:10). 재림을 핑계로 게으름 피우지 말고, 선을 행하다가 낙심하지 마십시오(3:13).","title":"게으르지 말고 일하라"}],"chapter_verses":[{"book_id":"b_2th","chapter":1,"verses":[{"book_en":"2Thessalonians","ch":1,"note":"환난 중에도 부르심에 합당하게 서도록 기도하는 바울의 간구입니다.","ref":"살후 1:11-12","v":11,"text":"이러므로 우리도 항상 너희를 위하여 기도함은 우리 하나님이 너희를 그 부르심에 합당한 자로 여기시고 모든 선을 기뻐함과 믿음의 역사를 능력으로 이루게 하시고"}]},{"book_id":"b_2th","chapter":2,"verses":[{"book_en":"2Thessalonians","ch":2,"note":"구원이 처음부터 끝까지 하나님의 택하심과 은혜임을 보여주는 구절입니다.","ref":"살후 2:13","v":13,"text":"주의 사랑하시는 형제들아 우리가 항상 너희를 위하여 마땅히 하나님께 감사할 것은 하나님이 처음부터 너희를 택하사 성령의 거룩하게 하심과 진리를 믿음으로 구원을 얻게 하심이니"},{"book_en":"2Thessalonians","ch":2,"note":"흔들리는 시대에 사도의 가르침을 굳게 붙잡으라는 권면입니다.","ref":"살후 2:15","v":15,"text":"이러므로 형제들아 굳게 서서 말로나 우리 편지로 가르침을 받은 유전을 지키라"}]},{"book_id":"b_2th","chapter":3,"verses":[{"book_en":"2Thessalonians","ch":3,"note":"미쁘신 주님이 성도를 굳게 세우고 지키신다는 약속의 말씀입니다.","ref":"살후 3:3","v":3,"text":"주는 미쁘사 너희를 굳게 하시고 악한 자에게서 지키시리라"},{"book_en":"2Thessalonians","ch":3,"note":"성실한 노동의 가치를 가르치는, 근면의 대표 구절입니다.","ref":"살후 3:10","v":10,"text":"우리가 너희와 함께 있을 때에도 너희에게 명하기를 누구든지 일하기 싫어하거든 먹지도 말게 하라 하였더니"}]}]},{"id":"b_1tim","type":"book","name":"디모데전서","name_en":"1Timothy","tagline":"교회를 세우는 목회 지침서","summary":"디모데전서는 바울이 젊은 목회자 디모데에게 보낸 편지입니다. 교회의 지도자 자격, 예배 질서, 거짓 가르침 대처법을 가르칩니다. 목회서신의 첫 책입니다. 개혁주의 관점에서 교회는 말씀과 질서 위에 바로 세워져야 하며, 지도자는 경건과 교리적 순전함으로 검증되어야 합니다.","verses":[{"ref":"딤전 2:5","book_en":"1Timothy","ch":2,"v":5,"text":"하나님은 한 분이시요 또 하나님과 사람 사이에 중보도 한 분이시니 곧 사람이신 그리스도 예수라"},{"ref":"딤전 3:15","book_en":"1Timothy","ch":3,"v":15,"text":"만일 내가 지체하면 너로 하나님의 집에서 어떻게 행하여야 할 것을 알게 하려 함이니 이 집은 살아 계신 하나님의 교회요 진리의 기둥과 터이니라"},{"ref":"딤전 4:12","book_en":"1Timothy","ch":4,"v":12,"text":"누구든지 네 연소함을 업신여기지 못하게 하고 오직 말과 행실과 사랑과 믿음과 정절에 대하여 믿는 자에게 본이 되어"}],"related":["f_paul","f_timothy","d_church"],"meta":{"category":"바울서신","author":"바울","date":"AD 62~64년경","chapters":6,"year_est":63,"emperor":"네로"},"sections":[{"range":"1장","text":"디모데에게 다른 교훈을 가르치지 못하게 명합니다. 율법은 바르게 사용하면 선하지만, 구원의 조건으로 가르치면 안 됩니다.","title":"다른 교훈을 막으라"},{"range":"2-3장","text":"모든 사람을 위해 기도하고, 감독과 집사는 책망할 것이 없는 자라야 합니다(3:2). 교회는 진리의 기둥과 터입니다(3:15).","title":"예배와 직분자의 자격"},{"range":"4장","text":"말세에 믿음에서 떠나는 자들이 있으니, 경건에 이르도록 연습하십시오(4:7-8). 젊다고 업신여김을 받지 말고 말과 행실의 본이 되십시오(4:12).","title":"말씀과 경건으로 양육하라"},{"range":"5-6장","text":"과부와 장로를 공경하고, 부한 자들에게 선한 일에 부하고 나누어 주기를 명하십시오(6:18). 돈을 사랑함이 일만 악의 뿌리입니다(6:10).","title":"교회 안의 돌봄과 재물"}],"chapter_verses":[{"book_id":"b_1tim","chapter":1,"verses":[{"book_en":"1Timothy","ch":1,"note":"복음을 한 문장으로 요약한, 모든 사람이 받을 만한 미쁜 말씀입니다.","ref":"딤전 1:15","v":15,"text":"미쁘다 모든 사람이 받을만한 이 말이여 그리스도 예수께서 죄인을 구원하시려고 세상에 임하셨다 하였도다 죄인 중에 내가 괴수니라"},{"book_en":"1Timothy","ch":1,"note":"바울의 간증 뒤에 터져 나오는 하나님을 향한 찬송입니다.","ref":"딤전 1:17","v":17,"text":"만세의 왕 곧 썩지 아니하고 보이지 아니하고 홀로 하나이신 하나님께 존귀와 영광이 세세토록 있어지이다 아멘"}]},{"book_id":"b_1tim","chapter":2,"verses":[{"book_en":"1Timothy","ch":2,"note":"유일한 중보자 그리스도를 선언하는, 종교개혁이 붙잡은 핵심 구절입니다.","ref":"딤전 2:5","v":5,"text":"하나님은 한 분이시요 또 하나님과 사람 사이에 중보도 한 분이시니 곧 사람이신 그리스도 예수라"},{"book_en":"1Timothy","ch":2,"note":"통치자를 포함한 모든 사람을 위한 기도를 가장 먼저 하라는 명령입니다.","ref":"딤전 2:1-2","v":1,"text":"그러므로 내가 첫째로 권하노니 모든 사람을 위하여 간구와 기도와 도고와 감사를 하되"}]},{"book_id":"b_1tim","chapter":3,"verses":[{"book_en":"1Timothy","ch":3,"note":"교회가 진리를 붙드는 기둥과 터라는 교회의 본질을 보여줍니다.","ref":"딤전 3:15","v":15,"text":"만일 내가 지체하면 너로 하나님의 집에서 어떻게 행하여야 할 것을 알게 하려 함이니 이 집은 살아 계신 하나님의 교회요 진리의 기둥과 터이니라"}]},{"book_id":"b_1tim","chapter":4,"verses":[{"book_en":"1Timothy","ch":4,"note":"몸의 연습보다 경건의 연습이 영원히 유익하다는 영적 훈련의 말씀입니다.","ref":"딤전 4:7-8","v":7,"text":"망령되고 허탄한 신화를 버리고 오직 경건에 이르기를 연습하라"},{"book_en":"1Timothy","ch":4,"note":"나이와 상관없이 삶으로 본을 보이라는 젊은 목회자를 향한 권면입니다.","ref":"딤전 4:12","v":12,"text":"누구든지 네 연소함을 업신여기지 못하게 하고 오직 말과 행실과 사랑과 믿음과 정절에 대하여 믿는 자에게 본이 되어"}]},{"book_id":"b_1tim","chapter":5,"verses":[{"book_en":"1Timothy","ch":5,"note":"가족을 돌보는 것이 믿음의 열매임을 말하는 가정 윤리의 구절입니다.","ref":"딤전 5:8","v":8,"text":"누구든지 자기 친족 특히 자기 가족을 돌아보지 아니하면 믿음을 배반한 자요 불신자보다 더 악한 자니라"}]},{"book_id":"b_1tim","chapter":6,"verses":[{"book_en":"1Timothy","ch":6,"note":"자족함과 경건이 함께할 때 가장 큰 유익이라는 지혜의 말씀입니다.","ref":"딤전 6:6","v":6,"text":"그러나 지족하는 마음이 있으면 경건이 큰 이익이 되느니라"},{"book_en":"1Timothy","ch":6,"note":"돈 자체가 아니라 돈을 사랑함이 모든 악의 뿌리라는 유명한 경고입니다.","ref":"딤전 6:10","v":10,"text":"돈을 사랑함이 일만 악의 뿌리가 되나니 이것을 사모하는 자들이 미혹을 받아 믿음에서 떠나 많은 근심으로써 자기를 찔렀도다"}]}]},{"id":"b_2tim","type":"book","name":"디모데후서","name_en":"2Timothy","tagline":"순교 직전 바울의 유언","summary":"디모데후서는 순교를 앞둔 바울이 감옥에서 쓴 마지막 편지입니다. '선한 싸움을 싸우고 달려갈 길을 마쳤다'는 고백이 담겨 있습니다. 말씀을 굳게 붙들고 복음을 위해 고난받으라는 유언입니다. 개혁주의 관점에서 신앙의 유산은 다음 세대에 말씀을 전수하는 것입니다.","verses":[{"ref":"딤후 3:16","book_en":"2Timothy","ch":3,"v":16,"text":"모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니"},{"ref":"딤후 4:2","book_en":"2Timothy","ch":4,"v":2,"text":"너는 말씀을 전파하라 때를 얻든지 못 얻든지 항상 힘쓰라 범사에 오래 참음과 가르침으로 경책하며 경계하며 권하라"},{"ref":"딤후 4:7","book_en":"2Timothy","ch":4,"v":7,"text":"내가 선한 싸움을 싸우고 나의 달려갈 길을 마치고 믿음을 지켰으니"}],"related":["f_paul","f_timothy","e_paul_rome"],"meta":{"category":"바울서신","author":"바울","date":"AD 66~67년경","chapters":4,"year_est":66,"emperor":"네로"},"sections":[{"range":"1장","text":"감옥에 갇힌 바울은 디모데에게 복음을 부끄러워하지 말고 고난에 동참하라고 합니다(1:8). 하나님께 받은 은사를 불일듯하게 하십시오(1:6).","title":"부끄러워하지 말라"},{"range":"2장","text":"군사로 모집된 자는 자기 생활에 얽매이지 않습니다(2:4). 인내하면 함께 왕 노릇 하고, 진리의 말씀을 옳게 분별하십시오(2:15).","title":"그리스도의 좋은 군사"},{"range":"3장","text":"말세에 고통하는 때가 오지만, 모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함에 유익합니다(3:16). 성경이면 충분합니다.","title":"말세의 고통과 성경"},{"range":"4장","text":"나는 선한 싸움을 싸우고 나의 달려갈 길을 마치고 믿음을 지켰으니(4:7). 의의 면류관이 예비되어 있으며, 말씀 전파의 사명을 마치십시오.","title":"바울의 마지막 부탁"}],"chapter_verses":[{"book_id":"b_2tim","chapter":1,"verses":[{"book_en":"2Timothy","ch":1,"note":"두려움을 이기는 하나님의 선물, 능력과 사랑과 절제의 마음을 일깨웁니다.","ref":"딤후 1:7","v":7,"text":"하나님이 우리에게 주신 것은 두려워하는 마음이 아니요 오직 능력과 사랑과 근신하는 마음이니"},{"book_en":"2Timothy","ch":1,"note":"옥중의 바울이 맡긴 것을 지키실 하나님을 확신한 믿음의 고백입니다.","ref":"딤후 1:12","v":12,"text":"이를 인하여 내가 또 이 고난을 받되 부끄러워하지 아니함은 나의 의뢰한 자를 내가 알고 또한 나의 의탁한 것을 그 날까지 저가 능히 지키실 줄을 확신함이라"}]},{"book_id":"b_2tim","chapter":2,"verses":[{"book_en":"2Timothy","ch":2,"note":"말씀을 바르게 나누는 일꾼이 되라고 힘쓰라는 목회자의 강령입니다.","ref":"딤후 2:15","v":15,"text":"네가 진리의 말씀을 옳게 분변하며 부끄러울 것이 없는 일군으로 인정된 자로 자신을 하나님 앞에 드리기를 힘쓰라"},{"book_en":"2Timothy","ch":2,"note":"자기를 깨끗게 하는 자가 주인의 귀한 그릇으로 쓰임받는다는 말씀입니다.","ref":"딤후 2:21","v":21,"text":"그러므로 누구든지 이런 것에서 자기를 깨끗하게 하면 귀히 쓰는 그릇이 되어 거룩하고 주인의 쓰심에 합당하며 모든 선한 일에 예비함이 되리라"}]},{"book_id":"b_2tim","chapter":3,"verses":[{"book_en":"2Timothy","ch":3,"note":"성경의 영감과 유익을 선언하는 성경론의 대표 구절입니다.","ref":"딤후 3:16","v":16,"text":"모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니"},{"book_en":"2Timothy","ch":3,"note":"성경의 목적이 그리스도를 믿어 구원에 이르는 지혜에 있음을 말합니다.","ref":"딤후 3:15","v":15,"text":"또 네가 어려서부터 성경을 알았나니 성경은 능히 너로 하여금 그리스도 예수 안에 있는 믿음으로 말미암아 구원에 이르는 지혜가 있게 하느니라"}]},{"book_id":"b_2tim","chapter":4,"verses":[{"book_en":"2Timothy","ch":4,"note":"목회자에게 주신 가장 유명한 명령, 말씀 전파의 사명을 일깨웁니다.","ref":"딤후 4:2","v":2,"text":"너는 말씀을 전파하라 때를 얻든지 못 얻든지 항상 힘쓰라 범사에 오래 참음과 가르침으로 경책하며 경계하며 권하라"},{"book_en":"2Timothy","ch":4,"note":"순교를 앞둔 바울의 마지막 고백으로, 의의 면류관을 소망하게 합니다.","ref":"딤후 4:7-8","v":7,"text":"내가 선한 싸움을 싸우고 나의 달려갈 길을 마치고 믿음을 지켰으니"}]}]},{"id":"b_titus","type":"book","name":"디도서","name_en":"Titus","tagline":"건강한 교회를 세우는 법","summary":"디도서는 바울이 그레데 섬에 남겨진 동역자 디도에게 보낸 편지입니다. 장로 세우기, 건전한 교훈, 선한 행실을 강조합니다. 짧지만 교회 세우기의 핵심이 담겨 있습니다. 개혁주의 관점에서 참된 믿음은 반드시 선한 삶으로 열매 맺어야 합니다.","verses":[{"ref":"딛 2:11","book_en":"Titus","ch":2,"v":11,"text":"모든 사람에게 구원을 주시는 하나님의 은혜가 나타나"},{"ref":"딛 2:14","book_en":"Titus","ch":2,"v":14,"text":"그가 우리를 대신하여 자신을 주심은 모든 불법에서 우리를 구속하시고 우리를 깨끗하게 하사 선한 일에 열심하는 친 백성이 되게 하려 하심이니라"},{"ref":"딛 3:5","book_en":"Titus","ch":3,"v":5,"text":"우리를 구원하시되 우리의 행한바 의로운 행위로 말미암지 아니하고 오직 그의 긍휼하심을 좇아 중생의 씻음과 성령의 새롭게 하심으로 하셨나니"}],"related":["f_paul","d_church","d_salvation"],"meta":{"category":"바울서신","author":"바울","date":"AD 63~65년경","chapters":3,"year_est":64,"emperor":"네로"},"sections":[{"range":"1장","text":"그레데 각 성에 장로들을 세우고 거짓 교사들의 입을 막으십시오(1:5,11). 감독은 하나님의 청지기로서 책망할 것이 없어야 합니다.","title":"장로를 세우라"},{"range":"2장","text":"늙은 남자, 늙은 여자, 젊은 여자, 젊은 남자, 종에게 각각 합당한 바른 교훈을 가르치십시오. 디도 자신이 선행의 본이 되십시오(2:7).","title":"계층별 바른 삶"},{"range":"3장","text":"우리도 전에는 어리석었으나 하나님의 자비로 중생의 씻음과 성령의 새롭게 하심으로 구원받았습니다(3:5). 구원받은 자는 선한 일을 힘써야 합니다(3:8).","title":"선한 일에 힘쓰라"}],"chapter_verses":[{"book_id":"b_titus","chapter":1,"verses":[{"book_en":"Titus","ch":1,"note":"말로만 하나님을 안다 하고 행실로 부인하는 거짓을 경계하는 말씀입니다.","ref":"딛 1:16","v":16,"text":"저희가 하나님을 시인하나 행위로는 부인하니 가증한 자요 복종치 아니하는 자요 모든 선한 일을 버리는 자니라"}]},{"book_id":"b_titus","chapter":2,"verses":[{"book_en":"Titus","ch":2,"note":"은혜가 우리를 구원할 뿐 아니라 경건하게 살도록 가르친다는 말씀입니다.","ref":"딛 2:11-12","v":11,"text":"모든 사람에게 구원을 주시는 하나님의 은혜가 나타나"},{"book_en":"Titus","ch":2,"note":"그리스도의 속량의 목적이 선한 일에 열심인 백성임을 보여줍니다.","ref":"딛 2:14","v":14,"text":"그가 우리를 대신하여 자신을 주심은 모든 불법에서 우리를 구속하시고 우리를 깨끗하게 하사 선한 일에 열심하는 친 백성이 되게 하려 하심이니라"}]},{"book_id":"b_titus","chapter":3,"verses":[{"book_en":"Titus","ch":3,"note":"구원이 행위가 아닌 긍휼과 중생으로 말미암음을 선언하는 오직 은혜의 구절입니다.","ref":"딛 3:5","v":5,"text":"우리를 구원하시되 우리의 행한바 의로운 행위로 말미암지 아니하고 오직 그의 긍휼하심을 좇아 중생의 씻음과 성령의 새롭게 하심으로 하셨나니"},{"book_en":"Titus","ch":3,"note":"믿는 자가 선한 일에 힘쓰는 것이 아름답고 유익하다는 권면입니다.","ref":"딛 3:8","v":8,"text":"이 말이 미쁘도다 원컨대 네가 이 여러 것에 대하여 굳세게 말하라 이는 하나님을 믿는 자들로 하여금 조심하여 선한 일을 힘쓰게 하려 함이라 이것은 아름다우며 사람들에게 유익하니라"}]}]},{"id":"b_phm","type":"book","name":"빌레몬서","name_en":"Philemon","tagline":"도망친 노예를 형제로 받아들이다","summary":"빌레몬서는 바울이 도망친 노예 오네시모를 위해 그의 주인 빌레몬에게 쓴 짧은 편지입니다. 노예를 더 이상 종이 아니라 '사랑받는 형제'로 받아달라고 부탁합니다. 복음이 인간관계를 어떻게 바꾸는지 보여 주는 아름다운 예입니다. 개혁주의 관점에서 그리스도 안에서는 신분이 아니라 형제됨이 먼저입니다.","verses":[{"ref":"몬 1:10","book_en":"Philemon","ch":1,"v":10,"text":"갇힌 중에서 낳은 아들 오네시모를 위하여 네게 간구하노라"},{"ref":"몬 1:16","book_en":"Philemon","ch":1,"v":16,"text":"이 후로는 종과 같이 아니하고 종에서 뛰어나 곧 사랑 받는 형제로 둘 자라 내게 특별히 그러하거든 하물며 육신과 주 안에서 상관된 네게랴"},{"ref":"몬 1:17","book_en":"Philemon","ch":1,"v":17,"text":"그러므로 네가 나를 동무로 알찐대 저를 영접하기를 내게 하듯하고"}],"related":["f_paul","f_timothy"],"meta":{"category":"바울서신","author":"바울","date":"AD 60~62년경 옥중서신","chapters":1,"year_est":61,"emperor":"네로"},"sections":[{"range":"1-7절","text":"바울은 사도의 권위가 아니라 사랑으로 빌레몬에게 간구합니다. 빌레몬의 믿음과 성도들을 향한 사랑이 바울에게 큰 기쁨이 되었습니다.","title":"사랑으로 간구합니다"},{"range":"8-16절","text":"도망쳤던 종 오네시모가 이제는 복음 안에서 형제가 되었습니다. 바울은 그를 내 심복이라 부르며 사랑으로 받아줄 것을 부탁합니다.","title":"오네시모를 형제로 받으라"},{"range":"17-25절","text":"오네시모가 끼친 손해는 바울이 갚겠다고 합니다. 이는 우리 죄값을 대신 치르신 그리스도의 모습을 보여주는 아름다운 그림자입니다.","title":"빚은 내가 갚겠습니다"}],"chapter_verses":[{"book_id":"b_phm","chapter":1,"verses":[{"book_en":"Philemon","ch":1,"note":"도망친 종 오네시모를 그리스도 안의 형제로 받아들이라는 화해의 편지입니다.","ref":"몬 1:16","v":16,"text":"이 후로는 종과 같이 아니하고 종에서 뛰어나 곧 사랑 받는 형제로 둘 자라 내게 특별히 그러하거든 하물며 육신과 주 안에서 상관된 네게랴"},{"book_en":"Philemon","ch":1,"note":"믿음의 교제가 그리스도 안의 모든 선을 알게 한다는 짧은 편지의 핵심입니다.","ref":"몬 1:6","v":6,"text":"이로써 네 믿음의 교제가 우리 가운데 있는 선을 알게 하고 그리스도께 미치도록 역사하느니라"}]}]},{"id":"b_heb","type":"book","name":"히브리서","name_en":"Hebrews","tagline":"예수님은 모든 것보다 크십니다","summary":"히브리서는 박해로 흔들리는 유대인 그리스도인들에게 '예수님이 천사, 모세, 제사장보다 크시다'고 증언합니다. 예수님은 완전한 대제사장이자 완전한 제물이십니다. 믿음장(11장)이 유명합니다. 개혁주의 관점에서 히브리서는 구약의 모든 제사와 예언이 그리스도 안에서 성취됨을 보여 줍니다.","verses":[{"ref":"히 4:12","book_en":"Hebrews","ch":4,"v":12,"text":"하나님의 말씀은 살았고 운동력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 감찰하나니"},{"ref":"히 11:1","book_en":"Hebrews","ch":11,"v":1,"text":"믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니"},{"ref":"히 12:2","book_en":"Hebrews","ch":12,"v":2,"text":"믿음의 주요 또 온전케 하시는 이인 예수를 바라보자 저는 그 앞에 있는 즐거움을 위하여 십자가를 참으사 부끄러움을 개의치 아니하시더니 하나님 보좌 우편에 앉으셨느니라"}],"related":["f_jesus","e_cross","d_christ","d_salvation"],"meta":{"category":"일반서신","author":"저자 미상(전통적으로 바울 설도 있음)","date":"AD 64~68년경","chapters":13,"year_est":66,"emperor":"네로"},"sections":[{"range":"1-2장","text":"옛적에는 선지자들을 통해 말씀하셨지만, 마지막에는 아들을 통해 말씀하셨습니다(1:1-2). 이토록 큰 구원을 소홀히 하면 어떻게 피하겠습니까(2:3).","title":"천사보다 뛰어난 아들"},{"range":"3-4장","text":"예수님은 모세보다 더 큰 영광을 받으셨습니다(3:3). 광야에서 넘어진 이스라엘처럼 완고해지지 말고, 오늘 순종하여 안식에 들어가십시오.","title":"모세보다 뛰어나신 분, 안식에 들어가라"},{"range":"5-7장","text":"예수님은 멜기세덱의 반차를 좇은 영원한 대제사장이십니다(6:20). 레위 제사장들과 달리 죽지 않으시므로 구원을 완전히 이루십니다.","title":"영원한 대제사장"},{"range":"8-10장","text":"예수님은 자기 피로 단번에 성소에 들어가 영원한 속죄를 이루셨습니다(9:12). 짐승의 피가 아닌 그리스도의 피가 양심을 깨끗하게 합니다.","title":"더 좋은 언약, 단번의 제사"},{"range":"11장","text":"믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니(11:1). 아벨부터 라합까지, 믿음으로 산 증인들이 우리를 격려합니다.","title":"믿음의 증인들"},{"range":"12-13장","text":"믿음의 주요 온전하게 하시는 예수님을 바라보며 인내로 경주하십시오(12:1-2). 하나님의 징계는 사랑의 증거이며, 서로 사랑하고 손님 대접하기를 잊지 마십시오.","title":"인내로 경주하라"}],"chapter_verses":[{"book_id":"b_heb","chapter":1,"verses":[{"ref":"히 1:3","book_en":"Hebrews","ch":1,"v":3,"note":"예수님은 하나님의 영광의 광채요 본체의 형상이시라는 말로, 아들이 곧 하나님이심을 가장 분명히 선언합니다.","text":"이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결케 하는 일을 하시고 높은 곳에 계신 위엄의 우편에 앉으셨느니라"}]},{"book_id":"b_heb","chapter":2,"verses":[{"ref":"히 2:1","book_en":"Hebrews","ch":2,"v":1,"note":"들은 복음을 가볍게 여기지 말고 굳게 붙들라는 경고로, 구원의 말씀을 소홀히 하지 말라는 뜻입니다.","text":"그러므로 모든 들은 것을 우리가 더욱 간절히 삼갈찌니 혹 흘러 떠내려 갈까 염려하노라"}]},{"book_id":"b_heb","chapter":3,"verses":[{"ref":"히 3:1","book_en":"Hebrews","ch":3,"v":1,"note":"하늘의 부르심을 받은 성도는 사도이시며 대제사장이신 예수님을 깊이 생각하며 믿음을 붙들어야 합니다.","text":"그러므로 함께 하늘의 부르심을 입은 거룩한 형제들아 우리의 믿는 도리의 사도시며 대제사장이신 예수를 깊이 생각하라"}]},{"book_id":"b_heb","chapter":4,"verses":[{"ref":"히 4:12","book_en":"Hebrews","ch":4,"v":12,"note":"하나님의 말씀은 살아 있어 마음속 깊은 생각까지 비추어 쪼개는 능력이 있습니다.","text":"하나님의 말씀은 살았고 운동력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 감찰하나니"},{"ref":"히 4:16","book_en":"Hebrews","ch":4,"v":16,"note":"우리의 연약함을 아시는 대제사장이 계시니 담대히 은혜의 보좌 앞에 나아가라고 권합니다.","text":"그러므로 우리가 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라"}]},{"book_id":"b_heb","chapter":5,"verses":[{"ref":"히 5:7","book_en":"Hebrews","ch":5,"v":7,"note":"예수님도 육체에 계실 때 눈물로 간구하셨기에, 고난받는 우리의 기도를 결코 외면하지 않으십니다.","text":"그는 육체에 계실 때에 자기를 죽음에서 능히 구원하실 이에게 심한 통곡과 눈물로 간구와 소원을 올렸고 그의 경외하심을 인하여 들으심을 얻었느니라"}]},{"book_id":"b_heb","chapter":6,"verses":[{"ref":"히 6:19","book_en":"Hebrews","ch":6,"v":19,"note":"예수님 안에 둔 소망은 흔들리지 않는 닻과 같아 영혼을 든든히 붙들어 줍니다.","text":"우리가 이 소망이 있는 것은 영혼의 닻 같아서 튼튼하고 견고하여 휘장 안에 들어 가나니"}]},{"book_id":"b_heb","chapter":7,"verses":[{"ref":"히 7:25","book_en":"Hebrews","ch":7,"v":25,"note":"예수님은 지금도 살아 계셔서 우리를 위해 중보하시므로, 그분께 나아가는 자를 온전히 구원하십니다.","text":"그러므로 자기를 힘입어 하나님께 나아가는 자들을 온전히 구원하실 수 있으니 이는 그가 항상 살아서 저희를 위하여 간구하심이니라"}]},{"book_id":"b_heb","chapter":8,"verses":[{"ref":"히 8:12","book_en":"Hebrews","ch":8,"v":12,"note":"새 언약의 핵심은 하나님이 우리의 불의를 긍휼히 여기시고 죄를 다시 기억하지 않으신다는 약속입니다.","text":"내가 저희 불의를 긍휼히 여기고 저희 죄를 다시 기억하지 아니하리라 하셨느니라"}]},{"book_id":"b_heb","chapter":9,"verses":[{"ref":"히 9:22","book_en":"Hebrews","ch":9,"v":22,"note":"피 흘림 없이는 죄 사함이 없다는 말로, 예수님의 십자가 피가 유일한 속죄 길임을 보여줍니다.","text":"율법을 좇아 거의 모든 물건이 피로써 정결케 되나니 피흘림이 없은즉 사함이 없느니라"},{"ref":"히 9:27-28","book_en":"Hebrews","ch":9,"v":27,"note":"사람은 한 번 죽고 심판이 있으며, 예수님은 다시 오실 때 구원을 완성하실 것입니다.","text":"한번 죽는 것은 사람에게 정하신 것이요 그 후에는 심판이 있으리니"}]},{"book_id":"b_heb","chapter":10,"verses":[{"ref":"히 10:25","book_en":"Hebrews","ch":10,"v":25,"note":"모이기를 소홀히 하지 말고 서로 권면하라는 말씀으로, 교회 공동체의 소중함을 일깨웁니다.","text":"모이기를 폐하는 어떤 사람들의 습관과 같이 하지 말고 오직 권하여 그날이 가까움을 볼수록 더욱 그리하자"}]},{"book_id":"b_heb","chapter":11,"verses":[{"ref":"히 11:1","book_en":"Hebrews","ch":11,"v":1,"note":"믿음이 무엇인지 가장 유명하게 정의한 구절로, 보이지 않는 것을 붙드는 것이 믿음입니다.","text":"믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니"},{"ref":"히 11:6","book_en":"Hebrews","ch":11,"v":6,"note":"믿음 없이는 하나님을 기쁘시게 할 수 없다는 말로, 믿음이 신앙의 출발점임을 강조합니다.","text":"믿음이 없이는 기쁘시게 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할찌니라"}]},{"book_id":"b_heb","chapter":12,"verses":[{"ref":"히 12:1-2","book_en":"Hebrews","ch":12,"v":1,"note":"수많은 증인이 지켜보듯 무거운 짐을 벗고, 믿음의 주이신 예수를 바라보며 달리라고 격려합니다.","text":"이러므로 우리에게 구름 같이 둘러싼 허다한 증인들이 있으니 모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 경주하며"},{"ref":"히 12:14","book_en":"Hebrews","ch":12,"v":14,"note":"모든 사람과 화평하고 거룩함을 좇으라는 말씀으로, 거룩함 없이는 주를 보지 못함을 경고합니다.","text":"모든 사람으로 더불어 화평함과 거룩함을 좇으라 이것이 없이는 아무도 주를 보지 못하리라"}]},{"book_id":"b_heb","chapter":13,"verses":[{"ref":"히 13:8","book_en":"Hebrews","ch":13,"v":8,"note":"예수 그리스도는 어제나 오늘이나 영원토록 동일하시니, 흔들리는 세상에서 가장 든든한 반석입니다.","text":"예수 그리스도는 어제나 오늘이나 영원토록 동일하시니라"}]}]},{"id":"b_jas","type":"book","name":"야고보서","name_en":"James","tagline":"믿음은 행동으로 증명됩니다","summary":"야고보서는 예수님의 동생 야고보가 쓴 편지로, 행함 없는 믿음은 죽은 것이라고 강조합니다. 말과 행동이 일치하는 삶을 촉구합니다. 바울의 '오직 믿음'과 충돌하는 게 아니라, 참된 믿음은 반드시 삶의 열매를 맺는다는 뜻입니다. 개혁주의도 구원은 믿음으로, 그 믿음은 행함으로 확인된다고 가르칩니다.","verses":[{"ref":"약 1:22","book_en":"James","ch":1,"v":22,"text":"너희는 도를 행하는 자가 되고 듣기만 하여 자신을 속이는 자가 되지말라"},{"ref":"약 2:17","book_en":"James","ch":2,"v":17,"text":"이와 같이 행함이 없는 믿음은 그 자체가 죽은 것이라"},{"ref":"약 2:26","book_en":"James","ch":2,"v":26,"text":"영혼 없는 몸이 죽은것 같이 행함이 없는 믿음은 죽은 것이니라"}],"related":["f_james_brother","f_jesus","d_salvation"],"meta":{"category":"일반서신","author":"야고보(예수의 동생)","date":"AD 45~48년경","chapters":5,"year_est":46,"emperor":"글라우디오"},"sections":[{"range":"1장","text":"시험을 만나거든 온전히 기쁘게 여기십시오. 시험은 인내를 낳습니다(1:2-3). 말씀을 듣기만 하지 말고 행하는 자가 되십시오(1:22).","title":"시험을 이기는 믿음"},{"range":"2장","text":"아브라함이 이삭을 바친 행함으로 믿음이 온전해졌습니다(2:22). 행함이 없는 믿음은 그 자체가 죽은 것이라(2:17).","title":"행함 없는 믿음은 죽은 것"},{"range":"3장","text":"혀는 작은 불이지만 큰 숲을 태웁니다(3:5). 위로부터 난 지혜는 화평하고 온유하며 긍휼이 가득합니다(3:17).","title":"혀를 다스리라"},{"range":"4-5장","text":"하나님을 가까이하면 하나님이 가까이 오십니다(4:8). 부한 자들의 횡포를 경고하고, 주의 재림까지 농부처럼 인내하십시오(5:7-8).","title":"겸손과 인내"}],"chapter_verses":[{"book_id":"b_jas","chapter":1,"verses":[{"ref":"약 1:5","book_en":"James","ch":1,"v":5,"note":"지혜가 부족하면 후히 주시는 하나님께 구하라는 말씀으로, 기도 응답을 확신하게 합니다.","text":"너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라"}]},{"book_id":"b_jas","chapter":2,"verses":[{"ref":"약 2:26","book_en":"James","ch":2,"v":26,"note":"행함이 없는 믿음은 죽은 믿음이라는 말로, 참된 믿음은 반드시 삶으로 드러남을 가르칩니다.","text":"영혼 없는 몸이 죽은것 같이 행함이 없는 믿음은 죽은 것이니라"}]},{"book_id":"b_jas","chapter":3,"verses":[{"ref":"약 3:5-6","book_en":"James","ch":3,"v":5,"note":"작은 혀가 큰 불을 일으키듯 말이 가진 무서운 힘을 경고하는 구절입니다.","text":"이와 같이 혀도 작은 지체로되 큰 것을 자랑하도다 보라 어떻게 작은 불이 어떻게 많은 나무를 태우는가"}]},{"book_id":"b_jas","chapter":4,"verses":[{"ref":"약 4:7","book_en":"James","ch":4,"v":7,"note":"하나님께 순종하고 마귀를 대적하라는 말씀으로, 영적 싸움에서 이기는 비결을 알려줍니다.","text":"그런즉 너희는 하나님께 순복할찌어다 마귀를 대적하라 그리하면 너희를 피하리라"}]},{"book_id":"b_jas","chapter":5,"verses":[{"ref":"약 5:16","book_en":"James","ch":5,"v":16,"note":"서로 죄를 고백하고 병 낫기를 위해 기도하라는 말씀으로, 의인의 간구의 놀라운 능력을 약속합니다.","text":"이러므로 너희 죄를 서로 고하며 병 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 많으니라"}]}]},{"id":"b_1pet","type":"book","name":"베드로전서","name_en":"1Peter","tagline":"고난받는 성도에게 주는 소망","summary":"베드로전서는 박해받는 성도들에게 보낸 편지입니다. 고난 중에도 산 소망을 붙들고 거룩하게 살라고 격려합니다. 성도는 이 땅의 나그네이지만 하늘의 유업을 가진 자들입니다. 개혁주의 관점에서 고난은 하나님의 징계이자 연단의 도구이며, 소망은 흔들리지 않습니다.","verses":[{"ref":"벧전 1:3","book_en":"1Peter","ch":1,"v":3,"text":"찬송하리로다 우리 주 예수 그리스도의 아버지 하나님이 그 많으신 긍휼대로 예수 그리스도의 죽은 자 가운데서 부활하심으로 말미암아 우리를 거듭나게 하사 산 소망이 있게 하시며"},{"ref":"벧전 2:9","book_en":"1Peter","ch":2,"v":9,"text":"오직 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유된 백성이니 이는 너희를 어두운데서 불러 내어 그의 기이한 빛에 들어가게 하신 자의 아름다운 덕을 선전하게 하려 하심이라"},{"ref":"벧전 5:7","book_en":"1Peter","ch":5,"v":7,"text":"너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라"}],"related":["f_peter","f_paul","d_church","d_salvation"],"meta":{"category":"일반서신","author":"베드로","date":"AD 62~64년경","chapters":5,"year_est":63,"emperor":"네로"},"sections":[{"range":"1장","text":"예수님의 부활로 산 소망을 얻었고, 썩지 않고 더럽지 않은 기업이 하늘에 간직되었습니다(1:3-4). 잠깐의 고난은 믿음을 연단합니다.","title":"산 소망으로 거듭남"},{"range":"2장","text":"성도는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라입니다(2:9). 비방하는 자들 앞에서도 선행으로 하나님께 영광을 돌리십시오.","title":"왕 같은 제사장들"},{"range":"3-4장","text":"그리스도도 의인으로서 불의한 자를 대신해 고난받으셨습니다(3:18). 선을 행하다 고난받는 것은 하나님의 뜻이며 복입니다.","title":"고난 중에도 선을 행하라"},{"range":"5장","text":"장로들은 양 떼의 본이 되어 돌보고, 젊은이들은 겸손하십시오. 너희 염려를 다 주께 맡기라 이는 그가 너희를 돌보심이라(5:7).","title":"겸손히 맡기라"}],"chapter_verses":[{"book_id":"b_1pet","chapter":1,"verses":[{"ref":"벧전 1:3","book_en":"1Peter","ch":1,"v":3,"note":"예수님의 부활로 산 소망을 얻었다는 말로, 고난 중에도 소망이 있는 이유를 보여줍니다.","text":"찬송하리로다 우리 주 예수 그리스도의 아버지 하나님이 그 많으신 긍휼대로 예수 그리스도의 죽은 자 가운데서 부활하심으로 말미암아 우리를 거듭나게 하사 산 소망이 있게 하시며"}]},{"book_id":"b_1pet","chapter":2,"verses":[{"ref":"벧전 2:9","book_en":"1Peter","ch":2,"v":9,"note":"성도는 택하신 족속이요 왕 같은 제사장이라는 말씀으로, 우리의 존귀한 신분을 선언합니다.","text":"오직 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유된 백성이니 이는 너희를 어두운데서 불러 내어 그의 기이한 빛에 들어가게 하신 자의 아름다운 덕을 선전하게 하려 하심이라"}]},{"book_id":"b_1pet","chapter":3,"verses":[{"ref":"벧전 3:15","book_en":"1Peter","ch":3,"v":15,"note":"믿음의 이유를 묻는 자에게 온유와 두려움으로 대답할 준비를 하라는 말씀입니다.","text":"너희 마음에 그리스도를 주로 삼아 거룩하게 하고 너희 속에 있는 소망에 관한 이유를 묻는 자에게는 대답할 것을 항상 예비하되 온유와 두려움으로 하고"}]},{"book_id":"b_1pet","chapter":4,"verses":[{"ref":"벧전 4:8","book_en":"1Peter","ch":4,"v":8,"note":"열심으로 서로 사랑하라는 말씀으로, 사랑이 허다한 죄를 덮는다고 가르칩니다.","text":"무엇보다도 열심으로 서로 사랑할찌니 사랑은 허다한 죄를 덮느니라"}]},{"book_id":"b_1pet","chapter":5,"verses":[{"ref":"벧전 5:7","book_en":"1Peter","ch":5,"v":7,"note":"모든 염려를 주께 맡기라는 말씀으로, 하나님이 우리를 돌보신다는 위로를 줍니다.","text":"너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라"}]}]},{"id":"b_2pet","type":"book","name":"베드로후서","name_en":"2Peter","tagline":"거짓 가르침을 경계하라","summary":"베드로후서는 순교를 앞둔 베드로가 거짓 교사들을 경계하라고 쓴 편지입니다. 주님의 재림이 더디다고 조롱하는 자들에게 하나님의 때는 반드시 온다고 답합니다. 말씀에 대한 확신과 경건을 강조합니다. 개혁주의 관점에서 교회는 시대를 따라 변하는 가르침이 아니라 사도들의 증언 위에 서야 합니다.","verses":[{"ref":"벧후 1:21","book_en":"2Peter","ch":1,"v":21,"text":"예언은 언제든지 사람의 뜻으로 낸 것이 아니요 오직 성령의 감동하심을 입은 사람들이 하나님께 받아 말한 것임이니라"},{"ref":"벧후 3:9","book_en":"2Peter","ch":3,"v":9,"text":"주의 약속은 어떤이의 더디다고 생각하는 것 같이 더딘 것이 아니라 오직 너희를 대하여 오래 참으사 아무도 멸망치 않고 다 회개하기에 이르기를 원하시느니라"},{"ref":"벧후 3:18","book_en":"2Peter","ch":3,"v":18,"text":"오직 우리 주 곧 구주 예수 그리스도의 은혜와 저를 아는 지식에서 자라 가라 영광이 이제와 영원한 날까지 저에게 있을찌어다"}],"related":["f_peter","d_eschatology"],"meta":{"category":"일반서신","author":"베드로","date":"AD 64~67년경","chapters":3,"year_est":65,"emperor":"네로"},"sections":[{"range":"1장","text":"믿음에 덕을, 덕에 지식을 더해 부르심과 택하심을 굳게 하십시오(1:5,10). 예언은 사람의 뜻이 아니라 성령의 감동으로 된 것입니다(1:21).","title":"믿음에 덕을 더하라"},{"range":"2장","text":"거짓 선생들이 멸망할 이단을 몰래 끌어들입니다(2:1). 노아 시대와 소돔을 심판하신 하나님은 경건한 자를 건지십니다.","title":"거짓 선생들을 조심하라"},{"range":"3장","text":"재림이 더딘 것은 멸망이 아니라 회개의 기회를 주시는 하나님의 오래 참으심입니다(3:9). 주의 날을 사모하며 거룩한 행실로 살아가십시오.","title":"주의 날을 사모하라"}],"chapter_verses":[{"book_id":"b_2pet","chapter":1,"verses":[{"ref":"벧후 1:3","book_en":"2Peter","ch":1,"v":3,"note":"생명과 경건에 필요한 모든 것을 이미 주셨다는 말씀으로, 신앙생활의 자원이 부족하지 않음을 확신시킵니다.","text":"그의 신기한 능력으로 생명과 경건에 속한 모든 것을 우리에게 주셨으니 이는 자기의 영광과 덕으로써 우리를 부르신 자를 앎으로 말미암음이라"}]},{"book_id":"b_2pet","chapter":2,"verses":[{"ref":"벧후 2:9","book_en":"2Peter","ch":2,"v":9,"note":"주님은 경건한 자를 시험에서 건지신다는 말씀으로, 거짓 가르침 속에서도 보호하심을 약속합니다.","text":"주께서 경건한 자는 시험에서 건지시고 불의한 자는 형벌 아래 두어 심판날까지 지키시며"}]},{"book_id":"b_2pet","chapter":3,"verses":[{"ref":"벧후 3:9","book_en":"2Peter","ch":3,"v":9,"note":"주님의 더디 오심은 아무도 멸망하지 않고 회개하기를 바라시는 오래 참으심입니다.","text":"주의 약속은 어떤이의 더디다고 생각하는 것 같이 더딘 것이 아니라 오직 너희를 대하여 오래 참으사 아무도 멸망치 않고 다 회개하기에 이르기를 원하시느니라"},{"ref":"벧후 3:18","book_en":"2Peter","ch":3,"v":18,"note":"편지의 마지막 권면으로, 예수 그리스도의 은혜와 그분을 아는 지식에서 자라가라고 당부합니다.","text":"오직 우리 주 곧 구주 예수 그리스도의 은혜와 저를 아는 지식에서 자라 가라 영광이 이제와 영원한 날까지 저에게 있을찌어다"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『Expository Sermons on 2 Peter』 (벧후 1장, Banner of Truth)","text":"로이드존스는 베드로후서 1장을 그리스도인의 성장에 대한 강해로 다루며, 믿음에 덕을 더해 나가는 삶의 필요성을 강조했다. 그는 하나님의 신성한 성품에 참여하는 자가 되었다는 약속을 근거로, 성도가 부르심과 택하심을 굳게 하도록 힘써야 한다고 설명했다. 또한 예언의 말씀을 어두운 데 비치는 등불에 비유하며, 성경에 대한 확고한 신뢰를 성도의 삶의 기초로 삼았다."}]},{"chapter":2,"summaries":[{"author":"마틴 로이드존스","source":"『Expository Sermons on 2 Peter』 (벧후 2장, Banner of Truth)","text":"로이드존스는 거짓 교사들의 등장과 그들의 심판을 다루며, 하나님께서 경건한 자를 시험에서 건지시는 분임을 강조했다. 그는 발람의 길과 같은 탐욕과 거짓 가르침을 경계하며, 성도가 미혹되지 않도록 진리 안에 거해야 한다고 설명했다. 이 장은 교회를 향한 하나님의 보호하심과 거짓 가르침에 대한 엄중한 경고를 함께 보여준다."}]},{"chapter":3,"summaries":[{"author":"마틴 로이드존스","source":"『Expository Sermons on 2 Peter』 (벧후 3장, Banner of Truth)","text":"로이드존스는 말세에 조롱하는 자들의 등장과 주의 날을 다루며, 하나님의 오래 참으심이 구원의 기회임을 강조했다. 그는 새 하늘과 새 땅을 바라보는 소망이 성도를 거룩한 삶으로 이끈다고 설명하며, 은혜 안에서 자라가는 것을 베드로후서의 마지막 권면으로 제시했다."}]}],"exposition_note":"로이드존스: 『Expository Sermons on 2 Peter』 (벧후 전체, Banner of Truth)"},{"id":"b_1jn","type":"book","name":"요한일서","name_en":"1John","tagline":"하나님은 사랑이십니다","summary":"요한일서는 사도 요한이 쓴 편지로, 하나님은 빛이시며 사랑이심을 선포합니다. 예수님의 성육신을 부인하는 이단을 경계하고, 서로 사랑하라고 권면합니다. '하나님은 사랑이시라'는 고백이 이 책에 있습니다. 개혁주의 관점에서 참된 신앙은 바른 교리와 사랑의 삶이 함께 갑니다.","verses":[{"ref":"요일 1:9","book_en":"1John","ch":1,"v":9,"text":"만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요"},{"ref":"요일 4:8","book_en":"1John","ch":4,"v":8,"text":"사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"},{"ref":"요일 4:19","book_en":"1John","ch":4,"v":19,"text":"우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"}],"related":["f_john_apostle","d_christ","d_salvation"],"meta":{"category":"일반서신","author":"요한","date":"AD 85~95년경","chapters":5,"year_est":90,"emperor":"도미티아누스"},"sections":[{"range":"1장","text":"하나님은 빛이시니 어둠에 행하지 마십시오(1:5-6). 죄를 자백하면 신실하고 의로우신 하나님이 용서하시고 깨끗하게 하십니다(1:9).","title":"빛 가운데 행하라"},{"range":"2장","text":"그의 계명을 지키는 자라야 하나님을 아는 것입니다(2:3). 적그리스도가 많으니 성령의 기름부으심을 따라 진리 안에 거하십시오.","title":"계명을 지키는 자"},{"range":"3장","text":"하나님의 사랑으로 자녀라 일컬음을 받았습니다(3:1). 말과 혀로만이 아니라 행함과 진실함으로 사랑하십시오(3:18).","title":"하나님의 자녀답게"},{"range":"4장","text":"사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라(4:8). 하나님이 먼저 우리를 사랑하셨으니 우리도 서로 사랑해야 합니다.","title":"하나님은 사랑이시라"},{"range":"5장","text":"이 글을 쓰는 목적은 너희에게 영생이 있음을 알게 하려 함이라(5:13)입니다. 예수님을 믿는 자는 구원을 확신할 수 있습니다.","title":"구원의 확신"}],"chapter_verses":[{"book_id":"b_
