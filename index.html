<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>신약 성경 그래프</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f5f7f6; --surface:#ffffff; --surface-2:#eef2f0; --text:#17211d; --muted:#59645f;
      --line:#d9e1dd; --line-strong:#bcc8c2; --accent:#1d5e49; --accent-soft:#e3f0eb;
      --book:#7FA8DC; --book-fill:#DCE9FA; --figure:#6FCF97; --figure-fill:#D8F0E2;
      --event:#F2B880; --event-fill:#FDEBD7; --doctrine:#B79CED; --doctrine-fill:#E9DFFA;
      --world:#9DB4BC; --world-fill:#E3E9EC; --korea:#D895A3; --korea-fill:#F9E2E7;
      --edge:rgba(73,91,82,.23); --edge-hi:rgba(29,94,73,.78); --scrim:rgba(12,20,16,.42);
      --shadow:0 16px 45px rgba(31,48,40,.12); --focus:#145dca;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --bg:#111714; --surface:#19211d; --surface-2:#222c27; --text:#eef4f1; --muted:#afbbb5;
        --line:#35433c; --line-strong:#516158; --accent:#75c7a8; --accent-soft:#203b31;
        --book:#8FB4E3; --book-fill:#1E344D; --figure:#86D6A8; --figure-fill:#1D3C2F;
        --event:#F0BE8E; --event-fill:#4A2F1C; --doctrine:#C4A9F0; --doctrine-fill:#382B49;
        --world:#A9BEC6; --world-fill:#2A3438; --korea:#DFA3AF; --korea-fill:#4A3037;
        --edge:rgba(190,211,201,.22); --edge-hi:rgba(117,199,168,.85); --scrim:rgba(0,0,0,.62);
        --shadow:0 18px 55px rgba(0,0,0,.35); --focus:#82b4ff;
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    .app{height:100dvh;min-height:560px;display:flex;flex-direction:column}
    .top{padding:18px clamp(16px,3vw,34px) 12px;background:var(--surface);border-bottom:1px solid var(--line);z-index:4}
    .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px}
    .intro h1{font-size:clamp(23px,3vw,34px);line-height:1.15;letter-spacing:-.045em;margin:0;font-weight:760}
    .intro p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
    .count{flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;background:var(--surface-2);padding:7px 10px;border-radius:6px}
    .controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,330px);gap:14px;align-items:center}
    .tabs{display:flex;gap:6px;flex-wrap:wrap}
    .tab{border:1px solid transparent;background:transparent;padding:8px 11px;border-radius:7px;color:var(--muted);font-weight:650;font-size:13px;white-space:nowrap}
    .tab:hover{background:var(--surface-2);color:var(--text)}
    .tab[aria-selected="true"]{background:var(--accent);color:#fff}
    @media(prefers-color-scheme:dark){.tab[aria-selected="true"]{color:#102019}}
    .search-wrap{position:relative}
    .search{width:100%;height:40px;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:0 38px 0 38px;outline:none}
    .search:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
    .search-icon{position:absolute;left:12px;top:10px;width:19px;height:19px;color:var(--muted);pointer-events:none}
    .search-clear{position:absolute;right:7px;top:6px;width:28px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:6px;display:none}
    .search-clear.visible{display:grid;place-items:center}
    .results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;max-height:min(360px,55vh);overflow:auto;display:none;z-index:30;padding:6px}
    .results.open{display:block}
    .result{width:100%;border:0;background:transparent;border-radius:7px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;align-items:center}
    .result:hover,.result:focus{background:var(--surface-2);outline:none}
    .result-dot{width:10px;height:10px;border-radius:50%}
    .result strong{font-size:14px;display:block}
    .result small{font-size:12px;color:var(--muted);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}
    .viewbar{min-height:54px;padding:9px clamp(16px,3vw,34px);display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--bg);border-bottom:1px solid var(--line)}
    .viewcopy{display:flex;align-items:baseline;gap:9px;min-width:0}
    .viewcopy strong{font-size:14px;white-space:nowrap}
    .viewcopy span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .legend{display:flex;gap:11px;flex:none}
    .legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
    .legend i{width:8px;height:8px;border-radius:50%;display:block;background:var(--c)}
    .view-tools{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap}
    .type-filters{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
    .type-filters[hidden]{display:none}
    .type-filter{min-height:31px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:720;color:var(--text);white-space:nowrap}
    .type-filter:hover{border-color:var(--type-color);background:var(--surface-2)}
    .type-filter[aria-pressed="false"]{color:var(--muted);background:transparent;border-style:dashed;opacity:.7}
    .type-filter[aria-pressed="false"] .type-dot{background:transparent;border:1.5px solid var(--type-color)}
    .type-dot{width:8px;height:8px;border-radius:50%;background:var(--type-color);flex:none}
    .type-filters:not([hidden])+.legend{display:none}
    #figureFilters{justify-content:flex-start}
    #figureFilters .type-filter{font-size:11px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;flex:1;transition:grid-template-columns .2s ease}
    .layout.detail-open{grid-template-columns:minmax(0,1fr) 390px}
    .stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
    .stage.event-mode,.stage.timeline-mode,.stage.book-mode{overflow:auto;overscroll-behavior:contain}
    .stage.event-mode canvas,.stage.event-mode .hint,.stage.event-mode .zoom,.stage.timeline-mode canvas,.stage.timeline-mode .hint,.stage.timeline-mode .zoom,.stage.book-mode canvas,.stage.book-mode .hint,.stage.book-mode .zoom{display:none}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
    .figure-board{display:none;width:100%;max-width:1480px;margin:0 auto;padding:18px clamp(14px,2.5vw,28px) 48px;column-count:2;column-gap:18px}
    .stage.figure-mode .figure-board{display:none}
    .figure-group{position:relative;display:inline-block;width:100%;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;break-inside:avoid;vertical-align:top}
    .figure-group-head{position:relative;z-index:3;min-height:68px;padding:13px 15px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--figure-fill) 40%,var(--surface))}
    .figure-group-head strong{display:block;font-size:13px;line-height:1.35;font-weight:800}
    .figure-group-head span{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45;word-break:keep-all}
    .figure-group-head small{position:absolute;right:14px;top:14px;color:var(--muted);font-size:10px;font-weight:750;font-variant-numeric:tabular-nums}
    .figure-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 10px;padding:22px 14px 25px}
    .figure-edges{position:absolute;z-index:1;left:0;right:0;top:68px;width:100%;height:calc(100% - 68px);pointer-events:none;overflow:visible}
    .figure-edge{stroke:#495B52;stroke-width:.8;stroke-opacity:.45;vector-effect:non-scaling-stroke}
    @media(prefers-color-scheme:dark){.figure-edge{stroke:#BED3C9;stroke-opacity:.4}}
    .figure-person{position:relative;z-index:2;min-width:0;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:5px 3px 0;border:0;border-radius:8px;background:transparent;text-align:center}
    .figure-person:hover,.figure-person:focus-visible{background:color-mix(in srgb,var(--figure-fill) 44%,transparent);outline:none}
    .figure-person:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
    .figure-dot{flex:none;width:var(--dot-size);height:var(--dot-size);border-radius:50%;background:var(--dot-color);border:2px solid var(--surface);box-shadow:0 0 0 1px color-mix(in srgb,var(--figure) 26%,transparent)}
    .figure-person.tier-0{--dot-size:28px;--dot-color:color-mix(in srgb,var(--figure-fill) 92%,var(--figure))}
    .figure-person.tier-1{--dot-size:39px;--dot-color:color-mix(in srgb,var(--figure-fill) 60%,var(--figure))}
    .figure-person.tier-2{--dot-size:50px;--dot-color:color-mix(in srgb,var(--figure-fill) 30%,var(--figure))}
    .figure-person.tier-3{--dot-size:62px;--dot-color:var(--figure)}
    .figure-name{max-width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:color-mix(in srgb,var(--surface) 96%,transparent);box-shadow:0 2px 8px color-mix(in srgb,var(--bg) 68%,transparent);font-size:11px;font-weight:650;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
    .figure-person[aria-pressed="true"] .figure-name{border-color:var(--figure);color:var(--accent);font-weight:800}
    .book-board{display:none;min-height:100%;padding:18px 20px 44px;width:100%;position:relative}
    .stage.book-mode .book-board{display:block}
    .book-group{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
    .book-group-head{min-height:50px;display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--book-fill) 38%,var(--surface))}
    .book-group-head strong{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap}
    .book-group-head span{font-size:11px;line-height:1.45;color:var(--muted)}
    .book-group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px}
    .book-group .timeline-item{position:relative;left:auto!important;top:auto!important;width:100%!important;min-height:92px;padding:10px 11px 10px 14px}
    .book-group .timeline-item strong{font-size:13px}
    .book-group .event-tagline{margin:6px 0 0;font-size:12px;line-height:1.5}
    .synoptic-tag{display:inline-block;margin:0 0 6px;color:var(--book);font-size:9.5px;font-weight:800;line-height:1.3}
    .timeline-board{display:none;min-height:100%;padding:18px 20px 44px;width:max-content;min-width:100%;position:relative}
    .stage.timeline-mode .timeline-board{display:block}
    .timeline-tools{position:sticky;left:0;z-index:5;width:max-content;max-width:calc(100vw - 40px);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .timeline-note{margin:0;padding:7px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11px;box-shadow:0 2px 8px rgba(31,48,40,.06)}
    .timeline-jumps{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .timeline-jump{min-height:28px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:10.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(31,48,40,.05)}
    .timeline-jump:hover,.timeline-jump:focus-visible{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);outline:none}
    .timeline-lane{position:relative;margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
    .lane-head{position:sticky;left:0;z-index:4;width:150px;height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-right:1px solid var(--line);font-size:12px;font-weight:800}
    .lane-head i{width:9px;height:9px;border-radius:50%;background:var(--lane-color);box-shadow:0 0 0 4px color-mix(in srgb,var(--lane-color) 16%,transparent)}
    .lane-axis{position:absolute;left:24px;right:24px;top:56px;height:2px;background:var(--line-strong)}
    .timeline-item{position:absolute;width:126px;min-height:55px;text-align:left;padding:8px 9px 8px 12px;border:1px solid color-mix(in srgb,var(--item-color) 42%,var(--line));border-radius:7px;background:var(--surface);box-shadow:0 2px 8px rgba(31,48,40,.07)}
    .timeline-item:before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:4px;border-radius:7px 0 0 7px;background:var(--item-color)}
    .timeline-item:hover,.timeline-item:focus-visible{outline:none;border-color:var(--item-color);background:color-mix(in srgb,var(--item-fill) 52%,var(--surface))}
    .timeline-item time{display:block;margin-bottom:3px;color:var(--item-color);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
    .timeline-item strong{display:block;font-size:11.5px;line-height:1.35;word-break:keep-all}
    .timeline-tick{position:absolute;top:46px;transform:translateX(-50%);font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
    .timeline-tick:after{content:"";display:block;width:1px;height:9px;margin:3px auto 0;background:var(--line-strong)}
    .emperor-lane{height:118px}.emperor-lane .lane-axis{top:83px}.emperor-lane .timeline-tick{top:74px}
    .reign-bar{position:absolute;top:50px;height:27px;min-width:34px;border:1px solid color-mix(in srgb,var(--doctrine) 48%,var(--line));border-radius:5px;background:color-mix(in srgb,var(--doctrine-fill) 72%,var(--surface));color:var(--doctrine);font-size:10px;font-weight:760;padding:6px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
    .reign-bar:hover,.reign-bar:focus-visible{outline:2px solid var(--focus);outline-offset:1px;z-index:3}
    .republic-bar{border-style:dashed;color:var(--world);background:var(--world-fill)}
    .timeline-lane.bible-lane{height:var(--lane-height)}.timeline-lane.world-lane,.timeline-lane.korea-lane{height:var(--lane-height)}
    .event-list{display:none;width:min(880px,100%);margin:0 auto;padding:22px clamp(16px,4vw,38px) 52px;counter-reset:event-card}
    .stage.event-mode .event-list{display:block}
    .event-card{position:relative;width:100%;display:grid;grid-template-columns:94px minmax(0,1fr);gap:18px;text-align:left;border:1px solid var(--line);background:var(--surface);padding:19px 20px;margin:0 0 14px;border-radius:10px;box-shadow:0 3px 12px rgba(31,48,40,.05);counter-increment:event-card}
    .event-card:hover,.event-card:focus-visible{border-color:var(--event);outline:none;background:color-mix(in srgb,var(--event-fill) 38%,var(--surface))}
    .event-time{align-self:start;color:var(--event);font-size:12px;font-weight:750;line-height:1.35;padding-top:3px;font-variant-numeric:tabular-nums}
    .event-time:before{content:counter(event-card,decimal-leading-zero);display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
    .event-name{display:block;margin:0;font-size:19px;font-weight:750;line-height:1.25;letter-spacing:-.025em}
    .event-tagline{display:block;margin:7px 0 12px;color:var(--muted);font-size:13.5px;line-height:1.55}
    .event-links{display:flex;flex-wrap:wrap;gap:6px}
    .event-link{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:var(--surface-2);padding:5px 8px;font-size:11px;font-weight:650;color:var(--text)}
    .event-link:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--link-color)}
    canvas.dragging{cursor:grabbing}
    canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--focus)}
    .hint{position:absolute;left:16px;bottom:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);color:var(--muted);font-size:11px;padding:7px 9px;border-radius:6px;pointer-events:none}
    .zoom{position:absolute;right:14px;bottom:14px;display:grid;gap:6px}
    .icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--text);box-shadow:0 3px 12px rgba(28,43,36,.08)}
    .icon-btn:hover{background:var(--surface-2)}
    .icon-btn svg{width:18px;height:18px}
    .detail{display:none;background:var(--surface);border-left:1px solid var(--line);min-height:0;overflow:auto}
    .detail.open{display:block}
    .detail-inner{padding:24px 24px 40px}
    .detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
    .close{width:36px;height:36px;border:0;background:var(--surface-2);border-radius:8px;display:grid;place-items:center;flex:none}
    .close svg{width:18px;height:18px}
    .badge{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:5px 8px;font-size:11px;font-weight:750;background:var(--fill);color:var(--type-color);margin-bottom:10px}
    .detail-title{display:flex;align-items:baseline;gap:9px;min-width:0}
    .detail h2{font-size:27px;line-height:1.18;margin:0;letter-spacing:-.035em}
    .google-link{flex:none;color:var(--muted);font-size:19px;line-height:1;text-decoration:none;opacity:.58;transition:opacity .16s ease,color .16s ease}
    .google-link:hover,.google-link:focus-visible{color:var(--text);opacity:1;outline:none}
    .bible-link{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:14px 7px;margin:-14px -7px -14px 1px;vertical-align:baseline;color:var(--muted);opacity:.62;text-decoration:none;font-size:10px;font-style:italic;font-weight:600;line-height:16px;letter-spacing:-.01em;border-radius:6px;transition:opacity .16s ease,color .16s ease}
    .bible-link:hover{color:var(--text);opacity:1}
    .bible-link:focus-visible{color:var(--text);opacity:1;outline:2px solid var(--focus);outline-offset:-8px}
    .doctrine-link-layer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
    .doctrine-link-layer[hidden]{display:none}
    .doctrine-google{position:absolute;width:20px;height:20px;display:grid;place-items:center;pointer-events:auto;color:var(--muted);font-size:9px;line-height:1;text-decoration:none;opacity:.58;transition:opacity .16s ease,color .16s ease}
    .doctrine-google:hover,.doctrine-google:focus-visible{color:var(--text);opacity:1;outline:none}
    .en{font-size:13px;color:var(--muted);margin-top:4px}
    .tagline{font-size:16px;line-height:1.55;margin:17px 0 0;font-weight:650;color:var(--accent)}
    .summary{font-size:14.5px;line-height:1.78;margin:13px 0 0;color:var(--text);word-break:keep-all}
    .reading-list{margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .reading-item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:13px;padding:15px 2px}
    .reading-item+.reading-item{border-top:1px solid var(--line)}
    .reading-range{font-size:11px;font-weight:750;line-height:1.45;color:var(--book);padding-top:2px}
    .reading-copy strong{display:block;font-size:14px;line-height:1.45;margin-bottom:5px}
    .reading-copy p{font-size:13.5px;line-height:1.82;margin:0;color:var(--text);word-break:keep-all}
    .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:21px;border-radius:8px;overflow:hidden}
    .meta div{background:var(--surface-2);padding:10px 11px;min-width:0}
    .meta dt{font-size:10px;color:var(--muted);margin:0 0 4px}
    .meta dd{font-size:13px;font-weight:650;margin:0;line-height:1.35}
    .section-title{font-size:13px;margin:25px 0 10px;display:flex;align-items:center;gap:8px}
    .section-title:after{content:"";height:1px;background:var(--line);flex:1}
    .verse{margin:0 0 9px;padding:13px 14px;background:var(--surface-2);border-radius:7px}
    .verse strong{display:block;color:var(--accent);font-size:12px;margin-bottom:6px}
    .verse p{font-family:"Noto Serif KR","AppleMyungjo","Batang",serif;font-size:14px;line-height:1.72;margin:0}
    .chapter-picker{display:flex;align-items:center;gap:10px;margin:0 0 11px;padding:10px 12px;background:var(--surface-2);border-radius:8px}
    .chapter-picker label{font-size:12px;font-weight:750;white-space:nowrap;color:var(--muted)}

<body>
<div class="app">
  <header class="top">
    <div class="intro">
      <div><h1>신약 성경 그래프</h1><p>점을 눌러 책·인물·사건·교리·세계사·한국사의 연결을 따라가 보세요.</p></div>
      <div class="count" id="count" aria-live="polite">노드 수 계산 중</div>
    </div>
    <div class="controls">
      <nav class="tabs" aria-label="그래프 보기 방식">
        <button class="tab" data-view="book" aria-selected="false">신약성경</button>
        <button class="tab" data-view="timeline" aria-selected="true">시대순</button>
        <button class="tab" data-view="figure" aria-selected="false">주요인물</button>
        <button class="tab" data-view="event" aria-selected="false">주요사건</button>
        <button class="tab" data-view="doctrine" aria-selected="false">핵심교리</button>
        <button class="tab" data-view="all" aria-selected="false">지식그래프</button>
      </nav>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" class="search" type="search" autocomplete="off" placeholder="이름 또는 핵심 내용 검색" aria-label="노드 검색" aria-controls="results">
        <button id="clearSearch" class="search-clear" aria-label="검색어 지우기"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <div id="results" class="results" role="listbox"></div>
      </div>
    </div>
  </header>
  <div class="viewbar">
    <div class="viewcopy"><strong id="viewTitle">시대순</strong><span id="viewDesc">로마 황제·성경 사건·세계사 30개·한국사 12개를 같은 시간축에서 살펴보세요.</span></div>
    <div class="view-tools">
      <div class="type-filters" id="typeFilters" aria-label="지식그래프 노드 유형 필터">

        <button class="type-filter" data-type="figure" aria-pressed="false" style="--type-color:var(--figure)"><span class="type-dot"></span>인물</button>
        <button class="type-filter" data-type="event" aria-pressed="true" style="--type-color:var(--event)"><span class="type-dot"></span>사건</button>
        <button class="type-filter" data-type="doctrine" aria-pressed="false" style="--type-color:var(--doctrine)"><span class="type-dot"></span>교리</button>
        <button class="type-filter" data-type="world" aria-pressed="false" style="--type-color:var(--world)"><span class="type-dot"></span>세계사</button>
        <button class="type-filter" data-type="korea" aria-pressed="false" style="--type-color:var(--korea)"><span class="type-dot"></span>한국사</button>
      </div>
      <div class="legend" aria-label="노드 종류 범례">
        <span data-short="책"><i style="--c:var(--book)"></i>신약성경</span><span data-short="인물"><i style="--c:var(--figure)"></i>인물</span><span data-short="사건"><i style="--c:var(--event)"></i>사건</span><span data-short="교리"><i style="--c:var(--doctrine)"></i>교리</span><span data-short="세계"><i style="--c:var(--world)"></i>세계사</span><span data-short="한국"><i style="--c:var(--korea)"></i>한국사</span>
      </div>
      <div class="type-filters" id="figureFilters" aria-label="주요인물 그룹 필터" hidden></div>
    </div>
  </div>
  <main class="layout" id="layout">
    <section class="stage" id="stage" aria-label="신약 성경 연결 그래프">
      <canvas id="graph" tabindex="0" aria-describedby="canvasHelp"></canvas>
      <div class="doctrine-link-layer" id="doctrineLinkLayer" aria-label="핵심교리 Google 검색 링크" hidden></div>
      <div class="figure-board" id="figureBoard" aria-label="역할별 신약 주요인물"></div>
      <div class="book-board" id="bookBoard" aria-label="신약 27권 목록"></div>
      <div class="timeline-board" id="timelineBoard" aria-label="성경과 세계사, 한국사 평행 타임라인"></div>
      <div class="event-list" id="eventList" aria-label="주요사건 시간순 카드 목록"></div>
      <p class="sr-only" id="canvasHelp">노드를 클릭하면 상세 설명을 볼 수 있습니다. 화면을 끌어 이동하고 두 손가락으로 확대할 수 있습니다.</p>
      <div class="hint">점을 누르면 이름 표시 · 드래그 이동 · 스크롤 확대</div>
      <div class="zoom" aria-label="그래프 화면 조절">
        <button class="icon-btn" id="zoomIn" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" id="zoomOut" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
        <button class="icon-btn" id="resetView" aria-label="화면 맞춤"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button>
      </div>
    </section>
    <aside class="detail" id="detail" aria-label="선택한 노드 상세" aria-live="polite"></aside>
  </main>
  <div class="scrim" id="scrim"></div>
  <div class="sr-only" id="status" aria-live="polite"></div>
</div>
<script>
(function(){
  'use strict';
  const DATA={"nodes":[{"id":"b_matthew","type":"book","name":"마태복음","name_en":"Matthew","tagline":"약속된 왕, 예수님을 소개합니다","summary":"마태복음은 예수님이 구약에서 약속된 메시아(왕)이심을 보여 주는 책입니다. 예수님의 족보로 시작해 산상수훈 같은 가르침과 많은 기적을 전합니다. 특히 유대인 독자에게 '예언이 예수님 안에서 이루어졌다'는 점을 강조합니다. 개혁주의 관점에서 마태복음은 하나님의 약속이 역사를 통해 신실하게 성취됨을 보여 줍니다.","verses":[{"ref":"마 1:1","book_en":"Matthew","ch":1,"v":1,"text":"아브라함과 다윗의 자손 예수 그리스도의 세계라"},{"ref":"마 11:28","book_en":"Matthew","ch":11,"v":28,"text":"수고하고 무거운 짐진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"},{"ref":"마 28:19","book_en":"Matthew","ch":28,"v":19,"text":"그러므로 너희는 가서 모든 족속으로 제자를 삼아 아버지와 아들과 성령의 이름으로 세례를 주고"}],"related":["f_jesus","f_mary_mother","f_john_baptist","e_birth","e_baptism","e_cross","e_resurrection","d_christ"],"meta":{"category":"복음서","author":"마태","date":"AD 60년경","chapters":28,"year_est":60,"emperor":"네로"},"sections":[{"range":"1-4장","title":"약속된 왕이 오셨습니다","text":"마태는 예수님의 족보와 탄생, 세례와 광야 시험을 통해 구약의 예언이 그대로 이루어졌음을 보여줍니다. 예수님은 다윗의 자손으로 오신 약속의 메시아이십니다."},{"range":"5-7장","title":"천국 백성은 이렇게 삽니다","text":"산상수훈에서 예수님은 팔복과 주기도문으로 천국 백성의 삶의 모습을 가르치십니다. 구원은 행위가 아니라 은혜이지만, 구원받은 자는 반드시 새로운 삶을 삽니다."},{"range":"8-12장","title":"기적으로 증명된 왕의 권위","text":"병 고침과 귀신 쫓아냄, 풍랑을 잔잔하게 하심으로 예수님의 왕 되심을 드러내십니다. 그러나 종교 지도자들은 오히려 예수님을 배척하기 시작합니다."},{"range":"13-18장","title":"천국 비유와 교회의 기초","text":"씨 뿌리는 자의 비유 등 천국의 비밀을 비유로 가르치시고, 베드로의 고백 위에 교회를 세우시겠다고 약속하십니다. 교회의 주인은 예수님이십니다."},{"range":"19-25장","title":"예루살렘 입성과 마지막 가르침","text":"나귀를 타시고 예루살렘에 입성하신 후 성전을 정화하시고, 감람산에서 재림과 종말에 대해 가르치십니다. 깨어 준비하는 것이 성도의 자세입니다."},{"range":"26-28장","title":"십자가, 부활, 그리고 지상명령","text":"예수님은 우리 죄를 대신해 십자가에서 죽으시고 부활하셨습니다. 부활하신 주님은 모든 민족을 제자로 삼으라는 지상명령을 주셨고, 이는 오늘 우리 교회의 사명입니다."}],"chapter_verses":[{"book_id":"b_matthew","chapter":1,"verses":[{"book_en":"Matthew","ch":1,"note":"예수라는 이름의 뜻이 '자기 백성을 죄에서 구원하실 분'이라는 것, 곧 예수님이 오신 이유가 밝혀지는 구절입니다.","ref":"마 1:21","v":21,"text":"아들을 낳으리니 이름을 예수라 하라 이는 그가 자기 백성을 저희 죄에서 구원할 자이심이라 하니라"},{"book_en":"Matthew","ch":1,"note":"예수님이 '우리와 함께하시는 하나님' 임마누엘이심을 보여주는 탄생 예언의 성취입니다.","ref":"마 1:23","v":23,"text":"보라 처녀가 잉태하여 아들을 낳을 것이요 그 이름은 임마누엘이라 하리라 하셨으니 이를 번역한즉 하나님이 우리와 함께 계시다 함이라"}]},{"book_id":"b_matthew","chapter":2,"verses":[{"book_en":"Matthew","ch":2,"note":"메시아가 베들레헴에서 나실 것이라는 미가 선지자의 예언이 예수님의 탄생으로 이루어졌음을 보여줍니다.","ref":"마 2:6","v":6,"text":"또 유대 땅 베들레헴아 너는 유대 고을 중에 가장 작지 아니하도다 네게서 한 다스리는 자가 나와서 내 백성 이스라엘의 목자가 되리라 하였음이니이다"},{"book_en":"Matthew","ch":2,"note":"동방의 박사들이 아기 예수께 경배하고 예물을 드린 장면으로, 예수님이 만민의 왕이심을 보여줍니다.","ref":"마 2:11","v":11,"text":"집에 들어가 아기와 그 모친 마리아의 함께 있는 것을 보고 엎드려 아기께 경배하고 보배합을 열어 황금과 유향과 몰약을 예물로 드리니라"}]},{"book_id":"b_matthew","chapter":3,"verses":[{"book_en":"Matthew","ch":3,"note":"세례 요한의 첫 외침으로, 천국에 들어가려면 먼저 죄를 회개해야 함을 선포합니다.","ref":"마 3:2","v":2,"text":"회개하라 천국이 가까왔느니라 하였으니"},{"book_en":"Matthew","ch":3,"note":"예수님이 물이 아닌 성령과 불로 세례를 주실 분, 곧 심판자요 구원자이심을 선언합니다.","ref":"마 3:11","v":11,"text":"나는 너희로 회개케 하기 위하여 물로 세례를 주거니와 내 뒤에 오시는 이는 나보다 능력이 많으시니 나는 그의 신을 들기도 감당치 못하겠노라 그는 성령과 불로 너희에게 세례를 주실 것이요"},{"book_en":"Matthew","ch":3,"note":"예수님이 세례받으실 때 하늘에서 들린 음성으로, 하나님이 예수님을 아들로 확증하신 장면입니다.","ref":"마 3:17","v":17,"text":"하늘로서 소리가 있어 말씀하시되 이는 내 사랑하는 아들이요 내 기뻐하는 자라 하시니라"}]},{"book_id":"b_matthew","chapter":4,"verses":[{"book_en":"Matthew","ch":4,"note":"광야 시험에서 예수님이 사탄을 이기신 말씀으로, 하나님의 말씀이 영적 싸움의 무기임을 보여줍니다.","ref":"마 4:4","v":4,"text":"예수께서 대답하여 가라사대 기록되었으되 사람이 떡으로만 살것이 아니요 하나님의 입으로 나오는 모든 말씀으로 살 것이라 하였느니라 하시니"},{"book_en":"Matthew","ch":4,"note":"예수님의 공생애 첫 선포로, 천국이 가까웠으니 회개하라는 복음의 핵심 요약입니다.","ref":"마 4:17","v":17,"text":"이때부터 예수께서 비로소 전파하여 가라사대 회개하라 천국이 가까왔느니라 하시더라"},{"book_en":"Matthew","ch":4,"note":"예수님이 제자들을 부르신 말씀으로, 그리스도인은 부르심 받아 사람을 낚는 자가 됨을 보여줍니다.","ref":"마 4:19","v":19,"text":"말씀하시되 나를 따라 오너라 내가 너희로 사람을 낚는 어부가 되게 하리라 하시니"}]},{"book_id":"b_matthew","chapter":5,"verses":[{"book_en":"Matthew","ch":5,"note":"팔복의 첫 말씀으로, 자기 죄를 알고 하나님 앞에 가난한 마음으로 나오는 자가 천국 백성임을 선언합니다.","ref":"마 5:3","v":3,"text":"심령이 가난한 자는 복이 있나니 천국이 저희 것임이요"},{"book_en":"Matthew","ch":5,"note":"그리스도인은 세상 앞에서 빛이 되어 착한 행실로 하나님께 영광 돌리는 삶을 살아야 합니다.","ref":"마 5:16","v":16,"text":"이같이 너희 빛을 사람 앞에 비취게 하여 저희로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라"},{"book_en":"Matthew","ch":5,"note":"하나님 아버지처럼 온전하라는 명령으로, 성도의 삶의 목표가 하나님의 성품을 닮는 것임을 보여줍니다.","ref":"마 5:48","v":48,"text":"그러므로 하늘에 계신 너희 아버지의 온전하심과 같이 너희도 온전하라"}]},{"book_id":"b_matthew","chapter":6,"verses":[{"book_en":"Matthew","ch":6,"note":"'하늘에 계신 우리 아버지'로 시작하는 주기도문의 첫 구절로, 기도는 하나님을 아버지로 부르는 것에서 시작합니다.","ref":"마 6:9","v":9,"text":"그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며"},{"book_en":"Matthew","ch":6,"note":"삶의 우선순위를 가르치신 말씀으로, 하나님 나라를 먼저 구하면 필요한 것은 하나님이 채우십니다.","ref":"마 6:33","v":33,"text":"너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"}]},{"book_id":"b_matthew","chapter":7,"verses":[{"book_en":"Matthew","ch":7,"note":"구하면 주신다는 기도의 약속으로, 하나님은 구하는 자녀에게 좋은 것으로 응답하시는 아버지이십니다.","ref":"마 7:7","v":7,"text":"구하라 그러면 너희에게 주실 것이요 찾으라 그러면 찾을 것이요 문을 두드리라 그러면 너희에게 열릴 것이니"},{"book_en":"Matthew","ch":7,"note":"이웃에게 대접받고 싶은 대로 대접하라는 황금률로, 율법과 선지자의 핵심을 한 문장으로 요약합니다.","ref":"마 7:12","v":12,"text":"그러므로 무엇이든지 남에게 대접을 받고자 하는대로 너희도 남을 대접하라 이것이 율법이요 선지자니라"}]},{"book_id":"b_matthew","chapter":8,"verses":[{"book_en":"Matthew","ch":8,"note":"이방인 백부장의 믿음을 예수님이 칭찬하신 말씀으로, 믿음은 민족이 아니라 예수님을 향한 신뢰에 있음을 보여줍니다.","ref":"마 8:10","v":10,"text":"예수께서 들으시고 기이히 여겨 좇는 자들에게 이르시되 내가 진실로 너희에게 이르노니 이스라엘 중 아무에게서도 이만한 믿음을 만나보지 못하였노라"},{"book_en":"Matthew","ch":8,"note":"풍랑을 잔잔케 하신 뒤 제자들이 고백한 말씀으로, 예수님이 자연까지 다스리시는 하나님이심을 드러냅니다.","ref":"마 8:27","v":27,"text":"그 사람들이 기이히 여겨 가로되 이 어떠한 사람이기에 바람과 바다도 순종하는고 하더라"}]},{"book_id":"b_matthew","chapter":9,"verses":[{"book_en":"Matthew","ch":9,"note":"죄 사함이 병 고침보다 먼저임을 보여주신 말씀으로, 예수님께는 죄를 용서하시는 하나님의 권세가 있습니다.","ref":"마 9:2","v":2,"text":"침상에 누운 중풍병자를 사람들이 데리고 오거늘 예수께서 저희의 믿음을 보시고 중풍병자에게 이르시되 소자야 안심하라 네 죄 사함을 받았느니라"},{"book_en":"Matthew","ch":9,"note":"예수님이 세리와 죄인과 함께하신 이유를 밝히신 말씀으로, 하나님은 긍휼을 원하시고 죄인을 부르십니다.","ref":"마 9:13","v":13,"text":"너희는 가서 내가 긍휼을 원하고 제사를 원치 아니하노라 하신 뜻이 무엇인지 배우라 내가 의인을 부르러 온 것이 아니요 죄인을 부르러 왔노라 하시니라"}]},{"book_id":"b_matthew","chapter":10,"verses":[{"book_en":"Matthew","ch":10,"note":"제자들을 세상에 보내시며 주신 말씀으로, 지혜롭게 대처하되 순결한 마음을 잃지 말라는 당부입니다.","ref":"마 10:16","v":16,"text":"보라 내가 너희를 보냄이 양을 이리 가운데 보냄과 같도다 그러므로 너희는 뱀 같이 지혜롭고 비둘기 같이 순결하라"},{"book_en":"Matthew","ch":10,"note":"핍박을 두려워하지 말라는 말씀으로, 사람의 손보다 영혼을 주관하시는 하나님을 경외해야 함을 가르칩니다.","ref":"마 10:28","v":28,"text":"몸은 죽여도 영혼은 능히 죽이지 못하는 자들을 두려워하지 말고 오직 몸과 영혼을 능히 지옥에 멸하시는 자를 두려워하라"}]},{"book_id":"b_matthew","chapter":11,"verses":[{"book_en":"Matthew","ch":11,"note":"수고하고 무거운 짐 진 자를 부르시는 예수님의 초청으로, 안식은 율법이 아니라 예수님께 나아옴으로 얻습니다.","ref":"마 11:28","v":28,"text":"수고하고 무거운 짐진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"},{"book_en":"Matthew","ch":11,"note":"예수님의 마음이 온유하고 겸손하시다는 말씀으로, 그분께 배우는 자는 참된 쉼을 얻습니다.","ref":"마 11:29","v":29,"text":"나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라 그러면 너희 마음이 쉼을 얻으리니"}]},{"book_id":"b_matthew","chapter":12,"verses":[{"book_en":"Matthew","ch":12,"note":"예수님이 안식일의 주인이심을 선언하신 말씀으로, 안식일의 참된 의미는 그분 안에서 누리는 쉼입니다.","ref":"마 12:8","v":8,"text":"인자는 안식일의 주인이니라 하시니라"},{"book_en":"Matthew","ch":12,"note":"하나님 뜻대로 행하는 자가 예수님의 가족이라는 말씀으로, 참된 소속은 믿음과 순종으로 맺어집니다.","ref":"마 12:50","v":50,"text":"누구든지 하늘에 계신 내 아버지의 뜻대로 하는 자가 내 형제요 자매요 모친이니라 하시더라"}]},{"book_id":"b_matthew","chapter":13,"verses":[{"book_en":"Matthew","ch":13,"note":"천국의 비밀을 아는 것이 은혜로 주어진 것임을 밝히신 말씀으로, 믿음 자체가 하나님의 선물임을 보여줍니다.","ref":"마 13:11","v":11,"text":"대답하여 가라사대 천국의 비밀을 아는 것이 너희에게는 허락되었으나 저희에게는 아니되었나니"},{"book_en":"Matthew","ch":13,"note":"천국을 밭에 감추인 보화에 비유하신 말씀으로, 천국은 모든 것을 팔고서라도 얻을 가치가 있는 것입니다.","ref":"마 13:44","v":44,"text":"천국은 마치 밭에 감추인 보화와 같으니 사람이 이를 발견한 후 숨겨 두고 기뻐하여 돌아가서 자기의 소유를 다 팔아 그 밭을 샀느니라"}]},{"book_id":"b_matthew","chapter":14,"verses":[{"book_en":"Matthew","ch":14,"note":"물 위를 걸어오시며 두려워하는 제자들에게 하신 말씀으로, 예수님이 함께하시면 두려움이 사라집니다.","ref":"마 14:27","v":27,"text":"예수께서 즉시 일러 가라사대 안심하라 내니 두려워 말라"},{"book_en":"Matthew","ch":14,"note":"배에 있던 제자들이 예수님께 절하며 고백한 말씀으로, 풍랑 속에서도 예수님을 하나님의 아들로 알아보는 것이 믿음입니다.","ref":"마 14:33","v":33,"text":"배에 있는 사람들이 예수께 절하며 가로되 진실로 하나님의 아들이로소이다 하더라"}]},{"book_id":"b_matthew","chapter":15,"verses":[{"book_en":"Matthew","ch":15,"note":"사람을 더럽히는 것은 음식이 아니라 마음에서 나오는 것임을 가르치신 말씀으로, 참된 정결은 마음의 문제입니다.","ref":"마 15:11","v":11,"text":"입에 들어가는 것이 사람을 더럽게 하는 것이 아니라 입에서 나오는 그것이 사람을 더럽게 하는 것이니라"},{"book_en":"Matthew","ch":15,"note":"가나안 여인의 간절한 믿음을 칭찬하신 말씀으로, 예수님은 유대인을 넘어 이방인에게도 은혜를 베푸십니다.","ref":"마 15:28","v":28,"text":"이에 예수께서 대답하여 가라사대 여자야 네 믿음이 크도다 네 소원대로 되리라 하시니 그 시로부터 그의 딸이 나으니라"}]},{"book_id":"b_matthew","chapter":16,"verses":[{"book_en":"Matthew","ch":16,"note":"베드로의 신앙고백으로, 예수님이 그리스도시요 살아 계신 하나님의 아들이심이 복음의 반석입니다.","ref":"마 16:16","v":16,"text":"시몬 베드로가 대답하여 가로되 주는 그리스도시요 살아계신 하나님의 아들이시니이다"},{"book_en":"Matthew","ch":16,"note":"예수님이 이 고백 위에 교회를 세우시겠다고 약속하신 말씀으로, 교회는 흔들리지 않는 하나님의 일입니다.","ref":"마 16:18","v":18,"text":"또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라"},{"book_en":"Matthew","ch":16,"note":"제자의 길을 정의하신 말씀으로, 예수님을 따르는 삶은 자기를 부인하고 십자가를 지는 것입니다.","ref":"마 16:24","v":24,"text":"이에 예수께서 제자들에게 이르시되 아무든지 나를 따라 오려거든 자기를 부인하고 자기 십자가를 지고 나를 좇을 것이니라"}]},{"book_id":"b_matthew","chapter":17,"verses":[{"book_en":"Matthew","ch":17,"note":"변화산에서 들린 하나님의 음성으로, 예수님이 사랑받는 아들이시니 그분의 말씀을 들어야 함을 확증합니다.","ref":"마 17:5","v":5,"text":"말할 때에 홀연히 빛난 구름이 저희를 덮으며 구름 속에서 소리가 나서 가로되 이는 내 사랑하는 아들이요 내 기뻐하는 자니 너희는 저의 말을 들으라 하는지라"},{"book_en":"Matthew","ch":17,"note":"겨자씨만한 믿음도 산을 옮긴다는 말씀으로, 능력은 믿음의 크기가 아니라 믿음의 대상이신 하나님께 있습니다.","ref":"마 17:20","v":20,"text":"가라사대 너희 믿음이 적은 연고니라 진실로 너희에게 이르노니 너희가 만일 믿음이 한 겨자씨만큼만 있으면 이 산을 명하여 여기서 저기로 옮기라 하여도 옮길 것이요 또 너희가 못할 것이 없으리라"}]},{"book_id":"b_matthew","chapter":18,"verses":[{"book_en":"Matthew","ch":18,"note":"어린아이처럼 낮아지지 않으면 천국에 들어갈 수 없다는 말씀으로, 천국은 겸손한 믿음으로 받는 것입니다.","ref":"마 18:3","v":3,"text":"가라사대 진실로 너희에게 이르노니 너희가 돌이켜 어린 아이들과 같이 되지 아니하면 결단코 천국에 들어가지 못하리라"},{"book_en":"Matthew","ch":18,"note":"두세 사람이 예수님의 이름으로 모인 곳에 주님이 함께하신다는 약속으로, 공동 기도의 능력을 보여줍니다.","ref":"마 18:20","v":20,"text":"두 세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라"}]},{"book_id":"b_matthew","chapter":19,"verses":[{"book_en":"Matthew","ch":19,"note":"어린아이들을 막지 말라는 말씀으로, 천국은 아이처럼 순수하게 예수님께 나오는 자들의 것입니다.","ref":"마 19:14","v":14,"text":"예수께서 가라사대 어린 아이들을 용납하고 내게 오는 것을 금하지 말라 천국이 이런 자의 것이니라 하시고"},{"book_en":"Matthew","ch":19,"note":"부자 청년의 이야기 뒤에 하신 말씀으로, 사람으로는 불가능한 구원이 하나님께는 가능함을 선언합니다.","ref":"마 19:26","v":26,"text":"예수께서 저희를 보시며 가라사대 사람으로는 할 수 없으되 하나님으로서는 다 할 수 있느니라"}]},{"book_id":"b_matthew","chapter":20,"verses":[{"book_en":"Matthew","ch":20,"note":"포도원 품꾼 비유의 결론으로, 하나님의 나라에서는 인간의 계산과 달리 은혜가 기준이 됩니다.","ref":"마 20:16","v":16,"text":"이와 같이 나중 된 자로서 먼저 되고 먼저 된 자로서 나중 되리라"},{"book_en":"Matthew","ch":20,"note":"예수님이 오신 목적을 직접 밝히신 말씀으로, 그분은 섬김을 받으러 오신 것이 아니라 섬기러 오셨습니다.","ref":"마 20:28","v":28,"text":"인자가 온것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라"}]},{"book_id":"b_matthew","chapter":21,"verses":[{"book_en":"Matthew","ch":21,"note":"예수님이 예루살렘에 입성하실 때 무리가 외친 환호로, 그분을 다윗의 자손 메시아로 맞이한 장면입니다.","ref":"마 21:9","v":9,"text":"앞에서 가고 뒤에서 따르는 무리가 소리질러 가로되 호산나 다윗의 자손이여 찬송하리로다 주의 이름으로 오시는이여 가장 높은 곳에서 호산나 하더라"},{"book_en":"Matthew","ch":21,"note":"성전을 깨끗케 하시며 하신 말씀으로, 하나님의 집은 기도하는 곳이지 장사하는 곳이 아님을 선언하셨습니다.","ref":"마 21:13","v":13,"text":"저희에게 이르시되 기록된바 내 집은 기도하는 집이라 일컬음을 받으리라 하였거늘 너희는 강도의 굴혈을 만드는도다 하시니라"}]},{"book_id":"b_matthew","chapter":22,"verses":[{"book_en":"Matthew","ch":22,"note":"세금 문제에 답하신 말씀으로, 세상 권위에 순종하되 하나님께 속한 것은 하나님께 드려야 함을 가르칩니다.","ref":"마 22:21","v":21,"text":"가로되 가이사의 것이니이다 이에 가라사대 그런즉 가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라 하시니"},{"book_en":"Matthew","ch":22,"note":"율법 중 가장 큰 계명으로, 하나님 사랑이 모든 계명의 첫째요 으뜸임을 밝히신 말씀입니다.","ref":"마 22:37","v":37,"text":"예수께서 가라사대 네 마음을 다하고 목숨을 다하고 뜻을 다하여 주 너의 하나님을 사랑하라 하셨으니"}]},{"book_id":"b_matthew","chapter":23,"verses":[{"book_en":"Matthew","ch":23,"note":"하나님 나라에서 큰 자의 기준을 뒤집으신 말씀으로, 참된 위대함은 남을 섬기는 데 있습니다.","ref":"마 23:11","v":11,"text":"너희 중에 큰 자는 너희를 섬기는 자가 되어야 하리라"},{"book_en":"Matthew","ch":23,"note":"예루살렘을 향한 예수님의 탄식으로, 하나님은 암탉이 병아리를 모으듯 백성을 품으려 하셨습니다.","ref":"마 23:37","v":37,"text":"예루살렘아 예루살렘아 선지자들을 죽이고 네게 파송된 자들을 돌로 치는 자여 암탉이 그 새끼를 날개 아래 모음 같이 내가 네 자녀를 모으려 한 일이 몇번이냐 그러나 너희가 원치 아니하였도다"}]},{"book_id":"b_matthew","chapter":24,"verses":[{"book_en":"Matthew","ch":24,"note":"천국 복음이 온 세상에 전파된 뒤에 끝이 온다는 말씀으로, 선교가 역사를 이끄는 하나님의 계획입니다.","ref":"마 24:14","v":14,"text":"이 천국 복음이 모든 민족에게 증거되기 위하여 온 세상에 전파되리니 그제야 끝이 오리라"},{"book_en":"Matthew","ch":24,"note":"천지는 없어져도 예수님의 말씀은 영원하다는 선언으로, 성경의 권위와 확실성을 보여줍니다.","ref":"마 24:35","v":35,"text":"천지는 없어지겠으나 내 말은 없어지지 아니하리라"}]},{"book_id":"b_matthew","chapter":25,"verses":[{"book_en":"Matthew","ch":25,"note":"달란트 비유에서 충성된 종에게 하신 칭찬으로, 하나님은 맡긴 것에 대한 신실함을 기뻐하십니다.","ref":"마 25:21","v":21,"text":"그 주인이 이르되 잘 하였도다 착하고 충성된 종아 네가 작은 일에 충성하였으매 내가 많은 것으로 네게 맡기리니 네 주인의 즐거움에 참예할찌어다 하고"},{"book_en":"Matthew","ch":25,"note":"작은 자에게 한 것이 곧 주님께 한 것이라는 말씀으로, 이웃 사랑이 곧 하나님 사랑의 열매임을 보여줍니다.","ref":"마 25:40","v":40,"text":"임금이 대답하여 가라사대 내가 진실로 너희에게 이르노니 너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라 하시고"}]},{"book_id":"b_matthew","chapter":26,"verses":[{"book_en":"Matthew","ch":26,"note":"최후의 만찬에서 잔을 주시며 하신 말씀으로, 예수님의 피가 죄 사함을 위한 새 언약임을 선포합니다.","ref":"마 26:28","v":28,"text":"이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는바 나의 피 곧 언약의 피니라"},{"book_en":"Matthew","ch":26,"note":"겟세마네에서 드리신 기도로, 예수님이 십자가를 앞두고 아버지의 뜻에 완전히 순종하셨음을 보여줍니다.","ref":"마 26:39","v":39,"text":"조금 나아가사 얼굴을 땅에 대시고 엎드려 기도하여 가라사대 내 아버지여 만일 할만하시거든 이 잔을 내게서 지나가게 하옵소서 그러나 나의 원대로 마옵시고 아버지의 원대로 하옵소서 하시고"}]},{"book_id":"b_matthew","chapter":27,"verses":[{"book_en":"Matthew","ch":27,"note":"십자가 위에서 외치신 말씀으로, 예수님이 우리의 죄를 대신 지시고 하나님께 버림받으셨음을 보여줍니다.","ref":"마 27:46","v":46,"text":"제 구시 즈음에 예수께서 크게 소리질러 가라사대 엘리 엘리 라마 사박다니 하시니 이는 곧 나의 하나님, 나의 하나님, 어찌하여 나를 버리셨나이까 하는 뜻이라"},{"book_en":"Matthew","ch":27,"note":"예수님이 운명하시자 성소 휘장이 찢어진 사건으로, 그분의 죽음으로 하나님께 나아가는 길이 열렸습니다.","ref":"마 27:51","v":51,"text":"이에 성소 휘장이 위로부터 아래까지 찢어져 둘이 되고 땅이 진동하며 바위가 터지고"}]},{"book_id":"b_matthew","chapter":28,"verses":[{"book_en":"Matthew","ch":28,"note":"부활의 핵심 선언으로, 예수님이 죽음을 이기고 살아나셨다는 것이 기독교 신앙의 기초입니다.","ref":"마 28:6","v":6,"text":"그가 여기 계시지 않고 그의 말씀하시던대로 살아나셨느니라 와서 그의 누우셨던 곳을 보라"},{"book_en":"Matthew","ch":28,"note":"지상명령의 시작으로, 모든 민족을 제자로 삼으라는 예수님의 명령이 교회의 사명입니다.","ref":"마 28:19","v":19,"text":"그러므로 너희는 가서 모든 족속으로 제자를 삼아 아버지와 아들과 성령의 이름으로 세례를 주고"},{"book_en":"Matthew","ch":28,"note":"마태복음의 마지막 말씀으로, 세상 끝날까지 항상 함께하시겠다는 예수님의 약속입니다.","ref":"마 28:20","v":20,"text":"내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼찌어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"팀 켈러","source":"『Hidden Christmas』 (마 1-2장 부분, Viking)","text":"켈러는 마태복음의 족보가 예수를 다윗의 자손이자 아브라함의 자손, 곧 약속된 왕으로 소개한다고 말한다. 족보에 등장하는 다말과 라합과 룻과 밧세바는 당시 족보에 이름을 올리기 어려운 사람들이었는데, 하나님은 바로 이런 깨어진 인생들을 통해 일하셨다. 그래서 성탄은 착한 사람들의 이야기가 아니라 은혜의 이야기이다. 족보의 흐름은 역사가 우연이 아니라 하나님의 약속을 따라 움직인다는 것을 보여준다."}]},{"chapter":2,"summaries":[{"author":"팀 켈러","source":"『Hidden Christmas』 (마 1-2장 부분, Viking)","text":"켈러는 동방박사와 헤롯의 극명한 대조에 주목한다. 먼 길을 온 이방인 박사들은 아기 예수께 엎드려 경배했지만, 유대의 왕 헤롯은 아기를 제거하려 했다. 성탄 앞에서 인간은 경배 아니면 거부, 둘 중 하나로 반응하게 된다. 박사들이 드린 황금과 유향과 몰약은 예수가 왕이시며 하나님이시며 고난받는 구원자이심을 고백하는 예물이다. 성탄은 우리 마음속 헤롯, 곧 내 인생의 왕좌를 내놓지 않으려는 마음을 드러낸다."}]},{"chapter":5,"summaries":[{"author":"마틴 로이드존스","source":"『Studies in the Sermon on the Mount』 1권 (마 5장, Banner of Truth)","text":"로이드존스는 산상수훈이 세상 일반을 향한 새로운 율법이 아니라, 이미 그리스도를 따르는 제자들의 삶을 그리는 말씀임을 강조한다. 팔복은 그리스도인이 되려고 애써야 할 덕목 목록이 아니라, 그리스도인이 이미 어떤 사람인지를 보여주는 초상화이다. 마음이 가난한 자가 첫 번째 복인 이유는 자기 의를 내려놓는 자리에서 비로소 하나님의 나라가 열리기 때문이다. 소금과 빛의 비유는 그리스도인이 세상 속에 스며들어 썩음을 막고 어둠을 밝히는 존재임을 가르친다."}]},{"chapter":6,"summaries":[{"author":"마틴 로이드존스","source":"『Studies in the Sermon on the Mount』 2권 (마 6장, Banner of Truth)","text":"로이드존스는 6장이 하나님 앞에서의 은밀한 경건을 다룬다고 본다. 구제와 기도와 금식은 사람에게 보이려고 하면 이미 상을 다 받은 것이므로, 은밀한 중에 보시는 아버지께 드려야 한다. 주기도문은 하나님의 이름과 나라를 먼저 구하고, 일용할 양식과 용서와 시험에서의 건지심을 구하는 기도의 모범이다. 염려하지 말라는 말씀은 무계획을 뜻하는 것이 아니라, 돌보시는 하나님 아버지를 신뢰하는 믿음의 문제이다."}]},{"chapter":7,"summaries":[{"author":"마틴 로이드존스","source":"『Studies in the Sermon on the Mount』 2권 (마 7장, Banner of Truth)","text":"로이드존스는 비판하지 말라는 말씀이 모든 판단을 금하는 것이 아니라 위선에 대한 경고라고 풀어준다. 형제의 눈에 있는 티를 보기 전에 먼저 자기 눈의 들보를 빼내야 한다. 좁은 문으로 들어가라는 말씀은 구원이 값싼 것이 아님을 보여주고, 거짓 선지자는 그 열매로 분별해야 한다. 말씀을 듣고 행하는 자가 반석 위에 집을 짓는 자이며, 이것이 산상수훈 전체의 결론이다."}]}],"exposition_note":"로이드존스: 산상수훈(마 5-7장) / 켈러: 성탄 이야기(마 1-2장)"},{"id":"b_mark","type":"book","name":"마가복음","name_en":"Mark","tagline":"가장 짧고 빠른 예수님 이야기","summary":"마가복음은 네 복음서 중 가장 짧고 속도감 있게 예수님의 사역을 전합니다. '예수님은 하나님의 아들 그리스도'라는 고백으로 시작해 십자가와 부활로 끝납니다. 베드로의 증언을 마가가 기록했다는 전통이 있습니다. 고난받는 종으로서의 예수님을 강조하며, 제자의 길도 고난과 섬김임을 보여 줍니다.","verses":[{"ref":"막 1:1","book_en":"Mark","ch":1,"v":1,"text":"하나님의 아들 예수 그리스도 복음의 시작이라"},{"ref":"막 10:45","book_en":"Mark","ch":10,"v":45,"text":"인자의 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라"},{"ref":"막 16:6","book_en":"Mark","ch":16,"v":6,"text":"청년이 이르되 놀라지 말라 너희가 십자가에 못 박히신 나사렛 예수를 찾는구나 그가 살아나셨고 여기 계시지 아니하니라 보라 그를 두었던 곳이니라"}],"related":["f_jesus","f_peter","f_john_baptist","e_baptism","e_cross","e_resurrection","d_christ"],"meta":{"category":"복음서","author":"마가","date":"AD 55~65년경","chapters":16,"year_est":60,"emperor":"네로"},"sections":[{"range":"1-3장","title":"복음의 시작","text":"세례 요한의 외침으로 시작해 예수님의 세례, 시험, 제자 부르심이 이어집니다. 예수님은 말씀과 기적으로 하나님의 나라가 임했음을 선포하십니다."},{"range":"4-8장","title":"기적과 오해","text":"비유로 천국을 가르치시고 오병이어 등 기적을 행하시지만, 사람들은 여전히 예수님이 누구신지 잘 모릅니다. 베드로가 주는 그리스도시니이다라고 고백합니다."},{"range":"9-10장","title":"고난을 예고하신 예수님","text":"변화산에서 영광을 보이신 예수님은 세 번에 걸쳐 고난과 부활을 예고하십니다. 인자가 온 것은 섬김을 받으려 함이 아니라 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함입니다(10:45)."},{"range":"11-13장","title":"예루살렘에서의 마지막 한 주","text":"성전에 입성해 장사하는 자들을 내쫓으시고, 감람산에서 종말에 대해 가르치십니다. 겉모습이 아닌 중심을 보시는 하나님 앞에 진실해야 합니다."},{"range":"14-16장","title":"십자가와 빈 무덤","text":"잡히시고 십자가에 못 박히셨지만 사흘 만에 부활하셨습니다. 여인들에게 가장 먼저 보이신 부활은 연약한 자를 쓰시는 하나님의 은혜를 보여줍니다."}],"chapter_verses":[{"book_id":"b_mark","chapter":1,"verses":[{"ref":"막 1:15","book_en":"Mark","ch":1,"v":15,"note":"예수님이 공생애를 시작하시며 처음 선포하신 말씀으로, 복음의 핵심(하나님 나라·회개·믿음)이 한 구절에 담겨 있습니다.","text":"가라사대 때가 찼고 하나님 나라가 가까왔으니 회개하고 복음을 믿으라 하시더라"}]},{"book_id":"b_mark","chapter":2,"verses":[{"ref":"막 2:17","book_en":"Mark","ch":2,"v":17,"note":"예수님이 죄인을 부르러 오셨다고 직접 밝히신 말씀으로, 복음이 병든 자 같은 죄인을 위한 것임을 보여줍니다.","text":"예수께서 들으시고 저희에게 이르시되 건강한 자에게는 의원이 쓸데 없고 병든 자에게라야 쓸데 있느니라 내가 의인을 부르러 온것이 아니요 죄인을 부르러 왔노라 하시니라"}]},{"book_id":"b_mark","chapter":3,"verses":[{"ref":"막 3:35","book_en":"Mark","ch":3,"v":35,"note":"하나님의 뜻대로 사는 사람이 예수님의 참된 가족이라는 말씀으로, 믿음으로 맺어지는 영적 가족을 가르쳐줍니다.","text":"누구든지 하나님의 뜻대로 하는 자는 내 형제요 자매요 모친이니라"}]},{"book_id":"b_mark","chapter":4,"verses":[{"ref":"막 4:39","book_en":"Mark","ch":4,"v":39,"note":"풍랑을 한마디로 잔잔케 하신 장면으로, 예수님이 자연까지 다스리시는 하나님의 아들이심을 보여줍니다.","text":"예수께서 깨어 바람을 꾸짖으시며 바다더러 이르시되 잠잠하라 고요하라 하시니 바람이 그치고 아주 잔잔하여지더라"}]},{"book_id":"b_mark","chapter":5,"verses":[{"ref":"막 5:34","book_en":"Mark","ch":5,"v":34,"note":"혈루증 앓던 여인을 고치시며 하신 말씀으로, 구원은 예수님을 향한 믿음으로 받는다는 것을 보여줍니다.","text":"예수께서 가라사대 딸아 네 믿음이 너를 구원하였으니 평안히 가라 네 병에서 놓여 건강할찌어다"}]},{"book_id":"b_mark","chapter":6,"verses":[{"ref":"막 6:50","book_en":"Mark","ch":6,"v":50,"note":"물 위를 걸어오신 예수님이 두려워하는 제자들에게 하신 말씀으로, 어떤 풍랑 속에서도 주님이 함께하심을 일깨워줍니다.","text":"저희가 다 예수를 보고 놀람이라 이에 예수께서 곧 더불어 말씀하여 가라사대 안심하라 내니 두려워 말라 하시고"}]},{"book_id":"b_mark","chapter":7,"verses":[{"ref":"막 7:15","book_en":"Mark","ch":7,"v":15,"note":"사람을 더럽히는 것은 겉모습이나 음식이 아니라 마음에서 나오는 것임을 가르쳐주신 말씀입니다.","text":"무엇이든지 밖에서 사람에게로 들어가는 것은 능히 사람을 더럽게 하지 못하되"}]},{"book_id":"b_mark","chapter":8,"verses":[{"ref":"막 8:29","book_en":"Mark","ch":8,"v":29,"note":"'너희는 나를 누구라 하느냐'는 예수님의 질문에 베드로가 그리스도라고 고백한, 복음서의 전환점이 되는 장면입니다.","text":"또 물으시되 너희는 나를 누구라 하느냐 베드로가 대답하여 가로되 주는 그리스도시니이다 하매"},{"ref":"막 8:34","book_en":"Mark","ch":8,"v":34,"note":"예수님을 따르는 제자의 길은 자기를 부인하고 자기 십자가를 지는 것임을 분명히 하신 말씀입니다.","text":"무리와 제자들을 불러 이르시되 아무든지 나를 따라 오려거든 자기를 부인하고 자기 십자가를 지고 나를 좇을 것이니라"}]},{"book_id":"b_mark","chapter":9,"verses":[{"ref":"막 9:7","book_en":"Mark","ch":9,"v":7,"note":"변화산에서 하나님이 직접 '이는 내 사랑하는 아들이니'라고 증언하신 말씀으로, 예수님의 신성을 확증해줍니다.","text":"마침 구름이 와서 저희를 덮으며 구름 속에서 소리가 나되 이는 내 사랑하는 아들이니 너희는 저의 말을 들으라 하는지라"},{"ref":"막 9:23","book_en":"Mark","ch":9,"v":23,"note":"믿는 자에게는 능치 못할 일이 없다는 말씀으로, 기도의 응답은 하나님의 능력에 대한 믿음에 달려 있음을 보여줍니다.","text":"예수께서 이르시되 할 수 있거든이 무슨 말이냐 믿는 자에게는 능치 못할 일이 없느니라 하시니"}]},{"book_id":"b_mark","chapter":10,"verses":[{"ref":"막 10:45","book_en":"Mark","ch":10,"v":45,"note":"마가복음 전체의 핵심 구절로, 예수님이 섬기러 오셨고 자기 목숨을 대속물로 주셨다는 복음의 중심을 선언합니다.","text":"인자의 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라"},{"ref":"막 10:27","book_en":"Mark","ch":10,"v":27,"note":"사람으로는 불가능한 구원도 하나님께는 가능하다는 말씀으로, 구원이 전적으로 하나님의 은혜임을 보여줍니다.","text":"예수께서 저희를 보시며 가라사대 사람으로는 할 수 없으되 하나님으로는 그렇지 아니하니 하나님으로서는 다 하실 수 있느니라"}]},{"book_id":"b_mark","chapter":11,"verses":[{"ref":"막 11:24","book_en":"Mark","ch":11,"v":24,"note":"기도하고 구하는 것은 받은 줄로 믿으라는 말씀으로, 믿음의 기도에 대한 예수님의 약속입니다.","text":"그러므로 내가 너희에게 말하노니 무엇이든지 기도하고 구하는 것은 받은 줄로 믿으라 그리하면 너희에게 그대로 되리라"}]},{"book_id":"b_mark","chapter":12,"verses":[{"ref":"막 12:30","book_en":"Mark","ch":12,"v":30,"note":"마음과 목숨과 뜻과 힘을 다해 하나님을 사랑하라는 가장 큰 계명으로, 신앙생활의 방향을 정해줍니다.","text":"네 마음을 다하고 목숨을 다하고 뜻을 다하고 힘을 다하여 주 너의 하나님을 사랑하라 하신 것이요"},{"ref":"막 12:17","book_en":"Mark","ch":12,"v":17,"note":"가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라는 말씀으로, 신앙과 세상 권위에 대한 지혜를 가르쳐줍니다.","text":"이에 예수께서 가라사대 가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라 하시니 저희가 예수께 대하여 심히 기이히 여기더라"}]},{"book_id":"b_mark","chapter":13,"verses":[{"ref":"막 13:31","book_en":"Mark","ch":13,"v":31,"note":"천지는 없어져도 예수님의 말씀은 영원하다는 선언으로, 성경 말씀의 확실성을 붙들게 해줍니다.","text":"천지는 없어지겠으나 내 말은 없어지지 아니하리라"}]},{"book_id":"b_mark","chapter":14,"verses":[{"ref":"막 14:36","book_en":"Mark","ch":14,"v":36,"note":"겟세마네에서 십자가를 앞두고 '아버지의 원대로'라고 기도하신 말씀으로, 순종하는 예수님의 모습을 보여줍니다.","text":"가라사대 아바 아버지여 아버지께는 모든 것이 가능하오니 이 잔을 내게서 옮기시옵소서 그러나 나의 원대로 마옵시고 아버지의 원대로 하옵소서 하시고"},{"ref":"막 14:38","book_en":"Mark","ch":14,"v":38,"note":"마음은 원해도 육신이 약하니 깨어 기도하라는 말씀으로, 유혹을 이기는 길은 기도임을 일깨워줍니다.","text":"시험에 들지 않게 깨어 있어 기도하라 마음에는 원이로되 육신이 약하도다 하시고"}]},{"book_id":"b_mark","chapter":15,"verses":[{"ref":"막 15:34","book_en":"Mark","ch":15,"v":34,"note":"십자가 위에서 외치신 말씀으로, 우리 죄를 대신 지신 예수님의 고통과 대속의 깊이를 보여줍니다.","text":"제 구시에 예수께서 크게 소리지르시되 엘리 엘리 라마 사박다니 하시니 이를 번역하면 나의 하나님 나의 하나님 어찌하여 나를 버리셨나이까 하는 뜻이라"},{"ref":"막 15:39","book_en":"Mark","ch":15,"v":39,"note":"예수님의 죽음을 본 로마 백부장이 '진실로 하나님의 아들이었도다'라고 고백한 장면으로, 십자가가 하나님의 아들을 드러냅니다.","text":"예수를 향하여 섰던 백부장이 그렇게 운명하심을 보고 가로되 이 사람은 진실로 하나님의 아들이었도다 하더라"}]},{"book_id":"b_mark","chapter":16,"verses":[{"ref":"막 16:6","book_en":"Mark","ch":16,"v":6,"note":"빈 무덤에서 들은 부활 선포로, 기독교 신앙의 기초인 예수님의 부활을 전하는 가장 유명한 말씀입니다.","text":"청년이 이르되 놀라지 말라 너희가 십자가에 못 박히신 나사렛 예수를 찾는구나 그가 살아나셨고 여기 계시지 아니하니라 보라 그를 두었던 곳이니라"},{"ref":"막 16:15","book_en":"Mark","ch":16,"v":15,"note":"온 천하에 다니며 만민에게 복음을 전파하라는 지상명령으로, 교회의 사명을 분명히 해줍니다.","text":"또 가라사대 너희는 온 천하에 다니며 만민에게 복음을 전파하라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 1장 부분, Dutton)","text":"켈러는 마가복음 1장을 왕의 등장으로 소개한다. 예수님은 도덕 교사가 아니라 권위 있는 왕으로 오셨다. 귀신을 쫓고 병을 고치는 권세와 죄인을 부르는 초청이 함께 나타난다. 복음의 시작은 인간의 노력이 아니라 왕의 찾아오심이다."}]},{"chapter":2,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 2장 부분, Dutton)","text":"2장에서 켈러가 주목하는 것은 예수님이 죄인들과 함께 식사하신 장면이다. 세리 레위를 제자로 부르신 것은 종교의 상식을 뒤집는다. 복음은 착한 사람을 더 착하게 만드는 것이 아니라 죄인을 의롭다 하시는 하나님의 은혜다. 바리새인들의 비판 앞에서 예수님은 병든 자에게 의원이 필요하다고 말씀하신다."}]},{"chapter":3,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 3장 부분, Dutton)","text":"켈러는 3장에서 예수님이 열두 제자를 세우신 의미를 강조한다. 왕은 홀로 일하지 않고 백성을 세워 함께하게 하신다. 바알세불 논쟁에서는 성령을 모독하는 완고함의 위험을 경고하신다. 혈연이 아니라 하나님의 뜻을 행하는 자가 참된 가족이라는 말씀은 은혜로 맺어진 새 공동체를 보여준다."}]},{"chapter":4,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 4장 부분, Dutton)","text":"씨 뿌리는 비유에서 켈러는 하나님 나라의 역설을 설명한다. 나라는 눈에 띄지 않게 그러나 확실하게 자라난다. 열매의 차이는 씨가 아니라 밭, 곧 말씀을 받는 마음에 있다. 풍랑을 꾸짖으시는 장면은 자연까지 다스리는 왕의 권위를 드러낸다."}]},{"chapter":5,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 5장 부분, Dutton)","text":"5장의 세 이야기는 절망의 깊이를 보여준다. 귀신들린 사람, 고칠 수 없는 병, 이미 죽은 아이가 차례로 나온다. 켈러는 예수님이 어떤 절망 앞에서도 물러서지 않으신다고 강조한다. 믿음으로 손을 내민 여인과 울부짖은 아버지를 주님은 외면하지 않으셨다. 죽음조차 왕의 말씀 앞에서는 잠자는 것에 불과하다."}]},{"chapter":6,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 6장 부분, Dutton)","text":"고향 나사렛 사람들은 예수님을 배척했다. 켈러는 친숙함이 오히려 믿음을 막을 수 있다고 지적한다. 세례 요한의 죽음은 진리를 말하는 자가 치르는 대가를 보여준다. 오천 명을 먹이시고 물 위를 걸으시는 기적 앞에서도 제자들은 깨닫지 못한다. 작은 믿음을 책망하시면서도 제자들을 먹이고 건지시는 주님의 인내가 돋보인다."}]},{"chapter":7,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 7장 부분, Dutton)","text":"바리새인들과의 논쟁에서 예수님은 문제의 핵심을 짚으신다. 사람을 더럽히는 것은 밖에서 들어오는 것이 아니라 마음에서 나오는 것이다. 켈러는 종교적 외식보다 마음의 변화를 강조한다. 수로보니게 여인의 간청에 응답하신 것은 이방인에게도 열려 있는 은혜의 문을 보여준다."}]},{"chapter":8,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 8장 부분, Dutton)","text":"8장은 마가복음의 전환점이다. 베드로가 주는 그리스도이심을 고백하자마자 예수님은 수난을 예고하신다. 켈러는 이 책 전체의 핵심이 여기에 있다고 본다. 참된 왕은 군림하러 온 것이 아니라 십자가의 길로 가신다. 자기를 부인하고 자기 십자가를 지라는 초청이 제자도의 본질이다."}]},{"chapter":9,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 9장 부분, Dutton)","text":"변화산에서 제자들은 왕의 영광을 미리 본다. 그러나 영광의 산에서 내려오신 예수님은 귀신들린 아이를 고치신다. 켈러는 영광의 왕이 고통의 현장으로 내려오심을 강조한다. 믿음 없는 세대를 향한 탄식 뒤에 믿는 자에게는 능치 못할 일이 없다는 약속이 이어진다."}]},{"chapter":10,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 10장 부분, Dutton)","text":"10장은 켈러가 책 전체의 심장으로 꼽는 장이다. 인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이라는 말씀이 중심이다. 부자 청년은 재물을 구했고 야고보와 요한은 자리를 구했지만 왕이 주신 답은 섬김과 대속이었다. 맹인 바디매오의 부르짖음에 멈추신 것은 낮은 자를 향한 왕의 마음이다."}]},{"chapter":11,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 11장 부분, Dutton)","text":"나귀를 타고 입성하신 것은 예언이 이루어진 겸손한 왕의 행차다. 켈러는 사람들의 환호와 일주일 뒤의 십자가를 대비시킨다. 성전을 정화하신 분노는 하나님의 집을 향한 열심에서 나왔다. 잎만 무성한 무화과나무의 저주는 열매 없는 종교에 대한 경고다."}]},{"chapter":12,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 12장 부분, Dutton)","text":"덫을 놓으려는 질문들 앞에서 예수님은 흔들리지 않는 지혜를 보이신다. 가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라는 말씀은 권위에 대한 바른 시각을 준다. 켈러는 가장 큰 계명으로 요약된 사랑, 곧 하나님 사랑과 이웃 사랑이 율법의 중심이라고 강조한다. 과부의 두 렙돈은 액수가 아니라 마음을 보시는 하나님의 시선을 보여준다."}]},{"chapter":13,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 13장 부분, Dutton)","text":"성전의 파괴를 예언하신 예수님은 제자들의 호기심보다 깨어 있음을 명하신다. 켈러는 종말의 때를 계산하기보다 오늘 충성하라고 강조한다. 환난 중에도 복음이 만민에게 증거될 것이라는 약속이 있다. 주인이 언제 올지 모르니 문지기는 깨어 있어야 한다."}]},{"chapter":14,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 14장 부분, Dutton)","text":"향유를 부은 여인의 헌신과 대조적으로 제자들은 하나둘 무너진다. 겟세마네에서 예수님은 홀로 기도하신다. 켈러는 내 원대로 마옵시고 아버지의 원대로 하옵소서라는 기도를 순종의 절정으로 본다. 체포와 재판, 베드로의 부인까지 모든 사람이 버린 자리에서 왕은 홀로 십자가를 향해 가신다."}]},{"chapter":15,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 15장 부분, Dutton)","text":"빌라도 앞에서 침묵하신 예수님은 유대인의 왕이라는 죄패를 달고 십자가에 못 박히신다. 켈러는 가장 비참한 죽음이 가장 영광스러운 왕의 즉위식이었다고 설명한다. 엘리 엘리 라마 사박다니의 부르짖음은 우리 대신 하나님의 버리심을 당하신 것이다. 그 모습을 본 백부장의 참으로 하나님의 아들이었다는 고백은 이방인의 입에서 나온 최초의 신앙고백이다."}]},{"chapter":16,"summaries":[{"author":"팀 켈러","source":"『King's Cross』 (막 16장 부분, Dutton)","text":"빈 무덤 앞에서 여인들은 두려움과 놀라움에 휩싸인다. 그러나 전갈은 분명하다. 예수님은 살아나셨고 갈릴리에서 제자들을 만나실 것이다. 켈러는 도망쳤던 제자들을 다시 부르신다는 점에 주목한다. 은혜의 이야기는 인간의 실패로 끝나지 않고 부활의 새 시작으로 이어진다."}]}],"exposition_note":"팀 켈러: 『King's Cross』 (마가복음 전체, Dutton)"},{"id":"b_luke","type":"book","name":"누가복음","name_en":"Luke","tagline":"모든 사람을 향한 구원의 소식","summary":"누가복음은 의사 누가가 세심하게 조사해 기록한 예수님의 생애입니다. 가난한 사람, 여자, 이방인처럼 소외된 사람들에게 향한 예수님의 사랑을 특별히 강조합니다. 사도행전과 함께 2부작으로 이어집니다. 개혁주의 관점에서 누가복음은 구원이 특정 민족이 아니라 모든 민족에게 미친다는 하나님의 주권적 은혜를 보여 줍니다.","verses":[{"ref":"눅 2:11","book_en":"Luke","ch":2,"v":11,"text":"오늘날 다윗의 동네에 너희를 위하여 구주가 나셨으니 곧 그리스도 주시니라"},{"ref":"눅 19:10","book_en":"Luke","ch":19,"v":10,"text":"인자의 온 것은 잃어버린 자를 찾아 구원하려 함이니라"},{"ref":"눅 24:47","book_en":"Luke","ch":24,"v":47,"text":"또 그의 이름으로 죄 사함을 얻게 하는 회개가 예루살렘으로부터 시작하여 모든 족속에게 전파될 것이 기록되었으니"}],"related":["f_jesus","f_mary_mother","e_birth","e_ascension","d_holyspirit"],"meta":{"category":"복음서","author":"누가","date":"AD 60년경","chapters":24,"year_est":60,"emperor":"네로"},"sections":[{"range":"1-3장","title":"구주의 탄생을 준비하시다","text":"세례 요한과 예수님의 탄생 이야기로 시작합니다. 천사는 오늘 다윗의 동네에 너희를 위하여 구주가 나셨으니 곧 그리스도 주시니라고 선포합니다(2:11)."},{"range":"4-9장","title":"갈릴리에서의 사역","text":"나사렛에서 주의 성령이 내게 임하셨으니 이는 가난한 자에게 복음을 전하게 하시려고 선언하시고(4:18), 병자를 고치시고 열두 제자를 세우십니다."},{"range":"10-19장","title":"예루살렘을 향한 여정","text":"선한 사마리아인, 탕자의 비유 등 잃어버린 자를 찾으시는 하나님의 사랑을 가르치십니다. 삭개오처럼 죄인도 예수님을 만나면 삶이 바뀝니다."},{"range":"20-23장","title":"고난과 십자가","text":"종교 지도자들과의 논쟁, 최후의 만찬, 겟세마네 기도 끝에 십자가에 못 박히십니다. 아버지여 저들을 사하여 주옵소서라는 기도는 대속의 사랑을 보여줍니다(23:34)."},{"range":"24장","title":"부활과 승천","text":"엠마오로 가던 제자들에게 나타나 성경을 풀어 설명하시고, 승천하시며 제자들에게 복음 전파의 사명을 맡기십니다."}],"chapter_verses":[{"book_id":"b_luke","chapter":1,"verses":[{"ref":"눅 1:37","book_en":"Luke","ch":1,"v":37,"note":"하나님의 말씀은 능치 못하심이 없다는 천사의 선언으로, 불가능해 보이는 일도 하나님이 이루신다는 믿음을 줍니다.","text":"대저 하나님의 모든 말씀은 능치 못하심이 없느니라"}]},{"book_id":"b_luke","chapter":2,"verses":[{"ref":"눅 2:11","book_en":"Luke","ch":2,"v":11,"note":"목자들에게 전해진 성탄 선포로, 아기 예수가 곧 구주 그리스도이심을 알리는 복음의 첫 소식입니다.","text":"오늘날 다윗의 동네에 너희를 위하여 구주가 나셨으니 곧 그리스도 주시니라"},{"ref":"눅 2:52","book_en":"Luke","ch":2,"v":52,"note":"소년 예수가 지혜와 키가 자라가며 하나님과 사람에게 사랑받으셨다는 말씀으로, 참 사람이 되신 예수님을 보여줍니다.","text":"예수는 그 지혜와 그 키가 자라가며 하나님과 사람에게 더 사랑스러워 가시더라"}]},{"book_id":"b_luke","chapter":3,"verses":[{"ref":"눅 3:22","book_en":"Luke","ch":3,"v":22,"note":"예수님이 세례 받으실 때 하늘에서 '너는 내 사랑하는 아들이라'고 하신 말씀으로, 삼위일체 하나님이 함께 나타나신 장면입니다.","text":"성령이 형체로 비둘기 같이 그의 위에 강림하시더니 하늘로서 소리가 나기를 너는 내 사랑하는 아들이라 내가 너를 기뻐하노라 하시니라"}]},{"book_id":"b_luke","chapter":4,"verses":[{"ref":"눅 4:18","book_en":"Luke","ch":4,"v":18,"note":"가난한 자에게 복음을, 포로된 자에게 자유를 전하러 오셨다는 예수님의 취임 선언으로, 그분의 사명을 요약해줍니다.","text":"주의 성령이 내게 임하셨으니 이는 가난한 자에게 복음을 전하게 하시려고 내게 기름을 부으시고 나를 보내사 포로 된 자에게 자유를, 눈먼 자에게 다시 보게 함을 전파하며 눌린 자를 자유케 하고"}]},{"book_id":"b_luke","chapter":5,"verses":[{"ref":"눅 5:8","book_en":"Luke","ch":5,"v":8,"note":"기적을 본 베드로가 '나는 죄인이로소이다'라고 엎드린 고백으로, 거룩하신 주님 앞에서 죄를 깨닫는 것이 믿음의 시작임을 보여줍니다.","text":"시몬 베드로가 이를 보고 예수의 무릎 아래 엎드려 가로되 주여 나를 떠나소서 나는 죄인이로소이다 하니"},{"ref":"눅 5:32","book_en":"Luke","ch":5,"v":32,"note":"의인이 아니라 죄인을 불러 회개시키러 오셨다는 말씀으로, 복음이 누구를 위한 것인지 분명히 해줍니다.","text":"내가 의인을 부르러 온 것이 아니요 죄인을 불러 회개시키러 왔노라"}]},{"book_id":"b_luke","chapter":6,"verses":[{"ref":"눅 6:31","book_en":"Luke","ch":6,"v":31,"note":"남에게 받고 싶은 대로 남을 대접하라는 황금률로, 이웃 사랑을 실천하는 가장 쉬운 기준을 알려줍니다.","text":"남에게 대접을 받고자 하는대로 너희도 남을 대접하라"},{"ref":"눅 6:36","book_en":"Luke","ch":6,"v":36,"note":"아버지의 자비하심 같이 자비하라는 말씀으로, 우리가 받은 긍휼을 그대로 나누며 살 것을 가르쳐줍니다.","text":"너희 아버지의 자비하심 같이 너희도 자비하라"}]},{"book_id":"b_luke","chapter":7,"verses":[{"ref":"눅 7:47","book_en":"Luke","ch":7,"v":47,"note":"많이 용서받은 자가 많이 사랑한다는 말씀으로, 은혜를 깊이 아는 사람일수록 사랑이 커짐을 보여줍니다.","text":"이러므로 내가 네게 말하노니 저의 많은 죄가 사하여졌도다 이는 저의 사랑함이 많음이라 사함을 받은 일이 적은 자는 적게 사랑하느니라"},{"ref":"눅 7:50","book_en":"Luke","ch":7,"v":50,"note":"'네 믿음이 너를 구원하였으니 평안히 가라'는 말씀으로, 구원은 예수님을 향한 믿음으로 받는 것임을 확증해줍니다.","text":"예수께서 여자에게 이르시되 네 믿음이 너를 구원하였으니 평안히 가라 하시니라"}]},{"book_id":"b_luke","chapter":8,"verses":[{"ref":"눅 8:50","book_en":"Luke","ch":8,"v":50,"note":"죽은 딸 앞에서 절망한 야이로에게 '두려워 말고 믿기만 하라'고 하신 말씀으로, 절망 속에서도 믿음을 붙들게 해줍니다.","text":"예수께서 들으시고 가라사대 두려워 말고 믿기만 하라 그리하면 딸이 구원을 얻으리라 하시고"}]},{"book_id":"b_luke","chapter":9,"verses":[{"ref":"눅 9:23","book_en":"Luke","ch":9,"v":23,"note":"날마다 자기를 부인하고 제 십자가를 지고 따르라는 말씀으로, 제자의 삶이 매일의 순종임을 가르쳐줍니다.","text":"또 무리에게 이르시되 아무든지 나를 따라 오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 좇을 것이니라"},{"ref":"눅 9:35","book_en":"Luke","ch":9,"v":35,"note":"변화산 구름 속에서 '이는 나의 아들이니 저의 말을 들으라'고 하신 하나님의 음성으로, 예수님 말씀의 권위를 확증해줍니다.","text":"구름 속에서 소리가 나서 가로되 이는 나의 아들 곧 택함을 받은 자니 너희는 저의 말을 들으라 하고"}]},{"book_id":"b_luke","chapter":10,"verses":[{"ref":"눅 10:20","book_en":"Luke","ch":10,"v":20,"note":"능력 행함보다 이름이 하늘에 기록된 것을 기뻐하라는 말씀으로, 구원의 확신이 기쁨의 진짜 이유임을 알려줍니다.","text":"그러나 귀신들이 너희에게 항복하는 것으로 기뻐하지 말고 너희 이름이 하늘에 기록된 것으로 기뻐하라 하시니라"},{"ref":"눅 10:42","book_en":"Luke","ch":10,"v":42,"note":"바쁜 마르다와 달리 말씀 앞에 앉은 마리아가 좋은 편을 택했다는 말씀으로, 주님과 교제하는 시간이 가장 소중함을 보여줍니다.","text":"그러나 몇 가지만 하든지 혹 한 가지만이라도 족하니라 마리아는 이 좋은 편을 택하였으니 빼앗기지 아니하리라 하시니라"}]},{"book_id":"b_luke","chapter":11,"verses":[{"ref":"눅 11:9","book_en":"Luke","ch":11,"v":9,"note":"구하라, 찾으라, 두드리라는 기도의 약속으로, 간절히 구하는 기도에 하나님이 응답하신다는 확신을 줍니다.","text":"내가 또 너희에게 이르노니 구하라 그러면 너희에게 주실 것이요 찾으라 그러면 찾을 것이요 문을 두드리라 그러면 너희에게 열릴 것이니"},{"ref":"눅 11:13","book_en":"Luke","ch":11,"v":13,"note":"구하는 자에게 성령을 주신다는 말씀으로, 기도의 가장 큰 응답은 성령님의 함께하심임을 알려줍니다.","text":"너희가 악할찌라도 좋은 것을 자식에게 줄줄 알거든 하물며 너희 천부께서 구하는 자에게 성령을 주시지 않겠느냐 하시니라"}]},{"book_id":"b_luke","chapter":12,"verses":[{"ref":"눅 12:32","book_en":"Luke","ch":12,"v":32,"note":"'적은 무리여 무서워 말라'는 말씀으로, 연약한 성도에게 하나님 나라를 주시기를 기뻐하시는 아버지의 마음을 보여줍니다.","text":"적은 무리여 무서워 말라 너희 아버지께서 그 나라를 너희에게 주시기를 기뻐하시느니라"},{"ref":"눅 12:34","book_en":"Luke","ch":12,"v":34,"note":"보물 있는 곳에 마음도 있다는 말씀으로, 무엇을 가장 소중히 여기는지 돌아보게 하는 유명한 경고입니다.","text":"너희 보물 있는 곳에는 너희 마음도 있으리라"}]},{"book_id":"b_luke","chapter":13,"verses":[{"ref":"눅 13:3","book_en":"Luke","ch":13,"v":3,"note":"회개하지 않으면 망한다는 엄중한 말씀으로, 회개가 선택이 아니라 반드시 필요한 것임을 일깨워줍니다.","text":"너희에게 이르노니 아니라 너희도 만일 회개치 아니하면 다 이와 같이 망하리라"},{"ref":"눅 13:30","book_en":"Luke","ch":13,"v":30,"note":"나중 된 자가 먼저 된다는 말씀으로, 하나님의 나라는 세상 기준과 다르게 운영됨을 보여줍니다.","text":"보라 나중 된 자로서 먼저 될 자도 있고 먼저 된 자로서 나중 될 자도 있느니라 하시더라"}]},{"book_id":"b_luke","chapter":14,"verses":[{"ref":"눅 14:27","book_en":"Luke","ch":14,"v":27,"note":"자기 십자가를 지고 따르지 않으면 제자가 될 수 없다는 말씀으로, 예수님을 따르는 데는 대가가 따름을 분명히 해줍니다.","text":"누구든지 자기 십자가를 지고 나를 좇지 않는 자도 능히 나의 제자가 되지 못하리라"}]},{"book_id":"b_luke","chapter":15,"verses":[{"ref":"눅 15:7","book_en":"Luke","ch":15,"v":7,"note":"죄인 하나가 회개하면 하늘이 더 기뻐한다는 말씀으로, 하나님 앞에서 한 영혼이 얼마나 소중한지 보여줍니다.","text":"내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라"},{"ref":"눅 15:20","book_en":"Luke","ch":15,"v":20,"note":"돌아오는 아들을 아버지가 달려가 안아주는 장면으로, 회개하는 죄인을 향한 하나님의 긍휼을 가장 아름답게 그린 구절입니다.","text":"이에 일어나서 아버지께로 돌아가니라 아직도 상거가 먼데 아버지가 저를 보고 측은히 여겨 달려가 목을 안고 입을 맞추니"},{"ref":"눅 15:24","book_en":"Luke","ch":15,"v":24,"note":"'죽었다가 다시 살아났다'는 아버지의 선언으로, 회개는 죽음에서 생명으로 옮겨지는 것임을 보여줍니다.","text":"이 내 아들은 죽었다가 다시 살아났으며 내가 잃었다가 다시 얻었노라 하니 저희가 즐거워하더라"}]},{"book_id":"b_luke","chapter":16,"verses":[{"ref":"눅 16:13","book_en":"Luke","ch":16,"v":13,"note":"하나님과 재물을 겸하여 섬길 수 없다는 말씀으로, 돈이 주인이 되지 않도록 마음을 점검하게 해줍니다.","text":"집 하인이 두 주인을 섬길 수 없나니 혹 이를 미워하고 저를 사랑하거나 혹 이를 중히 여기고 저를 경히 여길 것임이니라 너희가 하나님과 재물을 겸하여 섬길 수 없느니라"}]},{"book_id":"b_luke","chapter":17,"verses":[{"ref":"눅 17:10","book_en":"Luke","ch":17,"v":10,"note":"해야 할 일을 다 한 후에도 '무익한 종'이라고 고백하라는 말씀으로, 섬김 뒤에도 교만하지 말 것을 가르쳐줍니다.","text":"이와 같이 너희도 명령 받은 것을 다 행한 후에 이르기를 우리는 무익한 종이라 우리의 하여야 할 일을 한것 뿐이라 할찌니라"},{"ref":"눅 17:21","book_en":"Luke","ch":17,"v":21,"note":"하나님의 나라는 너희 안에 있다는 말씀으로, 하나님 나라는 먼 미래가 아니라 지금 믿는 자 안에 임함을 보여줍니다.","text":"또 여기 있다 저기 있다고도 못하리니 하나님의 나라는 너희 안에 있느니라"}]},{"book_id":"b_luke","chapter":18,"verses":[{"ref":"눅 18:16","book_en":"Luke","ch":18,"v":16,"note":"어린 아이들을 막지 말라는 말씀으로, 하나님 나라는 어린아이처럼 순수히 믿는 자의 것임을 가르쳐줍니다.","text":"예수께서 그 어린 아이들을 불러 가까이 하시고 이르시되 어린 아이들이 내게 오는 것을 용납하고 금하지 말라 하나님의 나라가 이런 자의 것이니라"},{"ref":"눅 18:27","book_en":"Luke","ch":18,"v":27,"note":"사람이 할 수 없는 것을 하나님이 하신다는 말씀으로, 구원은 전적으로 하나님의 능력과 은혜임을 선언합니다.","text":"가라사대 무릇 사람의 할 수 없는 것을 하나님은 하실 수 있느니라"}]},{"book_id":"b_luke","chapter":19,"verses":[{"ref":"눅 19:10","book_en":"Luke","ch":19,"v":10,"note":"잃어버린 자를 찾아 구원하러 오셨다는 말씀으로, 누가복음 전체의 주제를 한 문장으로 요약한 핵심 구절입니다.","text":"인자의 온 것은 잃어버린 자를 찾아 구원하려 함이니라"}]},{"book_id":"b_luke","chapter":20,"verses":[{"ref":"눅 20:25","book_en":"Luke","ch":20,"v":25,"note":"가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라는 말씀으로, 세상 권위와 신앙의 자리를 분별하게 해줍니다.","text":"가라사대 그런즉 가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라 하시니"}]},{"book_id":"b_luke","chapter":21,"verses":[{"ref":"눅 21:33","book_en":"Luke","ch":21,"v":33,"note":"천지는 없어져도 예수님의 말씀은 없어지지 않는다는 선언으로, 흔들리는 세상에서 붙들 말씀의 영원함을 확증해줍니다.","text":"천지는 없어지겠으나 내 말은 없어지지 아니하리라"}]},{"book_id":"b_luke","chapter":22,"verses":[{"ref":"눅 22:19","book_en":"Luke","ch":22,"v":19,"note":"'이는 너희를 위하여 주는 내 몸이라'는 말씀으로, 성찬의 의미를 세우신 예수님의 유언과도 같은 구절입니다.","text":"또 떡을 가져 사례하시고 떼어 저희에게 주시며 가라사대 이것은 너희를 위하여 주는 내 몸이라 너희가 이를 행하여 나를 기념하라 하시고"},{"ref":"눅 22:42","book_en":"Luke","ch":22,"v":42,"note":"십자가를 앞두고 '아버지의 원대로'라고 기도하신 말씀으로, 고난 중에도 순종하신 예수님의 모습을 보여줍니다.","text":"가라사대 아버지여 만일 아버지의 뜻이어든 이 잔을 내게서 옮기시옵소서 그러나 내 원대로 마옵시고 아버지의 원대로 되기를 원하나이다 하시니"}]},{"book_id":"b_luke","chapter":23,"verses":[{"ref":"눅 23:34","book_en":"Luke","ch":23,"v":34,"note":"십자가 위에서 자신을 못 박는 자들을 용서해달라고 기도하신 말씀으로, 예수님의 사랑이 어디까지 미치는지 보여줍니다.","text":"이에 예수께서 가라사대 아버지여 저희를 사하여 주옵소서 자기의 하는 것을 알지 못함이니이다 하시더라 저희가 그의 옷을 나눠 제비 뽑을쌔"},{"ref":"눅 23:43","book_en":"Luke","ch":23,"v":43,"note":"회개한 강도에게 '오늘 나와 함께 낙원에 있으리라'고 약속하신 말씀으로, 마지막 순간에도 구원은 믿음으로 주어짐을 보여줍니다.","text":"예수께서 이르시되 내가 진실로 네게 이르노니 오늘 네가 나와 함께 낙원에 있으리라 하시니라"},{"ref":"눅 23:46","book_en":"Luke","ch":23,"v":46,"note":"'내 영혼을 아버지 손에 부탁하나이다'라는 마지막 말씀으로, 죽음까지 아버지께 맡기신 예수님의 신뢰를 보여줍니다.","text":"예수께서 큰 소리로 불러 가라사대 아버지여 내 영혼을 아버지 손에 부탁하나이다 하고 이 말씀을 하신 후 운명하시다"}]},{"book_id":"b_luke","chapter":24,"verses":[{"ref":"눅 24:6","book_en":"Luke","ch":24,"v":6,"note":"빈 무덤에서 선포된 부활 소식으로, 기독교 신앙의 심장인 예수님의 부활을 전하는 말씀입니다.","text":"여기 계시지 않고 살아나셨느니라 갈릴리에 계실 때에 너희에게 어떻게 말씀하신 것을 기억하라"},{"ref":"눅 24:47","book_en":"Luke","ch":24,"v":47,"note":"회개와 죄 사함의 복음이 모든 족속에게 전파될 것이라는 말씀으로, 세계 선교의 명령을 담고 있습니다.","text":"또 그의 이름으로 죄 사함을 얻게 하는 회개가 예루살렘으로부터 시작하여 모든 족속에게 전파될 것이 기록되었으니"},{"ref":"눅 24:49","book_en":"Luke","ch":24,"v":49,"note":"아버지의 약속하신 것(성령)을 보내신다는 말씀으로, 부활하신 주님이 교회에 성령을 주심을 약속하십니다.","text":"볼찌어다 내가 내 아버지의 약속하신 것을 너희에게 보내리니 너희는 위로부터 능력을 입히울 때까지 이 성에 유하라 하시니라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"팀 켈러","source":"『Hidden Christmas』 (눅 1장 부분, Viking)","text":"켈러는 성탄의 소식이 먼저 임한 곳이 궁전이 아니라 시골 목자들이 있는 들판이었다는 점을 강조한다. 하나님은 사람의 기대와 달리 약하고 낮은 자들을 통해 일하신다고 설명한다. 세례 요한의 아버지 사가랴의 찬송을 통해, 하나님의 약속은 인간의 불가능을 뛰어넘는다고 풀어낸다."}]},{"chapter":2,"summaries":[{"author":"팀 켈러","source":"『Hidden Christmas』 (눅 2장 부분, Viking)","text":"예수님이 여관 방이 아니라 말구유에 나신 것은 우연이 아니라 복음의 본질이라고 설명한다. 하나님 자신이 가장 낮은 자리로 내려오셨으니, 우리도 그분을 만나려면 낮은 자리에서 만나야 한다고 말한다. 목자들이 전한 소식처럼, 성탄의 기쁨은 전해야 할 소식이라고 강조한다."}]},{"chapter":15,"summaries":[{"author":"팀 켈러","source":"『The Prodigal God』 (눅 15장 전체, Dutton)","text":"켈러는 탕자 비유의 핵심이 방탕한 둘째 아들이 아니라, 돌아온 동생을 받아들이지 못한 맏아들에 있다고 본다. 종교적인 도덕주의자야말로 아버지의 마음을 모르는 진짜 길 잃은 자라는 역설을 풀어낸다. 아버지가 두 아들을 향해 집 밖으로 나아가신 것처럼, 하나님은 은혜로 죄인을 찾아오시는 분이라고 설명한다."}]}],"exposition_note":"팀 켈러: 『The Prodigal God』 (눅 15장, Dutton), 『Hidden Christmas』 (눅 1-2장 성탄 이야기, Viking)"},{"id":"b_john","type":"book","name":"요한복음","name_en":"John","tagline":"예수님은 하나님의 아들이십니다","summary":"요한복음은 '예수님이 하나님의 아들 그리스도이심을 믿게 하려' 기록된 책입니다. '나는 ~이다'라는 예수님의 일곱 선언과 표적들을 통해 예수님의 신성을 깊이 보여 줍니다. 다른 복음서와는 다른 독특한 시각으로 예수님을 전합니다. 개혁주의 신학은 요한복음을 기독론의 핵심 본문으로 삼습니다.","verses":[{"ref":"요 1:1","book_en":"John","ch":1,"v":1,"text":"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라"},{"ref":"요 3:16","book_en":"John","ch":3,"v":16,"text":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"},{"ref":"요 20:31","book_en":"John","ch":20,"v":31,"text":"오직 이것을 기록함은 너희로 예수께서 하나님의 아들 그리스도이심을 믿게 하려 함이요 또 너희로 믿고 그 이름을 힘입어 생명을 얻게 하려 함이니라"}],"related":["f_jesus","f_john_apostle","f_john_baptist","f_mary_magdalene","e_cross","e_resurrection","d_christ"],"meta":{"category":"복음서","author":"요한","date":"AD 85~90년경","chapters":21,"year_est":88,"emperor":"도미티아누스"},"sections":[{"range":"1-2장","title":"말씀이 육신이 되셨다","text":"태초에 말씀이 계시니라 이 말씀은 곧 하나님이시니라(1:1). 예수님은 하나님이시며 사람이 되신 분임을 선언합니다. 가나의 기적으로 영광을 드러내십니다."},{"range":"3-4장","title":"거듭남과 생수","text":"니고데모에게 거듭나지 아니하면 하나님 나라를 볼 수 없느니라고 하시고(3:3), 사마리아 여인에게는 영원한 생수를 주십니다. 구원은 성령으로 새로 태어나는 것입니다."},{"range":"5-8장","title":"생명의 떡, 세상의 빛","text":"예수님은 나는 생명의 떡이니(6:35), 나는 세상의 빛이니(8:12)라고 선언하십니다. 예수님을 믿는 자는 영생을 얻습니다."},{"range":"9-12장","title":"선한 목자와 마지막 초청","text":"날 때부터 맹인된 자를 고치시고 나는 선한 목자라고 하십니다(10:11). 나사로를 살리시고 예루살렘에 입성하시며 십자가를 향해 가십니다."},{"range":"13-17장","title":"떠나시며 주신 약속","text":"제자들의 발을 씻기시고 보혜사 성령을 보내주겠다고 약속하십니다. 포도나무 비유로 내 안에 거하라고 하시고, 제자들을 위해 기도하십니다(17장)."},{"range":"18-21장","title":"십자가, 부활, 그리고 사명","text":"다 이루었다 하시고 운명하시지만(19:30), 부활하셔서 도마의 의심을 믿음으로 바꾸시고 베드로에게 내 양을 먹이라고 사명을 주십니다(21:17)."}],"chapter_verses":[{"book_id":"b_john","chapter":1,"verses":[{"book_en":"John","ch":1,"note":"예수님은 처음부터 계신 하나님이시라는, 기독교 신앙의 가장 근본적인 선언입니다.","ref":"요 1:1","v":1,"text":"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라"},{"book_en":"John","ch":1,"note":"하나님이신 말씀이 사람이 되셔서 우리 가운데 사셨다는 성탄의 핵심 진리입니다.","ref":"요 1:14","v":14,"text":"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라"}]},{"book_id":"b_john","chapter":2,"verses":[{"book_en":"John","ch":2,"note":"예수님이 가나에서 보이신 첫 표적으로, 제자들이 그분을 믿게 된 시작점입니다.","ref":"요 2:11","v":11,"text":"예수께서 이 처음 표적을 갈릴리 가나에서 행하여 그 영광을 나타내시매 제자들이 그를 믿으니라"},{"book_en":"John","ch":2,"note":"예수님이 자신의 죽음과 부활을 미리 말씀하신 구절로, 성전보다 크신 분임을 보여줍니다.","ref":"요 2:19","v":19,"text":"예수께서 대답하여 가라사대 너희가 이 성전을 헐라 내가 사흘 동안에 일으키리라"}]},{"book_id":"b_john","chapter":3,"verses":[{"book_en":"John","ch":3,"note":"거듭나지 않으면 하나님 나라를 볼 수 없다는, 중생 교리의 가장 유명한 말씀입니다.","ref":"요 3:3","v":3,"text":"예수께서 대답하여 가라사대 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 하나님 나라를 볼수 없느니라"},{"book_en":"John","ch":3,"note":"하나님의 사랑과 믿음으로 얻는 영생을 담은, 성경 전체에서 가장 널리 읽히는 구절입니다.","ref":"요 3:16","v":16,"text":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"},{"book_en":"John","ch":3,"note":"세례 요한의 고백으로, 예수님은 높아지시고 나는 낮아져야 한다는 신앙의 자세를 보여줍니다.","ref":"요 3:30","v":30,"text":"그는 흥하여야 하겠고 나는 쇠하여야 하리라 하니라"}]},{"book_id":"b_john","chapter":4,"verses":[{"book_en":"John","ch":4,"note":"예수님이 주시는 생수는 영원히 목마르지 않는 영생의 은혜임을 말씀합니다.","ref":"요 4:14","v":14,"text":"내가 주는 물을 먹는 자는 영원히 목마르지 아니하리니 나의 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라"},{"book_en":"John","ch":4,"note":"하나님은 영이시니 예배는 형식보다 신령과 진정으로 드려야 함을 가르칩니다.","ref":"요 4:24","v":24,"text":"하나님은 영이시니 예배하는 자가 신령과 진정으로 예배할찌니라"}]},{"book_id":"b_john","chapter":5,"verses":[{"book_en":"John","ch":5,"note":"예수님의 말씀을 믿는 자는 이미 영생을 얻었고 심판에 이르지 않는다는 약속입니다.","ref":"요 5:24","v":24,"text":"내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라"},{"book_en":"John","ch":5,"note":"성경 전체가 예수 그리스도를 증거한다는, 성경 읽기의 핵심 원리입니다.","ref":"요 5:39","v":39,"text":"너희가 성경에서 영생을 얻는줄 생각하고 성경을 상고하거니와 이 성경이 곧 내게 대하여 증거하는 것이로다"}]},{"book_id":"b_john","chapter":6,"verses":[{"book_en":"John","ch":6,"note":"예수님이 친히 '생명의 떡'이라 선언하시며 영혼의 양식이 되심을 말씀합니다.","ref":"요 6:35","v":35,"text":"예수께서 가라사대 내가 곧 생명의 떡이니 내게 오는 자는 결코 주리지 아니할 터이요 나를 믿는 자는 영원히 목마르지 아니하리라"},{"book_en":"John","ch":6,"note":"아버지께서 주시는 자는 다 내게로 오고, 오는 자를 내쫓지 않으신다는 구원의 확신입니다.","ref":"요 6:37","v":37,"text":"아버지께서 내게 주시는 자는 다 내게로 올 것이요 내게 오는 자는 내가 결코 내어 쫓지 아니하리라"}]},{"book_id":"b_john","chapter":7,"verses":[{"book_en":"John","ch":7,"note":"목마른 자는 누구든지 예수님께 와서 마시라는 초청의 말씀입니다.","ref":"요 7:37","v":37,"text":"명절 끝날 곧 큰날에 예수께서 서서 외쳐 가라사대 누구든지 목마르거든 내게로 와서 마시라"},{"book_en":"John","ch":7,"note":"예수님을 믿는 자의 속에서 생수의 강이 흘러나온다는 성령의 약속입니다.","ref":"요 7:38","v":38,"text":"나를 믿는 자는 성경에 이름과 같이 그 배에서 생수의 강이 흘러나리라 하시니"}]},{"book_id":"b_john","chapter":8,"verses":[{"book_en":"John","ch":8,"note":"예수님이 '세상의 빛'이라 선언하시며 어둠 속 인생의 길이 되심을 말씀합니다.","ref":"요 8:12","v":12,"text":"예수께서 또 일러 가라사대 나는 세상의 빛이니 나를 따르는 자는 어두움에 다니지 아니하고 생명의 빛을 얻으리라"},{"book_en":"John","ch":8,"note":"진리를 알면 자유하게 된다는, 복음이 주는 참 자유의 선언입니다.","ref":"요 8:32","v":32,"text":"진리를 알찌니 진리가 너희를 자유케 하리라"},{"book_en":"John","ch":8,"note":"예수님이 '아브라함이 나기 전부터 내가 있느니라' 하시며 자신의 신성을 밝히신 말씀입니다.","ref":"요 8:58","v":58,"text":"예수께서 가라사대 진실로 진실로 너희에게 이르노니 아브라함이 나기 전부터 내가 있느니라 하시니"}]},{"book_id":"b_john","chapter":9,"verses":[{"book_en":"John","ch":9,"note":"소경이었던 사람이 '지금 보는 것'을 고백하듯, 은혜를 경험한 자의 단순하고 확실한 간증입니다.","ref":"요 9:25","v":25,"text":"대답하되 그가 죄인인지 내가 알지 못하나 한 가지 아는 것은 내가 소경으로 있다가 지금 보는 그것이니이다"}]},{"book_id":"b_john","chapter":10,"verses":[{"book_en":"John","ch":10,"note":"예수님이 양들을 위해 목숨을 버리시는 '선한 목자'임을 선언하신 말씀입니다.","ref":"요 10:11","v":11,"text":"나는 선한 목자라 선한 목자는 양들을 위하여 목숨을 버리거니와"},{"book_en":"John","ch":10,"note":"예수님이 주신 영생은 빼앗기지 않고 영원히 멸망하지 않는다는 성도의 견인 약속입니다.","ref":"요 10:28","v":28,"text":"내가 저희에게 영생을 주노니 영원히 멸망치 아니할 터이요 또 저희를 내 손에서 빼앗을 자가 없느니라"}]},{"book_id":"b_john","chapter":11,"verses":[{"book_en":"John","ch":11,"note":"예수님이 친히 '부활이요 생명'이라 하시며 죽음을 이기신 분임을 선포합니다.","ref":"요 11:25","v":25,"text":"예수께서 가라사대 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고"},{"book_en":"John","ch":11,"note":"성경에서 가장 짧은 구절로, 우시는 예수님께 사람의 아픔을 아시는 인성을 보여줍니다.","ref":"요 11:35","v":35,"text":"예수께서 눈물을 흘리시더라"}]},{"book_id":"b_john","chapter":12,"verses":[{"book_en":"John","ch":12,"note":"한 알의 밀이 죽어야 많은 열매를 맺듯, 예수님의 죽음이 생명을 낳는다는 말씀입니다.","ref":"요 12:24","v":24,"text":"내가 진실로 진실로 너희에게 이르노니 한 알의 밀이 땅에 떨어져 죽지 아니하면 한 알 그대로 있고 죽으면 많은 열매를 맺느니라"},{"book_en":"John","ch":12,"note":"십자가에 들리신 예수님이 모든 사람을 이끄신다는 복음의 능력입니다.","ref":"요 12:32","v":32,"text":"내가 땅에서 들리면 모든 사람을 내게로 이끌겠노라 하시니"}]},{"book_id":"b_john","chapter":13,"verses":[{"book_en":"John","ch":13,"note":"서로 사랑하라는 새 계명으로, 제자도의 표지가 사랑임을 가르치신 말씀입니다.","ref":"요 13:34","v":34,"text":"새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한것 같이 너희도 서로 사랑하라"},{"book_en":"John","ch":13,"note":"서로 사랑하면 모든 사람이 제자인 줄 알 것이라 하신, 교회의 가장 큰 증거입니다.","ref":"요 13:35","v":35,"text":"너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인줄 알리라"}]},{"book_id":"b_john","chapter":14,"verses":[{"book_en":"John","ch":14,"note":"근심하는 마음을 예수님을 믿는 믿음으로 위로하시는 말씀입니다.","ref":"요 14:1","v":1,"text":"너희는 마음에 근심하지 말라 하나님을 믿으니 또 나를 믿으라"},{"book_en":"John","ch":14,"note":"예수님만이 아버지께 이르는 길이요 진리요 생명이라는, 복음의 핵심 선언입니다.","ref":"요 14:6","v":6,"text":"예수께서 가라사대 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라"},{"book_en":"John","ch":14,"note":"세상이 주는 것과 다른 예수님의 평안을 약속하신 말씀입니다.","ref":"요 14:27","v":27,"text":"평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것 같지 아니하니라 너희는 마음에 근심도 말고 두려워하지도 말라"}]},{"book_id":"b_john","chapter":15,"verses":[{"book_en":"John","ch":15,"note":"예수님 안에 거해야 열매를 맺는다는, 포도나무 비유의 핵심입니다.","ref":"요 15:5","v":5,"text":"나는 포도나무요 너희는 가지니 저가 내 안에, 내가 저 안에 있으면 이 사람은 과실을 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라"},{"book_en":"John","ch":15,"note":"친구를 위해 목숨을 버리는 것보다 큰 사랑이 없다는, 십자가 사랑의 정의입니다.","ref":"요 15:13","v":13,"text":"사람이 친구를 위하여 자기 목숨을 버리면 이에서 더 큰 사랑이 없나니"}]},{"book_id":"b_john","chapter":16,"verses":[{"book_en":"John","ch":16,"note":"진리의 성령이 오셔서 모든 진리 가운데로 인도하신다는 약속입니다.","ref":"요 16:13","v":13,"text":"그러하나 진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 자의로 말하지 않고 오직 듣는 것을 말하시며 장래 일을 너희에게 알리시리라"},{"book_en":"John","ch":16,"note":"세상에서 환난을 당해도 담대하라는, 세상을 이기신 예수님의 승리 선언입니다.","ref":"요 16:33","v":33,"text":"이것을 너희에게 이름은 너희로 내 안에서 평안을 누리게 하려함이라 세상에서는 너희가 환난을 당하나 담대하라 내가 세상을 이기었노라 하시니라"}]},{"book_id":"b_john","chapter":17,"verses":[{"book_en":"John","ch":17,"note":"영생이란 유일하신 참 하나님과 예수 그리스도를 아는 것이라는 정의입니다.","ref":"요 17:3","v":3,"text":"영생은 곧 유일하신 참 하나님과 그의 보내신 자 예수 그리스도를 아는 것이니이다"},{"book_en":"John","ch":17,"note":"하나님의 말씀인 진리로 성도를 거룩하게 해달라는 예수님의 기도입니다.","ref":"요 17:17","v":17,"text":"저희를 진리로 거룩하게 하옵소서 아버지의 말씀은 진리니이다"}]},{"book_id":"b_john","chapter":18,"verses":[{"book_en":"John","ch":18,"note":"예수님의 나라는 이 세상에 속한 것이 아니라는, 십자가 왕국의 선언입니다.","ref":"요 18:36","v":36,"text":"예수께서 대답하시되 내 나라는 이 세상에 속한 것이 아니라 만일 내 나라가 이 세상에 속한 것이었더면 내 종들이 싸워 나로 유대인들에게 넘기우지 않게 하였으리라 이제 내 나라는 여기에 속한 것이 아니니라"},{"book_en":"John","ch":18,"note":"빌라도의 '진리가 무엇이냐'는 질문 앞에, 진리이신 예수님이 침묵으로 서 계십니다.","ref":"요 18:38","v":38,"text":"빌라도가 가로되 진리가 무엇이냐 하더라 이 말을 하고 다시 유대인들에게 나가서 이르되 나는 그에게서 아무 죄도 찾지 못하노라"}]},{"book_id":"b_john","chapter":19,"verses":[{"book_en":"John","ch":19,"note":"십자가 위에서 '다 이루었다' 하신, 구속 사역을 완성하신 승리의 선언입니다.","ref":"요 19:30","v":30,"text":"예수께서 신 포도주를 받으신 후 가라사대 다 이루었다 하시고 머리를 숙이시고 영혼이 돌아가시니라"}]},{"book_id":"b_john","chapter":20,"verses":[{"book_en":"John","ch":20,"note":"도마의 고백 '나의 주시며 나의 하나님이시니이다'는 부활하신 예수님의 신성을 선포합니다.","ref":"요 20:28","v":28,"text":"도마가 대답하여 가로되 나의 주시며 나의 하나님이시니이다"},{"book_en":"John","ch":20,"note":"보지 못하고 믿는 자가 복되다는, 믿음의 본질을 가르치신 말씀입니다.","ref":"요 20:29","v":29,"text":"예수께서 가라사대 너는 나를 본 고로 믿느냐 보지못하고 믿는 자들은 복되도다 하시니라"},{"book_en":"John","ch":20,"note":"요한복음을 기록한 목적, 곧 예수를 믿어 생명을 얻게 하려는 선언입니다.","ref":"요 20:31","v":31,"text":"오직 이것을 기록함은 너희로 예수께서 하나님의 아들 그리스도이심을 믿게 하려 함이요 또 너희로 믿고 그 이름을 힘입어 생명을 얻게 하려 함이니라"}]},{"book_id":"b_john","chapter":21,"verses":[{"book_en":"John","ch":21,"note":"베드로에게 '내 어린 양을 먹이라' 하시며 회복과 사명을 주신 말씀입니다.","ref":"요 21:15","v":15,"text":"저희가 조반 먹은 후에 예수께서 시몬 베드로에게 이르시되 요한의 아들 시몬아 네가 이 사람들보다 나를 더 사랑하느냐 하시니 가로되 주여 그러하외다 내가 주를 사랑하는줄 주께서 아시나이다 가라사대 내 어린 양을 먹이라 하시고"},{"book_en":"John","ch":21,"note":"예수님의 행적은 다 기록할 수 없을 만큼 크다는 요한복음의 맺음말입니다.","ref":"요 21:25","v":25,"text":"예수의 행하신 일이 이 외에도 많으니 만일 낱낱이 기록된다면 이 세상이라도 이 기록된 책을 두기에 부족할줄 아노라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『Born of God: 요한복음 1장 강해』 (요 1:1-18, Banner of Truth)","text":"로이드존스는 요한복음 1장을 하나님의 아들의 영원한 신성을 선포하는 본문으로 다루며, 말씀이 곧 하나님이시라는 진리를 붙든다. 또한 12-13절의 거듭남을 인간의 결심이 아니라 오직 하나님의 주권적인 역사로 설명한다. 하나님의 자녀가 되는 것은 혈통이나 육정의 뜻이 아닌 하나님의 은혜의 선물임을 강조한다."},{"author":"팀 켈러","source":"『Encounters with Jesus』 (나다나엘, 요 1:43-51, Dutton)","text":"켈러는 나다나엘을 정직한 회의자로 그린다. 나사렛 출신이라는 편견을 가졌으면서도 와서 보라는 초대에 응하는 모습에서, 솔직한 의심은 믿음으로 가는 길이 될 수 있음을 보여준다. 무화과나무 아래 있던 나다나엘을 이미 보고 계셨던 예수님은 우리를 속속들이 아시면서도 받아주시는 분이다."}]},{"chapter":2,"summaries":[{"author":"팀 켈러","source":"『Encounters with Jesus』 (가나 혼인 잔치, 요 2:1-11, Dutton)","text":"켈러는 가나의 기적을 단순한 문제 해결이 아니라 표적으로 읽는다. 물이 변하여 된 좋은 포도주는 장차 올 더 큰 잔치, 곧 하나님의 나라의 풍성함을 미리 보여준다. 일상의 기쁨에도 관심을 가지시는 예수님은 바로 그 자리에서 자신의 영광을 드러내신다."}]},{"chapter":3,"summaries":[{"author":"팀 켈러","source":"『Encounters with Jesus』 (니고데모, 요 3:1-21, Dutton)","text":"켈러는 밤에 찾아온 니고데모를 종교적 내부자의 대표로 본다. 도덕적 노력으로 쌓아 올린 종교심으로는 하나님 나라에 이를 수 없으며, 성령으로 거듭나는 새 출생이 필요하다는 것이 예수님의 답이다. 종교는 인간의 성취를 말하지만 복음은 하나님의 새 창조를 말한다는 대비가 이 만남의 핵심이다."}]},{"chapter":4,"summaries":[{"author":"팀 켈러","source":"『Encounters with Jesus』 (사마리아 여인, 요 4:1-42, Dutton)","text":"켈러는 예수님이 유대인의 금기를 넘어 사마리아 여인에게 다가가신 점에 주목한다. 목마름의 정체를 드러내신 예수님은 우물물이 아닌 생수를 주시겠다고 약속하신다. 신령과 진정으로 드리는 예배를 가르치신 뒤, 그 여인은 자기 동네로 돌아가 사람들을 예수님께로 이끄는 증인이 된다."}]},{"chapter":11,"summaries":[{"author":"팀 켈러","source":"『Encounters with Jesus』 (마르다와 마리아, 요 11:1-44, Dutton)","text":"켈러는 슬픔에 잠긴 두 자매 앞에서 눈물 흘리신 예수님을 통해 기독교의 위로를 설명한다. 나사로를 살리실 것을 아시면서도 우시는 모습은, 하나님이 우리의 아픔을 외면하지 않으시고 그 한가운데로 들어오심을 보여준다. 나는 부활이요 생명이라는 선언은 죽음 앞에서도 흔들리지 않는 소망의 근거가 된다."}]},{"chapter":13,"summaries":[{"author":"팀 켈러","source":"『Encounters with Jesus』 (다락방 강화, 요 13-17장, Dutton)","text":"켈러는 고별 설교를 제자들을 떠나보내기 전 남기신 사랑의 유언으로 읽는다. 발을 씻기신 섬김, 포도나무에 붙어 있으라는 당부, 보혜사 성령의 약속은 모두 같은 방향을 가리킨다. 세상이 주는 평안이 아니라 예수님이 주시는 평안 안에서 환난을 이기라는 것이 이 긴 대화의 결론이다."}]},{"chapter":17,"summaries":[{"author":"마틴 로이드존스","source":"『The Assurance of Our Salvation: 요한복음 17장 연구』 (요 17장 전체, Crossway)","text":"로이드존스는 대제사장적 기도를 성도의 확신을 세우는 본문으로 강해한다. 아버지께서 아들에게 주신 자들은 하나도 잃지 않으신다는 약속에서 구원의 확실성을 찾는다. 진리로 거룩하게 하옵소서라는 기도는 성화가 하나님의 말씀 안에서 이루어지는 은혜의 역사임을 보여준다."}]},{"chapter":18,"summaries":[{"author":"팀 켈러","source":"『Encounters with Jesus』 (겟세마네 체포, 요 18:1-11, Dutton)","text":"켈러는 체포되러 온 무리 앞에서 스스로 나서시는 예수님의 모습에서 십자가의 자발성을 강조한다. 잡혀 끌려가시는 것이 아니라 친히 고난을 향해 걸어가시는 분이라는 점이 요한복음의 증언이다. 제자들을 보호하시며 홀로 서시는 모습에서 대속의 사랑이 드러난다."}]},{"chapter":20,"summaries":[{"author":"팀 켈러","source":"『Encounters with Jesus』 (막달라 마리아, 요 20:11-18, Dutton)","text":"켈러는 빈 무덤 앞에서 울던 마리아가 동산지기인 줄 알았던 예수님을 이름 불리심으로 알아본 장면에 주목한다. 기독교는 교리를 아는 것을 넘어 주님을 인격적으로 만나는 것임을 보여주는 만남이다. 부활의 첫 증인이 슬픔에 잠긴 한 여인이었다는 사실 자체가 복음의 역설을 말해준다."}]}],"exposition_note":"로이드존스: 요 1장·17장 / 켈러: 『Encounters with Jesus』의 요한복음 만남들 (요 1·2·3·4·11·13·18·20장)"},{"id":"b_acts","type":"book","name":"사도행전","name_en":"Acts","tagline":"성령으로 시작된 교회의 이야기","summary":"사도행전은 예수님의 승천 이후 성령 강림으로 교회가 시작되고, 복음이 예루살렘에서 로마까지 퍼져 나가는 이야기입니다. 베드로와 바울을 중심으로 복음이 유대인을 넘어 이방인에게 전해집니다. '행전'이라는 제목처럼 사도들의 행적이자 성령의 행적이기도 합니다. 교회는 사람의 계획이 아니라 성령의 역사로 세워짐을 보여 줍니다.","verses":[{"ref":"행 1:8","book_en":"Acts","ch":1,"v":8,"text":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 이르러 내 증인이 되리라 하시니라"},{"ref":"행 2:38","book_en":"Acts","ch":2,"v":38,"text":"베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니"},{"ref":"행 16:31","book_en":"Acts","ch":16,"v":31,"text":"가로되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 얻으리라 하고"}],"related":["f_peter","f_paul","f_stephen","e_pentecost","e_stephen_martyrdom","e_paul_conversion","e_paul_rome","d_church"],"meta":{"category":"역사서","author":"누가","date":"AD 62년경","chapters":28,"year_est":62,"emperor":"네로"},"sections":[{"range":"1-2장","text":"오순절에 성령이 강림하시자 베드로의 설교로 삼천 명이 회개하고 교회가 시작됩니다. 교회는 사람의 조직이 아니라 성령의 역사로 세워집니다.","title":"성령 강림과 교회의 탄생"},{"range":"3-7장","text":"기적과 핍박 속에서 교회가 자라고, 스데반이 돌에 맞아 순교합니다. 고난은 복음을 막지 못하고 오히려 흩어진 성도들을 통해 복음이 퍼집니다.","title":"성장과 첫 순교자"},{"range":"8-12장","text":"박해자 사울이 다메섹에서 예수님을 만나 바울이 되고, 고넬료 가정에 성령이 임하십니다. 구원은 유대인만의 것이 아니라 모든 민족을 향한 하나님의 은혜입니다.","title":"이방인에게 열린 복음"},{"range":"13-20장","text":"바울과 바나바가 세 차례 전도 여행으로 소아시아와 유럽에 교회를 세웁니다. 예루살렘 공의회(15장)는 이방인에게 할례를 강요하지 않기로 결정합니다.","title":"바울의 전도 여행"},{"range":"21-28장","text":"바울은 체포되고 로마로 압송되지만, 감옥에서도 담대히 복음을 전합니다. 하나님의 나라를 전파하며 주 예수 그리스도에 관한 것을 담대히 거침없이 가르치더라(28:31).","title":"결박 속에서도 전진하는 복음"}],"chapter_verses":[{"book_id":"b_acts","chapter":1,"verses":[{"book_en":"Acts","ch":1,"note":"성령의 권능을 받아 땅 끝까지 증인이 되라는, 사도행전 전체의 주제이자 교회의 사명입니다.","ref":"행 1:8","v":8,"text":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 이르러 내 증인이 되리라 하시니라"},{"book_en":"Acts","ch":1,"note":"올리우신 그대로 다시 오실 예수님의 재림을 약속한 말씀입니다.","ref":"행 1:11","v":11,"text":"가로되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다 보느냐 너희 가운데서 하늘로 올리우신 이 예수는 하늘로 가심을 본 그대로 오시리라 하였느니라"}]},{"book_id":"b_acts","chapter":2,"verses":[{"book_en":"Acts","ch":2,"note":"회개하고 세례를 받으라, 성령을 선물로 받으리라는 오순절 베드로 설교의 핵심입니다.","ref":"행 2:38","v":38,"text":"베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니"},{"book_en":"Acts","ch":2,"note":"사도의 가르침, 교제, 떡 떼기, 기도에 힘쓴 초대교회의 모범입니다.","ref":"행 2:42","v":42,"text":"저희가 사도의 가르침을 받아 서로 교제하며 떡을 떼며 기도하기를 전혀 힘쓰니라"}]},{"book_id":"b_acts","chapter":3,"verses":[{"book_en":"Acts","ch":3,"note":"'은과 금은 내게 없거니와' 예수 이름으로 앉은뱅이를 일으킨 사도들의 권능입니다.","ref":"행 3:6","v":6,"text":"베드로가 가로되 은과 금은 내게 없거니와 내게 있는 것으로 네게 주노니 곧 나사렛 예수 그리스도의 이름으로 걸으라 하고"},{"book_en":"Acts","ch":3,"note":"회개하고 돌이켜 죄 없이 함을 받으라는 베드로의 복음 초청입니다.","ref":"행 3:19","v":19,"text":"그러므로 너희가 회개하고 돌이켜 너희 죄 없이 함을 받으라 이같이 하면 유쾌하게 되는 날이 주 앞으로부터 이를 것이요"}]},{"book_id":"b_acts","chapter":4,"verses":[{"book_en":"Acts","ch":4,"note":"예수 외에 다른 구원이 없다는, 복음의 배타성과 확실성을 선포한 말씀입니다.","ref":"행 4:12","v":12,"text":"다른이로서는 구원을 얻을 수 없나니 천하 인간에 구원을 얻을만한 다른 이름을 우리에게 주신 일이 없음이니라 하였더라"},{"book_en":"Acts","ch":4,"note":"보고 들은 것을 말하지 않을 수 없다는 사도들의 담대한 증거입니다.","ref":"행 4:20","v":20,"text":"우리는 보고 들은 것을 말하지 아니할 수 없다 하니"}]},{"book_id":"b_acts","chapter":5,"verses":[{"book_en":"Acts","ch":5,"note":"사람보다 하나님께 순종하는 것이 마땅하다는, 신앙 양심의 대원칙입니다.","
