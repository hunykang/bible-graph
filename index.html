1jn","chapter":1,"verses":[{"ref":"요일 1:9","book_en":"1John","ch":1,"v":9,"note":"죄를 자백하면 하나님이 신실하셔서 모든 죄를 사하신다는 가장 유명한 용서의 약속입니다.","text":"만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요"}]},{"book_id":"b_1jn","chapter":2,"verses":[{"ref":"요일 2:15","book_en":"1John","ch":2,"v":15,"note":"세상과 세상의 것들을 사랑하지 말라는 말씀으로, 하나님 사랑과 세상 사랑은 함께할 수 없음을 가르칩니다.","text":"이 세상이나 세상에 있는 것들을 사랑치 말라 누구든지 세상을 사랑하면 아버지의 사랑이 그 속에 있지 아니하니"}]},{"book_id":"b_1jn","chapter":3,"verses":[{"ref":"요일 3:1","book_en":"1John","ch":3,"v":1,"note":"우리가 하나님의 자녀라 일컬음을 받는 것이 얼마나 큰 사랑인지 돌아보게 하는 말씀입니다.","text":"보라 아버지께서 어떠한 사랑을 우리에게 주사 하나님의 자녀라 일컬음을 얻게 하셨는고, 우리가 그러하도다 그러므로 세상이 우리를 알지 못함은 그를 알지 못함이니라"}]},{"book_id":"b_1jn","chapter":4,"verses":[{"ref":"요일 4:8","book_en":"1John","ch":4,"v":8,"note":"하나님은 사랑이시라는 말씀으로, 사랑하지 않는 것은 하나님을 알지 못한다는 뜻입니다.","text":"사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"},{"ref":"요일 4:19","book_en":"1John","ch":4,"v":19,"note":"우리가 사랑하는 것은 하나님이 먼저 우리를 사랑하셨기 때문이라는 말씀입니다.","text":"우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"}]},{"book_id":"b_1jn","chapter":5,"verses":[{"ref":"요일 5:13","book_en":"1John","ch":5,"v":13,"note":"예수님을 믿는 자에게 영생이 있음을 확실히 알게 하려고 썼다는 말씀으로, 구원의 확신을 줍니다.","text":"내가 하나님의 아들의 이름을 믿는 너희에게 이것을 쓴 것은 너희로 하여금 너희에게 영생이 있음을 알게 하려 함이라"}]}],"expositions":[{"chapter":1,"summaries":[{"author":"마틴 로이드존스","source":"『Life in Christ: Studies in 1 John』 1권 (요일 1장, Crossway)","text":"로이드존스는 요한1서 1장을 하나님과의 사귐에 대한 강해로 다루며, 빛 가운데 행하는 삶의 중요성을 강조했다. 그는 죄를 자백하는 자에게 신실하신 하나님이 용서하신다는 약속을 근거로, 죄에 대한 정직한 인정이 사귐의 출발점이라고 설명했다. 참된 그리스도인의 기쁨은 하나님과의 사귐에서 흘러나온다고 덧붙였다."}]},{"chapter":2,"summaries":[{"author":"마틴 로이드존스","source":"『Life in Christ: Studies in 1 John』 2권 (요일 2장 부분, Crossway)","text":"로이드존스는 예수 그리스도를 우리를 위한 대언자로 소개하며, 죄를 지었을 때 성도에게 있는 소망을 설명했다. 그는 계명을 지키는 것이 하나님을 아는 증거라고 강조하며, 세상을 사랑하지 말라는 권면을 통해 성도의 구별된 삶을 촉구했다. 또한 적그리스도의 미혹을 경계하며, 기름 부음 받은 성도가 진리 안에 거할 것을 당부했다."}]},{"chapter":3,"summaries":[{"author":"마틴 로이드존스","source":"『Life in Christ: Studies in 1 John』 3권 (요일 3장 부분, Crossway)","text":"로이드존스는 하나님의 자녀라 불리는 놀라운 사랑을 중심으로, 소망을 가진 자가 자신을 깨끗하게 한다는 말씀을 강조했다. 그는 행함과 진실함으로 사랑하라는 권면을 통해, 말뿐이 아닌 삶으로 드러나는 사랑을 촉구했다. 하나님 앞에서 담대함을 얻는 길은 계명을 지키는 순종에 있다고 설명했다."}]},{"chapter":4,"summaries":[{"author":"마틴 로이드존스","source":"『Life in Christ: Studies in 1 John』 4권 (요일 4장, Crossway)","text":"로이드존스는 영들을 분별하라는 경고를 시작으로, 하나님은 사랑이시라는 선언을 요한1서의 절정으로 다루었다. 그는 완전한 사랑이 두려움을 내쫓는다고 설명하며, 하나님의 사랑을 받은 자가 형제를 사랑하는 것은 당연한 열매라고 강조했다. 사랑은 하나님의 본성에서 흘러나오는 것이므로, 사랑하지 않는 자는 하나님을 알지 못한다고 덧붙였다."}]},{"chapter":5,"summaries":[{"author":"마틴 로이드존스","source":"『Life in Christ: Studies in 1 John』 5권 (요일 5장, Crossway)","text":"로이드존스는 세상을 이기는 승리가 곧 믿음이라고 선언하며, 영생에 대한 확신을 요한1서의 기록 목적으로 제시했다. 그는 하나님의 뜻대로 구하는 기도에 대한 응답의 약속을 근거로, 성도가 담대하게 기도할 수 있다고 설명했다. 우상을 멀리하라는 마지막 권면으로 강해를 마치며, 참 하나님 안에 거하는 삶을 촉구했다."}]}],"exposition_note":"로이드존스: 『Life in Christ: Studies in 1 John』 전 5권 (요일 전체, Crossway)"},{"id":"b_2jn","type":"book","name":"요한이서","name_en":"2John","tagline":"진리 안에서 사랑하라","summary":"요한이서는 가장 짧은 책 중 하나로, 진리를 붙들고 거짓 교사를 경계하라고 권면합니다. 사랑은 진리 안에서 행할 때 참됩니다. 개혁주의 관점에서 사랑이라는 이름으로 진리를 포기해서는 안 됩니다.","verses":[{"ref":"요이 1:4","book_en":"2John","ch":1,"v":4,"text":"너의 자녀 중에 우리가 아버지께 받은 계명대로 진리에 행하는 자를 내가 보니 심히 기쁘도다"},{"ref":"요이 1:6","book_en":"2John","ch":1,"v":6,"text":"또 사랑은 이것이니 우리가 그 계명을 좇아 행하는 것이요 계명은 이것이니 너희가 처음부터 들은 바와 같이 그 가운데서 행하라 하심이라"},{"ref":"요이 1:9","book_en":"2John","ch":1,"v":9,"text":"지내쳐 그리스도 교훈 안에 거하지 아니하는 자마다 하나님을 모시지 못하되 교훈 안에 거하는 이 사람이 아버지와 아들을 모시느니라"}],"related":["f_john_apostle","d_church"],"meta":{"category":"일반서신","author":"요한","date":"AD 85~95년경","chapters":1,"year_est":90,"emperor":"도미티아누스"},"sections":[{"range":"1-6절","text":"택하심을 받은 부녀와 자녀들에게, 진리 안에서 서로 사랑하라고 권합니다. 사랑은 계명대로 행하는 것입니다(6절).","title":"진리 안에서 사랑하라"},{"range":"7-13절","text":"예수 그리스도께서 육체로 오심을 부인하는 자가 적그리스도입니다(7절). 그런 자를 집에 들이지도 인사하지도 마십시오(10절).","title":"미혹하는 자를 경계하라"}],"chapter_verses":[{"book_id":"b_2jn","chapter":1,"verses":[{"ref":"요이 1:6","book_en":"2John","ch":1,"v":6,"note":"사랑은 곧 하나님의 계명을 따라 행하는 것이라는 말씀으로, 참된 사랑의 기준을 알려줍니다.","text":"또 사랑은 이것이니 우리가 그 계명을 좇아 행하는 것이요 계명은 이것이니 너희가 처음부터 들은 바와 같이 그 가운데서 행하라 하심이라"}]}]},{"id":"b_3jn","type":"book","name":"요한삼서","name_en":"3John","tagline":"진리를 위해 수고하는 동역자","summary":"요한삼서는 복음을 위해 수고하는 가이오를 칭찬하고, 교만으로 교회를 어지럽히는 디오드레베를 책망합니다. 나그네 된 전도자들을 돕는 것이 하나님을 기쁘시게 함을 가르칩니다. 개혁주의 관점에서 교회는 복음 사역자들을 따뜻하게 품는 공동체여야 합니다.","verses":[{"ref":"요삼 1:4","book_en":"3John","ch":1,"v":4,"text":"내가 내 자녀들이 진리 안에서 행한다 함을 듣는 것보다 더 즐거움이 없도다"},{"ref":"요삼 1:8","book_en":"3John","ch":1,"v":8,"text":"이러므로 우리가 이같은 자들을 영접하는 것이 마땅하니 이는 우리로 진리를 위하여 함께 수고하는 자가 되게 하려 함이니라"},{"ref":"요삼 1:11","book_en":"3John","ch":1,"v":11,"text":"사랑하는 자여 악한 것을 본받지 말고 선한 것을 본받으라 선을 행하는 자는 하나님께 속하고 악을 행하는 자는 하나님을 뵈옵지 못하였느니라"}],"related":["f_john_apostle","d_church"],"meta":{"category":"일반서신","author":"요한","date":"AD 85~95년경","chapters":1,"year_est":90,"emperor":"도미티아누스"},"sections":[{"range":"1-8절","text":"가이오가 진리 안에서 행하고 나그네 된 형제들을 영접한 것을 칭찬합니다(5절). 진리를 위해 수고하는 자들과 함께 일하는 자가 되십시오(8절).","title":"진리 안에서 행하는 가이오"},{"range":"9-15절","text":"으뜸 되기를 좋아하는 디올드레베를 경계하고, 선한 증거를 받은 데메드리오를 본받으십시오. 악한 일을 행하는 자는 하나님을 뵈옵지 못하였느니라(11절).","title":"악을 본받지 말라"}],"chapter_verses":[{"book_id":"b_3jn","chapter":1,"verses":[{"ref":"요삼 1:4","book_en":"3John","ch":1,"v":4,"note":"자녀들이 진리 안에서 행하는 것보다 더 큰 기쁨이 없다는 말씀으로, 다음 세대를 향한 믿음의 마음을 보여줍니다.","text":"내가 내 자녀들이 진리 안에서 행한다 함을 듣는 것보다 더 즐거움이 없도다"}]}]},{"id":"b_jude","type":"book","name":"유다서","name_en":"Jude","tagline":"믿음을 위해 힘써 싸우라","summary":"유다서는 예수님의 동생 유다가 쓴 짧은 편지로, 거짓 가르침에 맞서 '믿음을 위해 힘써 싸우라'고 촉구합니다. 은혜를 방탕의 구실로 삼는 자들을 경고합니다. 개혁주의 관점에서 교회는 값싼 은혜가 아니라 거룩을 추구하는 은혜를 붙들어야 합니다.","verses":[{"ref":"유 1:3","book_en":"Jude","ch":1,"v":3,"text":"사랑하는 자들아 내가 우리의 일반으로 얻은 구원을 들어 너희에게 편지하려는 뜻이 간절하던 차에 성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라는 편지로 너희를 권하여야 할 필요를 느꼈노니"},{"ref":"유 1:20","book_en":"Jude","ch":1,"v":20,"text":"사랑하는 자들아 너희는 너희의 지극히 거룩한 믿음 위에 자기를 건축하며 성령으로 기도하며"},{"ref":"유 1:24","book_en":"Jude","ch":1,"v":24,"text":"능히 너희를 보호하사 거침이 없게 하시고 너희로 그 영광 앞에 흠이 없이 즐거움으로 서게 하실 자"}],"related":["f_jesus","f_james_brother","f_jude_brother","d_eschatology"],"meta":{"category":"일반서신","author":"유다(예수의 동생)","date":"AD 65~80년경","chapters":1,"year_est":70,"emperor":"베스파시아누스"},"sections":[{"range":"1-4절","text":"성도에게 단번에 주신 믿음의 도를 위해 힘써 싸우라고 권합니다(3절). 은혜를 방탕한 것으로 바꾸는 자들이 몰래 들어왔기 때문입니다.","title":"믿음을 위해 힘써 싸우라"},{"range":"5-16절","text":"출애굽 백성, 타락한 천사, 소돔과 고모라의 심판을 상기시킵니다. 가인의 길, 발람의 삯, 고라의 패역을 따르는 자들의 최후는 정해져 있습니다.","title":"옛 심판을 기억하라"},{"range":"17-25절","text":"사도들의 말씀을 기억하고, 지극히 거룩한 믿음 위에 자기를 건축하며 성령으로 기도하십시오(20절). 영광이 홀로 하나이신 하나님께 있기를(25절).","title":"거룩한 믿음 위에 서라"}],"chapter_verses":[{"book_id":"b_jude","chapter":1,"verses":[{"ref":"유 1:3","book_en":"Jude","ch":1,"v":3,"note":"믿음의 도를 위하여 힘써 싸우라는 말씀으로, 복음을 지키는 것이 성도의 사명임을 일깨웁니다.","text":"사랑하는 자들아 내가 우리의 일반으로 얻은 구원을 들어 너희에게 편지하려는 뜻이 간절하던 차에 성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라는 편지로 너희를 권하여야 할 필요를 느꼈노니"}]}]},{"id":"b_rev","type":"book","name":"요한계시록","name_en":"Revelation","tagline":"마지막에 예수님이 이기십니다","summary":"요한계시록은 밧모섬에 유배된 요한이 본 환상을 기록한 책입니다. 박해받는 교회에 '예수님이 이미 승리하셨고 다시 오신다'는 소망을 줍니다. 상징이 많아 해석이 어렵지만, 핵심 메시지는 분명합니다. 개혁주의 관점에서 세부 시기론 논쟁을 피하고, 그리스도의 승리와 재림, 새 하늘 새 땅의 확실한 소망을 붙듭니다.","verses":[{"ref":"계 1:8","book_en":"Revelation","ch":1,"v":8,"text":"주 하나님이 가라사대 나는 알파와 오메가라 이제도 있고 전에도 있었고 장차 올 자요 전능한 자라 하시더라"},{"ref":"계 21:4","book_en":"Revelation","ch":21,"v":4,"text":"모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라"},{"ref":"계 22:20","book_en":"Revelation","ch":22,"v":20,"text":"이것들을 증거하신 이가 가라사대 내가 진실로 속히 오리라 하시거늘 아멘 주 예수여 오시옵소서"}],"related":["f_john_apostle","f_jesus","e_patmos_revelation","d_eschatology","d_christ","d_church"],"meta":{"category":"예언서","author":"요한","date":"AD 95년경","chapters":22,"year_est":95,"emperor":"도미티아누스"},"sections":[{"range":"1-3장","text":"부활하신 그리스도가 소아시아 일곱 교회에 칭찬과 책망, 약속을 주십니다. 귀 있는 자는 성령이 교회들에게 하시는 말씀을 들을지어다(2:7).","title":"일곱 교회에 주시는 말씀"},{"range":"4-5장","text":"하늘 보좌의 예배 가운데 죽임당한 어린양만이 인봉한 책을 펴실 자격이 있으십니다(5:5,9). 예배의 중심은 어린양 예수님이십니다.","title":"보좌와 어린양"},{"range":"6-11장","text":"심판이 진행되는 중에도 하나님의 인 맞은 백성은 보호받고, 두 증인이 말씀을 전합니다. 심판의 목적은 회개로 이끄는 것입니다.","title":"일곱 인과 일곱 나팔"},{"range":"12-14장","text":"여자와 용, 바다와 땅의 짐승이 등장하는 영적 전쟁이 그려집니다. 그러나 어린양을 따르는 자들이 어린양의 피와 자기들이 증언하는 말씀으로써 이깁니다(12:11).","title":"용과 어린양의 전쟁"},{"range":"15-20장","text":"일곱 대접의 진노와 큰 성 바벨론의 멸망 뒤에 그리스도께서 재림하셔서 악을 심판하십니다. 세부 시기 논쟁을 떠나 확실한 것은 그리스도의 완전한 승리입니다.","title":"심판과 그리스도의 최후 승리"},{"range":"21-22장","text":"하나님이 친히 함께하시고 모든 눈물을 닦아주십니다(21:3-4). 아멘 주 예수여 오시옵소서(22:20). 성도의 소망은 주님의 재림입니다.","title":"새 하늘과 새 땅"}],"chapter_verses":[{"book_id":"b_rev","chapter":1,"verses":[{"ref":"계 1:3","book_en":"Revelation","ch":1,"v":3,"note":"예언의 말씀을 읽고 듣고 지키는 자는 복이 있다는 말씀으로, 계시록은 두려움의 책이 아니라 복의 책임을 보여줍니다.","text":"이 예언의 말씀을 읽는 자와 듣는 자들과 그 가운데 기록한 것을 지키는 자들이 복이 있나니 때가 가까움이라"}]},{"book_id":"b_rev","chapter":2,"verses":[{"ref":"계 2:10","book_en":"Revelation","ch":2,"v":10,"note":"죽도록 충성하라는 말씀으로, 고난받는 교회에 생명의 면류관을 약속하십니다.","text":"네가 장차 받을 고난을 두려워 말라 볼찌어다 마귀가 장차 너희 가운데서 몇 사람을 옥에 던져 시험을 받게 하리니 너희가 십일 동안 환난을 받으리라 네가 죽도록 충성하라 그리하면 내가 생명의 면류관을 네게 주리라"}]},{"book_id":"b_rev","chapter":3,"verses":[{"ref":"계 3:20","book_en":"Revelation","ch":3,"v":20,"note":"예수님이 문 밖에 서서 두드리신다는 말씀으로, 마음 문을 열면 친히 들어와 함께하신다는 초청입니다.","text":"볼찌어다 내가 문밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그로 더불어 먹고 그는 나로 더불어 먹으리라"}]},{"book_id":"b_rev","chapter":4,"verses":[{"ref":"계 4:11","book_en":"Revelation","ch":4,"v":11,"note":"보좌 앞에 드리는 찬양으로, 창조주 하나님께 영광 돌리는 것이 예배의 중심임을 보여줍니다.","text":"우리 주 하나님이여 영광과 존귀와 능력을 받으시는 것이 합당하오니 주께서 만물을 지으신지라 만물이 주의 뜻대로 있었고 또 지으심을 받았나이다 하더라"}]},{"book_id":"b_rev","chapter":5,"verses":[{"ref":"계 5:12","book_en":"Revelation","ch":5,"v":12,"note":"죽임 당하신 어린 양이 모든 찬송을 받기에 합당하시다는 하늘의 합창입니다.","text":"큰 음성으로 가로되 죽임을 당하신 어린 양이 능력과 부와 지혜와 힘과 존귀와 영광과 찬송을 받으시기에 합당하도다 하더라"}]},{"book_id":"b_rev","chapter":6,"verses":[{"ref":"계 6:17","book_en":"Revelation","ch":6,"v":17,"note":"하나님의 진노의 큰 날에 누가 설 수 있느냐는 물음으로, 심판의 엄중함을 경고합니다.","text":"그들의 진노의 큰 날이 이르렀으니 누가 능히 서리요 하더라"}]},{"book_id":"b_rev","chapter":7,"verses":[{"ref":"계 7:17","book_en":"Revelation","ch":7,"v":17,"note":"어린 양이 목자가 되셔서 생명수 샘으로 인도하시고 모든 눈물을 씻기신다는 위로입니다.","text":"이는 보좌 가운데 계신 어린 양이 저희의 목자가 되사 생명수 샘으로 인도하시고 하나님께서 저희 눈에서 모든 눈물을 씻어 주실 것임이러라"}]},{"book_id":"b_rev","chapter":8,"verses":[{"ref":"계 8:3-4","book_en":"Revelation","ch":8,"v":3,"note":"성도들의 기도가 향의 연기처럼 하나님 앞에 올라간다는 말씀으로, 기도가 하늘에서 응답됨을 보여줍니다.","text":"또 다른 천사가 와서 제단 곁에 서서 금 향로를 가지고 많은 향을 받았으니 이는 모든 성도의 기도들과 합하여 보좌 앞 금단에 드리고자 함이라"}]},{"book_id":"b_rev","chapter":9,"verses":[{"ref":"계 9:20","book_en":"Revelation","ch":9,"v":20,"note":"무서운 재앙에도 사람들이 회개하지 않았다는 기록으로, 마음이 굳어지면 경고도 소용없음을 보여줍니다.","text":"이 재앙에 죽지 않고 남은 사람들은 그 손으로 행하는 일을 회개치 아니하고 오히려 여러 귀신과 또는 보거나 듣거나 다니거나 하지 못하는 금, 은, 동과 목석의 우상에게 절하고"}]},{"book_id":"b_rev","chapter":10,"verses":[{"ref":"계 10:10","book_en":"Revelation","ch":10,"v":10,"note":"작은 책이 입에는 달고 배에는 썼다는 말씀으로, 하나님의 말씀은 달콤하지만 심판의 경고는 쓰디씀을 뜻합니다.","text":"내가 천사의 손에서 작은 책을 갖다 먹어버리니 내 입에는 꿀 같이 다나 먹은 후에 내 배에서는 쓰게 되더라"}]},{"book_id":"b_rev","chapter":11,"verses":[{"ref":"계 11:15","book_en":"Revelation","ch":11,"v":15,"note":"세상 나라가 주와 그리스도의 나라가 되었다는 선포로, 역사의 끝은 하나님의 승리임을 선언합니다.","text":"일곱째 천사가 나팔을 불매 하늘에 큰 음성들이 나서 가로되 세상 나라가 우리 주와 그 그리스도의 나라가 되어 그가 세세토록 왕노릇 하시리로다 하니"}]},{"book_id":"b_rev","chapter":12,"verses":[{"ref":"계 12:11","book_en":"Revelation","ch":12,"v":11,"note":"성도들이 어린 양의 피와 증거하는 말로 사탄을 이겼다는 말씀으로, 승리의 비결을 알려줍니다.","text":"또 여러 형제가 어린 양의 피와 자기의 증거하는 말을 인하여 저를 이기었으니 그들은 죽기까지 자기 생명을 아끼지 아니하였도다"}]},{"book_id":"b_rev","chapter":13,"verses":[{"ref":"계 13:10","book_en":"Revelation","ch":13,"v":10,"note":"환난 중에도 성도에게 필요한 것은 인내와 믿음이라는 말씀으로, 끝까지 견디는 믿음을 권합니다.","text":"사로잡는 자는 사로잡힐 것이요 칼로 죽이는 자는 자기도 마땅히 칼에 죽으리니 성도들의 인내와 믿음이 여기 있느니라"}]},{"book_id":"b_rev","chapter":14,"verses":[{"ref":"계 14:13","book_en":"Revelation","ch":14,"v":13,"note":"주 안에서 죽는 자는 복이 있다는 말씀으로, 믿음 안에서의 죽음은 쉼이 됨을 위로합니다.","text":"또 내가 들으니 하늘에서 음성이 나서 가로되 기록하라 자금 이후로 주 안에서 죽는 자들은 복이 있도다 하시매 성령이 가라사대 그러하다 저희 수고를 그치고 쉬리니 이는 저희의 행한 일이 따름이라 하시더라"}]},{"book_id":"b_rev","chapter":15,"verses":[{"ref":"계 15:3-4","book_en":"Revelation","ch":15,"v":3,"note":"모세의 노래와 어린 양의 노래로, 하나님의 크고 기이한 행사를 찬양합니다.","text":"하나님의 종 모세의 노래, 어린 양의 노래를 불러 가로되 주 하나님 곧 전능하신이시여 하시는 일이 크고 기이하시도다 만국의 왕이시여 주의 길이 의롭고 참되시도다"}]},{"book_id":"b_rev","chapter":16,"verses":[{"ref":"계 16:15","book_en":"Revelation","ch":16,"v":15,"note":"내가 도둑같이 오리니 깨어 있어야 한다는 말씀으로, 주님의 재림을 준비하며 살라고 경고합니다.","text":"보라 내가 도적 같이 오리니 누구든지 깨어 자기 옷을 지켜 벌거벗고 다니지 아니하며 자기의 부끄러움을 보이지 아니하는 자가 복이 있도다"}]},{"book_id":"b_rev","chapter":17,"verses":[{"ref":"계 17:14","book_en":"Revelation","ch":17,"v":14,"note":"어린 양은 만왕의 왕이시므로 세상의 세력을 반드시 이기신다는 승리의 선언입니다.","text":"저희가 어린 양으로 더불어 싸우려니와 어린 양은 만주의 주시요 만왕의 왕이시므로 저희를 이기실터이요 또 그와 함께 있는 자들 곧 부르심을 입고 빼내심을 얻고 진실한 자들은 이기리로다"}]},{"book_id":"b_rev","chapter":18,"verses":[{"ref":"계 18:4","book_en":"Revelation","ch":18,"v":4,"note":"내 백성아 바벨론에서 나오라는 말씀으로, 세상의 죄악된 문화와 구별되게 살라고 명하십니다.","text":"또 내가 들으니 하늘로서 다른 음성이 나서 가로되 내 백성아, 거기서 나와 그의 죄에 참예하지 말고 그의 받을 재앙들을 받지 말라"}]},{"book_id":"b_rev","chapter":19,"verses":[{"ref":"계 19:16","book_en":"Revelation","ch":19,"v":16,"note":"예수님의 옷에 쓰인 이름 '만왕의 왕이요 만주의 주'는 그분의 절대 주권을 선포합니다.","text":"그 옷과 그 다리에 이름 쓴 것이 있으니 만왕의 왕이요 만주의 주라 하였더라"}]},{"book_id":"b_rev","chapter":20,"verses":[{"ref":"계 20:11-12","book_en":"Revelation","ch":20,"v":11,"note":"흰 보좌 심판 앞에서 모든 사람이 행한 대로 심판을 받는다는 말씀으로, 최후 심판의 확실함을 보여줍니다.","text":"또 내가 크고 흰 보좌와 그 위에 앉으신 자를 보니 땅과 하늘이 그 앞에서 피하여 간데 없더라"}]},{"book_id":"b_rev","chapter":21,"verses":[{"ref":"계 21:4","book_en":"Revelation","ch":21,"v":4,"note":"하나님이 모든 눈물을 씻기시고 사망과 고통이 다시 없을 것이라는 새 하늘과 새 땅의 약속입니다.","text":"모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라"}]},{"book_id":"b_rev","chapter":22,"verses":[{"ref":"계 22:20","book_en":"Revelation","ch":22,"v":20,"note":"성경의 마지막 기도 '아멘 주 예수여 오시옵소서'는 재림을 사모하는 교회의 고백입니다.","text":"이것들을 증거하신 이가 가라사대 내가 진실로 속히 오리라 하시거늘 아멘 주 예수여 오시옵소서"}]}]},{"id":"f_jesus","type":"figure","name":"예수 그리스도","name_en":"Jesus Christ","tagline":"인류를 구원하러 오신 하나님의 아들","summary":"예수님은 하나님의 아들로서 사람이 되신 분입니다(성육신). 십자가에서 죄의 값을 치르시고 부활하심으로 믿는 자에게 구원을 주셨습니다. 개혁주의 신앙고백은 예수님이 참 하나님이시며 참 사람이신 한 분이심을 고백합니다. 사도신경의 중심이 바로 이 예수 그리스도입니다.","verses":[{"ref":"요 1:14","book_en":"John","ch":1,"v":14,"text":"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라"},{"ref":"마 16:16","book_en":"Matthew","ch":16,"v":16,"text":"시몬 베드로가 대답하여 가로되 주는 그리스도시요 살아계신 하나님의 아들이시니이다"},{"ref":"빌 2:11","book_en":"Philippians","ch":2,"v":11,"text":"모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라"}],"related":["f_mary_mother","f_john_baptist","e_birth","e_cross","e_resurrection","e_ascension","d_christ","d_salvation"],"meta":{"role":"하나님의 아들, 구원자"},"key_chapters":[{"book_id":"b_matthew","ref":"마 5-7장","text":"천국 백성이 어떻게 살아야 하는지 가르치신 예수님의 대표 설교입니다.","title":"산상수훈"},{"book_id":"b_luke","ref":"눅 15장","text":"잃은 양과 아들의 비유로 죄인 하나를 기뻐하시는 예수님의 마음을 보여줍니다.","title":"잃은 자를 찾는 비유"},{"book_id":"b_john","ref":"요 1:1-14","text":"예수님이 참 하나님이시며 참 사람이심을 선언하는 성육신의 핵심 본문입니다.","title":"말씀이 육신이 되심"},{"book_id":"b_john","ref":"요 14:6","text":"구원이 오직 예수님을 통해서만 있음을 분명히 하신 말씀입니다.","title":"길이요 진리요 생명이니"}]},{"id":"f_john_baptist","type":"figure","name":"세례 요한","name_en":"John the Baptist","tagline":"예수님의 길을 예비한 선지자","summary":"세례 요한은 예수님보다 먼저 와서 회개를 외치며 예수님의 오심을 예비한 선지자입니다. 예수님께 세례를 베풀었고, '보라 하나님의 어린양'이라고 증언했습니다. 예수님은 그를 '여자가 낳은 자 중에 가장 큰 자'라고 하셨습니다.","verses":[{"ref":"요 1:29","book_en":"John","ch":1,"v":29,"text":"이튿날 요한이 예수께서 자기에게 나아오심을 보고 가로되 보라 세상 죄를 지고 가는 하나님의 어린 양이로다"},{"ref":"마 11:11","book_en":"Matthew","ch":11,"v":11,"text":"내가 진실로 너희에게 말하노니 여자가 낳은 자 중에 세례 요한보다 큰이가 일어남이 없도다 그러나 천국에서는 극히 작은 자라도 저보다 크니라"},{"ref":"막 1:4","book_en":"Mark","ch":1,"v":4,"text":"세례 요한이 이르러 광야에서 죄 사함을 받게 하는 회개의 세례를 전파하니"}],"related":["f_jesus","e_baptism","b_matthew","b_mark","b_luke"],"meta":{"role":"예수님의 길을 예비한 선지자"},"key_chapters":[{"book_id":"b_matthew","ref":"마 3:1-12","text":"회개를 외치며 메시아의 길을 예비한 세례 요한의 사역을 보여줍니다.","title":"광야에서 외치는 자의 소리"},{"book_id":"b_john","ref":"요 1:29-34","text":"예수님을 세상의 죄를 지고 가는 어린 양으로 증거한 장면입니다.","title":"보라 하나님의 어린 양"},{"book_id":"b_mark","ref":"막 6:14-29","text":"헤롯의 죄를 지적하다가 목숨을 잃은 선지자의 담대함을 보여줍니다.","title":"진리를 외치다 순교하다"}]},{"id":"f_peter","type":"figure","name":"베드로","name_en":"Peter","tagline":"반석 위에 세워진 교회의 일꾼","summary":"베드로는 예수님의 열두 제자 중 대표로, '주는 그리스도시요 살아 계신 하나님의 아들이시니이다'라고 고백했습니다. 한때 예수님을 부인했지만 회개하고, 오순절 설교로 교회를 세우는 일꾼이 되었습니다. 전통에 따르면 로마에서 순교했습니다.","verses":[{"ref":"마 16:18","book_en":"Matthew","ch":16,"v":18,"text":"또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라"},{"ref":"요 21:17","book_en":"John","ch":21,"v":17,"text":"세번째 가라사대 요한의 아들 시몬아 네가 나를 사랑하느냐 하시니 주께서 세번째 네가 나를 사랑하느냐 하시므로 베드로가 근심하여 가로되 주여 모든 것을 아시오매 내가 주를 사랑하는 줄을 주께서 아시나이다 예수께서 가라사대 내 양을 먹이라"},{"ref":"행 2:38","book_en":"Acts","ch":2,"v":38,"text":"베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니"}],"related":["f_jesus","f_paul","f_john_apostle","e_pentecost","e_jerusalem_council","b_mark","b_acts","b_1pet"],"meta":{"role":"열두 제자의 대표, 초대교회 지도자"},"key_chapters":[{"book_id":"b_matthew","ref":"마 16:13-20","text":"예수님을 그리스도로 고백한 베드로의 신앙고백이 담긴 본문입니다.","title":"주는 그리스도시니이다"},{"book_id":"b_luke","ref":"눅 22:54-62","text":"예수님을 모른다고 부인했지만 통회하며 돌이킨 베드로의 연약함과 회개를 보여줍니다.","title":"세 번 부인하고 회개하다"},{"book_id":"b_john","ref":"요 21:15-19","text":"부활하신 예수님이 베드로를 회복시키시고 양 떼를 맡기신 장면입니다.","title":"네가 나를 사랑하느냐"},{"book_id":"b_acts","ref":"행 2:14-41","text":"성령 충만해진 베드로가 담대히 복음을 전해 삼천 명이 회개한 설교입니다.","title":"오순절 설교"}]},{"id":"f_john_apostle","type":"figure","name":"요한(사도)","name_en":"John the Apostle","tagline":"예수님이 사랑하신 제자","summary":"사도 요한은 예수님이 특별히 사랑하신 제자로, 십자가 곁을 지킨 사람입니다. 요한복음과 요한서신, 요한계시록을 기록했습니다. '하나님은 사랑이시라'는 메시지를 평생 전했습니다. 밧모섬 유배 중 계시를 받았습니다.","verses":[{"ref":"요 21:20","book_en":"John","ch":21,"v":20,"text":"베드로가 돌이켜 예수의 사랑하시는 그 제자가 따르는 것을 보니 그는 만찬석에서 예수의 품에 의지하여 주여 주를 파는 자가 누구오니이까 묻던 자러라"},{"ref":"요일 4:8","book_en":"1John","ch":4,"v":8,"text":"사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"},{"ref":"계 1:9","book_en":"Revelation","ch":1,"v":9,"text":"나 요한은 너희 형제요 예수의 환난과 나라와 참음에 동참하는 자라 하나님의 말씀과 예수의 증거를 인하여 밧모라 하는 섬에 있었더니"}],"related":["f_jesus","f_peter","b_john","b_1jn","b_rev","e_patmos_revelation"],"meta":{"role":"사랑의 사도, 요한복음·요한계시록 저자"},"key_chapters":[{"book_id":"b_john","ref":"요 19:25-27","text":"제자들이 흩어질 때 끝까지 예수님 곁을 지킨 사랑의 제자를 보여줍니다.","title":"십자가 아래의 요한"},{"book_id":"b_1jn","ref":"요일 4:7-12","text":"'사랑의 사도'라 불리는 요한 신학의 핵심이 담긴 본문입니다.","title":"하나님은 사랑이시라"},{"book_id":"b_rev","ref":"계 1:9-20","text":"박해받는 교회를 위해 밧모섬에서 계시를 받은 요한의 모습을 보여줍니다.","title":"밧모섬의 환상"}]},{"id":"f_paul","type":"figure","name":"바울","name_en":"Paul","tagline":"핍박자에서 이방인의 사도로","summary":"바울은 원래 교회를 핍박하던 사람이었으나, 다메섹 도상에서 부활하신 예수님을 만나 회심했습니다. 이방인에게 복음을 전하는 사도로 부름받아 세 차례 전도여행을 했습니다. 신약의 절반 가까운 편지를 썼습니다. 개혁주의 신학은 바울의 '오직 믿음' 가르침 위에 서 있습니다.","verses":[{"ref":"행 9:15","book_en":"Acts","ch":9,"v":15,"text":"주께서 가라사대 가라 이 사람은 내 이름을 이방인과 임금들과 이스라엘 자손들 앞에 전하기 위하여 택한 나의 그릇이라"},{"ref":"롬 1:16","book_en":"Romans","ch":1,"v":16,"text":"내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라 첫째는 유대인에게요 또한 헬라인에게로다"},{"ref":"갈 2:20","book_en":"Galatians","ch":2,"v":20,"text":"내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 산 것이 아니요 오직 내 안에 그리스도께서 사신 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 몸을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라"}],"related":["f_peter","f_timothy","f_stephen","e_paul_conversion","e_jerusalem_council","e_paul_rome","b_acts","d_salvation"],"meta":{"role":"이방인의 사도"},"key_chapters":[{"book_id":"b_acts","ref":"행 9:1-19","text":"교회를 박해하던 사울이 부활하신 예수님을 만나 사도 바울로 바뀐 극적인 장면입니다.","title":"다메섹 도상의 회심"},{"book_id":"b_romans","ref":"롬 1:16-17","text":"바울 복음관의 핵심으로, 오직 믿음으로 의롭다 하심을 선포합니다.","title":"복음을 부끄러워하지 않음"},{"book_id":"b_gal","ref":"갈 2:20","text":"그리스도와 함께 죽고 그리스도로 사는 바울의 신앙고백입니다.","title":"이제는 내가 산 것이 아니요"},{"book_id":"b_2tim","ref":"딤후 4:6-8","text":"순교를 앞두고 믿음을 지킨 바울의 마지막 고백입니다.","title":"선한 싸움을 다 싸우고"}]},{"id":"f_james_brother","type":"figure","name":"야고보(예수의 동생)","name_en":"James, brother of Jesus","tagline":"예루살렘 교회를 이끈 예수님의 동생","summary":"야고보는 예수님의 동생으로, 처음에는 예수님을 믿지 않았으나 부활 후 믿게 되었습니다. 예루살렘 교회의 기둥 같은 지도자가 되었고, 예루살렘 공의회를 주재했습니다. 야고보서를 써서 행함 있는 믿음을 강조했습니다. AD 62년경 순교한 것으로 전해집니다.","verses":[{"ref":"행 15:13","book_en":"Acts","ch":15,"v":13,"text":"말을 마치매 야고보가 대답하여 가로되 형제들아 내 말을 들으라"},{"ref":"약 1:22","book_en":"James","ch":1,"v":22,"text":"너희는 도를 행하는 자가 되고 듣기만 하여 자신을 속이는 자가 되지말라"},{"ref":"고전 15:7","book_en":"1Corinthians","ch":15,"v":7,"text":"그 후에 야고보에게 보이셨으며 그 후에 모든 사도에게와"}],"related":["f_jesus","f_paul","e_jerusalem_council","b_jas","b_acts"],"meta":{"role":"예루살렘 교회 지도자, 야고보서 저자"},"key_chapters":[{"book_id":"b_1cor","ref":"고전 15:7","text":"예수님의 동생이었던 야고보가 부활하신 주를 만나 믿게 된 근거 구절입니다.","title":"부활을 목격한 야고보"},{"book_id":"b_acts","ref":"행 15:13-21","text":"예루살렘 교회의 기둥이 된 야고보가 이방인 구원을 분별해 선언한 장면입니다.","title":"예루살렘 공의회의 선언"},{"book_id":"b_jas","ref":"약 1:22-25","text":"듣기만 하고 행하지 않는 믿음을 경계한 야고보서의 핵심 권면입니다.","title":"말씀을 행하는 자"}]},{"id":"f_jude_brother","type":"figure","name":"유다(예수의 동생)","name_en":"Jude","tagline":"믿음을 위해 힘써 싸우라 전한 예수님의 동생","summary":"유다는 예수님의 동생입니다(마 13:55). 예수님이 살아 계실 때는 형제들과 함께 예수님을 믿지 않았지만(요 7:5), 부활하신 예수님을 만난 뒤 믿게 되었습니다. 그는 자신을 '예수 그리스도의 종이요 야고보의 형제'라고 소개하며(유 1:1) 유다서를 썼습니다. 유다서는 거짓 가르침이 교회에 들어올 때 성도에게 주신 믿음을 위해 힘써 싸우라고 권면하는 짧지만 힘 있는 편지입니다(유 1:3).","verses":[{"ref":"유 1:1","book_en":"Jude","ch":1,"v":1,"text":"예수 그리스도의 종이요 야고보의 형제인 유다는 부르심을 입은 자 곧 하나님 아버지 안에서 사랑을 얻고 예수 그리스도를 위하여 지키심을 입은 자들에게 편지하노라"},{"ref":"유 1:3","book_en":"Jude","ch":1,"v":3,"text":"사랑하는 자들아 내가 우리의 일반으로 얻은 구원을 들어 너희에게 편지하려는 뜻이 간절하던 차에 성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라는 편지로 너희를 권하여야 할 필요를 느꼈노니"},{"ref":"마 13:55","book_en":"Matthew","ch":13,"v":55,"text":"이는 그 목수의 아들이 아니냐 그 모친은 마리아, 그 형제들은 야고보, 요셉, 시몬, 유다라 하지 않느냐"}],"related":["f_james_brother","b_jude","f_jesus"],"meta":{"role":"유다서의 저자, 예수님의 동생"},"key_chapters":[{"book_id":"b_jude","ref":"유 1:1","title":"예수 그리스도의 종","text":"유다가 자신을 예수님의 동생이 아니라 예수 그리스도의 종이라 소개한 구절입니다."},{"book_id":"b_jude","ref":"유 1:3","title":"믿음을 위해 힘써 싸우라","text":"거짓 가르침 앞에서 성도에게 주신 믿음을 지키라고 권면한 유다서의 핵심 말씀입니다."},{"book_id":"b_jude","ref":"유 1:20-21","title":"믿음 위에 자기를 세우라","text":"지극히 거룩한 믿음 위에 자신을 세우고 성령으로 기도하며 하나님의 사랑 안에서 지키라는 권면입니다."}]},{"id":"f_mary_mother","type":"figure","name":"마리아(예수의 어머니)","name_en":"Mary, mother of Jesus","tagline":"말씀대로 되기를 원한 순종의 여인","summary":"마리아는 처녀의 몸으로 성령으로 예수님을 잉태한 여인입니다. '주의 여종이오니 말씀대로 내게 이루어지이다'라고 순종했습니다. 개혁주의(합동) 관점에서 마리아는 존경할 순종의 본이지만, 숭배나 중보자의 대상이 아닙니다. 구원자는 오직 예수 그리스도뿐입니다.","verses":[{"ref":"눅 1:38","book_en":"Luke","ch":1,"v":38,"text":"마리아가 가로되 주의 계집 종이오니 말씀대로 내게 이루어지이다 하매 천사가 떠나가니라"},{"ref":"마 1:21","book_en":"Matthew","ch":1,"v":21,"text":"아들을 낳으리니 이름을 예수라 하라 이는 그가 자기 백성을 저희 죄에서 구원할 자이심이라 하니라"},{"ref":"요 2:5","book_en":"John","ch":2,"v":5,"text":"그 어머니가 하인들에게 이르되 너희에게 무슨 말씀을 하시든지 그대로 하라 하니라"}],"related":["f_jesus","e_birth","b_matthew","b_luke","b_acts"],"meta":{"role":"예수님의 어머니"},"key_chapters":[{"book_id":"b_luke","ref":"눅 1:26-38","text":"'주의 계집종이오니 말씀대로 내게 이루어지이다' 순종한 마리아의 믿음을 보여줍니다.","title":"수태고지"},{"book_id":"b_luke","ref":"눅 1:46-55","text":"하나님의 구원을 찬양한 마리아의 노래로, 겸손한 자를 높이시는 하나님을 고백합니다.","title":"마리아의 찬가"},{"book_id":"b_john","ref":"요 19:25-27","text":"아들의 십자가를 지켜본 마리아를 요한에게 부탁하신 예수님의 효심을 보여줍니다.","title":"십자가 아래의 어머니"}]},{"id":"f_mary_magdalene","type":"figure","name":"막달라 마리아","name_en":"Mary Magdalene","tagline":"부활을 처음 목격한 증인","summary":"막달라 마리아는 일곱 귀신에게서 고침 받은 후 예수님을 따르던 여인입니다. 십자가 곁을 지켰고, 부활하신 예수님을 가장 먼저 만난 증인이 되었습니다. 여인의 증언이 가볍게 여겨지던 시대에 부활의 첫 증인으로 세워졌습니다.","verses":[{"ref":"막 16:9","book_en":"Mark","ch":16,"v":9,"text":"[예수께서 안식후 첫날 이른 아침에 살아나신 후 전에 일곱 귀신을 쫓아내어 주신 막달라 마리아에게 먼저 보이시니"},{"ref":"요 20:16","book_en":"John","ch":20,"v":16,"text":"예수께서 마리아야 하시거늘 마리아가 돌이켜 히브리 말로 랍오니여 하니 (이는 선생님이라)"},{"ref":"눅 8:2","book_en":"Luke","ch":8,"v":2,"text":"또한 악귀를 쫓아내심과 병 고침을 받은 어떤 여자들 곧 일곱 귀신이 나간 자 막달라인이라 하는 마리아와"}],"related":["f_jesus","e_cross","e_resurrection","b_john","b_mark"],"meta":{"role":"부활의 첫 증인"},"key_chapters":[{"book_id":"b_luke","ref":"눅 8:1-3","text":"예수님께 고침받고 평생 그분을 섬긴 막달라 마리아의 시작을 보여줍니다.","title":"일곱 귀신에서 놓인 여인"},{"book_id":"b_mark","ref":"막 15:40-47","text":"제자들이 흩어질 때 십자가와 장사까지 함께한 충성된 제자였습니다.","title":"십자가와 무덤을 지킨 여인"},{"book_id":"b_john","ref":"요 20:11-18","text":"빈 무덤에서 부활하신 예수님을 처음 만나 증인이 된 장면입니다.","title":"부활의 첫 증인"}]},{"id":"f_stephen","type":"figure","name":"스데반","name_en":"Stephen","tagline":"복음을 위해 목숨을 바친 첫 순교자","summary":"스데반은 초대교회의 일곱 집사 중 한 사람으로, 지혜와 성령이 충만한 설교자였습니다. 산헤드린 공회 앞에서 담대히 예수님을 증언하다 돌에 맞아 순교했습니다. 그의 순교를 지켜본 청년이 바로 훗날의 바울입니다. 개혁주의 관점에서 순교는 패배가 아니라 복음의 씨앗입니다.","verses":[{"ref":"행 6:8","book_en":"Acts","ch":6,"v":8,"text":"스데반이 은혜와 권능이 충만하여 큰 기사와 표적을 민간에 행하니"},{"ref":"행 7:59","book_en":"Acts","ch":7,"v":59,"text":"저희가 돌로 스데반을 치니 스데반이 부르짖어 가로되 주 예수여 내 영혼을 받으시옵소서 하고"},{"ref":"행 7:60","book_en":"Acts","ch":7,"v":60,"text":"무릎을 꿇고 크게 불러 가로되 주여 이 죄를 저들에게 돌리지 마옵소서 이 말을 하고 자니라"}],"related":["f_paul","e_stephen_martyrdom","e_pentecost","b_acts","d_church"],"meta":{"role":"최초의 순교자"},"key_chapters":[{"book_id":"b_acts","ref":"행 6:8-15","text":"성령과 지혜가 충만하여 표적을 행한 첫 집사 스데반의 모습을 보여줍니다.","title":"은혜와 권능이 충만한 일꾼"},{"book_id":"b_acts","ref":"행 7:2-53","text":"아브라함부터 이어진 구속사를 설교하며 예수님이 메시아이심을 증거했습니다.","title":"구약으로 증언한 설교"},{"book_id":"b_acts","ref":"행 7:54-60","text":"'주 예수여 내 영혼을 받으시옵소서' 기도하며 잠든 첫 순교자의 장면입니다.","title":"돌에 맞아 순교하다"}]},{"id":"f_timothy","type":"figure","name":"디모데","name_en":"Timothy","tagline":"바울이 아끼던 젊은 목회자","summary":"디모데는 바울의 전도여행에서 동역자가 된 젊은이로, 바울이 '믿음 안에서 참 아들'이라 부른 사람입니다. 에베소 교회를 맡았고, 디모데전후서를 받았습니다. 다음 세대에 복음을 전수하는 모델입니다.","verses":[{"ref":"딤전 4:12","book_en":"1Timothy","ch":4,"v":12,"text":"누구든지 네 연소함을 업신여기지 못하게 하고 오직 말과 행실과 사랑과 믿음과 정절에 대하여 믿는 자에게 본이 되어"},{"ref":"딤후 2:2","book_en":"2Timothy","ch":2,"v":2,"text":"또 네가 많은 증인 앞에서 내게 들은 바를 충성된 사람들에게 부탁하라 저희가 또 다른 사람들을 가르칠수 있으리라"},{"ref":"행 16:1","book_en":"Acts","ch":16,"v":1,"text":"바울이 더베와 루스드라에도 이르매 거기 디모데라 하는 제자가 있으니 그 모친은 믿는 유대 여자요 부친은 헬라인이라"}],"related":["f_paul","b_1tim","b_2tim","b_acts","b_php"],"meta":{"role":"바울의 동역자, 목회자"},"key_chapters":[{"book_id":"b_acts","ref":"행 16:1-5","text":"젊은 디모데가 바울의 전도 여행에 합류해 평생의 동역자가 된 시작입니다.","title":"바울의 동역자가 되다"},{"book_id":"b_2tim","ref":"딤후 1:5","text":"외조모 로이스와 어머니 유니게에게서 이어받은 디모데의 신앙 가문을 보여줍니다.","title":"거짓이 없는 믿음"},{"book_id":"b_1tim","ref":"딤전 4:12","text":"나이보다 본이 되는 삶으로 교회를 섬기라는 바울의 권면입니다.","title":"젊음을 업신여기지 못하게"}]},{"id":"e_birth","type":"event","name":"예수님의 탄생","name_en":"Birth of Jesus","tagline":"하나님이 사람이 되어 오셨습니다","summary":"예수님은 베들레헴에서 처녀 마리아의 몸을 통해 태어나셨습니다. 하나님이 친히 사람이 되신 성육신의 사건입니다. 천사가 '오늘 다윗의 동네에 구주가 나셨다'고 전했습니다. 개혁주의 관점에서 성탄은 하나님의 구원 계획이 역사 속에 시작된 순간입니다.","verses":[{"ref":"눅 2:11","book_en":"Luke","ch":2,"v":11,"text":"오늘날 다윗의 동네에 너희를 위하여 구주가 나셨으니 곧 그리스도 주시니라"},{"ref":"마 1:21","book_en":"Matthew","ch":1,"v":21,"text":"아들을 낳으리니 이름을 예수라 하라 이는 그가 자기 백성을 저희 죄에서 구원할 자이심이라 하니라"},{"ref":"요 1:14","book_en":"John","ch":1,"v":14,"text":"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라"}],"related":["f_jesus","f_mary_mother","b_matthew","b_luke","d_christ"],"meta":{"when":"BC 4년경","order":2,"year_est":-4,"emperor":"아우구스투스"},"key_chapters":[{"book_id":"b_matthew","ref":"마 1:18-25","text":"성령으로 잉태되어 처녀 마리아에게서 나신 예수의 탄생을 기록합니다.","title":"동정녀에게서 나심"},{"book_id":"b_luke","ref":"눅 2:1-20","text":"낮은 마굿간에 나시고 가장 먼저 목자들에게 알리신 겸손한 탄생을 보여줍니다.","title":"베들레헴 마굿간과 목자들"},{"book_id":"b_matthew","ref":"마 2:1-12","text":"이방인 박사들까지 아기 예수께 경배하러 온 장면입니다.","title":"동방박사의 경배"}]},{"id":"e_baptism","type":"event","name":"예수님의 세례","name_en":"Baptism of Jesus","tagline":"성령이 비둘기처럼 임하셨습니다","summary":"예수님은 세례 요한에게 요단강에서 세례를 받으셨습니다. 죄가 없으신 분이지만 죄인들과 자신을 하나 되게 하시려는 뜻이었습니다. 하늘이 열리고 성령이 임하시며 '이는 내 사랑하는 아들이라'는 음성이 들렸습니다. 공생애 사역의 시작을 알리는 사건입니다.","verses":[{"ref":"마 3:16","book_en":"Matthew","ch":3,"v":16,"text":"예수께서 세례를 받으시고 곧 물에서 올라 오실쌔 하늘이 열리고 하나님의 성령이 비둘기 같이 내려 자기 위에 임하심을 보시더니"},{"ref":"막 1:11","book_en":"Mark","ch":1,"v":11,"text":"하늘로서 소리가 나기를 너는 내 사랑하는 아들이라 내가 너를 기뻐하노라 하시니라"},{"ref":"눅 3:22","book_en":"Luke","ch":3,"v":22,"text":"성령이 형체로 비둘기 같이 그의 위에 강림하시더니 하늘로서 소리가 나기를 너는 내 사랑하는 아들이라 내가 너를 기뻐하노라 하시니라"}],"related":["f_jesus","f_john_baptist","b_matthew","b_mark","b_luke","d_holyspirit"],"meta":{"when":"AD 27년경","order":6,"year_est":27,"emperor":"디베료"},"key_chapters":[{"book_id":"b_matthew","ref":"마 3:13-17","text":"세례받으실 때 성령이 임하고 '이는 내 사랑하는 아들'이라는 음성이 들린 장면입니다.","title":"하늘이 열리고"},{"book_id":"b_luke","ref":"눅 3:21-22","text":"성부와 성자와 성령 삼위가 함께 나타나신 공생애의 시작을 보여줍니다.","title":"기도하실 때 하늘이 열리매"}]},{"id":"e_cross","type":"event","name":"십자가 처형","name_en":"Crucifixion","tagline":"우리 죄를 대신 지신 죽음","summary":"예수님은 로마 총독 빌라도에게 넘겨져 십자가에 못 박혀 돌아가셨습니다. 죄 없는 분이 죄인들의 죄 값을 대신 치르신 대속의 죽음입니다. '다 이루었다'는 마지막 말씀으로 구원을 완성하셨습니다. 개혁주의 신앙의 중심에는 바로 이 십자가가 있습니다.","verses":[{"ref":"요 19:30","book_en":"John","ch":19,"v":30,"text":"예수께서 신 포도주를 받으신 후 가라사대 다 이루었다 하시고 머리를 숙이시고 영혼이 돌아가시니라"},{"ref":"롬 5:8","book_en":"Romans","ch":5,"v":8,"text":"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라"},{"ref":"고전 15:3","book_en":"1Corinthians","ch":15,"v":3,"text":"내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고"}],"related":["f_jesus","f_mary_magdalene","b_matthew","b_mark","b_luke","b_john","d_salvation","d_christ"],"meta":{"when":"AD 30년경","order":27,"year_est":30,"emperor":"디베료"},"key_chapters":[{"book_id":"b_john","ref":"요 19:16-30","text":"십자가 위에서 구속 사역을 완성하셨음을 선포하신 예수님의 마지막 말씀입니다.","title":"다 이루었다"},{"book_id":"b_luke","ref":"눅 23:32-43","text":"십자가 옆 강도의 회개를 받아주신 예수님의 구원의 은혜를 보여줍니다.","title":"회개한 강도"},{"book_id":"b_matthew","ref":"마 27:45-54","text":"예수님이 운명하시자 성소 휘장이 찢어진, 대속의 완성을 보여주는 장면입니다.","title":"어둠과 지진"}]},{"id":"e_resurrection","type":"event","name":"부활","name_en":"Resurrection","tagline":"사망을 이기고 다시 살아나셨습니다","summary":"예수님은 십자가에 돌아가신 지 사흘 만에 부활하셨습니다. 빈 무덤과 수많은 목격자가 이를 증언합니다. 부활은 예수님이 하나님의 아들이심을 확증하고, 믿는 자에게도 부활의 소망을 줍니다. 바울은 '부활이 없으면 믿음도 헛것'이라고 했습니다.","verses":[{"ref":"고전 15:20","book_en":"1Corinthians","ch":15,"v":20,"text":"그러나 이제 그리스도께서 죽은 자 가운데서 다시 살아 잠자는 자들의 첫 열매가 되셨도다"},{"ref":"눅 24:6","book_en":"Luke","ch":24,"v":6,"text":"여기 계시지 않고 살아나셨느니라 갈릴리에 계실 때에 너희에게 어떻게 말씀하신 것을 기억하라"},{"ref":"롬 1:4","book_en":"Romans","ch":1,"v":4,"text":"성결의 영으로는 죽은 가운데서 부활하여 능력으로 하나님의 아들로 인정되셨으니 곧 우리 주 예수 그리스도시니라"}],"related":["f_jesus","f_mary_magdalene","f_peter","b_matthew","b_mark","b_luke","b_john","d_salvation"],"meta":{"when":"AD 30년경","order":28,"year_est":30,"emperor":"디베료"},"key_chapters":[{"book_id":"b_matthew","ref":"마 28:1-10","text":"여인들이 빈 무덤을 발견하고 부활 소식을 처음 들은 장면입니다.","title":"빈 무덤"},{"book_id":"b_luke","ref":"눅 24:13-35","text":"부활하신 예수님이 성경을 풀어주셔서 마음이 뜨거워진 제자들의 이야기입니다.","title":"엠마오로 가는 두 제자"},{"book_id":"b_1cor","ref":"고전 15:3-8","text":"베드로와 오백 형제를 비롯한 많은 증인을 열거한 부활의 역사적 증거 본문입니다.","title":"부활의 증인들"}]},{"id":"e_ascension","type":"event","name":"승천","name_en":"Ascension","tagline":"하늘에 오르사 다시 오실 것을 약속하셨습니다","summary":"부활하신 예수님은 40일 동안 제자들에게 나타나신 후 감람산에서 하늘로 오르셨습니다. 지금은 하나님 우편에 앉아 우리를 위해 중보하십니다. 천사들은 '이 예수가 하늘로 가심을 본 그대로 오시리라'고 했습니다. 승천은 재림 약속과 이어집니다.","verses":[{"ref":"행 1:9","book_en":"Acts","ch":1,"v":9,"text":"이 말씀을 마치시고 저희 보는데서 올리워 가시니 구름이 저를 가리워 보이지 않게 하더라"},{"ref":"행 1:11","book_en":"Acts","ch":1,"v":11,"text":"가로되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다 보느냐 너희 가운데서 하늘로 올리우신 이 예수는 하늘로 가심을 본 그대로 오시리라 하였느니라"},{"ref":"눅 24:51","book_en":"Luke","ch":24,"v":51,"text":"축복하실 때에 저희를 떠나 [하늘로 올리우]시니"}],"related":["f_jesus","b_luke","b_acts","d_christ","d_eschatology"],"meta":{"when":"AD 30년경","order":32,"year_est":30,"emperor":"디베료"},"key_chapters":[{"book_id":"b_luke","ref":"눅 24:50-53","text":"제자들을 축복하시며 하늘로 오르신 승천을 기록합니다.","title":"하늘로 올리우심"},{"book_id":"b_acts","ref":"행 1:6-11","text":"다시 오실 것을 약속하시며 승천하신 장면으로, 사도행전의 서막입니다.","title":"구름 속으로"}]},{"id":"e_pentecost","type":"event","name":"오순절 성령 강림","name_en":"Pentecost","tagline":"성령이 임하셔서 교회가 시작됐습니다","summary":"예수님이 약속하신 성령이 오순절에 제자들에게 강림하셨습니다. 베드로의 설교로 하루에 3천 명이 회개하고 교회가 시작되었습니다. 성령 강림은 교회의 생일이라 불립니다. 개혁주의 관점에서 성령은 오늘도 말씀을 통해 역사하시며 교회를 세우십니다.","verses":[{"ref":"행 2:4","book_en":"Acts","ch":2,"v":4,"text":"저희가 다 성령의 충만함을 받고 성령이 말하게 하심을 따라 다른 방언으로 말하기를 시작하니라"},{"ref":"행 2:38","book_en":"Acts","ch":2,"v":38,"text":"베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니"},{"ref":"행 2:41","book_en":"Acts","ch":2,"v":41,"text":"그 말을 받는 사람들은 세례를 받으매 이 날에 제자의 수가 삼천이나 더하더라"}],"related":["f_peter","f_stephen","b_acts","d_holyspirit","d_church"],"meta":{"when":"AD 30년경","order":33,"year_est":30,"emperor":"디베료"},"key_chapters":[{"book_id":"b_acts","ref":"행 2:1-13","text":"불의 혀같이 갈라지는 것으로 성령이 강림하신 오순절 사건의 기록입니다.","title":"성령의 임하심"},{"book_id":"b_acts","ref":"행 2:14-41","text":"성령 충만한 설교에 삼천 명이 회개하고 교회가 시작된 장면입니다.","title":"베드로의 설교"}]},{"id":"e_stephen_martyrdom","type":"event","name":"스데반의 순교","name_en":"Martyrdom of Stephen","tagline":"돌에 맞으면서도 용서를 빌었습니다","summary":"스데반은 복음을 전하다 돌에 맞아 순교한 최초의 순교자입니다. 죽으면서 '주여 이 죄를 저들에게 돌리지 마옵소서'라고 기도했습니다. 그의 순교 후 박해가 시작되었고, 흩어진 성도들이 복음을 전파했습니다. 순교자의 피는 교회의 씨앗이 되었습니다.","verses":[{"ref":"행 7:59","book_en":"Acts","ch":7,"v":59,"text":"저희가 돌로 스데반을 치니 스데반이 부르짖어 가로되 주 예수여 내 영혼을 받으시옵소서 하고"},{"ref":"행 7:60","book_en":"Acts","ch":7,"v":60,"text":"무릎을 꿇고 크게 불러 가로되 주여 이 죄를 저들에게 돌리지 마옵소서 이 말을 하고 자니라"},{"ref":"행 8:1","book_en":"Acts","ch":8,"v":1,"text":"사울이 그의 죽임 당함을 마땅히 여기더라 그 날에 예루살렘에 있는 교회에 큰 핍박이 나서 사도 외에는 다 유대와 사마리아 모든 땅으로 흩어지니라"}],"related":["f_stephen","f_paul","b_acts","d_church"],"meta":{"when":"AD 35년경","order":37,"year_est":35,"emperor":"디베료"},"key_chapters":[{"book_id":"b_acts","ref":"행 6:8-15","text":"지혜와 성령으로 대적할 수 없게 되자 거짓 증인으로 고소당한 배경을 보여줍니다.","title":"체포된 스데반"},{"book_id":"b_acts","ref":"행 7:54-60","text":"하늘이 열린 것을 보고 '주 예수여' 기도하며 잠든 첫 순교의 기록입니다.","title":"돌에 맞아 순교하다"}]},{"id":"e_paul_conversion","type":"event","name":"바울의 회심","name_en":"Conversion of Paul","tagline":"핍박자가 사도로 바뀐 극적인 만남","summary":"교회를 핍박하던 사울은 다메섹으로 가던 길에 부활하신 예수님을 만나 눈이 멀었다가 다시 보게 되었습니다. 세례를 받고 바울이라는 이름으로 이방인의 사도가 되었습니다. 사람의 노력으로는 불가능한 변화를 하나님이 이루신 사건입니다. 개혁주의는 회심을 하나님의 주권적 은혜로 봅니다.","verses":[{"ref":"행 9:15","book_en":"Acts","ch":9,"v":15,"text":"주께서 가라사대 가라 이 사람은 내 이름을 이방인과 임금들과 이스라엘 자손들 앞에 전하기 위하여 택한 나의 그릇이라"},{"ref":"행 9:18","book_en":"Acts","ch":9,"v":18,"text":"즉시 사울의 눈에서 비늘 같은 것이 벗어져 다시 보게 된지라 일어나 세례를 받고"},{"ref":"갈 1:16","book_en":"Galatians","ch":1,"v":16,"text":"그 아들을 이방에 전하기 위하여 그를 내 속에 나타내시기를 기뻐하실 때에 내가 곧 혈육과 의논하지 아니하고"}],"related":["f_paul","f_stephen","b_acts","d_salvation"],"meta":{"when":"AD 35년경","order":39,"year_est":35,"emperor":"디베료"},"key_chapters":[{"book_id":"b_acts","ref":"행 9:1-19","text":"빛 가운데 부활하신 주를 만나 눈이 멀었다가 다시 보게 된 회심의 기록입니다.","title":"다메섹 도상"},{"book_id":"b_acts","ref":"행 26:12-18","text":"바울 자신이 왕 앞에서 회심을 간증한 본문으로, 이방인의 사도 된 소명을 보여줍니다.","title":"아그립바 앞의 간증"}]},{"id":"e_jerusalem_council","type":"event","name":"예루살렘 공의회","name_en":"Jerusalem Council","tagline":"구원은 오직 믿음으로, 만장일치 결정","summary":"이방인 신자에게 할례를 요구해야 하는지를 두고 열린 최초의 교회 회의입니다. 베드로, 바울, 야고보가 함께 의논한 끝에 '믿음으로 구원받는다'는 결론을 내렸습니다. 교회가 말씀과 성령의 인도하심으로 진리를 확인한 모범입니다.","verses":[{"ref":"행 15:11","book_en":"Acts","ch":15,"v":11,"text":"우리가 저희와 동일하게 주 예수의 은혜로 구원 받는 줄을 믿노라 하니라"},{"ref":"행 15:19","book_en":"Acts","ch":15,"v":19,"text":"그러므로 내 의견에는 이방인 중에서 하나님께로 돌아 오는 자들을 괴롭게 말고"},{"ref":"갈 2:16","book_en":"Galatians","ch":2,"v":16,"text":"사람이 의롭게 되는 것은 율법의 행위에서 난 것이 아니요 오직 예수 그리스도를 믿음으로 말미암는줄 아는고로 우리도 그리스도 예수를 믿나니 이는 우리가 율법의 행위에서 아니고 그리스도를 믿음으로서 의롭다 함을 얻으려 함이라 율법의 행위로서는 의롭다 함을 얻을 육체가 없느니라"}],"related":["f_paul","f_peter","f_james_brother","b_acts","d_salvation","d_church"],"meta":{"when":"AD 49년경","order":43,"year_est":49,"emperor":"글라우디오"},"key_chapters":[{"book_id":"b_acts","ref":"행 15:1-21","text":"이방인에게 할례를 요구하지 않기로 결정한 최초의 교회 회의 기록입니다.","title":"할례 논쟁과 결정"},{"book_id":"b_gal","ref":"갈 2:1-10","text":"오직 믿음으로 구원받는다는 복음을 위해 바울이 싸운 배경을 보여줍니다.","title":"복음의 자유를 지킴"}]},{"id":"e_paul_rome","type":"event","name":"바울의 로마 전도와 순교","name_en":"Paul in Rome","tagline":"쇠사슬에 묶여서도 복음을 전했습니다","summary":"바울은 복음 때문에 체포되어 로마로 압송되었고, 감옥에서도 담대히 복음을 전했습니다. 옥중에서 에베소서, 빌립보서, 골로새서, 빌레몬서를 썼습니다. 전통에 따르면 네로 황제 때 순교했습니다. 고난 중에도 복음 전파를 멈추지 않은 사역자의 본입니다.","verses":[{"ref":"행 28:31","book_en":"Acts","ch":28,"v":31,"text":"담대히 하나님 나라를 전파하며 주 예수 그리스도께 관한 것을 가르치되 금하는 사람이 없었더라"},{"ref":"빌 1:21","book_en":"Philippians","ch":1,"v":21,"text":"이는 내게 사는 것이 그리스도니 죽는 것도 유익함이니라"},{"ref":"딤후 4:7","book_en":"2Timothy","ch":4,"v":7,"text":"내가 선한 싸움을 싸우고 나의 달려갈 길을 마치고 믿음을 지켰으니"}],"related":["f_paul","f_timothy","b_acts","b_php","b_2tim","e_temple_destruction"],"meta":{"when":"AD 60~67년경","order":48,"year_est":63,"emperor":"네로"},"key_chapters":[{"book_id":"b_acts","ref":"행 28:16-31","text":"쇠사슬에 매였으나 담대히 복음을 전한 바울의 로마 사역을 기록합니다.","title":"로마에서의 전도"},{"book_id":"b_2tim","ref":"딤후 4:6-8","text":"로마 감옥에서 생의 마지막을 정리한 바울의 유언 같은 편지입니다.","title":"순교를 앞둔 고백"}]},{"id":"e_temple_destruction","type":"event","name":"예루살렘 성전 파괴","name_en":"Destruction of the Temple","tagline":"예수님의 예언대로 성전이 무너졌습니다","summary":"AD 70년 로마 군대가 예루살렘을 함락하고 성전을 파괴했습니다. 예수님이 '돌 하나도 돌 위에 남지 않으리라'고 예언하신 그대로 이루어졌습니다. 유대교 중심 시대가 끝나고 복음이 온 세계로 퍼지는 전환점이 되었습니다.","verses":[{"ref":"마 24:2","book_en":"Matthew","ch":24,"v":2,"text":"대답하여 가라사대 너희가 이 모든 것을 보지 못하느냐 내가 진실로 너희에게 이르노니 돌 하나도 돌 위에 남지 않고 다 무너뜨리우리라"},{"ref":"눅 21:6","book_en":"Luke","ch":21,"v":6,"text":"너희 보는 이것들이 날이 이르면 돌 하나도 돌 위에 남지 않고 다 무너뜨리우리라"},{"ref":"막 13:2","book_en":"Mark","ch":13,"v":2,"text":"예수께서 이르시되 네가 이 큰 건물들을 보느냐 돌 하나도 돌 위에 남지 않고 다 무너뜨려지리라 하시니라"}],"related":["b_matthew","b_mark","b_luke","d_eschatology"],"meta":{"when":"AD 70년","order":49,"year_est":70,"emperor":"베스파시아누스"},"key_chapters":[{"book_id":"b_matthew","ref":"마 24:1-2","text":"AD 70년 성전 파괴를 미리 예언하신 예수님의 말씀입니다.","title":"돌 하나도 남지 않으리라"},{"book_id":"b_luke","ref":"눅 21:20-24","text":"군대에 에워싸일 예루살렘의 심판을 경고하신 예언의 본문입니다.","title":"예루살렘의 황폐"}]},{"id":"e_patmos_revelation","type":"event","name":"밧모섬의 계시","name_en":"Revelation on Patmos","tagline":"유배지에서 본 승리의 환상","summary":"사도 요한은 밧모섬에 유배되어 예수님의 계시를 보고 요한계시록을 기록했습니다. 박해받는 일곱 교회에 '예수님이 승리하신다'는 소망을 전했습니다. 신약의 마지막 사건이자 성경 전체의 결론을 여는 장면입니다.","verses":[{"ref":"계 1:9","book_en":"Revelation","ch":1,"v":9,"text":"나 요한은 너희 형제요 예수의 환난과 나라와 참음에 동참하는 자라 하나님의 말씀과 예수의 증거를 인하여 밧모라 하는 섬에 있었더니"},{"ref":"계 1:19","book_en":"Revelation","ch":1,"v":19,"text":"그러므로 네 본 것과 이제 있는 일과 장차 될 일을 기록하라"},{"ref":"계 22:20","book_en":"Revelation","ch":22,"v":20,"text":"이것들을 증거하신 이가 가라사대 내가 진실로 속히 오리라 하시거늘 아멘 주 예수여 오시옵소서"}],"related":["f_john_apostle","f_jesus","b_rev","d_eschatology"],"meta":{"when":"AD 95년경","order":50,"year_est":95,"emperor":"도미티아누스"},"key_chapters":[{"book_id":"b_rev","ref":"계 1:9-20","text":"밧모섬에서 부활하신 주를 뵌 요한의 첫 환상을 기록합니다.","title":"인자 같은 이의 환상"},{"book_id":"b_rev","ref":"계 21:1-7","text":"눈물을 씻기시고 모든 것을 새롭게 하시는 하나님의 완성을 보여줍니다.","title":"새 하늘과 새 땅"},{"book_id":"b_rev","ref":"계 22:20","text":"신약 전체를 마무리하는 재림 소망의 간구입니다.","title":"주 예수여 오시옵소서"}]},{"id":"d_christ","type":"doctrine","name":"예수 그리스도","name_en":"Jesus Christ","tagline":"참 하나님이시며 참 사람이십니다","summary":"개혁주의 신앙고백은 예수님이 참 하나님이시며 동시에 참 사람이신 한 분이심을 고백합니다. 하나님이 사람이 되셔서(성육신) 십자가에서 우리 죄를 대속하셨습니다. 사도신경과 웨스트민스터 소요리문답 21~28문이 이 진리를 다룹니다. 구원은 오직 이 예수 그리스도를 통해서만 있습니다.","verses":[{"ref":"요 1:14","book_en":"John","ch":1,"v":14,"text":"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라"},{"ref":"골 2:9","book_en":"Colossians","ch":2,"v":9,"text":"그 안에는 신성의 모든 충만이 육체로 거하시고"},{"ref":"히 1:3","book_en":"Hebrews","ch":1,"v":3,"text":"이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결케 하는 일을 하시고 높은 곳에 계신 위엄의 우편에 앉으셨느니라"}],"related":["f_jesus","b_matthew","b_john","b_heb","b_col","e_birth","e_cross"],"meta":{"locus":"기독론"},"sub_doctrines":[{"key_chapters":[{"book_id":"b_john","ref":"요 1:1-14","text":"태초부터 계신 말씀이 곧 하나님이시며, 그 말씀이 육신이 되어 우리 가운데 거하셨다고 선언합니다.","title":"말씀은 곧 하나님이시니라"},{"book_id":"b_col","ref":"골 2:9","text":"그리스도 안에는 신성의 모든 충만이 육체로 거하신다고 말합니다.","title":"그 안에는 신성의 모든 충만이"},{"book_id":"b_heb","ref":"히 1:3","text":"아들은 하나님 영광의 광채시요 본체의 형상이라고 선포합니다.","title":"하나님 본체의 형상"}],"summary":"예수님은 단순한 위인이 아니라 참 하나님이십니다. 요한복음은 '말씀이 곧 하나님'이라고 선언하고, 예수님 스스로 '나와 아버지는 하나'라고 하셨습니다. 하나님이 직접 사람이 되셔서 오셨다는 것, 이것이 기독교 신앙의 핵심입니다.","title":"그리스도의 신성"},{"key_chapters":[{"book_id":"b_heb","ref":"히 4:15","text":"모든 일에 우리와 한결같이 시험을 받으셨으되 죄는 없으시다고 합니다.","title":"우리와 같이 시험을 받으신"},{"book_id":"b_luke","ref":"눅 2:52","text":"예수님께서 참된 인간으로 자라나셨음을 보여 줍니다.","title":"지혜와 키가 자라가시며"},{"book_id":"b_1jn","ref":"요일 4:2","text":"예수 그리스도께서 육체로 오신 것을 시인하는 것이 참된 신앙의 표라고 합니다.","title":"육체로 오신 것을 시인"}],"summary":"예수님은 참 하나님이시면서 동시에 참 사람이셨습니다. 배고프고 목마르고 우셨으며, 우리와 같은 몸으로 시험을 받으셨습니다. 죄는 없으셨지만 인간의 모든 연약함을 친히 겪으셨기에 우리의 대제사장이 되실 수 있었습니다.","title":"그리스도의 인성"},{"key_chapters":[{"book_id":"b_php","ref":"빌 2:6-11","text":"하나님의 본체이신 분이 종의 형체를 입으시고 낮아지셨다가 높이심을 받으셨다고 노래합니다.","title":"하나님의 본체시나 종의 형체"},{"book_id":"b_1tim","ref":"딤전 2:5","text":"한 분 중보자이신 그리스도 예수는 사람이시라고 하여 양성을 한 위격으로 고백합니다.","title":"하나님과 사람 사이의 중보자"},{"book_id":"b_romans","ref":"롬 1:3-4","text":"육신으로는 다윗의 혈통에서 나셨고 성결의 영으로는 하나님의 아들로 선포되셨다고 합니다.","title":"육신으로는 다윗의 혈통"}],"summary":"신성과 인성은 예수님 안에서 한 위격으로 연합되었습니다. 섞이지도, 나뉘지도 않습니다. 그래서 예수님의 한 행위는 온전한 하나님이시자 온전한 사람이신 분의 행위입니다. 이 연합이 있기에 그분의 죽음이 온 인류를 구원할 가치가 있습니다.","title":"양성의 위격적 연합"},{"key_chapters":[{"book_id":"b_heb","ref":"히 7:24-25","text":"예수님은 영원히 살아 계셔서 우리를 위해 간구하시는 대제사장이라고 합니다.","title":"영원한 대제사장"},{"book_id":"b_matthew","ref":"마 28:18","text":"부활하신 주님이 하늘과 땅의 모든 권세를 받으신 왕이심을 선포합니다.","title":"하늘과 땅의 모든 권세"},{"book_id":"b_acts","ref":"행 3:22","text":"모세가 예언한 '나와 같은 선지자'가 예수님 안에서 성취되었다고 합니다.","title":"선지자를 일으키시리라"}],"summary":"그리스도는 선지자로 하나님의 말씀을 전하시고, 제사장으로 자신을 제물 삼아 속죄하시며, 왕으로 교회를 다스리십니다. 구약의 세 직분이 예수님 안에서 완성되었습니다.","title":"세 중직 - 선지자, 제사장, 왕"},{"key_chapters":[{"book_id":"b_php","ref":"빌 2:8-9","text":"십자가에 죽기까지 낮아지셨기에 하나님이 그를 지극히 높여 주셨다고 합니다.","title":"죽기까지 복종하시니"},{"book_id":"b_acts","ref":"행 1:9-11","text":"승천하신 그대로 다시 오실 것을 약속합니다.","title":"하늘로 올리우시다"},{"book_id":"b_rev","ref":"계 5:12","text":"높아지신 어린양이 만유의 찬송을 받으시는 장면을 보여 줍니다.","title":"어린양이 능력을 받으시는 것이"}],"summary":"그리스도는 낮아지심(성육신, 고난, 죽음, 장사)과 높아지심(부활, 승천, 보좌 우편, 재림)의 길을 걸으셨습니다. 낮아지심이 깊었던 만큼 높아지심도 영화롭습니다. 성도 역시 고난 뒤에 영광이 있음을 이 순서가 보여 줍니다.","title":"낮아지심과 높아지심"}]},{"id":"d_holyspirit","type":"doctrine","name":"성령의 사역","name_en":"Work of the Holy Spirit","tagline":"오늘도 우리 안에 역사하십니다","summary":"성령은 성부, 성자와 함께 한 분 하나님이십니다. 죄를 깨닫게 하시고, 거듭나게 하시며, 말씀을 깨닫게 하시고, 성도를 거룩하게 이끄십니다. 오순절에 강림하신 성령은 오늘도 교회를 세우십니다. 개혁주의는 성령의 역사가 항상 말씀과 함께한다고 가르칩니다.","verses":[{"ref":"요 14:26","book_en":"John","ch":14,"v":26,"text":"보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치시고 내가 너희에게 말한 모든 것을 생각나게 하시리라"},{"ref":"행 1:8","book_en":"Acts","ch":1,"v":8,"text":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 이르러 내 증인이 되리라 하시니라"},{"ref":"갈 5:22","book_en":"Galatians","ch":5,"v":22,"text":"오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과"}],"related":["f_jesus","b_luke","b_acts","b_eph","e_baptism","e_pentecost"],"meta":{"locus":"성령론"},"sub_doctrines":[{"key_chapters":[{"book_id":"b_acts","ref":"행 5:3-4","text":"성령을 속인 것이 하나님께 거짓말한 것이라고 하여 성령의 신성을 밝힙니다.","title":"성령을 속이고 하나님께 거짓말"},{"book_id":"b_1cor","ref":"고전 12:11","text":"성령께서 뜻대로 은사를 나누어 주시는 인격적 주체이심을 보여 줍니다.","title":"성령이 나누어 주시느니라"},{"book_id":"b_eph","ref":"엡 4:30","text":"성령이 근심하실 수 있는 인격이심을 말합니다.","title":"하나님의 성령을 근심하게 하지 말라"}],"summary":"성령은 단순한 힘이 아니라 참 하나님이시며 인격을 가지신 분입니다. 아나니아에게 '성령을 속인 것이 하나님을 속인 것'이라고 한 것처럼, 성령은 하나님이십니다. 그분은 말씀하시고, 인도하시고, 근심하십니다.","title":"성령의 신성과 인격"},{"key_chapters":[{"book_id":"b_john","ref":"요 3:5-6","text":"성령으로 나는 것이 하나님 나라에 들어가는 길이라고 하십니다.","title":"물과 성령으로 나지 아니하면"},{"book_id":"b_titus","ref":"딛 3:5","text":"구원이 성령의 새롭게 하심으로 이루어졌다고 합니다.","title":"성령의 새롭게 하심으로"},{"book_id":"b_1pet","ref":"벧전 1:23","text":"썩지 않을 씨 곧 하나님의 말씀으로 거듭났다고 합니다.","title":"썩지 아니할 씨로 된"}],"summary":"성령의 첫 번째 결정적 사역은 죄로 죽은 우리를 거듭나게 하시는 것입니다. 바람이 어디서 와서 어디로 가는지 모르는 것처럼, 성령의 중생 역사는 신비롭고 주권적입니다.","title":"중생케 하시는 사역"},{"key_chapters":[{"book_id":"b_gal","ref":"갈 5:22-23","text":"성령의 열매 아홉 가지가 성화의 모습을 보여 줍니다.","title":"오직 성령의 열매는"},{"book_id":"b_romans","ref":"롬 8:13","text":"성령으로 죄의 행실을 죽이는 것이 사는 길이라고 합니다.","title":"성령으로 몸의 행실을 죽이면"},{"book_id":"b_romans","ref":"롬 8:26","text":"말할 수 없는 탄식으로 우리를 위해 간구하신다고 합니다.","title":"성령도 우리의 연약함을 도우시나니"}],"summary":"성령은 거듭난 성도를 날마다 그리스도를 닮아가도록 빚으십니다. 성령의 열매를 맺게 하시고, 죄와 싸울 힘을 주시며, 기도할 때 말할 수 없는 탄식으로 도우십니다.","title":"성화의 사역"},{"key_chapters":[{"book_id":"b_eph","ref":"엡 1:13-14","text":"성령의 인치심이 기업을 보증하는 보증이라고 합니다.","title":"약속의 성령으로 인치심을 받았으니"},{"book_id":"b_romans","ref":"롬 8:16","text":"우리가 하나님의 자녀인 것을 성령이 친히 증거하신다고 합니다.","title":"성령이 친히 우리 영으로 더불어"},{"book_id":"b_2cor","ref":"고후 1:22","text":"마음에 성령을 보증으로 주셨다고 합니다.","title":"인치시고 보증으로 성령을"}],"summary":"성령은 믿는 자에게 인치심으로 '이 사람은 내 것'이라는 도장을 찍으십니다. 그 인치심이 구원의 확신을 줍니다. 환경이 흔들려도 성령의 증거가 '하나님의 자녀'임을 확증합니다.","title":"인치심과 확신"},{"title":"성령의 은사와 열매","summary":"성령은 교회를 세우기 위해 성도 각자에게 다양한 은사를 나누어 주십니다. 은사는 자랑이 아니라 섬김을 위한 선물입니다. 동시에 성령은 우리 안에 사랑, 희락, 화평 같은 열매를 맺게 하십니다.","key_chapters":[{"book_id":"b_1cor","ref":"고전 12:4-7","title":"유익하게 하려 하여","text":"은사는 여러 가지이나 모두에게 유익을 주기 위한 것임을 말합니다."},{"book_id":"b_gal","ref":"갈 5:22-23","title":"오직 성령의 열매는","text":"성령의 열매 아홉 가지를 열거합니다."},{"book_id":"b_eph","ref":"엡 4:11-12","title":"성도를 온전케 하며","text":"은사의 목적이 성도를 세우고 봉사의 일을 하게 하는 것임을 말합니다."}]}]},{"id":"d_church","type":"doctrine","name":"교회","name_en":"Church","tagline":"그리스도의 몸 된 공동체","summary":"교회는 예수 그리스도를 머리로 하는 믿는 사람들의 공동체입니다. 말씀 선포, 성례(세례와 성찬), 권징이 참된 교회의 표지라고 개혁주의는 가르칩니다. 교회는 건물이 아니라 사람들의 모임이며, 세상 속에서 복음의 증인으로 부름받았습니다. 웨스트민스터 신앙고백 25장이 다룹니다.","verses":[{"ref":"마 16:18","book_en":"Matthew","ch":16,"v":18,"text":"또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라"},{"ref":"엡 4:4","book_en":"Ephesians","ch":4,"v":4,"text":"몸이 하나이요 성령이 하나이니 이와 같이 너희가 부르심의 한 소망 안에서 부르심을 입었느니라"},{"ref":"행 2:42","book_en":"Acts","ch":2,"v":42,"text":"저희가 사도의 가르침을 받아 서로 교제하며 떡을 떼며 기도하기를 전혀 힘쓰니라"}],"related":["f_peter","f_paul","f_stephen","b_acts","b_eph","b_1cor","e_pentecost","e_jerusalem_council"],"meta":{"locus":"교회론"},"sub_doctrines":[{"key_chapters":[{"book_id":"b_matthew","ref":"마 16:18","text":"주님이 친히 교회를 세우신다고 약속하셨습니다.","title":"내가 이 반석 위에 내 교회를 세우리니"},{"book_id":"b_eph","ref":"엡 4:4-6","text":"교회의 하나됨의 근거를 말합니다.","title":"몸이 하나이요 성령도 한 분이시니"},{"book_id":"b_acts","ref":"행 2:42","text":"초대교회가 말씀, 교제, 성찬, 기도에 힘쓴 모습을 보여 줍니다.","title":"사도의 가르침을 받아"}],"summary":"교회는 건물이 아니라 그리스도 안에서 부르심을 받은 사람들의 모임입니다. 참된 교회의 표지는 말씀의 순수한 선포, 성례의 바른 집행, 권징의 시행입니다. 이 세 가지가 있는 곳에 참 교회가 있습니다.","title":"교회의 본질과 표지"},{"key_chapters":[{"book_id":"b_eph","ref":"엡 4:11-12","text":"성도를 온전케 하고 봉사의 일을 하게 하려 직분을 주셨다고 합니다.","title":"목사와 교사들을 주셨으니"},{"book_id":"b_matthew","ref":"마 18:15-17","text":"권징의 단계적 절차를 주님이 친히 가르치셨습니다.","title":"네 형제가 죄를 범하거든"},{"book_id":"b_1tim","ref":"딤전 3:1-7","text":"교회 직분자의 자격을 제시합니다.","title":"감독의 직분을 얻으려 하는 자는"}],"summary":"그리스도는 교회를 다스리기 위해 목사, 장로, 집사의 직분을 주셨습니다. 사랑의 권징은 죄인을 회복시키고 교회를 거룩하게 지키는 수단입니다. 권징의 목적은 정죄가 아니라 회복입니다.","title":"교회의 직분과 권징"},{"key_chapters":[{"book_id":"b_romans","ref":"롬 10:17","text":"들음은 그리스도의 말씀으로 말미암는다고 합니다.","title":"믿음은 들음에서 나며"},{"book_id":"b_2tim","ref":"딤후 3:16-17","text":"성경의 권위와 유익을 선언합니다.","title":"모든 성경은 하나님의 감동으로 된 것으로"},{"book_id":"b_acts","ref":"행 20:32","text":"은혜의 말씀이 세우고 유업을 주신다고 합니다.","title":"은혜의 말씀께 부탁하노니"}],"summary":"하나님은 말씀을 통해 은혜를 베푸십니다. 읽고 듣고 묵상하는 말씀, 그리고 선포되는 설교가 성도를 살리고 자라게 하는 통로입니다. 말씀 없는 교회는 생명이 없습니다.","title":"은혜의 수단 - 말씀"},{"key_chapters":[{"book_id":"b_matthew","ref":"마 28:19","text":"세례 명령의 근거 구절입니다.","title":"아버지와 아들과 성령의 이름으로 세례를 베풀고"},{"book_id":"b_1cor","ref":"고전 11:24-25","text":"성찬 제정의 말씀으로 기념과 참여의 의미를 보여 줍니다.","title":"이것은 너희를 위하는 내 몸이니"},{"book_id":"b_romans","ref":"롬 6:3-4","text":"세례가 그리스도와의 연합을 표징한다고 합니다.","title":"그리스도 예수와 합하여 세례를 받은 우리는"}],"summary":"성례는 말씀에 더해진 보이는 표입니다. 세례는 그리스도와의 연합과 죄 씻음을, 성찬은 그리스도의 몸과 피에 참여함을 표징합니다. 성례는 구원을 주는 것이 아니라 믿음을 굳게 하는 수단입니다.","title":"은혜의 수단 - 성례(세례와 성찬)"},{"title":"교회의 사명 - 전도와 선교","summary":"교회는 모여서 예배하는 공동체이면서, 세상으로 나아가 복음을 전하는 파송된 공동체입니다. '모든 민족을 제자로 삼으라'는 명령은 모든 성도에게 주신 사명입니다.","key_chapters":[{"book_id":"b_matthew","ref":"마 28:19-20","title":"모든 민족을 제자로 삼아","text":"부활하신 주님이 주신 지상명령입니다."},{"book_id":"b_acts","ref":"행 1:8","title":"땅 끝까지 이르러 내 증인이 되리라","text":"성령의 능력으로 증인이 되라는 약속입니다."},{"book_id":"b_romans","ref":"롬 10:14-15","title":"전파하는 자가 없이야","text":"복음을 전하는 자의 발이 아름답다고 말합니다."}]}]},{"id":"d_eschatology","type":"doctrine","name":"종말","name_en":"Eschatology","tagline":"예수님이 다시 오십니다","summary":"개혁주의 신앙고백은 예수님이 심판하러 다시 오시고, 죽은 자가 부활하며, 최후 심판과 새 하늘 새 땅이 있음을 확신합니다. 세부 시기 계산이나 논쟁은 피하고, '깨어 준비하라'는 주님의 말씀에 순종합니다. 종말은 두려움이 아니라 성도의 소망입니다. 사도신경의 마지막 고백이 바로 이것입니다.","verses":[{"ref":"행 1:11","book_en":"Acts","ch":1,"v":11,"text":"가로되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다 보느냐 너희 가운데서 하늘로 올리우신 이 예수는 하늘로 가심을 본 그대로 오시리라 하였느니라"},{"ref":"계 22:20","book_en":"Revelation","ch":22,"v":20,"text":"이것들을 증거하신 이가 가라사대 내가 진실로 속히 오리라 하시거늘 아멘 주 예수여 오시옵소서"},{"ref":"살전 4:16","book_en":"1Thessalonians","ch":4,"v":16,"text":"주께서 호령과 천사장의 소리와 하나님의 나팔로 친히 하늘로 좇아 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고"}],"related":["f_jesus","b_1th","b_2th","b_rev","b_2pet","e_ascension","e_patmos_revelation","e_temple_destruction"],"meta":{"locus":"종말론"},"sub_doctrines":[{"key_chapters":[{"book_id":"b_php","ref":"빌 1:23","text":"세상을 떠나 그리스도와 함께 있는 것이 훨씬 더 좋다고 고백합니다.","title":"그리스도와 함께 있는 것이"},{"book_id":"b_2cor","ref":"고후 5:8","text":"몸을 떠나 주와 함께 거함을 소망한다고 합니다.","title":"몸을 떠나 주와 함께 거하는"},{"book_id":"b_rev","ref":"계 14:13","text":"주 안에서 죽는 자의 복을 선언합니다.","title":"주 안에서 죽는 자들은 복이 있도다"}],"summary":"죽음은 죄의 결과이지만 성도에게는 안식으로 들어가는 문입니다. 몸은 부활 때까지 쉬고, 영혼은 즉시 주님과 함께 있습니다. 이것이 중간 상태에 대한 성경의 가르침입니다.","title":"죽음과 중간 상태"},{"key_chapters":[{"book_id":"b_acts","ref":"행 1:11","text":"승천하신 그대로 오실 것을 천사가 약속합니다.","title":"하늘로 가심을 본 그대로 오시리라"},{"book_id":"b_matthew","ref":"마 24:44","text":"생각지 않은 때에 오시니 깨어 준비하라고 하십니다.","title":"생각지 않은 때에 인자가 오리라"},{"book_id":"b_1th","ref":"살전 4:16-17","text":"재림의 모습을 가장 자세히 묘사합니다.","title":"주께서 친히 강림하시리니"}],"summary":"예수님은 승천하신 그대로 다시 오십니다. 재림은 갑작스럽고 영광스러우며, 성도에게는 소망이고 불신자에게는 심판입니다. 날짜는 알 수 없으나 반드시 온다는 것이 확실한 약속입니다.","title":"그리스도의 재림"},{"key_chapters":[{"book_id":"b_1cor","ref":"고전 15:20","text":"그리스도의 부활이 잠자는 자들의 첫 열매라고 합니다.","title":"다시 살아나사 첫 열매가 되셨도다"},{"book_id":"b_john","ref":"요 5:28-29","text":"선한 일을 행한 자는 생명의 부활로, 악을 행한 자는 심판의 부활로 나온다고 하십니다.","title":"무덤 속에 있는 자가 다 그의 음성을 들을 때"},{"book_id":"b_1cor","ref":"고전 15:42-44","text":"부활의 몸의 영광을 묘사합니다.","title":"썩지 아니할 것으로 다시 살아나며"}],"summary":"재림 때 죽은 자들이 부활합니다. 성도는 영광의 몸으로, 불신자는 심판을 받기 위해 일어납니다. 그리스도의 부활이 우리 부활의 첫 열매이자 보증입니다.","title":"죽은 자의 부활"},{"key_chapters":[{"book_id":"b_romans","ref":"롬 14:10-12","text":"각 사람이 자기 일을 하나님께 직접 아뢰게 된다고 합니다.","title":"우리가 다 하나님의 심판대 앞에 서리라"},{"book_id":"b_2cor","ref":"고후 5:10","text":"몸으로 행한 것을 따라 받게 된다고 합니다.","title":"그리스도의 심판대 앞에 나타나리라"},{"book_id":"b_rev","ref":"계 20:12","text":"행위에 따라 심판받는 장면을 보여 줍니다.","title":"책들이 펴 있고 또 다른 책이 펴졌으니"}],"summary":"모든 사람은 그리스도의 심판대 앞에 서게 됩니다. 행위에 따라 심판받되, 성도는 그리스도의 의로 말미암아 정죄받지 않습니다. 심판은 하나님의 공의가 완전히 드러나는 날입니다.","title":"최후 심판"},{"key_chapters":[{"book_id":"b_rev","ref":"계 21:1-4","text":"눈물과 사망과 애통이 다시 있지 않을 것을 약속합니다.","title":"처음 하늘과 처음 땅이 없어졌고"},{"book_id":"b_2pet","ref":"벧후 3:13","text":"의가 거하는 새 창조를 소망하라고 합니다.","title":"새 하늘과 새 땅을 바라보도다"},{"book_id":"b_romans","ref":"롬 8:21","text":"피조물이 썩어짐에서 해방될 소망을 말합니다.","title":"썩어짐의 종 노릇 한 데서 해방되어"}],"summary":"역사의 끝은 파괴가 아니라 회복입니다. 새 하늘과 새 땅에서는 눈물도 죽음도 고통도 없고, 하나님이 친히 함께 거하십니다. 이것이 성도가 바라는 최종 소망입니다.","title":"새 하늘과 새 땅"}]},{"id":"e_annunciation","type":"event","name":"수태고지","name_en":"The Annunciation","tagline":"예수님의 탄생을 미리 알리심","summary":"천사 가브리엘이 마리아에게 나타나 예수님의 탄생을 미리 알려준 사건입니다. 마리아는 약혼한 처녀였지만, 성령으로 말미암아 아들을 낳을 것이라는 말씀을 들었습니다. 마리아는 '주의 여종이오니 말씀대로 이루어지이다'라고 순종했습니다. 개혁주의 관점에서 수태고지는 구원이 전적으로 하나님의 주권적 은혜로 시작됨을 보여줍니다.","verses":[{"ref":"눅 1:26","book_en":"Luke","ch":1,"v":26,"text":"여섯째 달에 천사 가브리엘이 하나님의 보내심을 받들어 갈릴리 나사렛이란 동네에 가서"},{"ref":"눅 1:38","book_en":"Luke","ch":1,"v":38,"text":"마리아가 가로되 주의 계집 종이오니 말씀대로 내게 이루어지이다 하매 천사가 떠나가니라"}],"key_chapters":[{"book_id":"b_luke","ref":"눅 1:26-38","title":"가브리엘의 수태고지","text":"천사가 마리아에게 성령으로 예수님이 태어날 것을 알립니다."},{"book_id":"b_matthew","ref":"마 1:18-25","title":"요셉에게 나타난 천사","text":"요셉도 꿈에서 같은 소식을 듣고 마리아를 아내로 맞이합니다."}],"related":["e_birth","f_jesus","f_mary_mother","b_luke","b_matthew","d_christ"],"meta":{"when":"BC 5년경","order":1,"year_est":-5,"emperor":"아우구스투스"}},{"id":"e_magi","type":"event","name":"동방박사의 경배","name_en":"Visit of the Magi","tagline":"이방인도 찾아온 아기 예수","summary":"동방에서 온 박사들이 별을 보고 아기 예수님을 찾아온 사건입니다. 그들은 예루살렘을 거쳐 베들레헴에 이르러 황금과 유향과 몰약을 예물로 드렸습니다. 이방인인 박사들의 경배는 복음이 유대인을 넘어 온 세계를 향함을 미리 보여줍니다. 개혁주의 관점에서 이는 하나님의 구원 계획이 만민을 향한 것임을 증거합니다.","verses":[{"ref":"마 2:1","book_en":"Matthew","ch":2,"v":1,"text":"헤롯왕 때에 예수께서 유대 베들레헴에서 나시매 동방으로부터 박사들이 예루살렘에 이르러 말하되"},{"ref":"마 2:11","book_en":"Matthew","ch":2,"v":11,"text":"집에 들어가 아기와 그 모친 마리아의 함께 있는 것을 보고 엎드려 아기께 경배하고 보배합을 열어 황금과 유향과 몰약을 예물로 드리니라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 2:1-12","title":"동방박사의 방문","text":"별을 따라온 박사들이 아기 예수께 경배하고 예물을 드립니다."}],"related":["e_birth","f_jesus","f_mary_mother","b_matthew","d_christ"],"meta":{"when":"BC 4년경","order":3,"year_est":-4,"emperor":"아우구스투스"}},{"id":"e_boy_jesus","type":"event","name":"성전의 소년 예수","name_en":"The Boy Jesus in the Temple","tagline":"열두 살, 성전에서 배우심","summary":"열두 살 된 예수님이 유월절을 맞아 예루살렘 성전에 갔다가 부모와 떨어져 사흘 만에 발견된 사건입니다. 예수님은 성전에서 선생들과 묻고 답하며 모두를 놀라게 했습니다. '내 아버지 집에 있어야 할 줄을 알지 못하셨나이까'라는 말씀은 어릴 때부터 자신의 사명을 아셨음을 보여줍니다. 개혁주의 관점에서 이는 예수님의 참된 인성과 함께 일찍부터 드러난 신적 지혜를 증거합니다.","verses":[{"ref":"눅 2:49","book_en":"Luke","ch":2,"v":49,"text":"예수께서 가라사대 어찌하여 나를 찾으셨나이까 내가 내 아버지 집에 있어야 될 줄을 알지 못하셨나이까 하시니"},{"ref":"눅 2:52","book_en":"Luke","ch":2,"v":52,"text":"예수는 그 지혜와 그 키가 자라가며 하나님과 사람에게 더 사랑스러워 가시더라"}],"key_chapters":[{"book_id":"b_luke","ref":"눅 2:41-52","title":"성전의 소년 예수","text":"열두 살 예수가 성전에서 선생들과 대화하며 사명을 드러냅니다."}],"related":["e_birth","f_jesus","f_mary_mother","b_luke","d_christ"],"meta":{"when":"AD 8년경","order":4,"year_est":8,"emperor":"아우구스투스"}},{"id":"e_john_ministry","type":"event","name":"세례 요한의 외침","name_en":"Ministry of John the Baptist","tagline":"회개하라, 주를 예비하라","summary":"세례 요한이 광야에서 '회개하라 천국이 가까이 왔다'고 외친 사건입니다. 그는 예수님의 길을 예비하는 선구자로 보냄을 받았습니다. 많은 사람이 요단강에서 회개의 세례를 받았습니다. 개혁주의 관점에서 요한의 사역은 구원이 오직 회개와 믿음으로, 사람의 공로가 아닌 하나님의 은혜로 주어짐을 선포합니다.","verses":[{"ref":"마 3:1","book_en":"Matthew","ch":3,"v":1,"text":"그 때에 세례 요한이 이르러 유대 광야에서 전파하여 가로되"},{"ref":"마 3:11","book_en":"Matthew","ch":3,"v":11,"text":"나는 너희로 회개케 하기 위하여 물로 세례를 주거니와 내 뒤에 오시는 이는 나보다 능력이 많으시니 나는 그의 신을 들기도 감당치 못하겠노라 그는 성령과 불로 너희에게 세례를 주실 것이요"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 3:1-12","title":"광야의 외치는 자","text":"요한이 회개를 외치며 예수님의 오심을 예비합니다."},{"book_id":"b_luke","ref":"눅 3:1-18","title":"요한의 설교","text":"세례 요한이 회개에 합당한 열매를 맺으라고 촉구합니다."}],"related":["e_baptism","f_john_baptist","f_jesus","b_matthew","b_luke","d_salvation"],"meta":{"when":"AD 27년경","order":5,"year_est":27,"emperor":"디베료"}},{"id":"e_temptation","type":"event","name":"광야의 시험","name_en":"The Temptation of Jesus","tagline":"말씀으로 사탄을 이기심","summary":"세례 후 예수님이 성령에 이끌려 광야에서 사십 일 금식하신 뒤 사탄에게 세 번 시험받으신 사건입니다. 돌을 떡으로 만들라는 유혹, 성전 꼭대기에서 뛰어내리라는 유혹, 천하만국을 주겠다는 유혹을 모두 말씀으로 물리치셨습니다. 개혁주의 관점에서 이는 죄 없으신 그리스도께서 아담이 실패한 자리에서 승리하심으로 우리의 완전한 대속자가 되셨음을 보여줍니다.","verses":[{"ref":"마 4:1","book_en":"Matthew","ch":4,"v":1,"text":"그 때에 예수께서 성령에게 이끌리어 마귀에게 시험을 받으러 광야로 가사"},{"ref":"마 4:10","book_en":"Matthew","ch":4,"v":10,"text":"이에 예수께서 말씀하시되 사단아 물러가라 기록되었으되 주 너의 하나님께 경배하고 다만 그를 섬기라 하였느니라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 4:1-11","title":"세 가지 시험","text":"예수님이 말씀으로 사탄의 세 유혹을 물리치십니다."},{"book_id":"b_luke","ref":"눅 4:1-13","title":"광야의 시험","text":"누가복음도 같은 시험을 기록하며 예수님의 승리를 전합니다."}],"related":["e_baptism","f_jesus","b_matthew","b_luke","d_christ"],"meta":{"when":"AD 27년경","order":7,"year_est":27,"emperor":"디베료"}},{"id":"e_first_disciples","type":"event","name":"첫 제자들을 부르심","name_en":"Calling of the First Disciples","tagline":"나를 따르라, 사람을 낚게 하리라","summary":"예수님이 갈릴리 바닷가에서 베드로와 안드레, 야고보와 요한을 부르신 사건입니다. '나를 따라오너라 내가 너희로 사람을 낚는 어부가 되게 하리라'는 말씀에 그들은 즉시 그물을 버리고 따랐습니다. 개혁주의 관점에서 제자의 부르심은 전적으로 주님의 주권적 선택이며, 구원받은 자는 즉시 순종으로 응답함을 보여줍니다.","verses":[{"ref":"마 4:19","book_en":"Matthew","ch":4,"v":19,"text":"말씀하시되 나를 따라 오너라 내가 너희로 사람을 낚는 어부가 되게 하리라 하시니"},{"ref":"요 1:41","book_en":"John","ch":1,"v":41,"text":"그가 먼저 자기의 형제 시몬을 찾아 말하되 우리가 메시야를 만났다 하고 (메시야는 번역하면 그리스도라)"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 4:18-22","title":"갈릴리 바닷가의 부르심","text":"예수님이 어부들을 불러 제자로 삼으십니다."},{"book_id":"b_john","ref":"요 1:35-51","title":"처음 만난 제자들","text":"안드레와 빌립 등이 예수님을 메시아로 알아보고 따릅니다."}],"related":["f_peter","f_john_apostle","f_jesus","b_matthew","b_john","d_church"],"meta":{"when":"AD 27년경","order":8,"year_est":27,"emperor":"디베료"}},{"id":"e_cana","type":"event","name":"가나 혼인잔치","name_en":"Wedding at Cana","tagline":"첫 표적, 물을 포도주로","summary":"갈릴리 가나의 혼인잔치에서 포도주가 떨어지자 예수님이 물을 포도주로 바꾸신 첫 표적입니다. 요한복음은 이를 '표적'이라 부르며 예수님의 영광을 드러낸 사건으로 기록합니다. 개혁주의 관점에서 표적은 예수님이 약속된 메시아이심을 확증하는 하나님의 인침입니다.","verses":[{"ref":"요 2:9","book_en":"John","ch":2,"v":9,"text":"연회장은 물로 된 포도주를 맛보고 어디서 났는지 알지 못하되 물 떠온 하인들은 알더라 연회장이 신랑을 불러"},{"ref":"요 2:11","book_en":"John","ch":2,"v":11,"text":"예수께서 이 처음 표적을 갈릴리 가나에서 행하여 그 영광을 나타내시매 제자들이 그를 믿으니라"}],"key_chapters":[{"book_id":"b_john","ref":"요 2:1-11","title":"가나의 첫 표적","text":"예수님이 물을 포도주로 바꾸시며 영광을 드러내십니다."}],"related":["f_jesus","f_mary_mother","b_john","d_christ"],"meta":{"when":"AD 27년경","order":9,"year_est":27,"emperor":"디베료"}},{"id":"e_nicodemus","type":"event","name":"니고데모와의 대화","name_en":"Jesus and Nicodemus","tagline":"거듭나지 않으면 안 되느니라","summary":"바리새인 지도자 니고데모가 밤에 예수님을 찾아온 사건입니다. 예수님은 '거듭나지 아니하면 하나님의 나라를 볼 수 없느니라'고 말씀하셨습니다. 중생은 사람의 결심이 아니라 성령의 주권적 역사임을 가르치신 것입니다. 이어진 요한복음 3장 16절은 복음의 핵심을 한 문장으로 요약합니다. 개혁주의 관점에서 이 대화는 구원이 전적으로 하나님의 은혜임을 선포합니다.","verses":[{"ref":"요 3:3","book_en":"John","ch":3,"v":3,"text":"예수께서 대답하여 가라사대 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 하나님 나라를 볼수 없느니라"},{"ref":"요 3:16","book_en":"John","ch":3,"v":16,"text":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"}],"key_chapters":[{"book_id":"b_john","ref":"요 3:1-21","title":"밤에 찾아온 니고데모","text":"거듭남과 하나님의 사랑(요 3:16)을 가르치십니다."}],"related":["f_jesus","b_john","d_salvation"],"meta":{"when":"AD 27년경","order":10,"year_est":27,"emperor":"디베료"}},{"id":"e_samaritan","type":"event","name":"사마리아 여인","name_en":"The Samaritan Woman","tagline":"생수를 주는 메시아","summary":"예수님이 사마리아 수가의 우물가에서 한 여인과 대화하신 사건입니다. 유대인이 상종하지 않던 사마리아인이자 여러 남편을 둔 여인이었지만, 예수님은 그녀에게 '생수'를 약속하셨습니다. 여인은 마을로 달려가 사람들을 예수님께로 이끌었습니다. 개혁주의 관점에서 이는 구원의 은혜가 차별 없이 죄인에게 미치는 하나님의 주권을 보여줍니다.","verses":[{"ref":"요 4:14","book_en":"John","ch":4,"v":14,"text":"내가 주는 물을 먹는 자는 영원히 목마르지 아니하리니 나의 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라"},{"ref":"요 4:29","book_en":"John","ch":4,"v":29,"text":"나의 행한 모든 일을 내게 말한 사람을 와 보라 이는 그리스도가 아니냐 하니"}],"key_chapters":[{"book_id":"b_john","ref":"요 4:1-42","title":"우물가의 대화","text":"예수님이 사마리아 여인에게 생수와 참된 예배를 가르치십니다."}],"related":["f_jesus","b_john","d_salvation","d_christ"],"meta":{"when":"AD 27년경","order":11,"year_est":27,"emperor":"디베료"}},{"id":"e_sermon","type":"event","name":"산상수훈","name_en":"Sermon on the Mount","tagline":"천국 백성의 삶의 규범","summary":"예수님이 산 위에서 제자들에게 천국 백성의 삶을 가르치신 설교입니다. 팔복으로 시작해 율법의 참뜻, 기도(주기도문), 염려, 좁은 문 등을 다루십니다. 산상수훈은 구원의 조건이 아니라 구원받은 자의 삶의 열매를 보여줍니다. 개혁주의 관점에서 이는 율법의 참된 요구를 드러내어 죄를 깨닫게 하고, 오직 은혜로 사는 삶을 가르칩니다.","verses":[{"ref":"마 5:3","book_en":"Matthew","ch":5,"v":3,"text":"심령이 가난한 자는 복이 있나니 천국이 저희 것임이요"},{"ref":"마 7:24","book_en":"Matthew","ch":7,"v":24,"text":"그러므로 누구든지 나의 이 말을 듣고 행하는 자는 그 집을 반석 위에 지은 지혜로운 사람 같으리니"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 5-7장","title":"산상수훈","text":"팔복부터 주기도문까지 천국 백성의 삶을 가르치십니다."}],"related":["f_jesus","f_peter","b_matthew","d_christ","d_salvation"],"meta":{"when":"AD 28년경","order":12,"year_est":28,"emperor":"디베료"}},{"id":"e_paralytic","type":"event","name":"중풍병자를 고치심","name_en":"Healing of the Paralytic","tagline":"네 죄 사함을 받았느니라","summary":"네 사람이 지붕을 뚫고 중풍병자를 예수님께 내려드린 사건입니다. 예수님은 먼저 '네 죄 사함을 받았느니라'고 선언하셨고, 이어 병을 고쳐주셨습니다. 이는 예수님께 죄를 사하시는 하나님의 권세가 있음을 드러낸 표적입니다. 개혁주의 관점에서 육체의 치유보다 영혼의 죄 사함이 먼저임을 보여줍니다.","verses":[{"ref":"막 2:5","book_en":"Mark","ch":2,"v":5,"text":"예수께서 저희의 믿음을 보시고 중풍병자에게 이르시되 소자야 네 죄 사함을 받았느니라 하시니"},{"ref":"막 2:10","book_en":"Mark","ch":2,"v":10,"text":"그러나 인자가 땅에서 죄를 사하는 권세가 있는 줄을 너희로 알게 하려하노라 하시고 중풍병자에게 말씀하시되"}],"key_chapters":[{"book_id":"b_mark","ref":"막 2:1-12","title":"지붕을 뚫고 내린 환자","text":"죄 사함의 권세를 보이시며 중풍병자를 고치십니다."},{"book_id":"b_luke","ref":"눅 5:17-26","title":"중풍병자의 치유","text":"누가복음도 같은 사건을 전하며 예수님의 권세를 증거합니다."}],"related":["f_jesus","b_mark","b_luke","d_christ","d_salvation"],"meta":{"when":"AD 28년경","order":13,"year_est":28,"emperor":"디베료"}},{"id":"e_twelve","type":"event","name":"열두 제자를 세우심","name_en":"Appointment of the Twelve","tagline":"열두 사도의 선택","summary":"예수님이 밤새 기도하신 후 열두 제자를 따로 세우신 사건입니다. 그들은 예수님과 함께 있고, 복음을 전파하며, 귀신을 쫓는 권세를 받았습니다. 이 열두 사도는 신약 교회의 기초가 되었습니다. 개혁주의 관점에서 교회는 사도들의 가르침 위에 세워지며, 직분은 주님의 부르심으로 주어집니다.","verses":[{"ref":"막 3:14","book_en":"Mark","ch":3,"v":14,"text":"이에 열 둘을 세우셨으니 이는 자기와 함께 있게 하시고 또 보내사 전도도 하며"},{"ref":"눅 6:13","book_en":"Luke","ch":6,"v":13,"text":"밝으매 그 제자들을 부르사 그 중에서 열 둘을 택하여 사도라 칭하셨으니"}],"key_chapters":[{"book_id":"b_mark","ref":"막 3:13-19","title":"열두 사도 임명","text":"예수님이 열두 사람을 세워 사도로 삼으십니다."}],"related":["f_peter","f_john_apostle","f_jesus","b_mark","d_church"],"meta":{"when":"AD 28년경","order":14,"year_est":28,"emperor":"디베료"}},{"id":"e_parables","type":"event","name":"씨 뿌리는 자의 비유","name_en":"Parable of the Sower","tagline":"말씀을 받는 네 가지 마음","summary":"예수님이 씨 뿌리는 자의 비유로 말씀을 듣는 네 가지 마음을 가르치신 사건입니다. 길가, 돌밭, 가시떨기, 좋은 땅에 떨어진 씨는 각각 다른 반응을 보입니다. 좋은 땅에 떨어진 씨만 열매를 맺습니다. 개혁주의 관점에서 이는 같은 복음 앞에서도 마음의 반응이 다름을, 그리고 열매 맺는 믿음이 성령의 역사임을 가르칩니다.","verses":[{"ref":"마 13:8","book_en":"Matthew","ch":13,"v":8,"text":"더러는 좋은 땅에 떨어지매 혹 백배, 혹 육십배, 혹 삼십배의 결실을 하였느니라"},{"ref":"마 13:23","book_en":"Matthew","ch":13,"v":23,"text":"좋은 땅에 뿌리웠다는 것은 말씀을 듣고 깨닫는 자니 결실하여 혹 백배, 혹 육십배, 혹 삼십배가 되느니라 하시더라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 13:1-23","title":"씨 뿌리는 자의 비유","text":"네 가지 밭에 떨어진 씨로 말씀 듣는 마음을 비유하십니다."}],"related":["f_jesus","b_matthew","b_mark","d_salvation"],"meta":{"when":"AD 28년경","order":15,"year_est":28,"emperor":"디베료"}},{"id":"e_loaves","type":"event","name":"오병이어","name_en":"Feeding of the Five Thousand","tagline":"오천 명을 먹이신 기적","summary":"예수님이 소년의 보리떡 다섯 개와 물고기 두 마리로 오천 명을 먹이신 사건입니다. 이는 예수님의 공생애 중 가장 큰 이적 중 하나로, 네 복음서가 모두 기록합니다. 개혁주의 관점에서 이는 예수님이 생명의 떡이심을 드러내는 표적이며, 부족한 것을 채우시는 하나님의 풍성한 공급을 보여줍니다.","verses":[{"ref":"요 6:11","book_en":"John","ch":6,"v":11,"text":"예수께서 떡을 가져 축사하신 후에 앉은 자들에게 나눠 주시고 고기도 그렇게 저희의 원대로 주시다"},{"ref":"요 6:35","book_en":"John","ch":6,"v":35,"text":"예수께서 가라사대 내가 곧 생명의 떡이니 내게 오는 자는 결코 주리지 아니할 터이요 나를 믿는 자는 영원히 목마르지 아니하리라"}],"key_chapters":[{"book_id":"b_john","ref":"요 6:1-14","title":"오병이어의 기적","text":"오천 명을 먹이신 뒤 '나는 생명의 떡'이라 선언하십니다."},{"book_id":"b_mark","ref":"막 6:30-44","title":"광야에서의 급식","text":"마가복음도 떡 다섯 개로 무리를 먹이신 기적을 전합니다."}],"related":["f_jesus","f_peter","b_john","b_mark","d_christ"],"meta":{"when":"AD 29년경","order":16,"year_est":29,"emperor":"디베료"}},{"id":"e_walk_water","type":"event","name":"물 위를 걸으심","name_en":"Walking on Water","tagline":"파도 위를 걸어오신 주님","summary":"오병이어 후 예수님이 새벽에 바다 위를 걸어 제자들의 배로 오신 사건입니다. 베드로는 주님을 향해 물 위를 걷다가 바람을 보고 두려워 빠져들었고, 예수님이 손을 내밀어 건지셨습니다. 제자들은 '진실로 하나님의 아들이로소이다'라고 고백했습니다. 개혁주의 관점에서 이는 예수님의 신성을 드러내는 표적입니다.","verses":[{"ref":"마 14:27","book_en":"Matthew","ch":14,"v":27,"text":"예수께서 즉시 일러 가라사대 안심하라 내니 두려워 말라"},{"ref":"마 14:31","book_en":"Matthew","ch":14,"v":31,"text":"예수께서 즉시 손을 내밀어 저를 붙잡으시며 가라사대 믿음이 적은 자여 왜 의심하였느냐 하시고"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 14:22-33","title":"바다 위를 걸으심","text":"물 위를 걸어오시며 베드로의 작은 믿음을 붙드십니다."}],"related":["f_jesus","f_peter","b_matthew","d_christ"],"meta":{"when":"AD 29년경","order":17,"year_est":29,"emperor":"디베료"}},{"id":"e_peter_confession","type":"event","name":"베드로의 신앙고백","name_en":"Peter's Confession of Christ","tagline":"주는 그리스도시니이다","summary":"가이사랴 빌립보에서 베드로가 '주는 그리스도시요 살아 계신 하나님의 아들이시니이다'라고 고백한 사건입니다. 예수님은 이 고백이 혈육이 아닌 하늘에 계신 아버지께로부터 온 것이라 하셨습니다. 이어 '내가 이 반석 위에 내 교회를 세우리니'라고 선언하셨습니다. 개혁주의 관점에서 교회는 그리스도에 대한 참된 신앙고백 위에 세워집니다.","verses":[{"ref":"마 16:16","book_en":"Matthew","ch":16,"v":16,"text":"시몬 베드로가 대답하여 가로되 주는 그리스도시요 살아계신 하나님의 아들이시니이다"},{"ref":"마 16:18","book_en":"Matthew","ch":16,"v":18,"text":"또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 16:13-20","title":"베드로의 신앙고백","text":"그리스도 고백 위에 교회를 세우시겠다고 선언하십니다."}],"related":["f_peter","f_jesus","b_matthew","d_christ","d_church"],"meta":{"when":"AD 29년경","order":18,"year_est":29,"emperor":"디베료"}},{"id":"e_transfiguration","type":"event","name":"변화산","name_en":"The Transfiguration","tagline":"영광 중에 변화되심","summary":"예수님이 베드로·야고보·요한을 데리고 높은 산에 올라가 영광 중에 변화되신 사건입니다. 얼굴이 해같이 빛나고 옷이 희어졌으며, 모세와 엘리야가 나타나 함께 말했습니다. 구름 속 음성은 '이는 내 사랑하는 아들이니 그의 말을 들으라'고 했습니다. 개혁주의 관점에서 변화산은 십자가를 앞둔 제자들에게 그리스도의 신성과 장차 올 영광을 미리 보여준 사건입니다.","verses":[{"ref":"마 17:2","book_en":"Matthew","ch":17,"v":2,"text":"저희 앞에서 변형되사 그 얼굴이 해 같이 빛나며 옷이 빛과 같이 희어졌더라"},{"ref":"마 17:5","book_en":"Matthew","ch":17,"v":5,"text":"말할 때에 홀연히 빛난 구름이 저희를 덮으며 구름 속에서 소리가 나서 가로되 이는 내 사랑하는 아들이요 내 기뻐하는 자니 너희는 저의 말을 들으라 하는지라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 17:1-8","title":"변화산의 영광","text":"모세·엘리야와 함께 영광 중에 변화되십니다."},{"book_id":"b_luke","ref":"눅 9:28-36","title":"기도 중의 변화","text":"누가복음은 기도하실 때 변화되셨다고 전합니다."}],"related":["f_jesus","f_peter","f_john_apostle","b_matthew","d_christ"],"meta":{"when":"AD 29년경","order":19,"year_est":29,"emperor":"디베료"}},{"id":"e_lazarus","type":"event","name":"나사로를 살리심","name_en":"Raising of Lazarus","tagline":"나는 부활이요 생명이니라","summary":"죽은 지 나흘이 된 나사로를 예수님이 무덤에서 불러내신 사건입니다. 예수님은 '나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고'라고 선언하셨습니다. 이 표적은 예수님이 생명의 주권자이심을 드러냈고, 종교 지도자들의 살해 결의를 굳게 했습니다. 개혁주의 관점에서 이는 장차 있을 부활의 보증이며 그리스도의 신성을 증거합니다.","verses":[{"ref":"요 11:25","book_en":"John","ch":11,"v":25,"text":"예수께서 가라사대 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고"},{"ref":"요 11:43","book_en":"John","ch":11,"v":43,"text":"이 말씀을 하시고 큰 소리로 나사로야 나오라 부르시니"}],"key_chapters":[{"book_id":"b_john","ref":"요 11:1-44","title":"나사로의 부활","text":"'나사로야 나오라' 한 말씀에 죽은 자가 살아납니다."}],"related":["f_jesus","b_john","d_christ","e_cross","d_eschatology"],"meta":{"when":"AD 30년경","order":20,"year_est":30,"emperor":"디베료"}},{"id":"e_triumphal","type":"event","name":"예루살렘 입성","name_en":"Triumphal Entry","tagline":"호산나, 왕의 입성","summary":"예수님이 나귀를 타고 예루살렘에 입성하신 사건입니다. 무리는 종려나무 가지를 흔들며 '호산나 다윗의 자손이여'라고 외쳤습니다. 이는 스가랴의 예언(슥 9:9)의 성취로, 겸손한 왕의 오심을 보여줍니다. 개혁주의 관점에서 입성은 예수님이 약속된 메시아 왕이심을 공적으로 드러낸 사건입니다.","verses":[{"ref":"마 21:9","book_en":"Matthew","ch":21,"v":9,"text":"앞에서 가고 뒤에서 따르는 무리가 소리질러 가로되 호산나 다윗의 자손이여 찬송하리로다 주의 이름으로 오시는이여 가장 높은 곳에서 호산나 하더라"},{"ref":"요 12:13","book_en":"John","ch":12,"v":13,"text":"종려나무 가지를 가지고 맞으러 나가 외치되 호산나 찬송하리로다 주의 이름으로 오시는이 곧 이스라엘의 왕이시여 하더라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 21:1-11","title":"나귀를 타신 왕","text":"예언대로 겸손히 예루살렘에 입성하십니다."},{"book_id":"b_john","ref":"요 12:12-19","title":"호산나의 환호","text":"무리가 종려가지를 들고 왕을 맞이합니다."}],"related":["f_jesus","e_cross","b_matthew","b_john","d_christ"],"meta":{"when":"AD 30년경","order":21,"year_est":30,"emperor":"디베료"}},{"id":"e_last_supper","type":"event","name":"최후의 만찬","name_en":"The Last Supper","tagline":"떡과 잔, 새 언약","summary":"십자가 전날 밤 예수님이 제자들과 마지막 유월절 만찬을 나누신 사건입니다. 떡을 떼며 '이는 내 몸이라', 잔을 주며 '이 잔은 내 피로 세우는 새 언약'이라고 말씀하셨습니다. 성찬의 제정이 여기서 비롯됩니다. 개혁주의 관점에서 성찬은 그리스도의 대속을 기념하고 믿음으로 참여하는 은혜의 수단입니다.","verses":[{"ref":"마 26:28","book_en":"Matthew","ch":26,"v":28,"text":"이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는바 나의 피 곧 언약의 피니라"},{"ref":"요 13:34","book_en":"John","ch":13,"v":34,"text":"새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한것 같이 너희도 서로 사랑하라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 26:26-30","title":"성찬의 제정","text":"떡과 잔으로 새 언약을 세우십니다."},{"book_id":"b_john","ref":"요 13:1-17","title":"제자들의 발을 씻기심","text":"섬김의 본을 보이시며 서로 사랑하라 명하십니다."}],"related":["e_cross","f_jesus","f_peter","f_john_apostle","b_matthew","b_john","d_church"],"meta":{"when":"AD 30년경","order":22,"year_est":30,"emperor":"디베료"}},{"id":"e_gethsemane","type":"event","name":"겟세마네의 기도","name_en":"Prayer in Gethsemane","tagline":"내 뜻대로 마옵시고","summary":"체포 직전 예수님이 겟세마네 동산에서 땀이 핏방울같이 되도록 기도하신 사건입니다. '내 아버지여 만일 할 만하시거든 이 잔을 내게서 지나가게 하옵소서 그러나 나의 원대로 마옵시고 아버지의 원대로 하옵소서'라고 하셨습니다. 제자들은 졸고 있었습니다. 개혁주의 관점에서 이는 참 사람이신 그리스도께서 십자가의 고난을 앞두고 순종을 이루신 장면입니다.","verses":[{"ref":"마 26:39","book_en":"Matthew","ch":26,"v":39,"text":"조금 나아가사 얼굴을 땅에 대시고 엎드려 기도하여 가라사대 내 아버지여 만일 할만하시거든 이 잔을 내게서 지나가게 하옵소서 그러나 나의 원대로 마옵시고 아버지의 원대로 하옵소서 하시고"},{"ref":"눅 22:42","book_en":"Luke","ch":22,"v":42,"text":"가라사대 아버지여 만일 아버지의 뜻이어든 이 잔을 내게서 옮기시옵소서 그러나 내 원대로 마옵시고 아버지의 원대로 되기를 원하나이다 하시니"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 26:36-46","title":"겟세마네의 기도","text":"아버지의 뜻에 순종하기로 결단하십니다."}],"related":["e_cross","e_arrest","f_jesus","f_peter","b_matthew","d_christ"],"meta":{"when":"AD 30년경","order":23,"year_est":30,"emperor":"디베료"}},{"id":"e_arrest","type":"event","name":"체포와 배신","name_en":"Arrest and Betrayal","tagline":"가룟 유다의 입맞춤","summary":"가룟 유다가 은 삼십에 예수님을 팔아넘기고, 밤에 군병들을 이끌고 와 입맞춤으로 신호한 사건입니다. 베드로가 칼을 휘둘러 말고의 귀를 베자 예수님은 그를 고쳐주셨습니다. 예수님은 '내가 지금 내 아버지께 구하여 열두 영 더 되는 천사를 보내시게 할 수 없는 줄 아느냐'며 순순히 잡히셨습니다. 개혁주의 관점에서 이는 성경의 예언대로 자발적으로 고난을 받으신 그리스도의 순종을 보여줍니다.","verses":[{"ref":"요 18:4","book_en":"John","ch":18,"v":4,"text":"예수께서 그 당할 일을 다 아시고 나아가 가라사대 너희가 누구를 찾느냐"},{"ref":"마 26:50","book_en":"Matthew","ch":26,"v":50,"text":"예수께서 가라사대 친구여 네가 무엇을 하려고 왔는지 행하라 하신대 이에 저희가 나아와 예수께 손을 대어 잡는지라"}],"key_chapters":[{"book_id":"b_john","ref":"요 18:1-11","title":"붙잡히심","text":"'내가 그니라'는 말씀에 군병들이 물러가 넘어집니다."},{"book_id":"b_matthew","ref":"마 26:47-56","title":"배신과 체포","text":"유다의 입맞춤으로 체포되시나 순종하십니다."}],"related":["e_trial","f_jesus","f_peter","b_john","d_christ"],"meta":{"when":"AD 30년경","order":24,"year_est":30,"emperor":"디베료"}},{"id":"e_peter_denial","type":"event","name":"베드로의 세 번 부인","name_en":"Peter's Denial","tagline":"닭 울기 전 세 번 부인","summary":"예수님이 체포된 밤, 베드로가 대제사장의 뜰에서 예수님을 세 번 부인한 사건입니다. 예수님의 예언대로 닭이 울자 베드로는 주님의 눈빛을 보고 나가서 심히 통곡했습니다. 개혁주의 관점에서 이는 인간의 연약함과 자랑의 허무함을 보여주는 동시에, 회개하는 죄인을 버리지 않으시는 주님의 은혜를 드러냅니다.","verses":[{"ref":"눅 22:61","book_en":"Luke","ch":22,"v":61,"text":"주께서 돌이켜 베드로를 보시니 베드로가 주의 말씀 곧 오늘 닭 울기 전에 네가 세번 나를 부인하리라 하심이 생각나서"},{"ref":"눅 22:62","book_en":"Luke","ch":22,"v":62,"text":"밖에 나가서 심히 통곡하니라"}],"key_chapters":[{"book_id":"b_luke","ref":"눅 22:54-62","title":"세 번의 부인","text":"닭 울음에 주님을 돌아보고 통곡합니다."}],"related":["e_trial","f_peter","f_jesus","b_luke","d_salvation"],"meta":{"when":"AD 30년경","order":25,"year_est":30,"emperor":"디베료"}},{"id":"e_trial","type":"event","name":"빌라도 앞에서의 재판","name_en":"Trial before Pilate","tagline":"무죄하신 분의 유죄 판결","summary":"대제사장들 앞에서 심문받은 예수님이 로마 총독 빌라도 앞에 세워진 사건입니다. 빌라도는 '나는 그에게서 죄를 찾지 못하노라'고 세 번이나 말했으나, 무리의 압력에 못 이겨 십자가형을 선고했습니다. 개혁주의 관점에서 무죄하신 그리스도께서 죄인 대신 정죄받으심은 대속의 핵심이며, 이는 하나님의 정하신 뜻대로 이루어졌습니다.","verses":[{"ref":"요 19:5","book_en":"John","ch":19,"v":5,"text":"이에 예수께서 가시 면류관을 쓰고 자색 옷을 입고 나오시니 빌라도가 저희에게 말하되 보라 이 사람이로다 하매"},{"ref":"마 27:24","book_en":"Matthew","ch":27,"v":24,"text":"빌라도가 아무 효험도 없이 도리어 민란이 나려는 것을 보고 물을 가져다가 무리 앞에서 손을 씻으며 가로되 이 사람의 피에 대하여 나는 무죄하니 너희가 당하라"}],"key_chapters":[{"book_id":"b_john","ref":"요 18:28-19:16","title":"빌라도의 심문","text":"'진리가 무엇이냐'는 질문 앞에 서십니다."}],"related":["e_cross","f_jesus","b_john","d_christ","d_salvation"],"meta":{"when":"AD 30년경","order":26,"year_est":30,"emperor":"디베료"}},{"id":"e_emmaus","type":"event","name":"엠마오로 가는 두 제자","name_en":"Road to Emmaus","tagline":"성경을 풀어주신 동행자","summary":"부활 당일, 낙심한 두 제자가 엠마오로 가던 길에 부활하신 예수님이 동행하신 사건입니다. 그들은 알아보지 못했으나, 예수님이 모세와 선지자의 글로 자신을 설명하시자 마음이 뜨거워졌습니다. 떡을 떼실 때 눈이 밝아졌습니다. 개혁주의 관점에서 이는 성경 전체가 그리스도를 증거함을 가르치는 본입니다.","verses":[{"ref":"눅 24:27","book_en":"Luke","ch":24,"v":27,"text":"이에 모세와 및 모든 선지자의 글로 시작하여 모든 성경에 쓴바 자기에 관한 것을 자세히 설명하시니라"},{"ref":"눅 24:32","book_en":"Luke","ch":24,"v":32,"text":"저희가 서로 말하되 길에서 우리에게 말씀하시고 우리에게 성경을 풀어 주실 때에 우리 속에서 마음이 뜨겁지 아니하더냐 하고"}],"key_chapters":[{"book_id":"b_luke","ref":"눅 24:13-35","title":"엠마오의 동행","text":"성경으로 그리스도를 풀어주시자 눈이 밝아집니다."}],"related":["e_resurrection","f_jesus","b_luke","d_christ"],"meta":{"when":"AD 30년경","order":29,"year_est":30,"emperor":"디베료"}},{"id":"e_thomas","type":"event","name":"도마의 고백","name_en":"Confession of Thomas","tagline":"나의 주, 나의 하나님","summary":"부활하신 예수님을 보지 못해 믿지 않던 도마가 일주일 후 예수님을 만나 고백한 사건입니다. 예수님은 못 자국과 옆구리를 만져보라 하셨고, 도마는 '나의 주시며 나의 하나님이시니이다'라고 외쳤습니다. 예수님은 '보지 못하고 믿는 자들은 복되도다'라고 하셨습니다. 개혁주의 관점에서 이는 부활의 확실성과 믿음의 본질을 보여줍니다.","verses":[{"ref":"요 20:28","book_en":"John","ch":20,"v":28,"text":"도마가 대답하여 가로되 나의 주시며 나의 하나님이시니이다"},{"ref":"요 20:29","book_en":"John","ch":20,"v":29,"text":"예수께서 가라사대 너는 나를 본 고로 믿느냐 보지못하고 믿는 자들은 복되도다 하시니라"}],"key_chapters":[{"book_id":"b_john","ref":"요 20:24-29","title":"도마의 고백","text":"만져보고 고백한 도마에게 믿음의 복을 말씀하십니다."}],"related":["e_resurrection","f_jesus","b_john","d_christ","d_salvation"],"meta":{"when":"AD 30년경","order":30,"year_est":30,"emperor":"디베료"}},{"id":"e_great_commission","type":"event","name":"지상명령","name_en":"The Great Commission","tagline":"가서 모든 족속을 제자로 삼으라","summary":"부활하신 예수님이 갈릴리 산에서 제자들에게 '너희는 가서 모든 족속으로 제자를 삼으라'고 명령하신 사건입니다. 세례를 주고 가르쳐 지키게 하며, '내가 세상 끝날까지 너희와 항상 함께 있으리라'고 약속하셨습니다. 개혁주의 관점에서 지상명령은 교회의 존재 이유이며, 선교는 주님의 약속 안에서 수행되는 사명입니다.","verses":[{"ref":"마 28:19","book_en":"Matthew","ch":28,"v":19,"text":"그러므로 너희는 가서 모든 족속으로 제자를 삼아 아버지와 아들과 성령의 이름으로 세례를 주고"},{"ref":"행 1:8","book_en":"Acts","ch":1,"v":8,"text":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 이르러 내 증인이 되리라 하시니라"}],"key_chapters":[{"book_id":"b_matthew","ref":"마 28:18-20","title":"지상대명령","text":"모든 족속을 제자 삼으라는 명령과 동행 약속입니다."},{"book_id":"b_acts","ref":"행 1:6-8","title":"증인이 되리라","text":"성령의 능력으로 땅끝까지 증인이 되라고 하십니다."}],"related":["e_ascension","f_jesus","b_matthew","b_acts","d_church","d_holyspirit"],"meta":{"when":"AD 30년경","order":31,"year_est":30,"emperor":"디베료"}},{"id":"e_peter_sermon","type":"event","name":"베드로의 설교와 삼천 명","name_en":"Peter's Sermon and 3,000 Converts","tagline":"하루에 삼천 명이 회개하다","summary":"오순절 성령 강림 후 베드로가 담대히 설교하자 삼천 명이 회개하고 세례받은 사건입니다. '너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 받으라'는 말씀에 마음이 찔린 무리가 순종했습니다. 개혁주의 관점에서 이는 말씀과 성령의 역사로 교회가 탄생함을 보여주는 원형입니다.","verses":[{"ref":"행 2:38","book_en":"Acts","ch":2,"v":38,"text":"베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니"},{"ref":"행 2:41","book_en":"Acts","ch":2,"v":41,"text":"그 말을 받는 사람들은 세례를 받으매 이 날에 제자의 수가 삼천이나 더하더라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 2:14-41","title":"베드로의 첫 설교","text":"설교에 삼천 명이 회개하고 교회가 탄생합니다."}],"related":["e_pentecost","f_peter","b_acts","d_church","d_salvation","d_holyspirit"],"meta":{"when":"AD 30년경","order":34,"year_est":30,"emperor":"디베료"}},{"id":"e_ananias","type":"event","name":"아나니아와 삽비라","name_en":"Ananias and Sapphira","tagline":"성령을 속인 대가","summary":"초대교회 때 아나니아와 삽비라 부부가 밭을 팔고 값을 일부 숨긴 채 다 바친 것처럼 속인 사건입니다. 베드로는 '사람에게 거짓말한 것이 아니요 하나님께로다'라고 했고, 두 사람은 즉시 죽었습니다. 온 교회에 두려움이 임했습니다. 개혁주의 관점에서 이는 교회의 거룩하심과 성령을 속이는 죄의 심각함을 보여줍니다.","verses":[{"ref":"행 5:3","book_en":"Acts","ch":5,"v":3,"text":"베드로가 가로되 아나니아야 어찌하여 사단이 네 마음에 가득하여 네가 성령을 속이고 땅값 얼마를 감추었느냐"},{"ref":"행 5:11","book_en":"Acts","ch":5,"v":11,"text":"온 교회와 이 일을 듣는 사람들이 다 크게 두려워하니라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 5:1-11","title":"아나니아와 삽비라","text":"성령을 속인 죄에 대한 하나님의 심판입니다."}],"related":["f_peter","b_acts","d_church","d_holyspirit"],"meta":{"when":"AD 31년경","order":35,"year_est":31,"emperor":"디베료"}},{"id":"e_deacons","type":"event","name":"일곱 집사","name_en":"The Seven Deacons","tagline":"성령 충만한 일곱 사람","summary":"제자가 많아지자 헬라파 과부들이 구제에 소홀히 여겨짐을 보고 사도들이 일곱 집사를 세운 사건입니다. '성령과 지혜가 충만하여 칭찬 듣는 사람 일곱'을 택했고, 그중 스데반은 은혜와 권능이 충만했습니다. 사도들은 기도와 말씀 전하는 일에 전념했습니다. 개혁주의 관점에서 이는 교회의 직분이 말씀 사역과 구제 사역으로 구분됨을 보여주는 본입니다.","verses":[{"ref":"행 6:3","book_en":"Acts","ch":6,"v":3,"text":"형제들아 너희 가운데서 성령과 지혜가 충만하여 칭찬 듣는 사람 일곱을 택하라 우리가 이 일을 저희에게 맡기고"},{"ref":"행 6:7","book_en":"Acts","ch":6,"v":7,"text":"하나님의 말씀이 점점 왕성하여 예루살렘에 있는 제자의 수가 더 심히 많아지고 허다한 제사장의 무리도 이 도에 복종하니라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 6:1-7","title":"일곱 집사의 선택","text":"구제 사역을 위한 첫 집사들이 세워집니다."}],"related":["e_stephen_martyrdom","f_stephen","b_acts","d_church"],"meta":{"when":"AD 32년경","order":36,"year_est":32,"emperor":"디베료"}},{"id":"e_ethiopian","type":"event","name":"에디오피아 내시","name_en":"The Ethiopian Eunuch","tagline":"병거에서 읽던 이사야서","summary":"빌립 집사가 성령의 인도하심으로 에디오피아 내시의 병거에 올라 이사야 53장을 풀어준 사건입니다. 내시는 예수님을 믿고 즉시 물 있는 곳에서 세례를 받았습니다. 개혁주의 관점에서 이는 복음이 유대인을 넘어 이방인에게 미치는 하나님의 주권적 인도하심이며, 세례가 믿음의 고백 위에 주어짐을 보여줍니다.","verses":[{"ref":"행 8:35","book_en":"Acts","ch":8,"v":35,"text":"빌립이 입을 열어 이 글에서 시작하여 예수를 가르쳐 복음을 전하니"},{"ref":"행 8:39","book_en":"Acts","ch":8,"v":39,"text":"둘이 물에서 올라갈새 주의 영이 빌립을 이끌어 간지라 내시는 흔연히 길을 가므로 그를 다시 보지 못하니라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 8:26-39","title":"병거의 세례","text":"빌립이 이사야서를 풀어주자 내시가 믿고 세례받습니다."}],"related":["b_acts","d_church","d_salvation","e_jerusalem_council"],"meta":{"when":"AD 35년경","order":38,"year_est":35,"emperor":"디베료"}},{"id":"e_cornelius","type":"event","name":"고넬료 가정의 구원","name_en":"Salvation of Cornelius's Household","tagline":"이방인에게 내린 성령","summary":"로마 백부장 고넬료의 가정에 베드로가 복음을 전하자 성령이 임한 사건입니다. 베드로는 환상을 통해 하나님이 유대인과 이방인을 차별하지 않으심을 깨달았습니다. 이는 이방인 선교의 문을 연 결정적 사건으로, 예루살렘 공의회의 배경이 됩니다. 개혁주의 관점에서 구원이 혈통이 아닌 오직 믿음으로 주어짐을 확증합니다.","verses":[{"ref":"행 10:44","book_en":"Acts","ch":10,"v":44,"text":"베드로가 이 말 할때에 성령이 말씀 듣는 모든 사람에게 내려오시니"},{"ref":"행 10:47","book_en":"Acts","ch":10,"v":47,"text":"이에 베드로가 가로되 이 사람들이 우리와 같이 성령을 받았으니 누가 능히 물로 세례 줌을 금하리요 하고"}],"key_chapters":[{"book_id":"b_acts","ref":"행 10:1-48","title":"고넬료 가정의 성령 강림","text":"이방인에게도 성령이 임하심을 베드로가 목격합니다."}],"related":["f_peter","b_acts","d_church","d_holyspirit","e_jerusalem_council"],"meta":{"when":"AD 40년경","order":40,"year_est":40,"emperor":"갈리굴라"}},{"id":"e_peter_prison","type":"event","name":"베드로의 옥중 탈출","name_en":"Peter's Miraculous Escape from Prison","tagline":"쇠사슬이 풀리고 옥문이 열리다","summary":"헤롯이 야고보를 죽이고 베드로마저 잡아 옥에 가둔 사건입니다. 교회가 간절히 기도할 때 천사가 나타나 쇠사슬을 풀고 옥문을 열어 베드로를 구출했습니다. 베드로는 마가 요한의 어머니 마리아 집에 이르러 기도하던 성도들을 놀라게 했습니다. 개혁주의 관점에서 이는 기도에 응답하시고 교회를 지키시는 하나님의 섭리를 보여줍니다.","verses":[{"ref":"행 12:7","book_en":"Acts","ch":12,"v":7,"text":"홀연히 주의 사자가 곁에 서매 옥중에 광채가 조요하며 또 베드로의 옆구리를 쳐 깨워 가로되 급히 일어나라 하니 쇠사슬이 그 손에서 벗어지더라"},{"ref":"행 12:11","book_en":"Acts","ch":12,"v":11,"text":"이에 베드로가 정신이 나서 가로되 내가 이제야 참으로 주께서 그의 천사를 보내어 나를 헤롯의 손과 유대 백성의 모든 기대에서 벗어나게 하신줄 알겠노라 하여"}],"key_chapters":[{"book_id":"b_acts","ref":"행 12:1-19","title":"옥중 탈출","text":"교회의 기도에 천사가 베드로를 구출합니다."}],"related":["f_peter","b_acts","d_church"],"meta":{"when":"AD 44년경","order":41,"year_est":44,"emperor":"글라우디오"}},{"id":"e_mission1","type":"event","name":"1차 전도여행","name_en":"First Missionary Journey","tagline":"바나바와 바울의 첫 파송","summary":"안디옥 교회가 성령의 지시로 바나바와 바울을 안수하고 파송한 첫 전도여행입니다. 구브로와 비시디아 안디옥, 이고니온, 루스드라, 더베를 다니며 복음을 전하고 교회를 세웠습니다. 돌아와서는 '하나님이 함께 행하신 일'을 보고했습니다. 개혁주의 관점에서 선교는 교회가 성령의 부르심에 순종해 일꾼을 파송하는 사명입니다.","verses":[{"ref":"행 13:2","book_en":"Acts","ch":13,"v":2,"text":"주를 섬겨 금식할 때에 성령이 가라사대 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니"},{"ref":"행 14:23","book_en":"Acts","ch":14,"v":23,"text":"각교회에서 장로들을 택하여 금식 기도하며 저희를 그 믿은바 주께 부탁하고"}],"key_chapters":[{"book_id":"b_acts","ref":"행 13:1-3","title":"안디옥의 파송","text":"성령의 지시로 바나바와 바울이 파송됩니다."},{"book_id":"b_acts","ref":"행 14:21-28","title":"여행의 결산","text":"세운 교회들에 장로를 세우고 보고합니다."}],"related":["f_paul","b_acts","d_church","e_jerusalem_council","e_paul_rome"],"meta":{"when":"AD 47-48년경","order":42,"year_est":47,"emperor":"글라우디오"}},{"id":"e_macedonia","type":"event","name":"마게도냐의 환상","name_en":"The Macedonian Call","tagline":"마게도냐로 건너와 도우라","summary":"2차 전도여행 중 바울이 환상에서 '마게도냐로 건너와서 우리를 도우라'는 부름을 받은 사건입니다. 이에 바울 일행은 유럽으로 건너가 빌립보에서 복음을 전했습니다. 자주 장사 루디아가 첫 열매가 되었습니다. 개혁주의 관점에서 이는 복음의 방향을 정하시는 성령의 주권적 인도하심을 보여줍니다.","verses":[{"ref":"행 16:9","book_en":"Acts","ch":16,"v":9,"text":"밤에 환상이 바울에게 보이니 마게도냐 사람 하나가 서서 그에게 청하여 가로되 마게도냐로 건너와서 우리를 도우라 하거늘"},{"ref":"행 16:14","book_en":"Acts","ch":16,"v":14,"text":"두아디라성의 자주 장사로서 하나님을 공경하는 루디아라 하는 한 여자가 들었는데 주께서 그 마음을 열어 바울의 말을 청종하게 하신지라"}],"key_chapters":[{"book_id":"b_acts","ref":"행 16:6-15","title":"마게도냐의 부름","text":"환상을 따라 유럽으로 건너가 루디아가 믿습니다."}],"related":["f_paul","f_timothy","b_acts","d_church","d_holyspirit"],"meta":{"when":"AD 50-51년경","order":44,"year_est":50,"empe
